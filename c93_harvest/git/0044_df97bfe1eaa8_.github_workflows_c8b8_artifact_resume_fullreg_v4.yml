name: c8b8-artifact-resume-fullreg-v4
on:
  push:
    branches: [c8b8-drive-fullreg-20260809]
    paths:
      - '.github/workflows/c8b8_artifact_resume_fullreg_v4.yml'
permissions:
  contents: write
  actions: read
jobs:
  resume-native-fullreg:
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_CANDIDATE_SHA: c8b8f49620b45707f80f47a9fadf14db376a115bc6052517e9243e0cb2dc20e9
      EXPECTED_HOST_SHA: 081c4c62d2bf377913eb2aca0cc3cf3bf656350c8abaa3aaf11d171dac604804
      EXPECTED_C63_SHA: 56c02d18a9ee68a7ae14c4601e4ba24f7af170c6db01ea21fbff91cbe6b082fb
      EXPECTED_SMOKE_SHA: a9cc5cf614114c9481073669a3fd5d7ef5e1a1adce7e0fdc3f62824e0d50431d
      EXPECTED_ENC_SHA: 9ad292c1735b92821f56a6981319ec06c6addf427329a09bd75db13adfaf9e1d
      EXPECTED_XZ_SHA: 2f284aa9a0720fa5c493256dd8325c59fb9e490070d1636b56ff1e8292d06d1c
      EXPECTED_GHF_COUNT: '13'
      EXPECTED_GHF_BYTES: '82484656'
      SOURCE_RUN_ID: '31300771338'
      SOURCE_ARTIFACT: c8b8-v3-transport-checkpoint-31300771338
      HANDOFF_BRANCH: c8b8-drive-fullreg-20260809
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Restore persisted V3 encrypted transport checkpoint
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if(Test-Path restored_v3){Remove-Item -Recurse -Force restored_v3}
          gh run download $env:SOURCE_RUN_ID -n $env:SOURCE_ARTIFACT -D restored_v3
          if($LASTEXITCODE -ne 0){throw 'V3_ARTIFACT_DOWNLOAD_FAIL'}
          $parts=Get-ChildItem restored_v3 -Recurse -Filter 'c8b8_v3_part_*.bin' | Sort-Object Name
          if($parts.Count -ne 6){throw "V3_PART_COUNT_FAIL $($parts.Count)"}
          @'
          import hashlib, os
          from pathlib import Path
          root=Path('restored_v3'); parts=sorted(root.rglob('c8b8_v3_part_*.bin'))
          out=Path(os.environ['RUNNER_TEMP'])/'payload_v4.enc'; h=hashlib.sha256(); total=0
          with out.open('wb') as w:
              for p in parts:
                  b=p.read_bytes(); w.write(b); h.update(b); total+=len(b)
          d=h.hexdigest(); print('RESTORED_ENC_BYTES',total); print('RESTORED_ENC_SHA256',d)
          if d.lower()!=os.environ['EXPECTED_ENC_SHA'].lower(): raise SystemExit('RESTORED_ENC_SHA_FAIL')
          Path('restored_transport_binding_v4.txt').write_text(f'SOURCE_RUN_ID={os.environ["SOURCE_RUN_ID"]}\nSOURCE_ARTIFACT={os.environ["SOURCE_ARTIFACT"]}\nENC_BYTES={total}\nENC_SHA256={d}\nRESTORED_TRANSPORT_CHECKPOINT_PASS\n')
          '@ | Set-Content -Encoding ascii $env:RUNNER_TEMP\restore_bind_v4.py
          python $env:RUNNER_TEMP\restore_bind_v4.py
          if($LASTEXITCODE -ne 0){throw 'RESTORE_BIND_FAIL'}

      - name: Create fresh one-time RSA key handoff for AES pass only
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          @'
          import json, os, secrets, string, urllib.request
          from pathlib import Path
          def req(method,url,obj=None,token=None):
              data=None if obj is None else json.dumps(obj).encode(); r=urllib.request.Request(url,data=data,method=method)
              r.add_header('Accept','application/json')
              if data is not None:r.add_header('Content-Type','application/json')
              if token:r.add_header('Authorization','Bearer '+token)
              with urllib.request.urlopen(r,timeout=30) as x:return json.load(x)
          base='https://api.mail.tm'; domains=req('GET',base+'/domains'); members=domains if isinstance(domains,list) else domains.get('hydra:member',[])
          if not members:raise SystemExit('MAILTM_NO_DOMAIN')
          domain=members[0]['domain']; alphabet=string.ascii_lowercase+string.digits
          user='ghc8v4'+''.join(secrets.choice(alphabet) for _ in range(14)); password=''.join(secrets.choice(string.ascii_letters+string.digits+'-_') for _ in range(32)); address=user+'@'+domain
          req('POST',base+'/accounts',{'address':address,'password':password}); tok=req('POST',base+'/token',{'address':address,'password':password})['token']
          Path(os.environ['RUNNER_TEMP'],'mail_v4.json').write_text(json.dumps({'address':address,'password':password,'token':tok}))
          Path('mailbox_v4.txt').write_text(address+'\n'); Path('subject_v4.txt').write_text('GuanHu-C8B8-KeyOnly-V4-'+os.environ['GITHUB_RUN_ID']+'\n')
          print('V4_ONE_TIME_MAILBOX_READY',address)
          '@ | Set-Content -Encoding ascii $env:RUNNER_TEMP\mail_v4.py
          python $env:RUNNER_TEMP\mail_v4.py
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out $env:RUNNER_TEMP\private_v4.pem
          openssl pkey -in $env:RUNNER_TEMP\private_v4.pem -pubout -out public_v4.pem
          New-Item -ItemType Directory -Force .c8b8_v4_key_handoff | Out-Null
          Copy-Item public_v4.pem .c8b8_v4_key_handoff\public.pem -Force
          Copy-Item mailbox_v4.txt .c8b8_v4_key_handoff\mailbox.txt -Force
          Copy-Item subject_v4.txt .c8b8_v4_key_handoff\subject.txt -Force
          @("RUN_ID=$env:GITHUB_RUN_ID","ENC_SHA=$env:EXPECTED_ENC_SHA","CANDIDATE_SHA=$env:EXPECTED_CANDIDATE_SHA") | Set-Content .c8b8_v4_key_handoff\binding.txt
          git config user.name windows-dll-test-bot; git config user.email windows-dll-test-bot@users.noreply.github.com
          git add .c8b8_v4_key_handoff; git commit -m "Publish c8b8 V4 key-only handoff"
          if($LASTEXITCODE -ne 0){throw 'V4_HANDOFF_COMMIT_FAIL'}
          git push origin "HEAD:$env:HANDOFF_BRANCH"
          if($LASTEXITCODE -ne 0){throw 'V4_HANDOFF_PUSH_FAIL'}

      - name: Receive wrapped AES pass only
        shell: powershell
        timeout-minutes: 20
        run: |
          $ErrorActionPreference='Stop'
          @'
          import json,os,time,urllib.request,urllib.parse
          from pathlib import Path
          cfg=json.loads(Path(os.environ['RUNNER_TEMP'],'mail_v4.json').read_text()); token=cfg['token']; base='https://api.mail.tm'; wanted=Path('subject_v4.txt').read_text().strip(); out=Path('wrapped_key_v4.bin')
          def jget(url):
              r=urllib.request.Request(url);r.add_header('Accept','application/json');r.add_header('Authorization','Bearer '+token)
              with urllib.request.urlopen(r,timeout=30) as x:return json.load(x)
          def bget(url):
              r=urllib.request.Request(url);r.add_header('Authorization','Bearer '+token)
              with urllib.request.urlopen(r,timeout=60) as x:return x.read()
          end=time.time()+1000
          while time.time()<end and not out.exists():
              ls=jget(base+'/messages'); members=ls if isinstance(ls,list) else ls.get('hydra:member',[])
              for m in members:
                  if m.get('subject')!=wanted:continue
                  d=jget(base+'/messages/'+m['id'])
                  for a in d.get('attachments',[]):
                      if a.get('filename')=='c8b8_v4_wrapped_key.bin' and a.get('downloadUrl'):
                          out.write_bytes(bget(urllib.parse.urljoin(base,a['downloadUrl'])));break
              if not out.exists():time.sleep(3)
          if not out.exists() or out.stat().st_size!=384:raise SystemExit('V4_WRAPPED_KEY_TIMEOUT_OR_SIZE_FAIL')
          print('V4_WRAPPED_AES_KEY_RECEIVED bytes=384')
          '@ | Set-Content -Encoding ascii $env:RUNNER_TEMP\recv_key_v4.py
          python $env:RUNNER_TEMP\recv_key_v4.py
          if($LASTEXITCODE -ne 0){throw 'V4_KEY_RECEIVE_FAIL'}

      - name: Decrypt and verify payload with Windows-safe extraction
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $enc=Join-Path $env:RUNNER_TEMP 'payload_v4.enc'; $pass=Join-Path $env:RUNNER_TEMP 'pass_v4.txt'; $xz=Join-Path $env:RUNNER_TEMP 'payload_v4.tar.xz'
          openssl pkeyutl -decrypt -inkey $env:RUNNER_TEMP\private_v4.pem -in wrapped_key_v4.bin -out $pass -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          if($LASTEXITCODE -ne 0){throw 'V4_RSA_DECRYPT_FAIL'}
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in $enc -out $xz -pass file:$pass
          if($LASTEXITCODE -ne 0){throw 'V4_AES_DECRYPT_FAIL'}
          $xh=(Get-FileHash $xz -Algorithm SHA256).Hash.ToLowerInvariant(); if($xh -ne $env:EXPECTED_XZ_SHA){throw "V4_XZ_SHA_FAIL $xh"}
          if(Test-Path payload){Remove-Item -Recurse -Force payload}
          @'
          import os,tarfile,hashlib
          from pathlib import Path
          xz=Path(os.environ['RUNNER_TEMP'])/'payload_v4.tar.xz'
          with tarfile.open(xz,'r:xz') as t:t.extractall('.',filter='data')
          base=Path('payload');bad=[];checked=0
          for line in (base/'PAYLOAD_SHA256SUMS.txt').read_text().splitlines():
              if not line.strip():continue
              h,rel=line.split(None,1);rel=rel.strip();rel=rel[2:] if rel.startswith('./') else rel;p=base/rel;g=hashlib.sha256(p.read_bytes()).hexdigest();checked+=1
              if g.lower()!=h.lower():bad.append((rel,h,g))
          if bad:raise SystemExit('PAYLOAD_MEMBER_SHA_FAIL '+repr(bad[:3]))
          ghf=list((base/'testdata').rglob('*.ghf'));total=sum(p.stat().st_size for p in ghf)
          if len(ghf)!=int(os.environ['EXPECTED_GHF_COUNT']) or total!=int(os.environ['EXPECTED_GHF_BYTES']):raise SystemExit(f'GHF_BIND_FAIL {len(ghf)} {total}')
          for n,e in {'SigProcDll-64HF.dll':os.environ['EXPECTED_CANDIDATE_SHA'],'HostCompat.dll':os.environ['EXPECTED_HOST_SHA'],'C63.dll':os.environ['EXPECTED_C63_SHA'],'SigProcLoaderContractSmoke.exe':os.environ['EXPECTED_SMOKE_SHA']}.items():
              g=hashlib.sha256((base/n).read_bytes()).hexdigest()
              if g.lower()!=e.lower():raise SystemExit(f'BINARY_BIND_FAIL {n} {g}')
          Path('verified_payload_v4.txt').write_text(f'XZ_SHA256={os.environ["EXPECTED_XZ_SHA"]}\nMEMBERS={checked}\nGHF_COUNT={len(ghf)}\nGHF_BYTES={total}\nVERIFIED_PAYLOAD_V4_PASS\n')
          print('VERIFIED_PAYLOAD_V4_PASS',checked,len(ghf),total)
          '@ | Set-Content -Encoding ascii $env:RUNNER_TEMP\verify_extract_v4.py
          python $env:RUNNER_TEMP\verify_extract_v4.py
          if($LASTEXITCODE -ne 0){throw 'V4_PAYLOAD_VERIFY_FAIL'}
          Remove-Item $pass -Force

      - name: Persist verified extracted payload checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: c8b8-v4-verified-payload-${{ github.run_id }}
          path: |
            payload/**
            verified_payload_v4.txt
            restored_transport_binding_v4.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Configure MSVC x86
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Static PE ABI export import and stack gate fixed
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          dumpbin /headers payload\SigProcDll-64HF.dll | Set-Content -Encoding utf8 candidate_headers_v4.txt
          dumpbin /exports payload\SigProcDll-64HF.dll | Set-Content -Encoding utf8 candidate_exports_v4.txt
          dumpbin /dependents payload\SigProcDll-64HF.dll | Set-Content -Encoding utf8 candidate_dependents_v4.txt
          dumpbin /dependents payload\HostCompat.dll | Set-Content -Encoding utf8 hostcompat_dependents_v4.txt
          @'
          import re,struct
          from pathlib import Path
          b=Path('payload/SigProcDll-64HF.dll').read_bytes();u16=lambda o:struct.unpack_from('<H',b,o)[0];u32=lambda o:struct.unpack_from('<I',b,o)[0]
          if b[:2]!=b'MZ':raise SystemExit('MZ_FAIL')
          pe=u32(0x3c)
          if b[pe:pe+4]!=b'PE\0\0':raise SystemExit('PE_SIGNATURE_FAIL')
          machine=u16(pe+4);magic=u16(pe+24)
          if machine!=0x14c or magic!=0x10b:raise SystemExit(f'PE_ARCH_FAIL machine={machine:04x} magic={magic:04x}')
          exp=Path('candidate_exports_v4.txt').read_text(encoding='utf-8-sig',errors='ignore')
          for e in ['_SigProc@24','_SigProc_Fini@0','_SigProc_Init@8','_SigProc_Stat@0']:
              if e not in exp:raise SystemExit('MISSING_EXPORT '+e)
          def deps(p):
              s=Path(p).read_text(encoding='utf-8-sig',errors='ignore');return {m.group(1).lower() for m in re.finditer(r'^\s*([A-Za-z0-9_.-]+\.dll)\s*$',s,re.M|re.I)}
          c=deps('candidate_dependents_v4.txt');h=deps('hostcompat_dependents_v4.txt')
          if 'ucrtbase.dll' in c:raise SystemExit('DIRECT_UCRTBASE_FORBIDDEN')
          if c!=h:raise SystemExit('IMPORT_SET_DIFF candidate='+repr(sorted(c))+' host='+repr(sorted(h)))
          n=u16(pe+6);osz=u16(pe+20);s0=pe+24+osz;names=[];bad=[]
          for i in range(n):
              o=s0+40*i;name=b[o:o+8].split(b'\0',1)[0].decode('ascii','ignore');names.append(name);rs=u32(o+16);rp=u32(o+20);ch=u32(o+36)
              if ch&0x20000000:
                  for x in range(rp,max(rp,rp+rs-6)):
                      if b[x:x+2]==b'\x81\xec':
                          z=u32(x+2)
                          if 0x1000<=z<0x100000:bad.append((name,x,z))
          if '.stkfix' not in names:raise SystemExit('STKFIX_MISSING')
          if bad:raise SystemExit('UNSAFE_DIRECT_LARGE_STACK '+repr(bad))
          Path('native_static_gate_v4.txt').write_text('PE32_X86_PASS\nEXPORTS_PASS\nIMPORT_SET_EQUALS_HOSTCOMPAT\nSTKFIX_PRESENT\nDIRECT_LARGE_STACK_RESERVATIONS=0\nNATIVE_STATIC_GATE_PASS\n')
          print('NATIVE_STATIC_GATE_PASS',sorted(c))
          '@ | Set-Content -Encoding ascii $env:RUNNER_TEMP\static_v4.py
          python $env:RUNNER_TEMP\static_v4.py
          if($LASTEXITCODE -ne 0){throw 'V4_STATIC_GATE_FAIL'}

      - name: Inner and outer loader contract smoke
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          function Smoke([string]$tag,[string]$src){
            $d="smoke_$tag";if(Test-Path $d){Remove-Item -Recurse -Force $d};New-Item -ItemType Directory $d|Out-Null
            Copy-Item "$src\*" $d -Force;Copy-Item payload\SigProcDll-64HF.dll "$d\SigProcDll-64HF.dll" -Force;Copy-Item payload\SigProcLoaderContractSmoke.exe "$d\SigProcLoaderContractSmoke.exe" -Force
            Push-Location $d;try{.\SigProcLoaderContractSmoke.exe *>&1|Tee-Object -FilePath "..\loader_${tag}_v4.log";if($LASTEXITCODE -ne 0){throw "LOADER_${tag}_RC=$LASTEXITCODE"}}finally{Pop-Location}
            if(-not(Select-String -Quiet -SimpleMatch 'ALL_LOADER_CONTRACT_TESTS_PASS' "loader_${tag}_v4.log")){throw "LOADER_${tag}_MARKER_FAIL"}
          }
          Smoke inner payload\runtime\inner-bed;Smoke outer payload\runtime\outer-medical-bed
          'INNER_OUTER_LOADER_CONTRACT_PASS'|Set-Content loader_gate_v4.txt

      - name: Compile x86 full regression harness
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          cl /nologo /O2 /W4 /D_CRT_SECURE_NO_WARNINGS /Fe:fullreg_v4.exe payload\fullreg.c *>&1|Tee-Object fullreg_compile_v4.txt
          if($LASTEXITCODE -ne 0){throw 'FULLREG_COMPILE_FAIL'}

      - name: Execute complete native Windows regression
        shell: powershell
        timeout-minutes: 100
        run: |
          $ErrorActionPreference='Stop'
          .\fullreg_v4.exe payload\SigProcDll-64HF.dll payload\HostCompat.dll payload\C63.dll payload\runtime\inner-bed payload\runtime\outer-medical-bed payload\testdata *>&1|Tee-Object full_regression_v4.log
          $rc=$LASTEXITCODE;"REGRESSION_RC=$rc"|Set-Content regression_exit_v4.txt;if($rc -ne 0){throw "FULLREG_RC=$rc"}
          foreach($m in @('HOSTCOMPAT_REAL_NONZERO_PASS','C63_REAL_NONZERO_PASS','SEQ_TARGETS_VITAL_SUPPRESSION_RECOVERY_PASS','DETERMINISTIC_REPLAY_PASS','LONG_STABILITY_PASS loops=20000','TWO_THREAD_STRESS_PASS threads=2 loops_each=2000','REALTIME_1HZ_PASS frames=60','PERFORMANCE_PASS','COMPLETE_NATIVE_WINDOWS_REGRESSION_PASS')){if(-not(Select-String -Quiet -SimpleMatch $m full_regression_v4.log)){throw "MISSING_REGRESSION_MARKER $m"}}
          'FULL_NATIVE_WINDOWS_COMPLETE_REGRESSION_PASS'|Set-Content fullreg_gate_v4.txt

      - name: Exact post-test SHA and release lock
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';$h=(Get-FileHash payload\SigProcDll-64HF.dll -Algorithm SHA256).Hash.ToLowerInvariant();if($h -ne $env:EXPECTED_CANDIDATE_SHA){throw "POST_TEST_SHA_CHANGED $h"}
          "POST_TEST_SHA256=$h"|Set-Content post_test_sha_v4.txt
          "NATIVE_WINDOWS_DYNAMIC_PASS SHA256=$h`nFULL_NATIVE_WINDOWS_COMPLETE_REGRESSION_PASS SHA256=$h`nRELEASE_GATE_PASS SHA256=$h RUN_ID=$env:GITHUB_RUN_ID"|Set-Content C8B8_EXACT_RELEASE_PASS_V4.lock
          New-Item -ItemType Directory -Force evidence_summary|Out-Null;Copy-Item C8B8_EXACT_RELEASE_PASS_V4.lock evidence_summary\C8B8_EXACT_RELEASE_PASS_V4.lock -Force
          git config user.name windows-dll-test-bot;git config user.email windows-dll-test-bot@users.noreply.github.com;git add evidence_summary/C8B8_EXACT_RELEASE_PASS_V4.lock;git commit -m "Record c8b8 exact V4 native fullreg PASS";if($LASTEXITCODE -ne 0){throw 'PASS_COMMIT_FAIL'}
          $ok=$false;for($i=0;$i -lt 5;$i++){git fetch origin $env:HANDOFF_BRANCH;git rebase "origin/$env:HANDOFF_BRANCH";if($LASTEXITCODE -ne 0){git rebase --abort;throw 'PASS_REBASE_FAIL'};git push origin "HEAD:$env:HANDOFF_BRANCH";if($LASTEXITCODE -eq 0){$ok=$true;break};Start-Sleep 2};if(-not $ok){throw 'PASS_PUSH_FAIL'}

      - name: Upload final or failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c8b8-v4-fullreg-evidence-${{ github.run_id }}
          path: |
            payload/SigProcDll-64HF.dll
            payload/CHECKPOINT_MANIFEST.txt
            restored_transport_binding_v4.txt
            verified_payload_v4.txt
            native_static_gate_v4.txt
            candidate_headers_v4.txt
            candidate_exports_v4.txt
            candidate_dependents_v4.txt
            hostcompat_dependents_v4.txt
            loader_inner_v4.log
            loader_outer_v4.log
            loader_gate_v4.txt
            fullreg_compile_v4.txt
            full_regression_v4.log
            regression_exit_v4.txt
            fullreg_gate_v4.txt
            post_test_sha_v4.txt
            C8B8_EXACT_RELEASE_PASS_V4.lock
          if-no-files-found: ignore
          retention-days: 30
