name: c8b8-v4-drive-resumable-native-fullreg
on:
  push:
    branches: [c8b8-v4-drive-resumable-20260809]
    paths:
      - '.github/workflows/c8b8_v4_drive_resumable_fullreg.yml'
permissions:
  contents: write
  actions: read
jobs:
  fullreg:
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      CAND_SHA: c8b8f49620b45707f80f47a9fadf14db376a115bc6052517e9243e0cb2dc20e9
      HOST_SHA: 081c4c62d2bf377913eb2aca0cc3cf3bf656350c8abaa3aaf11d171dac604804
      C63_SHA: 56c02d18a9ee68a7ae14c4601e4ba24f7af170c6db01ea21fbff91cbe6b082fb
      SMOKE_SHA: a9cc5cf614114c9481073669a3fd5d7ef5e1a1adce7e0fdc3f62824e0d50431d
      XZ_SHA: 5a1c750b48a7d436f8ca7a011dd4d925d68891e8241a11aa42bf4bbd30afd3c0
      XZ_BYTES: '20593840'
      ENC_SHA: 9daad0be422b133235cfd99ec680dd2ed366c3bdd85c9436d90a14a5cc05b813
      ENC_BYTES: '20593872'
      GHF_FILES: '13'
      GHF_BYTES: '82484656'
      GHF_FRAMES: '10808'
      HANDOFF_BRANCH: c8b8-v4-drive-resumable-20260809
      PAYLOAD_ROOT: c8b8_fullreg_payload_v4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Try reusable decrypted-XZ checkpoint
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $ready=$false
          try {
            $j=gh api "/repos/$env:GITHUB_REPOSITORY/actions/artifacts?per_page=100" | ConvertFrom-Json
            $arts=@($j.artifacts | Where-Object { -not $_.expired -and $_.name -like 'c8b8-v4-plaintext-xz-*' } | Sort-Object id -Descending)
            foreach($a in $arts){
              Remove-Item -Recurse -Force "$env:RUNNER_TEMP\resume" -ErrorAction SilentlyContinue
              New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\resume" | Out-Null
              gh run download $a.workflow_run.id -n $a.name -D "$env:RUNNER_TEMP\resume"
              if($LASTEXITCODE -ne 0){ continue }
              $p=Get-ChildItem "$env:RUNNER_TEMP\resume" -Recurse -Filter 'payload.tar.xz' | Select-Object -First 1
              if(!$p){ continue }
              $h=(Get-FileHash $p.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              $sz=(Get-Item $p.FullName).Length
              if($h -eq $env:XZ_SHA -and $sz -eq [int64]$env:XZ_BYTES){
                Copy-Item -Force $p.FullName "$env:RUNNER_TEMP\payload.tar.xz"
                $ready=$true
                "REUSED_ARTIFACT_ID=$($a.id) RUN=$($a.workflow_run.id) SHA=$h BYTES=$sz" | Tee-Object reusable_checkpoint.txt
                break
              }
            }
          } catch {
            "REUSE_SCAN_WARNING=$($_.Exception.Message)" | Tee-Object reusable_checkpoint.txt
          }
          if($ready){ 'PAYLOAD_READY=1' | Out-File $env:GITHUB_ENV -Append -Encoding utf8; 'PAYLOAD_SOURCE=actions-checkpoint' | Out-File $env:GITHUB_ENV -Append -Encoding utf8 }
          else { 'PAYLOAD_READY=0' | Out-File $env:GITHUB_ENV -Append -Encoding utf8; 'PAYLOAD_SOURCE=mail-transport' | Out-File $env:GITHUB_ENV -Append -Encoding utf8; 'NO_REUSABLE_CHECKPOINT' | Add-Content reusable_checkpoint.txt }

      - name: Create one-time mailbox and RSA handoff
        if: env.PAYLOAD_READY != '1'
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          @'
          import json, os, secrets, string, urllib.request
          from pathlib import Path
          def req(method,url,obj=None,token=None):
              data=None if obj is None else json.dumps(obj).encode()
              r=urllib.request.Request(url,data=data,method=method)
              r.add_header('Accept','application/json')
              if data is not None:r.add_header('Content-Type','application/json')
              if token:r.add_header('Authorization','Bearer '+token)
              with urllib.request.urlopen(r,timeout=30) as x:return json.load(x)
          base='https://api.mail.tm'; domains=req('GET',base+'/domains')
          members=domains if isinstance(domains,list) else domains.get('hydra:member',[])
          if not members:raise SystemExit('MAILTM_NO_DOMAIN')
          domain=members[0]['domain']; alphabet=string.ascii_lowercase+string.digits
          user='ghc8v4'+''.join(secrets.choice(alphabet) for _ in range(14))
          password=''.join(secrets.choice(string.ascii_letters+string.digits+'-_') for _ in range(32))
          address=user+'@'+domain
          req('POST',base+'/accounts',{'address':address,'password':password})
          tok=req('POST',base+'/token',{'address':address,'password':password})['token']
          Path(os.environ['RUNNER_TEMP'],'mail.json').write_text(json.dumps({'address':address,'password':password,'token':tok}))
          Path('mailbox.txt').write_text(address+'\n')
          Path('subject_prefix.txt').write_text('GuanHu-C8B8-V4-'+os.environ['GITHUB_RUN_ID']+'\n')
          print('ONE_TIME_MAILBOX_READY',address)
          '@ | Set-Content -Encoding ascii "$env:RUNNER_TEMP\make_mailbox.py"
          python "$env:RUNNER_TEMP\make_mailbox.py"
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$env:RUNNER_TEMP\private.pem"
          openssl pkey -in "$env:RUNNER_TEMP\private.pem" -pubout -out public.pem
          Remove-Item -Recurse -Force .c8b8_v4_handoff -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force .c8b8_v4_handoff | Out-Null
          Copy-Item public.pem,mailbox.txt,subject_prefix.txt .c8b8_v4_handoff\ -Force
          @("RUN_ID=$env:GITHUB_RUN_ID","XZ_SHA=$env:XZ_SHA","ENC_SHA=$env:ENC_SHA","CAND_SHA=$env:CAND_SHA") | Set-Content .c8b8_v4_handoff\binding.txt
          git config user.name windows-dll-test-bot
          git config user.email windows-dll-test-bot@users.noreply.github.com
          git add .c8b8_v4_handoff
          git commit -m "Publish c8b8 v4 resumable handoff"
          if($LASTEXITCODE -ne 0){ throw 'HANDOFF_COMMIT_FAIL' }
          git push origin "HEAD:$env:HANDOFF_BRANCH"
          if($LASTEXITCODE -ne 0){ throw 'HANDOFF_PUSH_FAIL' }

      - name: Receive four ciphertext chunks and wrapped key
        if: env.PAYLOAD_READY != '1'
        shell: powershell
        timeout-minutes: 30
        run: |
          $ErrorActionPreference='Stop'
          @'
          import json,os,time,urllib.request,urllib.parse
          from pathlib import Path
          cfg=json.loads(Path(os.environ['RUNNER_TEMP'],'mail.json').read_text());token=cfg['token'];base='https://api.mail.tm'
          prefix=Path('subject_prefix.txt').read_text().strip();out=Path('transport');out.mkdir(exist_ok=True)
          wanted={f'{prefix}-P{i}':i for i in range(1,5)};got=set();key_ok=False;seen=set()
          def get_json(url):
              r=urllib.request.Request(url);r.add_header('Accept','application/json');r.add_header('Authorization','Bearer '+token)
              with urllib.request.urlopen(r,timeout=30) as x:return json.load(x)
          def get_bytes(url):
              r=urllib.request.Request(url);r.add_header('Authorization','Bearer '+token)
              with urllib.request.urlopen(r,timeout=120) as x:return x.read()
          deadline=time.time()+1500
          while time.time()<deadline and (len(got)<4 or not key_ok):
              listing=get_json(base+'/messages');msgs=listing if isinstance(listing,list) else listing.get('hydra:member',[])
              for m in msgs:
                  subj=m.get('subject','')
                  if subj not in wanted or m['id'] in seen:continue
                  seen.add(m['id']);detail=get_json(base+'/messages/'+m['id']);idx=wanted[subj]
                  for a in detail.get('attachments',[]):
                      name=a.get('filename','');u=a.get('downloadUrl')
                      if not u:continue
                      data=get_bytes(urllib.parse.urljoin(base,u))
                      if name==f'c8b8_v4_part{idx}.bin':(out/name).write_bytes(data);got.add(idx)
                      elif name=='c8b8_v4_wrapped_key.bin':(out/name).write_bytes(data);key_ok=True
              if len(got)<4 or not key_ok:time.sleep(5)
          if len(got)!=4 or not key_ok:raise SystemExit(f'MAIL_TRANSPORT_INCOMPLETE parts={sorted(got)} key={key_ok}')
          print('MAIL_TRANSPORT_COMPLETE parts=4 key=1')
          '@ | Set-Content -Encoding ascii "$env:RUNNER_TEMP\receive.py"
          python "$env:RUNNER_TEMP\receive.py" | Tee-Object mail_transport.txt
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }

      - name: Reassemble decrypt and SHA-bind plaintext XZ
        if: env.PAYLOAD_READY != '1'
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $parts=1..4 | ForEach-Object { [IO.File]::ReadAllBytes("transport\c8b8_v4_part$_.bin") }
          $out=[IO.File]::Create("$env:RUNNER_TEMP\payload.enc"); foreach($p in $parts){$out.Write($p,0,$p.Length)}; $out.Close()
          $eh=(Get-FileHash "$env:RUNNER_TEMP\payload.enc" -Algorithm SHA256).Hash.ToLowerInvariant();$esz=(Get-Item "$env:RUNNER_TEMP\payload.enc").Length
          if($eh -ne $env:ENC_SHA -or $esz -ne [int64]$env:ENC_BYTES){throw "ENC_BIND_FAIL $eh $esz"}
          if((Get-Item transport\c8b8_v4_wrapped_key.bin).Length -ne 384){throw 'WRAPPED_KEY_SIZE_FAIL'}
          openssl pkeyutl -decrypt -inkey "$env:RUNNER_TEMP\private.pem" -in transport\c8b8_v4_wrapped_key.bin -out "$env:RUNNER_TEMP\aes_pass.txt" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          if($LASTEXITCODE -ne 0){throw 'RSA_UNWRAP_FAIL'}
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in "$env:RUNNER_TEMP\payload.enc" -out "$env:RUNNER_TEMP\payload.tar.xz" -pass "file:$env:RUNNER_TEMP\aes_pass.txt"
          if($LASTEXITCODE -ne 0){throw 'AES_DECRYPT_FAIL'}
          $xh=(Get-FileHash "$env:RUNNER_TEMP\payload.tar.xz" -Algorithm SHA256).Hash.ToLowerInvariant();$xsz=(Get-Item "$env:RUNNER_TEMP\payload.tar.xz").Length
          if($xh -ne $env:XZ_SHA -or $xsz -ne [int64]$env:XZ_BYTES){throw "XZ_BIND_FAIL $xh $xsz"}
          "MAIL_TRANSPORT_PASS ENC_SHA=$eh XZ_SHA=$xh XZ_BYTES=$xsz" | Tee-Object plaintext_xz_binding.txt
          Remove-Item "$env:RUNNER_TEMP\aes_pass.txt" -Force

      - name: Save reusable decrypted-XZ checkpoint
        if: env.PAYLOAD_READY != '1'
        uses: actions/upload-artifact@v4
        with:
          name: c8b8-v4-plaintext-xz-${{ github.run_id }}
          path: ${{ runner.temp }}/payload.tar.xz
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Extract and verify self-contained payload
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $xh=(Get-FileHash "$env:RUNNER_TEMP\payload.tar.xz" -Algorithm SHA256).Hash.ToLowerInvariant();$xsz=(Get-Item "$env:RUNNER_TEMP\payload.tar.xz").Length
          if($xh -ne $env:XZ_SHA -or $xsz -ne [int64]$env:XZ_BYTES){throw 'PRE_EXTRACT_XZ_BIND_FAIL'}
          Remove-Item -Recurse -Force $env:PAYLOAD_ROOT -ErrorAction SilentlyContinue
          & "$env:SystemRoot\System32\tar.exe" -xf "$env:RUNNER_TEMP\payload.tar.xz" -C .
          if($LASTEXITCODE -ne 0){throw "WINDOWS_TAR_EXTRACT_FAIL $LASTEXITCODE"}
          if(!(Test-Path "$env:PAYLOAD_ROOT\fullreg.c")){throw 'PAYLOAD_ROOT_MISSING'}
          @'
          import hashlib,os,struct
          from pathlib import Path
          root=Path(os.environ['PAYLOAD_ROOT'])
          for line in (root/'MANIFEST_SHA256.txt').read_text().splitlines():
              h,rel=line.split(None,1); rel=rel.strip(); rel=rel[2:] if rel.startswith('./') else rel
              p=root/rel; got=hashlib.sha256(p.read_bytes()).hexdigest()
              if got!=h:raise SystemExit(f'MANIFEST_FAIL {rel} {got} {h}')
          expected={'SigProcDll-64HF.dll':os.environ['CAND_SHA'],'HostCompat.dll':os.environ['HOST_SHA'],'C63.dll':os.environ['C63_SHA'],'SigProcLoaderContractSmoke.exe':os.environ['SMOKE_SHA']}
          for n,h in expected.items():
              got=hashlib.sha256((root/n).read_bytes()).hexdigest()
              if got!=h:raise SystemExit(f'BINARY_BIND_FAIL {n} {got}')
          ghfs=sorted((root/'testdata').rglob('*.ghf')); total=sum(p.stat().st_size for p in ghfs); frames=0
          for p in ghfs:
              b=p.read_bytes();off=0
              while off<len(b):
                  n,tl=struct.unpack_from('<IH',b,off);off+=6+tl+n*12;frames+=1
                  if off>len(b):raise SystemExit(f'GHF_PARSE_FAIL {p}')
              if off!=len(b):raise SystemExit(f'GHF_TRAILING_FAIL {p}')
          if len(ghfs)!=int(os.environ['GHF_FILES']) or total!=int(os.environ['GHF_BYTES']) or frames!=int(os.environ['GHF_FRAMES']):raise SystemExit(f'GHF_BIND_FAIL files={len(ghfs)} bytes={total} frames={frames}')
          print(f'PAYLOAD_MANIFEST_AND_CORPUS_PASS files={len(ghfs)} bytes={total} frames={frames}')
          '@ | Set-Content -Encoding ascii "$env:RUNNER_TEMP\verify_payload.py"
          python "$env:RUNNER_TEMP\verify_payload.py" | Tee-Object payload_manifest_gate.txt
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}

      - name: Configure MSVC x86
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Static PE ABI import and stack-probe gate
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';$r=$env:PAYLOAD_ROOT
          dumpbin /headers "$r\SigProcDll-64HF.dll" | Out-File candidate_headers.txt
          dumpbin /exports "$r\SigProcDll-64HF.dll" | Out-File candidate_exports.txt
          dumpbin /dependents "$r\SigProcDll-64HF.dll" | Out-File candidate_dependents.txt
          dumpbin /dependents "$r\HostCompat.dll" | Out-File hostcompat_dependents.txt
          @'
          import os,re,struct
          from pathlib import Path
          root=Path(os.environ['PAYLOAD_ROOT']);b=(root/'SigProcDll-64HF.dll').read_bytes();u16=lambda o:struct.unpack_from('<H',b,o)[0];u32=lambda o:struct.unpack_from('<I',b,o)[0]
          pe=u32(0x3c)
          if b[:2]!=b'MZ' or b[pe:pe+4]!=b'PE\0\0' or u16(pe+4)!=0x14c or u16(pe+24)!=0x10b:raise SystemExit('NOT_PE32_X86')
          n=u16(pe+6);osz=u16(pe+20);s0=pe+24+osz;names=[];bad=[]
          for i in range(n):
              o=s0+40*i;name=b[o:o+8].split(b'\0',1)[0].decode('ascii','ignore');names.append(name);rs=u32(o+16);rp=u32(o+20);ch=u32(o+36)
              if ch&0x20000000:
                  for x in range(rp,max(rp,rp+rs-6)):
                      if b[x:x+2]==b'\x81\xec':
                          imm=u32(x+2)
                          if 0x1000<=imm<0x100000:bad.append((name,x,imm))
          if '.stkfix' not in names:raise SystemExit('STKFIX_SECTION_MISSING')
          if bad:raise SystemExit('UNSAFE_LARGE_DIRECT_STACK '+repr(bad))
          exp=Path('candidate_exports.txt').read_text(errors='ignore')
          for e in ['_SigProc@24','_SigProc_Fini@0','_SigProc_Init@8','_SigProc_Stat@0']:
              if e not in exp:raise SystemExit('EXPORT_MISSING '+e)
          def deps(path):
              s=Path(path).read_text(errors='ignore');return {m.group(1).lower() for m in re.finditer(r'^\s*([A-Za-z0-9_.-]+\.dll)\s*$',s,re.M|re.I)}
          c=deps('candidate_dependents.txt');h=deps('hostcompat_dependents.txt')
          if 'ucrtbase.dll' in c:raise SystemExit('DIRECT_UCRTBASE_IMPORT')
          if c-h:raise SystemExit('IMPORT_NOT_HOSTCOMPAT_SUBSET '+repr(sorted(c-h)))
          print('STATIC_PE_ABI_IMPORT_STACKPROBE_PASS sections='+','.join(names)+' imports='+','.join(sorted(c)))
          '@ | Set-Content -Encoding ascii "$env:RUNNER_TEMP\static_gate.py"
          python "$env:RUNNER_TEMP\static_gate.py" | Tee-Object static_gate.txt
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}

      - name: Inner and outer loader contract gates
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';$r=(Resolve-Path $env:PAYLOAD_ROOT).Path
          foreach($bed in @('inner-bed','outer-medical-bed')){
            $d="loader_$($bed.Replace('-','_'))";Remove-Item -Recurse -Force $d -ErrorAction SilentlyContinue;New-Item -ItemType Directory -Force $d|Out-Null
            Copy-Item "$r\SigProcDll-64HF.dll","$r\SigProcLoaderContractSmoke.exe" $d
            Copy-Item "$r\runtime\$bed\*" $d
            Push-Location $d
            try { .\SigProcLoaderContractSmoke.exe *>&1 | Tee-Object "..\loader_$bed.log"; if($LASTEXITCODE -ne 0){throw "LOADER_FAIL bed=$bed rc=$LASTEXITCODE"} }
            finally { Pop-Location }
            if(-not (Select-String -Quiet -SimpleMatch 'ALL_LOADER_CONTRACT_TESTS_PASS' "loader_$bed.log")){throw "LOADER_MARKER_MISSING $bed"}
          }
          'INNER_OUTER_LOADER_CONTRACT_PASS' | Tee-Object loader_contract_gate.txt

      - name: Compile complete regression harness x86
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';Push-Location $env:PAYLOAD_ROOT
          try { cl /nologo /O2 /W4 /D_CRT_SECURE_NO_WARNINGS /Fe:fullreg.exe fullreg.c 2>&1 | Tee-Object ..\fullreg_compile.txt; if($LASTEXITCODE -ne 0){throw "FULLREG_COMPILE_FAIL $LASTEXITCODE"} }
          finally { Pop-Location }

      - name: Execute complete full-data native Windows regression
        shell: powershell
        timeout-minutes: 100
        run: |
          $ErrorActionPreference='Stop';Push-Location $env:PAYLOAD_ROOT
          try { .\fullreg.exe .\SigProcDll-64HF.dll .\HostCompat.dll .\C63.dll .\testdata .\runtime *>&1 | Tee-Object ..\full_regression_v4.log; $rc=$LASTEXITCODE }
          finally { Pop-Location }
          if($rc -ne 0){throw "FULLREG_RC=$rc"}
          foreach($m in @('HOSTCOMPAT_NONZERO_CONTRACT_PASS','C63_NONZERO_CONTRACT_PASS','CANDIDATE_NONZERO_CONTRACT_PASS','FULL_13_GHF_CORPUS_PASS files=13 frames=10808 bytes=82484656','SEQ_TARGETS_VITAL_SUPPRESSION_RECOVERY_PASS','DETERMINISTIC_REPLAY_PASS frames=10808','LONG_STABILITY_PASS loops=20000','TWO_THREAD_STRESS_PASS threads=2 loops_each=2000','REALTIME_1HZ_PASS frames=60','COMPLETE_NATIVE_WINDOWS_REGRESSION_PASS')){
            if(-not (Select-String -Quiet -SimpleMatch $m full_regression_v4.log)){throw "FULLREG_MARKER_MISSING $m"}
          }
          $h=(Get-FileHash "$env:PAYLOAD_ROOT\SigProcDll-64HF.dll" -Algorithm SHA256).Hash.ToLowerInvariant();if($h -ne $env:CAND_SHA){throw "POSTREG_SHA_DRIFT $h"}
          "NATIVE_WINDOWS_DYNAMIC_NONZERO_PASS SHA256=$h`nFULL_NATIVE_WINDOWS_COMPLETE_REGRESSION_PASS SHA256=$h" | Tee-Object C8B8_V4_FULLREG_PASS.lock

      - name: Build and audit final release ZIP
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';$rel='GuanHu_C8B8_FINAL_RELEASE';Remove-Item -Recurse -Force $rel,'zip_audit' -ErrorAction SilentlyContinue;New-Item -ItemType Directory -Force $rel|Out-Null
          Copy-Item "$env:PAYLOAD_ROOT\SigProcDll-64HF.dll" "$rel\SigProcDll-64HF.dll"
          Copy-Item C8B8_V4_FULLREG_PASS.lock,static_gate.txt,loader_contract_gate.txt,payload_manifest_gate.txt "$rel\"
          $h=(Get-FileHash "$rel\SigProcDll-64HF.dll" -Algorithm SHA256).Hash.ToLowerInvariant();$sz=(Get-Item "$rel\SigProcDll-64HF.dll").Length
          if($h -ne $env:CAND_SHA -or $sz -le 0){throw 'PREZIP_DLL_BIND_FAIL'}
          "SHA256 $h  SigProcDll-64HF.dll`nSIZE $sz" | Set-Content "$rel\RELEASE_SHA256SUMS.txt"
          Compress-Archive -Path "$rel\*" -DestinationPath GuanHu_SigProc_Final_Release_20260809.zip -CompressionLevel Optimal
          Expand-Archive GuanHu_SigProc_Final_Release_20260809.zip -DestinationPath zip_audit -Force
          $ah=(Get-FileHash 'zip_audit\SigProcDll-64HF.dll' -Algorithm SHA256).Hash.ToLowerInvariant();$asz=(Get-Item 'zip_audit\SigProcDll-64HF.dll').Length
          if($ah -ne $env:CAND_SHA -or $asz -ne $sz){throw "ZIP_AUDIT_FAIL $ah $asz"}
          "FINAL_ZIP_AUDIT_PASS SHA256=$ah DLL_BYTES=$asz ZIP_BYTES=$((Get-Item GuanHu_SigProc_Final_Release_20260809.zip).Length)" | Tee-Object C8B8_V4_RELEASE_PASS.lock

      - name: Upload exact tested DLL final package and evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: c8b8-v4-exact-final-release-${{ github.run_id }}
          path: |
            ${{ env.PAYLOAD_ROOT }}/SigProcDll-64HF.dll
            GuanHu_SigProc_Final_Release_20260809.zip
            C8B8_V4_FULLREG_PASS.lock
            C8B8_V4_RELEASE_PASS.lock
            payload_manifest_gate.txt
            candidate_headers.txt
            candidate_exports.txt
            candidate_dependents.txt
            hostcompat_dependents.txt
            static_gate.txt
            loader_inner-bed.log
            loader_outer-medical-bed.log
            loader_contract_gate.txt
            fullreg_compile.txt
            full_regression_v4.log
            reusable_checkpoint.txt
            plaintext_xz_binding.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: c8b8-v4-failure-evidence-${{ github.run_id }}
          path: |
            reusable_checkpoint.txt
            mail_transport.txt
            plaintext_xz_binding.txt
            payload_manifest_gate.txt
            candidate_headers.txt
            candidate_exports.txt
            candidate_dependents.txt
            hostcompat_dependents.txt
            static_gate.txt
            loader_inner-bed.log
            loader_outer-medical-bed.log
            loader_contract_gate.txt
            fullreg_compile.txt
            full_regression_v4.log
          if-no-files-found: ignore
          retention-days: 30
