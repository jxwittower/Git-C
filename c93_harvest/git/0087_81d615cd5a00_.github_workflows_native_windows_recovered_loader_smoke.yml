name: native-windows-recovered-loader-smoke

on:
  push:
    paths:
      - '.github/workflows/native_windows_recovered_loader_smoke.yml'

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  smoke:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Create one-time RSA transport key
        run: |
          set -euo pipefail
          rm -rf .native_smoke_handoff
          mkdir -p .native_smoke_handoff
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$RUNNER_TEMP/private.pem"
          openssl pkey -in "$RUNNER_TEMP/private.pem" -pubout -out .native_smoke_handoff/public.pem
          git config user.name "windows-dll-test-bot"
          git config user.email "windows-dll-test-bot@users.noreply.github.com"
          git add .native_smoke_handoff/public.pem
          git commit -m "Publish one-time RSA key for recovered loader smoke"
          git push
          echo "ONE_TIME_PUBLIC_KEY_PUBLISHED"

      - name: Wait for RSA-wrapped AES key
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 300); do
            git pull --ff-only >/dev/null 2>&1 || true
            if [ -s .native_smoke_handoff/key.enc.b64 ]; then
              ok=1
              break
            fi
            sleep 2
          done
          if [ "$ok" != 1 ]; then
            echo "RSA_WRAPPED_AES_KEY_TIMEOUT"
            exit 20
          fi
          echo "RSA_WRAPPED_AES_KEY_RECEIVED"

      - name: Decrypt recovered payload
        run: |
          set -euo pipefail
          cat \
            .recovered_payload/chunk_00 \
            .recovered_payload/chunk_01 \
            .recovered_payload/chunk_02 \
            .recovered_payload/chunk_03 \
            .recovered_payload/chunk_04 \
            .recovered_payload/chunk_05 \
            .recovered_payload/chunk_06 \
            .recovered_payload/chunk_07 \
            .recovered_payload/chunk_08 \
            .recovered_payload/chunk_09 \
            .recovered_payload/chunk_10 \
            .recovered_payload/chunk_11 \
            .recovered_payload/chunk_12fix_00 \
            .recovered_payload/chunk_12fix_01 \
            .recovered_payload/chunk_12fix_02 \
            .recovered_payload/chunk_12fix_03_00 \
            .recovered_payload/chunk_12fix_03_01 \
            .recovered_payload/chunk_12fix_03_02 \
            .recovered_payload/chunk_12fix_03_03 \
            .recovered_payload/chunk_12fix_03_04 \
            .recovered_payload/chunk_12b \
            > "$RUNNER_TEMP/payload.enc.b64"
          test "$(wc -c < "$RUNNER_TEMP/payload.enc.b64")" -eq 259884
          base64 -d "$RUNNER_TEMP/payload.enc.b64" > "$RUNNER_TEMP/payload.enc"
          test "$(sha256sum "$RUNNER_TEMP/payload.enc" | awk '{print $1}')" = '49087efe5f8506eaa1ba8ed42196678019220ac1db0847ac5ae5ea140796d4a3'
          base64 -d .native_smoke_handoff/key.enc.b64 > "$RUNNER_TEMP/key.enc"
          openssl pkeyutl -decrypt -inkey "$RUNNER_TEMP/private.pem" -in "$RUNNER_TEMP/key.enc" -out "$RUNNER_TEMP/pass.txt" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in "$RUNNER_TEMP/payload.enc" -out "$RUNNER_TEMP/payload.tar.xz" -pass file:"$RUNNER_TEMP/pass.txt"
          test "$(sha256sum "$RUNNER_TEMP/payload.tar.xz" | awk '{print $1}')" = '46cd159d17a7e83a4a65af0afca61e967de519a232459ce3821b6263bf962bf5'
          rm -rf payload
          mkdir -p payload
          tar -xJf "$RUNNER_TEMP/payload.tar.xz" -C payload
          test "$(sha256sum payload/SigProcDll-64HF.dll | awk '{print $1}')" = '081c4c62d2bf377913eb2aca0cc3cf3bf656350c8abaa3aaf11d171dac604804'
          test "$(sha256sum payload/SigProcLoaderContractSmoke.exe | awk '{print $1}')" = 'a9cc5cf614114c9481073669a3fd5d7ef5e1a1adce7e0fdc3f62824e0d50431d'
          test "$(sha256sum payload/filter_brth | awk '{print $1}')" = 'ab3f170ff90741c614bd8ff2e5942038f1d14489f2c9df0a1dad7f3dd12b7b9a'
          test "$(sha256sum payload/filter_hrt3 | awk '{print $1}')" = '0ea419a929ac7d765f7c6bcb04fc151927eb6954a65a69819136bf3ae0946805'
          test "$(sha256sum payload/file_sig | awk '{print $1}')" = 'a9caf6b2a06fb194bed68b7de910e30d48b31e8e3b03c23b1ae675d037753290'
          test "$(sha256sum payload/file_bed_model_v1 | awk '{print $1}')" = '48571bf163e1f12b5265bb09b65ce2dc4025f01d27b748bfc521381f94611520'
          rm -f "$RUNNER_TEMP/pass.txt" "$RUNNER_TEMP/key.enc" "$RUNNER_TEMP/payload.enc" "$RUNNER_TEMP/payload.enc.b64" "$RUNNER_TEMP/payload.tar.xz"
          echo "RECOVERED_PAYLOAD_READY"

      - name: Run exact loader API closed loop on native Windows
        shell: cmd
        working-directory: payload
        run: |
          SigProcLoaderContractSmoke.exe > ..\loader_smoke.txt 2>&1
          set RC=%ERRORLEVEL%
          type ..\loader_smoke.txt
          exit /b %RC%

      - name: Validate exact pass sentinel
        shell: cmd
        run: |
          findstr /C:"ALL_LOADER_CONTRACT_TESTS_PASS" loader_smoke.txt > nul
          if errorlevel 1 exit /b 30
          echo EXACT_LOADER_GATE_PASS

      - name: Upload non-proprietary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovered-native-loader-smoke-evidence
          path: loader_smoke.txt
          if-no-files-found: ignore
          retention-days: 2

      - name: Remove one-time transport
        if: always()
        run: |
          set +e
          git pull --ff-only
          rm -rf .native_smoke_handoff .recovered_payload
          git add -A .native_smoke_handoff .recovered_payload
          if ! git diff --cached --quiet; then
            git commit -m "Remove recovered loader smoke transport"
            git push
          fi
          rm -rf payload
          rm -f "$RUNNER_TEMP/private.pem" "$RUNNER_TEMP/pass.txt" "$RUNNER_TEMP/key.enc" "$RUNNER_TEMP/payload.enc" "$RUNNER_TEMP/payload.enc.b64" "$RUNNER_TEMP/payload.tar.xz"
