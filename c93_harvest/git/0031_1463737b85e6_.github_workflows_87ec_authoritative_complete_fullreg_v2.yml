name: 87ec-authoritative-complete-fullreg-v2
on:
  push:
    branches: [87ec-authoritative-complete-fullreg-20260809]
    paths:
      - '.github/workflows/87ec_authoritative_complete_fullreg_v2.yml'
permissions:
  actions: read
  contents: write
jobs:
  release-gate:
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      HANDOFF_BRANCH: 87ec-authoritative-complete-fullreg-20260809
      CAND_SHA: 87ec3f9f2748d3143136c97e652b0334d63b973338b4c802aaea08e853ad226e
      PARENT_SHA: c8b8f49620b45707f80f47a9fadf14db376a115bc6052517e9243e0cb2dc20e9
      HOST_SHA: 081c4c62d2bf377913eb2aca0cc3cf3bf656350c8abaa3aaf11d171dac604804
      C63_SHA: 56c02d18a9ee68a7ae14c4601e4ba24f7af170c6db01ea21fbff91cbe6b082fb
      SMOKE_SHA: a9cc5cf614114c9481073669a3fd5d7ef5e1a1adce7e0fdc3f62824e0d50431d
      HARNESS_SHA: 90bd3ef14c9948677f259641e15227a7d26481baf399ae61ef67d09b031ecf71
      CHECKPOINT_XZ_SHA: 08a5af2c16526f9830ace68817d1e6517422d4a3e66a8051030e78f865b1dd48
      ORIGINAL_RUNNER_SHA: fa0fadfda7cc72135f39a583e977f4a0ba14df07aa88ab73a4be5678f06cb874
      CORE_RUN_ID: '31298060637'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Download decrypted complete checkpoint
        uses: actions/download-artifact@v4
        with:
          name: c8b8-decrypted-fullreg-xz-31310246212
          path: checkpoint
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: jxwittower/Git-C
          run-id: 31310246212

      - name: Download exact 87ec core PASS artifact
        uses: actions/download-artifact@v4
        with:
          name: c8b8-threadfix-v8-31298060637
          path: core87
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: jxwittower/Git-C
          run-id: 31298060637

      - name: Bind exact 87ec and patch orchestration syntax only
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $xz=(Resolve-Path 'checkpoint\c8b8_fullreg_payload_v2.tar.xz').Path
          $xh=(Get-FileHash $xz -Algorithm SHA256).Hash.ToLowerInvariant()
          if($xh -ne $env:CHECKPOINT_XZ_SHA){throw "CHECKPOINT_XZ_SHA_FAIL $xh"}
          New-Item -ItemType Directory -Force xzstage,expanded,payload | Out-Null
          7z x -y $xz "-o$pwd\xzstage" | Out-Null
          $tar=Get-ChildItem xzstage -Filter '*.tar' | Select-Object -First 1
          if(!$tar){throw 'CHECKPOINT_TAR_MISSING'}
          7z x -y $tar.FullName "-o$pwd\expanded" | Out-Null
          $src=(Resolve-Path 'expanded\c8b8_fullreg_payload_v2').Path
          Copy-Item "$src\*" payload -Recurse -Force
          $parent=(Get-FileHash 'payload\SigProcDll-64HF.dll' -Algorithm SHA256).Hash.ToLowerInvariant()
          if($parent -ne $env:PARENT_SHA){throw "PARENT_SHA_FAIL $parent"}

          $cand=@(Get-ChildItem core87 -Recurse -Filter 'SigProcDll-64HF.dll' | Where-Object { (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() -eq $env:CAND_SHA })
          if($cand.Count -ne 1){throw "EXACT_CANDIDATE_COUNT_FAIL $($cand.Count)"}
          Copy-Item $cand[0].FullName 'payload\SigProcDll-64HF.dll' -Force
          $bound=(Get-FileHash 'payload\SigProcDll-64HF.dll' -Algorithm SHA256).Hash.ToLowerInvariant()
          if($bound -ne $env:CAND_SHA){throw "BOUND_SHA_FAIL $bound"}

          $lock=Get-ChildItem core87 -Recurse -Filter 'C8B8_THREADFIX_V8_CORE_PASS.lock' | Select-Object -First 1
          if(!$lock){throw 'CORE_LOCK_MISSING'}
          $lt=Get-Content $lock.FullName -Raw
          foreach($m in @('THREADFIX_V8_CORE_NATIVE_PASS',"SHA256=$env:CAND_SHA",'TWO_THREAD=2x2000','LONG_STABILITY=20000','REALTIME_1HZ=60','RUN_ID=31298060637')){if(-not $lt.Contains($m)){throw "CORE_LOCK_MARKER_FAIL $m"}}
          Copy-Item $lock.FullName '87ec_core_native_pass.lock' -Force
          foreach($p in @('threadstress_v8.log','stability_v8.log','realtime_v8.log','loader_inner-bed.log','loader_outer-medical-bed.log','cp08_corepass.txt')){
            $f=Get-ChildItem core87 -Recurse -Filter $p | Select-Object -First 1
            if(!$f){throw "CORE_EVIDENCE_MISSING $p"}
            Copy-Item $f.FullName ".\core_$p" -Force
          }
          if(-not(Select-String -Path 'core_threadstress_v8.log' -Pattern 'TWO_THREAD_STRESS_PASS threads=2 loops_each=2000' -SimpleMatch -Quiet)){throw 'CORE_THREAD_FAIL'}
          if(-not(Select-String -Path 'core_stability_v8.log' -Pattern 'LONG_STABILITY_PASS loops=20000' -SimpleMatch -Quiet)){throw 'CORE_LONG_FAIL'}
          if(-not(Select-String -Path 'core_realtime_v8.log' -Pattern 'REALTIME_1HZ_PASS frames=60' -SimpleMatch -Quiet)){throw 'CORE_1HZ_FAIL'}
          if(-not(Select-String -Path 'core_loader_inner-bed.log' -Pattern 'ALL_LOADER_CONTRACT_TESTS_PASS' -SimpleMatch -Quiet)){throw 'CORE_INNER_LOADER_FAIL'}
          if(-not(Select-String -Path 'core_loader_outer-medical-bed.log' -Pattern 'ALL_LOADER_CONTRACT_TESTS_PASS' -SimpleMatch -Quiet)){throw 'CORE_OUTER_LOADER_FAIL'}
          if(-not(Select-String -Path 'core_cp08_corepass.txt' -Pattern "POST_TEST_SHA=$env:CAND_SHA" -SimpleMatch -Quiet)){throw 'CORE_POST_SHA_MARKER_FAIL'}

          $bytes=[IO.File]::ReadAllBytes((Resolve-Path 'payload\SigProcDll-64HF.dll'))
          $ascii=[Text.Encoding]::ASCII.GetString($bytes)
          if(-not $ascii.Contains('.stkfix')){throw 'STKFIX_MISSING'}
          if(-not $ascii.Contains('.thrfix')){throw 'THRFIX_MISSING'}
          $ghf=@(Get-ChildItem payload\testdata -Recurse -Filter '*.ghf');$gb=($ghf|Measure-Object Length -Sum).Sum
          if($ghf.Count -ne 13 -or $gb -ne 82484656){throw "GHF_COVERAGE_FAIL count=$($ghf.Count) bytes=$gb"}

          $runner='payload\run_windows_gate.ps1'
          $rh=(Get-FileHash $runner -Algorithm SHA256).Hash.ToLowerInvariant()
          if($rh -ne $env:ORIGINAL_RUNNER_SHA){throw "ORIGINAL_RUNNER_SHA_FAIL $rh"}
          $s=Get-Content $runner -Raw
          $pairs=@(
            @("Select-String candidate_headers.txt -SimpleMatch '14C machine (x86)' -Quiet","Select-String -Path candidate_headers.txt -Pattern '14C machine (x86)' -SimpleMatch -Quiet"),
            @("Select-String candidate_headers.txt -SimpleMatch '.stkfix' -Quiet","Select-String -Path candidate_headers.txt -Pattern '.stkfix' -SimpleMatch -Quiet"),
            @('Select-String candidate_exports.txt -SimpleMatch $e -Quiet','Select-String -Path candidate_exports.txt -Pattern $e -SimpleMatch -Quiet'),
            @("Select-String loader_inner.log -SimpleMatch 'ALL_LOADER_CONTRACT_TESTS_PASS' -Quiet","Select-String -Path loader_inner.log -Pattern 'ALL_LOADER_CONTRACT_TESTS_PASS' -SimpleMatch -Quiet"),
            @("Select-String loader_outer.log -SimpleMatch 'ALL_LOADER_CONTRACT_TESTS_PASS' -Quiet","Select-String -Path loader_outer.log -Pattern 'ALL_LOADER_CONTRACT_TESTS_PASS' -SimpleMatch -Quiet"),
            @('Select-String $x.f -SimpleMatch $x.m -Quiet','Select-String -Path $x.f -Pattern $x.m -SimpleMatch -Quiet')
          )
          foreach($q in $pairs){if(-not $s.Contains($q[0])){throw "RUNNER_PATCH_TARGET_MISSING $($q[0])"};$s=$s.Replace($q[0],$q[1])}
          [IO.File]::WriteAllText((Resolve-Path $runner),$s,(New-Object Text.UTF8Encoding($false)))
          $patched=(Get-FileHash $runner -Algorithm SHA256).Hash.ToLowerInvariant()
          @("CHECKPOINT_XZ_SHA=$xh","PARENT_SHA=$parent","BOUND_CANDIDATE_SHA=$bound","CORE_NATIVE_RUN=$env:CORE_RUN_ID","GHF_COUNT=$($ghf.Count)","GHF_BYTES=$gb","ORIGINAL_RUNNER_SHA=$rh","PATCHED_RUNNER_SHA=$patched",'PATCH_SCOPE=Select-String named parameters only','STKFIX=PASS','THRFIX=PASS') | Set-Content 87ec_exact_binding.txt

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Execute complete native Windows regression on all 13 original GHF
        shell: powershell
        timeout-minutes: 95
        run: |
          $ErrorActionPreference='Stop'
          & .\payload\run_windows_gate.ps1
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          if(!(Test-Path 'run_windows_gate_pass.txt')){throw 'RUN_WINDOWS_GATE_PASS_MISSING'}
          if(-not(Select-String -Path 'complete_regression_gate.txt' -Pattern 'COMPLETE_NATIVE_WINDOWS_REGRESSION_PASS' -SimpleMatch -Quiet)){throw 'COMPLETE_REGRESSION_MARKER_FAIL'}
          $post=(Get-FileHash 'payload\SigProcDll-64HF.dll' -Algorithm SHA256).Hash.ToLowerInvariant()
          if($post -ne $env:CAND_SHA){throw "POST_FULLREG_SHA_FAIL $post"}

      - name: Final strict marker performance and package audit
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $post=(Get-FileHash 'payload\SigProcDll-64HF.dll' -Algorithm SHA256).Hash.ToLowerInvariant()
          if($post -ne $env:CAND_SHA){throw "PREPACKAGE_SHA_FAIL $post"}
          $checks=@(
            @{f='01_sentinel.log';m='SEQ_TARGETS_VITAL_SUPPRESSION_RECOVERY_PASS'},
            @{f='02_long.log';m='LONG_STABILITY_PASS loops=20000'},
            @{f='03_threads.log';m='TWO_THREAD_STRESS_PASS threads=2 loops_each=2000'},
            @{f='04_full.log';m='FULL_GHF_NATIVE_PASS frames=10808 samples=6853006'},
            @{f='04_full.log';m='PERFORMANCE_PASS'},
            @{f='05_determinism.log';m='DETERMINISTIC_REPLAY_PASS'},
            @{f='06_realtime.log';m='REALTIME_1HZ_PASS frames=60'}
          )
          foreach($x in $checks){if(-not(Select-String -Path $x.f -Pattern $x.m -SimpleMatch -Quiet)){throw "FINAL_MARKER_FAIL $($x.m)"}}
          $perf=(Select-String -Path '04_full.log' -Pattern 'PERFORMANCE_PASS avg_ms=([0-9.]+)' | Select-Object -Last 1)
          if(!$perf){throw 'PERFORMANCE_LINE_MISSING'}
          $avg=[double]$perf.Matches[0].Groups[1].Value
          if($avg -gt 100.0){throw "PERFORMANCE_STRICT_100MS_FAIL avg=$avg"}
          @(
            '87EC_EXACT_NATIVE_AND_COMPLETE_FULLREG_PASS',"SHA256=$post",'PARENT_SHA=c8b8f49620b45707f80f47a9fadf14db376a115bc6052517e9243e0cb2dc20e9','CORE_NATIVE_RUN=31298060637',"COMPLETE_FULLREG_RUN=$env:GITHUB_RUN_ID",'PE32_X86=PASS','EXPORTS=PASS','IMPORT_SUBSET=PASS','STACK_PROBE=PASS','THREAD_SERIALIZATION=PASS','LOADER_INNER_OUTER=PASS','REAL_NONZERO_GHF=PASS','GHF_COUNT=13','GHF_BYTES=82484656','FULL_GHF_FRAMES=10808','FULL_GHF_SAMPLES=6853006','SEQ_TARGETS=PASS','DETERMINISTIC_REPLAY=PASS','LONG_STABILITY_20000=PASS','SAME_PROCESS_TWO_THREAD_2X2000=PASS','REALTIME_1HZ_60=PASS',"PERFORMANCE_AVG_MS=$avg",'PERFORMANCE_STRICT_LE_100MS=PASS'
          ) | Set-Content 87EC_EXACT_NATIVE_AND_COMPLETE_FULLREG_PASS.lock
          @('GuanHu SigProc authoritative final release','Filename=SigProcDll-64HF.dll',"SHA256=$post",'Architecture=PE32 x86','Exports=_SigProc@24,_SigProc_Fini@0,_SigProc_Init@8,_SigProc_Stat@0','CoreNativeRun=31298060637',"CompleteRegressionRun=$env:GITHUB_RUN_ID",'OriginalGHFCount=13','OriginalGHFBytes=82484656','FullFrames=10808','FullSamples=6853006',"PerformanceAvgMs=$avg") | Set-Content FINAL_RELEASE_MANIFEST.txt
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item 'payload\SigProcDll-64HF.dll' 'release\SigProcDll-64HF.dll' -Force
          Copy-Item '87EC_EXACT_NATIVE_AND_COMPLETE_FULLREG_PASS.lock','FINAL_RELEASE_MANIFEST.txt' release\ -Force
          "$post  SigProcDll-64HF.dll" | Set-Content 'release\SigProcDll-64HF.dll.sha256'
          Compress-Archive -Path 'release\*' -DestinationPath 'GuanHu_SigProc_Final_Release_20260809.zip' -Force
          if((Get-Item 'GuanHu_SigProc_Final_Release_20260809.zip').Length -le 0){throw 'ZIP_EMPTY'}
          Expand-Archive 'GuanHu_SigProc_Final_Release_20260809.zip' zip_audit -Force
          $zd=Get-Item 'zip_audit\SigProcDll-64HF.dll';if($zd.Length -le 0){throw 'ZIP_DLL_EMPTY'}
          $zsha=(Get-FileHash $zd.FullName -Algorithm SHA256).Hash.ToLowerInvariant();if($zsha -ne $env:CAND_SHA){throw "ZIP_DLL_SHA_FAIL $zsha"}
          $zipsha=(Get-FileHash 'GuanHu_SigProc_Final_Release_20260809.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          @('FINAL_ZIP_AUDIT_PASS',"ZIP_SHA256=$zipsha","EXTRACTED_DLL_SHA256=$zsha","EXTRACTED_DLL_BYTES=$($zd.Length)") | Set-Content FINAL_ZIP_AUDIT_PASS.txt
          New-Item -ItemType Directory -Force evidence_summary | Out-Null
          Copy-Item '87EC_EXACT_NATIVE_AND_COMPLETE_FULLREG_PASS.lock','FINAL_RELEASE_MANIFEST.txt','FINAL_ZIP_AUDIT_PASS.txt' evidence_summary\ -Force
          git config user.name windows-dll-test-bot;git config user.email windows-dll-test-bot@users.noreply.github.com
          git add evidence_summary;git commit -m 'Lock authoritative exact 87ec complete native regression PASS';if($LASTEXITCODE -ne 0){throw 'FINAL_COMMIT_FAIL'}
          git push origin "HEAD:$env:HANDOFF_BRANCH";if($LASTEXITCODE -ne 0){throw 'FINAL_PUSH_FAIL'}

      - name: Upload final exact DLL package and evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: 87ec-authoritative-final-${{ github.run_id }}
          path: |
            release/SigProcDll-64HF.dll
            GuanHu_SigProc_Final_Release_20260809.zip
            87EC_EXACT_NATIVE_AND_COMPLETE_FULLREG_PASS.lock
            FINAL_RELEASE_MANIFEST.txt
            FINAL_ZIP_AUDIT_PASS.txt
            87ec_exact_binding.txt
            87ec_core_native_pass.lock
            exact_asset_hashes.txt
            ghf_sha_gate.txt
            static_pe_gate.txt
            loader_inner.log
            loader_outer.log
            hostcompat_nonzero.log
            c63_nonzero.log
            01_sentinel.log
            02_long.log
            03_threads.log
            04_full.log
            05_determinism.log
            06_realtime.log
            post_test_sha.txt
            complete_regression_gate.txt
            core_threadstress_v8.log
            core_stability_v8.log
            core_realtime_v8.log
          if-no-files-found: error
          retention-days: 30
