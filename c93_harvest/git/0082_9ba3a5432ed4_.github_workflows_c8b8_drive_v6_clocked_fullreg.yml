name: c8b8-drive-v6-clock-aware-fullreg
on:
  push:
    branches: [c8b8-drive-v3-release-20260809]
    paths:
      - '.github/workflows/c8b8_drive_v6_clocked_fullreg.yml'
permissions:
  contents: read
jobs:
  fullreg:
    runs-on: windows-2022
    timeout-minutes: 150
    env:
      CAND_SHA: c8b8f49620b45707f80f47a9fadf14db376a115bc6052517e9243e0cb2dc20e9
      ENC_SHA: 53d11ca2b252e1b319d7552ed0c6ec5fdd53415286d63df0ea0c69bba1bd60de
      XZ_SHA: 95a0d2efecfcebee99355727bd8e9034e4c2fe08c169ea7a996b630e07da5fbc
      HARNESS_SHA: faa0f57ab71ab82fef66d9475584658d3b7c0e91e26bf45862e762b5470fe83d
      GHF_COUNT: '13'
      GHF_BYTES: '82484656'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Create one-time mailbox and RSA key
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          @'
          import json,os,secrets,string,urllib.request
          from pathlib import Path
          def q(method,url,obj=None,token=None):
              data=None if obj is None else json.dumps(obj).encode()
              r=urllib.request.Request(url,data=data,method=method);r.add_header('Accept','application/json')
              if data is not None:r.add_header('Content-Type','application/json')
              if token:r.add_header('Authorization','Bearer '+token)
              with urllib.request.urlopen(r,timeout=30) as x:return json.load(x)
          base='https://api.mail.tm';d=q('GET',base+'/domains');m=d if isinstance(d,list) else d.get('hydra:member',[])
          if not m:raise SystemExit('MAIL_DOMAIN_FAIL')
          a=string.ascii_lowercase+string.digits;addr='ghc8b8v6'+''.join(secrets.choice(a) for _ in range(14))+'@'+m[0]['domain'];pw=''.join(secrets.choice(string.ascii_letters+string.digits+'-_') for _ in range(32))
          q('POST',base+'/accounts',{'address':addr,'password':pw});tok=q('POST',base+'/token',{'address':addr,'password':pw})['token']
          Path(os.environ['RUNNER_TEMP'],'mail.json').write_text(json.dumps({'address':addr,'token':tok}));Path('mailbox.txt').write_text(addr+'\n');Path('subject_prefix.txt').write_text('GuanHu-C8B8-V6-'+os.environ['GITHUB_RUN_ID']+'\n')
          print('MAILBOX_READY',addr)
          '@ | Set-Content -Encoding ascii $env:RUNNER_TEMP\mailbox.py
          python $env:RUNNER_TEMP\mailbox.py
          if($LASTEXITCODE -ne 0){throw 'MAILBOX_FAIL'}
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out $env:RUNNER_TEMP\private.pem
          openssl pkey -in $env:RUNNER_TEMP\private.pem -pubout -out public.pem
          if($LASTEXITCODE -ne 0){throw 'RSA_FAIL'}
          New-Item -ItemType Directory -Force handoff|Out-Null;Copy-Item mailbox.txt,subject_prefix.txt,public.pem handoff\ -Force

      - name: Upload handoff
        uses: actions/upload-artifact@v4
        with:
          name: c8b8-v6-handoff-${{ github.run_id }}
          path: handoff/*
          if-no-files-found: error
          retention-days: 1

      - name: Receive exact encrypted payload
        shell: powershell
        timeout-minutes: 35
        run: |
          $ErrorActionPreference='Stop'
          @'
          import json,os,time,urllib.request,urllib.parse
          from pathlib import Path
          cfg=json.loads(Path(os.environ['RUNNER_TEMP'],'mail.json').read_text());token=cfg['token'];base='https://api.mail.tm';prefix=Path('subject_prefix.txt').read_text().strip();out=Path('transport');out.mkdir(exist_ok=True)
          wanted={f'{prefix}-P{i}':i for i in range(1,5)};got=set();key=False;seen=set()
          def j(url):
              r=urllib.request.Request(url);r.add_header('Accept','application/json');r.add_header('Authorization','Bearer '+token)
              with urllib.request.urlopen(r,timeout=30) as x:return json.load(x)
          def b(url):
              r=urllib.request.Request(url);r.add_header('Authorization','Bearer '+token)
              with urllib.request.urlopen(r,timeout=120) as x:return x.read()
          end=time.time()+1800
          while time.time()<end and (len(got)<4 or not key):
              x=j(base+'/messages');msgs=x if isinstance(x,list) else x.get('hydra:member',[])
              for m in msgs:
                  if m.get('subject') not in wanted or m.get('id') in seen:continue
                  seen.add(m['id']);idx=wanted[m['subject']];d=j(base+'/messages/'+m['id'])
                  for at in d.get('attachments',[]):
                      u=at.get('downloadUrl');name=at.get('filename','')
                      if not u:continue
                      data=b(urllib.parse.urljoin(base,u))
                      if name==f'c8b8_v6_part{idx}.bin':(out/name).write_bytes(data);got.add(idx)
                      elif name=='c8b8_v6_wrapped_key.bin':(out/name).write_bytes(data);key=True
              if len(got)<4 or not key:time.sleep(5)
          if len(got)!=4 or not key:raise SystemExit(f'TRANSPORT_FAIL parts={sorted(got)} key={key}')
          print('MAIL_TRANSPORT_COMPLETE parts=4 key=1')
          '@ | Set-Content -Encoding ascii $env:RUNNER_TEMP\recv.py
          python $env:RUNNER_TEMP\recv.py|Tee-Object mail_transport.txt
          if($LASTEXITCODE -ne 0){throw 'TRANSPORT_FAIL'}

      - name: Decrypt extract and exact-bind candidate and all GHF
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          @'
          import os
          from pathlib import Path
          d=Path(os.environ['RUNNER_TEMP'])/'payload.enc'
          with d.open('wb') as o:
              for i in range(1,5):o.write((Path('transport')/f'c8b8_v6_part{i}.bin').read_bytes())
          print('REASSEMBLED',d.stat().st_size)
          '@|Set-Content -Encoding ascii $env:RUNNER_TEMP\join.py
          python $env:RUNNER_TEMP\join.py
          $h=(Get-FileHash $env:RUNNER_TEMP\payload.enc -Algorithm SHA256).Hash.ToLowerInvariant();if($h -ne $env:ENC_SHA){throw "ENC_SHA_FAIL $h"}
          openssl pkeyutl -decrypt -inkey $env:RUNNER_TEMP\private.pem -in transport\c8b8_v6_wrapped_key.bin -out $env:RUNNER_TEMP\pass.txt -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in $env:RUNNER_TEMP\payload.enc -out $env:RUNNER_TEMP\payload.tar.xz -pass file:$env:RUNNER_TEMP\pass.txt
          if($LASTEXITCODE -ne 0){throw 'DECRYPT_FAIL'}
          $x=(Get-FileHash $env:RUNNER_TEMP\payload.tar.xz -Algorithm SHA256).Hash.ToLowerInvariant();if($x -ne $env:XZ_SHA){throw "XZ_SHA_FAIL $x"}
          @'
          import os,tarfile,hashlib
          from pathlib import Path
          dst=Path('payload');dst.mkdir(exist_ok=True)
          with tarfile.open(Path(os.environ['RUNNER_TEMP'])/'payload.tar.xz','r:xz') as t:t.extractall(dst)
          for f in ['CORE_SHA256SUMS.txt','GHF_SHA256SUMS.txt']:
              for line in (dst/f).read_text().splitlines():
                  if not line.strip():continue
                  sha,rel=line.split(None,1);p=dst/rel.strip();got=hashlib.sha256(p.read_bytes()).hexdigest()
                  if got!=sha:raise SystemExit(f'SHA_FAIL {rel} {got}')
          cand=hashlib.sha256((dst/'SigProcDll-64HF.dll').read_bytes()).hexdigest();ghf=list((dst/'testdata').rglob('*.ghf'));total=sum(p.stat().st_size for p in ghf)
          if cand!=os.environ['CAND_SHA'] or len(ghf)!=int(os.environ['GHF_COUNT']) or total!=int(os.environ['GHF_BYTES']):raise SystemExit(f'BIND_FAIL cand={cand} ghf={len(ghf)} bytes={total}')
          print('EXACT_PAYLOAD_BIND_PASS cand=%s ghf=%d bytes=%d'%(cand,len(ghf),total))
          '@|Set-Content -Encoding ascii $env:RUNNER_TEMP\bind.py
          python $env:RUNNER_TEMP\bind.py|Tee-Object exact_asset_binding.txt
          if($LASTEXITCODE -ne 0){throw 'BIND_FAIL'}

      - name: Install SHA-locked clock-aware full regression harness
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          @'
          import base64,gzip,hashlib,os
          from pathlib import Path
          s=''
          b=gzip.decompress(base64.b64decode(s));p=Path('payload/fullreg.c');p.write_bytes(b);h=hashlib.sha256(b).hexdigest()
          if h!=os.environ['HARNESS_SHA']:raise SystemExit('HARNESS_SHA_FAIL '+h)
          print('CLOCK_AWARE_HARNESS_SHA_PASS',h)
          '@|Set-Content -Encoding ascii $env:RUNNER_TEMP\install_harness.py
          python $env:RUNNER_TEMP\install_harness.py|Tee-Object harness_binding.txt
          if($LASTEXITCODE -ne 0){throw 'HARNESS_BIND_FAIL'}

      - name: Configure MSVC x86
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Compile clock-aware x86 harness
        shell: powershell
        run: |
          $ErrorActionPreference='Continue'
          $o=& cl /nologo /O2 /W4 /D_CRT_SECURE_NO_WARNINGS /Fe:payload\fullreg.exe payload\fullreg.c 2>&1;$rc=$LASTEXITCODE
          $t=($o|ForEach-Object{$_.ToString()}) -join "`n";$t|Set-Content -Encoding utf8 fullreg_compile.txt;Write-Host $t
          if($rc -ne 0){exit $rc}

      - name: Execute exact complete full regression with simulated 1Hz replay and real 1Hz clock check
        shell: powershell
        timeout-minutes: 125
        run: |
          $ErrorActionPreference='Continue'
          $o=& .\payload\fullreg.exe .\payload\SigProcDll-64HF.dll .\payload\HostCompat.dll .\payload\C63.dll .\payload\testdata .\payload\runtime\inner-bed .\payload\runtime\outer-medical-bed 2>&1;$rc=$LASTEXITCODE
          $t=($o|ForEach-Object{$_.ToString()}) -join "`n";$t|Set-Content -Encoding utf8 full_regression.log;Write-Host $t
          "FULLREG_EXIT=$rc"|Set-Content -Encoding ascii regression_runner_exit.txt
          if($rc -ne 0){exit $rc}
          $marks=@('FAKE_CLOCK_IAT_PASS tag=candidate-inner-full tick_seconds=1','INNER_FULL_REPLAY_PASS','OUTER_FULL_REPLAY_PASS','SEQ_TARGETS_VITAL_SUPPRESSION_RECOVERY_PASS','DETERMINISTIC_REPLAY_PASS','PERFORMANCE_PASS','LONG_STABILITY_PASS loops=20000','TWO_THREAD_STRESS_PASS threads=2 loops_each=2000','REALTIME_1HZ_PASS frames=60','HOSTCOMPAT_FULL_BASELINE_PASS','C63_FULL_BASELINE_PASS','BASELINE_COMPARISON_PASS','COMPLETE_NATIVE_WINDOWS_REGRESSION_PASS')
          foreach($m in $marks){if(-not $t.Contains($m)){Write-Error "MISSING_MARKER $m";exit 90}}
          'FULL_NATIVE_WINDOWS_COMPLETE_REGRESSION_PASS'|Set-Content -Encoding ascii fullreg_gate.txt

      - name: Exact post-test SHA release lock
        shell: powershell
        run: |
          $h=(Get-FileHash payload\SigProcDll-64HF.dll -Algorithm SHA256).Hash.ToLowerInvariant();if($h -ne $env:CAND_SHA){throw "POST_SHA_FAIL $h"}
          "POST_TEST_SHA256=$h"|Set-Content -Encoding ascii post_regression_sha256.txt
          "NATIVE_WINDOWS_DYNAMIC_PASS SHA256=$h`nFULL_NATIVE_WINDOWS_COMPLETE_REGRESSION_PASS SHA256=$h`nRELEASE_GATE_PASS SHA256=$h`nHARNESS_SHA256=$env:HARNESS_SHA"|Set-Content -Encoding ascii C8B8_V6_EXACT_RELEASE_PASS.lock

      - name: Upload exact tested DLL and full evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c8b8-v6-exact-release-${{ github.run_id }}
          path: |
            payload/SigProcDll-64HF.dll
            payload/fullreg.c
            exact_asset_binding.txt
            harness_binding.txt
            fullreg_compile.txt
            full_regression.log
            regression_runner_exit.txt
            fullreg_gate.txt
            post_regression_sha256.txt
            C8B8_V6_EXACT_RELEASE_PASS.lock
            mail_transport.txt
          if-no-files-found: ignore
          retention-days: 30
