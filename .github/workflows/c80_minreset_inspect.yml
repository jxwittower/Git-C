name: c80-minreset-inspect
on:
  push:
    branches: [c80-algo-only-reset-20260815]
    paths: ['.github/workflows/c80_minreset_inspect.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect minreset payload
        shell: bash
        run: |
          set -euo pipefail
          cat .c80_minreset_payload/part_00.b64 .c80_minreset_payload/part_01.b64 .c80_minreset_payload/part_02.b64 .c80_minreset_payload/part_03.b64 > "$RUNNER_TEMP/payload.b64"
          tr -d '\r\n\t ' < "$RUNNER_TEMP/payload.b64" > "$RUNNER_TEMP/payload.clean.b64"
          echo B64_CHARS=$(wc -c < "$RUNNER_TEMP/payload.clean.b64")
          base64 -d "$RUNNER_TEMP/payload.clean.b64" > "$RUNNER_TEMP/payload.bin"
          echo BIN_BYTES=$(wc -c < "$RUNNER_TEMP/payload.bin")
          sha256sum "$RUNNER_TEMP/payload.bin"
          file "$RUNNER_TEMP/payload.bin" || true
          mkdir -p "$RUNNER_TEMP/out"
          if tar -tJf "$RUNNER_TEMP/payload.bin" > listing.txt 2>tarerr.txt; then
            echo TAR_XZ_OK
            cat listing.txt
            tar -xJf "$RUNNER_TEMP/payload.bin" -C "$RUNNER_TEMP/out"
            echo HASHES
            find "$RUNNER_TEMP/out" -type f -print0 | sort -z | xargs -0 sha256sum
          else
            echo TAR_XZ_FAIL
            cat tarerr.txt
          fi
