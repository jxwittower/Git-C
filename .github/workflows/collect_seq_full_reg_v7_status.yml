name: collect-seq-full-reg-v7-status

on:
  workflow_run:
    workflows: ["guanhu-seq-candidate-full-regression-v7"]
    types: [completed]

permissions:
  contents: write
  actions: read

defaults:
  run:
    shell: bash

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify complete regression evidence
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence_summary
          rm -f evidence_summary/SEQ_FULL_REG_V7_PASS.lock evidence_summary/SEQ_FULL_REG_V7_FAIL.lock
          {
            echo "RUN_ID=$RUN_ID"
            echo "CONCLUSION=$CONCLUSION"
            echo "HEAD_SHA=$HEAD_SHA"
          } > evidence_summary/seq_full_reg_v7_status.txt
          if [ "$CONCLUSION" = success ]; then
            rm -rf "$RUNNER_TEMP/evidence"; mkdir -p "$RUNNER_TEMP/evidence"
            gh run download "$RUN_ID" -n seq-candidate-full-regression-v7-evidence -D "$RUNNER_TEMP/evidence"
            test -s "$RUNNER_TEMP/evidence/candidate_sha.txt"
            test -s "$RUNNER_TEMP/evidence/loader_smoke.txt"
            test -s "$RUNNER_TEMP/evidence/import_subset.txt"
            test -s "$RUNNER_TEMP/evidence/validation_c63.txt"
            test -s "$RUNNER_TEMP/evidence/validation_seq_targets.txt"
            test -s "$RUNNER_TEMP/evidence/determinism.txt"
            test -s "$RUNNER_TEMP/evidence/corpus_summary.txt"
            test -s "$RUNNER_TEMP/evidence/performance.txt"
            test -s "$RUNNER_TEMP/evidence/full_regression_gate.txt"
            grep -q 'ALL_LOADER_CONTRACT_TESTS_PASS' "$RUNNER_TEMP/evidence/loader_smoke.txt"
            grep -q 'IMPORT_SUBSET_PASS' "$RUNNER_TEMP/evidence/import_subset.txt"
            grep -q 'SEQ_TARGETS_VITAL_SUPPRESSION_RECOVERY_PASS' "$RUNNER_TEMP/evidence/validation_seq_targets.txt"
            grep -q 'DETERMINISM_PASS' "$RUNNER_TEMP/evidence/determinism.txt"
            grep -q 'HISTORICAL_CORPUS_SWEEP_PASS' "$RUNNER_TEMP/evidence/corpus_summary.txt"
            grep -q 'PERFORMANCE_GATE_PASS' "$RUNNER_TEMP/evidence/performance.txt"
            grep -q 'FULL_SEQ_CANDIDATE_REGRESSION_PASS' "$RUNNER_TEMP/evidence/full_regression_gate.txt"
            sha=$(tr -d '[:space:]' < "$RUNNER_TEMP/evidence/candidate_sha.txt")
            test "${#sha}" = 64
            grep -qx "NATIVE_WINDOWS_SEQ_CANDIDATE_PASS SHA256=$sha" evidence_summary/SEQ_CANDIDATE_V1_NATIVE_PASS.lock
            printf 'FULL_NATIVE_WINDOWS_COMPLETE_REGRESSION_PASS SHA256=%s\n' "$sha" > evidence_summary/SEQ_FULL_REG_V7_PASS.lock
            cp "$RUNNER_TEMP/evidence/loader_smoke.txt" evidence_summary/seq_v7_loader_smoke.txt
            cp "$RUNNER_TEMP/evidence/import_subset.txt" evidence_summary/seq_v7_import_subset.txt
            cp "$RUNNER_TEMP/evidence/validation_c63.txt" evidence_summary/seq_v7_validation_c63.txt
            cp "$RUNNER_TEMP/evidence/validation_seq_targets.txt" evidence_summary/seq_v7_validation_targets.txt
            cp "$RUNNER_TEMP/evidence/determinism.txt" evidence_summary/seq_v7_determinism.txt
            cp "$RUNNER_TEMP/evidence/corpus_summary.txt" evidence_summary/seq_v7_corpus_summary.txt
            cp "$RUNNER_TEMP/evidence/performance.txt" evidence_summary/seq_v7_performance.txt
            echo "CANDIDATE_SHA=$sha" >> evidence_summary/seq_full_reg_v7_status.txt
          else
            printf 'SEQ_FULL_REGRESSION_NOT_PASSED\n' > evidence_summary/SEQ_FULL_REG_V7_FAIL.lock
          fi
      - name: Publish hash-bound full regression result
        run: |
          set -euo pipefail
          git config user.name "windows-dll-test-bot"
          git config user.email "windows-dll-test-bot@users.noreply.github.com"
          rm -rf "$RUNNER_TEMP/persist"; mkdir -p "$RUNNER_TEMP/persist"
          cp -f evidence_summary/seq_full_reg_v7_status.txt "$RUNNER_TEMP/persist/"
          cp -f evidence_summary/SEQ_FULL_REG_V7_*.lock "$RUNNER_TEMP/persist/" 2>/dev/null || true
          cp -f evidence_summary/seq_v7_* "$RUNNER_TEMP/persist/" 2>/dev/null || true
          ok=0
          for n in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B main origin/main
            mkdir -p evidence_summary
            cp -f "$RUNNER_TEMP/persist/"* evidence_summary/ 2>/dev/null || true
            git add evidence_summary
            git commit -m "Record hash-bound full regression v7 result" || true
            if git push origin HEAD:main; then ok=1; break; fi
            sleep 2
          done
          [ "$ok" = 1 ]
