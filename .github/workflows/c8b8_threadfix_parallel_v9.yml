name: c8b8-threadfix-parallel-v9
on:
  push:
    branches: [c8b8-threadfix-v8-20260809]
    paths: ['.github/workflows/c8b8_threadfix_parallel_v9.yml']
permissions: {actions: read, contents: write}
jobs:
  parallel-gates:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      BRANCH: c8b8-threadfix-v8-20260809
      ROOT: c8b8_fullreg_v2_payload
      ENC_SHA: 0a3f05c61deb236d0e9c6e9d7879fb0d0d84551a765e75dfad25967d6e6c70c8
      XZ_SHA: 9e24503212064455f50e1f37d8ce15da52d0c2894b1570639ab5644199e6bfcd
      PARENT_SHA: c8b8f49620b45707f80f47a9fadf14db376a115bc6052517e9243e0cb2dc20e9
      CAND_SHA: 87ec3f9f2748d3143136c97e652b0334d63b973338b4c802aaea08e853ad226e
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: true}
      - uses: actions/download-artifact@v4
        with:
          name: c8b8-staged-encrypted-fullreg-31296517289
          path: stage
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: jxwittower/Git-C
          run-id: 31296517289
      - name: Publish run-specific handoff
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $h=(Get-FileHash stage\c8b8_fullreg_transport.enc -Algorithm SHA256).Hash.ToLowerInvariant(); if($h -ne $env:ENC_SHA){throw 'STAGE_SHA_FAIL'}
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out private.pem
          openssl pkey -in private.pem -pubout -out public.pem
          $d=".c8b8_parallel_v9_handoff\run_$env:GITHUB_RUN_ID"; New-Item -ItemType Directory -Force $d|Out-Null
          Copy-Item public.pem (Join-Path $d public.pem); @("RUN_ID=$env:GITHUB_RUN_ID","CAND_SHA=$env:CAND_SHA")|Set-Content (Join-Path $d binding.txt)
          git config user.name windows-dll-test-bot; git config user.email windows-dll-test-bot@users.noreply.github.com
          git add $d; git commit -m "Publish 87ec parallel v9 handoff $env:GITHUB_RUN_ID"; git push origin "HEAD:$env:BRANCH"
          if($LASTEXITCODE -ne 0){throw 'HANDOFF_PUSH_FAIL'}
      - name: Receive run-specific wrapped key
        shell: powershell
        timeout-minutes: 15
        run: |
          $ErrorActionPreference='Continue';$ok=$false;$rp=".c8b8_parallel_v9_handoff/run_$env:GITHUB_RUN_ID/wrapped_key.b64";$spec="origin/$env:BRANCH`:$rp"
          for($i=0;$i -lt 180;$i++){git fetch origin $env:BRANCH --quiet 2>$null;$txt=& git show $spec 2>$null;if($LASTEXITCODE -eq 0 -and $txt){try{$raw=[Convert]::FromBase64String((($txt -join "`n").Trim()))}catch{$raw=$null};if($raw -and $raw.Length -eq 384){[IO.File]::WriteAllBytes('wrapped_key.bin',$raw);$ok=$true;break}};Start-Sleep 5}
          $ErrorActionPreference='Stop';if(-not $ok){throw 'KEY_TIMEOUT'}
      - name: Decrypt exact payload and rebuild 87ec
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          openssl pkeyutl -decrypt -inkey private.pem -in wrapped_key.bin -out aes.txt -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in stage\c8b8_fullreg_transport.enc -out payload.tar.xz -pass file:aes.txt
          if($LASTEXITCODE -ne 0){throw 'DECRYPT_FAIL'}
          $x=(Get-FileHash payload.tar.xz -Algorithm SHA256).Hash.ToLowerInvariant();if($x -ne $env:XZ_SHA){throw 'XZ_SHA_FAIL'}
          New-Item -ItemType Directory -Force xzstage,unpacked|Out-Null;7z x -y payload.tar.xz "-o$pwd\xzstage"|Out-Null;$t=Get-ChildItem xzstage -Filter '*.tar'|Select-Object -First 1;7z x -y $t.FullName "-o$pwd\unpacked"|Out-Null;Remove-Item aes.txt -Force
          $r="unpacked\$env:ROOT";$p=Join-Path $r SigProcDll-64HF.dll;$ph=(Get-FileHash $p -Algorithm SHA256).Hash.ToLowerInvariant();if($ph -ne $env:PARENT_SHA){throw 'PARENT_SHA_FAIL'}
          python tools\c8b8\patch_thread_serial.py $p (Join-Path $r candidate87.dll) --report parallel_patch_report.json | Out-File patch.log
          $nh=(Get-FileHash (Join-Path $r candidate87.dll) -Algorithm SHA256).Hash.ToLowerInvariant();if($nh -ne $env:CAND_SHA){throw "CAND_SHA_FAIL $nh"};Move-Item -Force (Join-Path $r candidate87.dll) $p
          $g=Get-ChildItem (Join-Path $r testdata) -Recurse -Filter '*.ghf';if($g.Count -ne 13){throw 'GHF_COUNT_FAIL'};if(($g|Measure-Object Length -Sum).Sum -ne 82484656){throw 'GHF_BYTES_FAIL'}
          "CAND_SHA=$nh`nGHF_COUNT=13`nGHF_BYTES=82484656"|Out-File cp01_bind.txt
      - uses: ilammy/msvc-dev-cmd@v1
        with: {arch: x86}
      - name: Compile native x86 host
        shell: powershell
        run: |
          $r="unpacked\$env:ROOT";cl /nologo /O2 /W4 /D_CRT_SECURE_NO_WARNINGS /Fe:native_fullreg_host.exe (Join-Path $r native_fullreg_host.c) 2>&1|Tee-Object compile.log;if($LASTEXITCODE -ne 0){throw 'COMPILE_FAIL'}
      - name: Run full corpus twice plus 20k and real 1Hz in parallel
        shell: powershell
        timeout-minutes: 45
        run: |
          $ErrorActionPreference='Stop';$r=(Resolve-Path "unpacked\$env:ROOT").Path;$host=(Resolve-Path native_fullreg_host.exe).Path;$dll=Join-Path $r SigProcDll-64HF.dll
          $inner=@('01_initial_empty.ghf','02_supine.ghf','03_left.ghf','04_right.ghf','05_free.ghf','06_final_empty.ghf')|%{Join-Path $r "testdata\inner-bed\$_"}
          $outer=@('01_initial_empty.ghf','02_supine.ghf','03_left.ghf','04_right.ghf','05_leave.ghf','06_return_free.ghf','07_final_empty.ghf')|%{Join-Path $r "testdata\outer-medical-bed\$_"}
          foreach($n in @('rt_i1','rt_i2','rt_o1','rt_o2','rt_stress','rt_1hz')){if($n -like 'rt_o*'){Copy-Item (Join-Path $r 'runtime\outer-medical-bed') $n -Recurse -Force}else{Copy-Item (Join-Path $r 'runtime\inner-bed') $n -Recurse -Force}}
          function Start-Capture($name,$args){Start-Process -FilePath $host -ArgumentList $args -NoNewWindow -PassThru -RedirectStandardOutput "$name.out" -RedirectStandardError "$name.err"}
          $a1=@('replay',$dll,(Resolve-Path rt_i1).Path,(Join-Path $pwd inner1.csv))+$inner
          $a2=@('replay',$dll,(Resolve-Path rt_i2).Path,(Join-Path $pwd inner2.csv))+$inner
          $a3=@('replay',$dll,(Resolve-Path rt_o1).Path,(Join-Path $pwd outer1.csv))+$outer
          $a4=@('replay',$dll,(Resolve-Path rt_o2).Path,(Join-Path $pwd outer2.csv))+$outer
          $p1=Start-Capture inner1 $a1;$p2=Start-Capture inner2 $a2;$p3=Start-Capture outer1 $a3;$p4=Start-Capture outer2 $a4
          $ps=Start-Capture stability @('stress',$dll,(Resolve-Path rt_stress).Path,$inner[1],'20000')
          $pr=Start-Capture realtime @('realtime',$dll,(Resolve-Path rt_1hz).Path,$inner[1],'60')
          @($p1,$p2,$p3,$p4,$ps,$pr)|%{$_.WaitForExit()}
          $names=@('inner1','inner2','outer1','outer2','stability','realtime');foreach($n in $names){Get-Content "$n.out","$n.err" -ErrorAction SilentlyContinue|Add-Content parallel_v9.log}
          foreach($p in @($p1,$p2,$p3,$p4,$ps,$pr)){if($p.ExitCode -ne 0){throw "PROCESS_FAIL pid=$($p.Id) rc=$($p.ExitCode)"}}
          if(-not(Compare-Object (Get-Content inner1.csv) (Get-Content inner2.csv) -SyncWindow 0)){ 'INNER_DETERMINISTIC_PASS'|Add-Content cp02_parallel.txt }else{throw 'INNER_DETERMINISM_FAIL'}
          if(-not(Compare-Object (Get-Content outer1.csv) (Get-Content outer2.csv) -SyncWindow 0)){ 'OUTER_DETERMINISTIC_PASS'|Add-Content cp02_parallel.txt }else{throw 'OUTER_DETERMINISM_FAIL'}
          $log=Get-Content parallel_v9.log -Raw
          if($log -notmatch 'REPLAY_PASS frames=6294 files=6'){throw 'INNER_FRAME_COUNT_FAIL'}
          if($log -notmatch 'REPLAY_PASS frames=4514 files=7'){throw 'OUTER_FRAME_COUNT_FAIL'}
          if($log -notmatch 'LONG_STABILITY_PASS loops=20000'){throw 'LONG_STABILITY_FAIL'}
          if($log -notmatch 'REALTIME_1HZ_PASS frames=60'){throw 'REALTIME_FAIL'}
          @('FULL_13_GHF_REPLAY_PASS frames=10808','DETERMINISTIC_REPLAY_PASS inner=6294 outer=4514','LONG_STABILITY_PASS loops=20000','REALTIME_1HZ_PASS frames=60')|Add-Content cp02_parallel.txt
          $post=(Get-FileHash $dll -Algorithm SHA256).Hash.ToLowerInvariant();if($post -ne $env:CAND_SHA){throw 'POST_SHA_FAIL'};"POST_SHA=$post"|Add-Content cp02_parallel.txt
      - name: Commit parallel PASS lock
        if: success()
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force evidence_summary|Out-Null;@('THREADFIX_V9_PARALLEL_PASS',"SHA256=$env:CAND_SHA",'FULL_13_GHF=10808','DETERMINISTIC=PASS','LONG_STABILITY=20000','REALTIME_1HZ=60',"RUN_ID=$env:GITHUB_RUN_ID")|Set-Content evidence_summary\C8B8_THREADFIX_V9_PARALLEL_PASS.lock
          git config user.name windows-dll-test-bot;git config user.email windows-dll-test-bot@users.noreply.github.com;git add evidence_summary/C8B8_THREADFIX_V9_PARALLEL_PASS.lock;git commit -m 'Lock exact 87ec parallel full-corpus gates';git fetch origin $env:BRANCH;git rebase "origin/$env:BRANCH";git push origin "HEAD:$env:BRANCH"
      - name: Upload parallel evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c8b8-threadfix-parallel-v9-${{ github.run_id }}
          path: |
            unpacked/c8b8_fullreg_v2_payload/SigProcDll-64HF.dll
            cp*.txt
            parallel_patch_report.json
            compile.log
            parallel_v9.log
            *.out
            *.err
            inner1.csv
            inner2.csv
            outer1.csv
            outer2.csv
            evidence_summary/C8B8_THREADFIX_V9_PARALLEL_PASS.lock
          if-no-files-found: ignore
          retention-days: 30
