name: patch-c8b8-tar-path-once
on:
  push:
    branches: [c8b8-drive-fullreg-20260809]
    paths:
      - '.github/workflows/patch_c8b8_tar_path_once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Replace only the Windows tar path line
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/c8b8_drive_exact_native_fullreg.yml')
          s=p.read_text()
          old='          tar -xJf "$RUNNER_TEMP/payload.tar.xz" -C payload\n'
          new='          xz -dc "$RUNNER_TEMP/payload.tar.xz" | tar -xf - -C payload\n'
          if old not in s:
              raise SystemExit('EXPECTED_TAR_LINE_NOT_FOUND')
          if s.count(old) != 1:
              raise SystemExit('EXPECTED_TAR_LINE_NOT_UNIQUE')
          p.write_text(s.replace(old,new,1))
          PY
          git diff --check
          git diff -- .github/workflows/c8b8_drive_exact_native_fullreg.yml
          git config user.name windows-dll-test-bot
          git config user.email windows-dll-test-bot@users.noreply.github.com
          git add .github/workflows/c8b8_drive_exact_native_fullreg.yml
          git commit -m 'Fix Windows tar extraction path for c8b8 gate'
          git push origin HEAD:c8b8-drive-fullreg-20260809
