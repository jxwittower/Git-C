name: collect-windows-evidence

on:
  push:
    paths:
      - '.github/workflows/collect_windows_evidence.yml'

permissions:
  actions: read
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download latest Windows smoke evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _evidence evidence_summary
          mkdir -p _evidence evidence_summary
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" > "$RUNNER_TEMP/artifacts.json"
          python3 - "$RUNNER_TEMP/artifacts.json" <<'PY' > "$RUNNER_TEMP/selected.txt"
          import json,sys
          data=json.load(open(sys.argv[1]))
          names={'windows-native-smoke-evidence','windows-native-drive-smoke-evidence'}
          xs=[a for a in data.get('artifacts',[]) if a.get('name') in names and not a.get('expired')]
          xs.sort(key=lambda a:a.get('created_at',''), reverse=True)
          if not xs:
              raise SystemExit('NO_WINDOWS_EVIDENCE_ARTIFACT')
          a=xs[0]
          print(a['id'])
          print(a['name'])
          print(a.get('workflow_run',{}).get('id',''))
          print(a.get('created_at',''))
          PY
          mapfile -t SEL < "$RUNNER_TEMP/selected.txt"
          ART_ID="${SEL[0]}"; ART_NAME="${SEL[1]}"; RUN_ID="${SEL[2]}"; CREATED="${SEL[3]}"
          echo "artifact_id=$ART_ID name=$ART_NAME run_id=$RUN_ID created=$CREATED"
          gh api -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ART_ID}/zip" > "$RUNNER_TEMP/evidence.zip"
          unzip -q "$RUNNER_TEMP/evidence.zip" -d _evidence
          {
            echo "artifact_name=$ART_NAME"
            echo "artifact_id=$ART_ID"
            echo "run_id=$RUN_ID"
            echo "created_at=$CREATED"
            echo
            echo '=== loader_smoke.txt ==='
            cat _evidence/loader_smoke.txt 2>/dev/null || echo MISSING_LOADER_SMOKE
            echo
            echo '=== windows_environment.txt ==='
            cat _evidence/windows_environment.txt 2>/dev/null || true
          } > evidence_summary/windows_native_smoke_summary.txt
          if grep -q 'ALL_LOADER_CONTRACT_TESTS_PASS' evidence_summary/windows_native_smoke_summary.txt; then
            echo 'WINDOWS_NATIVE_LOADER_GATE=PASS' >> evidence_summary/windows_native_smoke_summary.txt
          else
            echo 'WINDOWS_NATIVE_LOADER_GATE=FAIL' >> evidence_summary/windows_native_smoke_summary.txt
          fi
          sha256sum _evidence/* 2>/dev/null > evidence_summary/evidence_sha256.txt || true
      - name: Commit evidence summary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'windows-dll-test-bot'
          git config user.email 'windows-dll-test-bot@users.noreply.github.com'
          git add evidence_summary
          git commit -m 'Record native Windows smoke evidence summary'
          git push
