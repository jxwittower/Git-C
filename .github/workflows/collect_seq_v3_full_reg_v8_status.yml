name: collect-seq-v3-full-reg-v8-status

on:
  workflow_run:
    workflows: ["guanhu-seq-v3-full-regression-v8"]
    types: [completed]

permissions:
  contents: write
  actions: read

defaults:
  run:
    shell: bash

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify all final v3 regression evidence
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence_summary
          rm -f evidence_summary/SEQ_V3_FULL_REG_V8_PASS.lock evidence_summary/SEQ_V3_FULL_REG_V8_FAIL.lock
          {
            echo "RUN_ID=$RUN_ID"
            echo "CONCLUSION=$CONCLUSION"
            echo "HEAD_SHA=$HEAD_SHA"
          } > evidence_summary/seq_v3_full_reg_v8_status.txt
          if [ "$CONCLUSION" = success ]; then
            rm -rf "$RUNNER_TEMP/evidence"; mkdir -p "$RUNNER_TEMP/evidence"
            gh run download "$RUN_ID" -n seq-v3-full-regression-v8-evidence -D "$RUNNER_TEMP/evidence"
            for f in candidate_v3_sha.txt loader_smoke_v3.txt import_subset_v3.txt validation_c63.txt validation_seq_targets.txt determinism.txt corpus_summary.txt performance.txt full_regression_v3_gate.txt; do test -s "$RUNNER_TEMP/evidence/$f"; done
            grep -q 'ALL_LOADER_CONTRACT_TESTS_PASS' "$RUNNER_TEMP/evidence/loader_smoke_v3.txt"
            grep -q 'IMPORT_SUBSET_PASS' "$RUNNER_TEMP/evidence/import_subset_v3.txt"
            grep -q 'SEQ_TARGETS_VITAL_SUPPRESSION_RECOVERY_PASS' "$RUNNER_TEMP/evidence/validation_seq_targets.txt"
            grep -q 'DETERMINISM_PASS' "$RUNNER_TEMP/evidence/determinism.txt"
            grep -q 'HISTORICAL_CORPUS_SWEEP_PASS' "$RUNNER_TEMP/evidence/corpus_summary.txt"
            grep -q 'PERFORMANCE_GATE_PASS' "$RUNNER_TEMP/evidence/performance.txt"
            grep -q 'FULL_SEQ_V3_REGRESSION_PASS' "$RUNNER_TEMP/evidence/full_regression_v3_gate.txt"
            sha=$(tr -d '[:space:]' < "$RUNNER_TEMP/evidence/candidate_v3_sha.txt")
            test "${#sha}" = 64
            grep -qx "NATIVE_WINDOWS_SEQ_CANDIDATE_V3_PASS SHA256=$sha" evidence_summary/SEQ_CANDIDATE_V3_NATIVE_PASS.lock
            printf 'FULL_NATIVE_WINDOWS_COMPLETE_REGRESSION_V3_PASS SHA256=%s\n' "$sha" > evidence_summary/SEQ_V3_FULL_REG_V8_PASS.lock
            cp "$RUNNER_TEMP/evidence/loader_smoke_v3.txt" evidence_summary/final_v3_loader_smoke.txt
            cp "$RUNNER_TEMP/evidence/import_subset_v3.txt" evidence_summary/final_v3_import_subset.txt
            cp "$RUNNER_TEMP/evidence/validation_c63.txt" evidence_summary/final_v3_validation_c63.txt
            cp "$RUNNER_TEMP/evidence/validation_seq_targets.txt" evidence_summary/final_v3_validation_targets.txt
            cp "$RUNNER_TEMP/evidence/determinism.txt" evidence_summary/final_v3_determinism.txt
            cp "$RUNNER_TEMP/evidence/corpus_summary.txt" evidence_summary/final_v3_corpus_summary.txt
            cp "$RUNNER_TEMP/evidence/performance.txt" evidence_summary/final_v3_performance.txt
            echo "CANDIDATE_SHA=$sha" >> evidence_summary/seq_v3_full_reg_v8_status.txt
          else
            printf 'SEQ_V3_FULL_REGRESSION_NOT_PASSED\n' > evidence_summary/SEQ_V3_FULL_REG_V8_FAIL.lock
          fi
      - name: Publish final hash-bound result
        run: |
          set -euo pipefail
          git config user.name "windows-dll-test-bot"
          git config user.email "windows-dll-test-bot@users.noreply.github.com"
          rm -rf "$RUNNER_TEMP/persist"; mkdir -p "$RUNNER_TEMP/persist"
          cp -f evidence_summary/seq_v3_full_reg_v8_status.txt "$RUNNER_TEMP/persist/"
          cp -f evidence_summary/SEQ_V3_FULL_REG_V8_*.lock "$RUNNER_TEMP/persist/" 2>/dev/null || true
          cp -f evidence_summary/final_v3_* "$RUNNER_TEMP/persist/" 2>/dev/null || true
          ok=0
          for n in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B main origin/main
            mkdir -p evidence_summary
            cp -f "$RUNNER_TEMP/persist/"* evidence_summary/ 2>/dev/null || true
            git add evidence_summary
            git commit -m "Record final v3 full regression v8 result" || true
            if git push origin HEAD:main; then ok=1; break; fi
            sleep 2
          done
          [ "$ok" = 1 ]
