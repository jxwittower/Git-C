name: native-7c305-repaired-repo-payload-v2
on:
  push:
    paths:
      - '.github/workflows/native_7c305_repaired_repo_payload_v2.yml'
permissions:
  contents: write
defaults:
  run:
    shell: bash
env:
  FIX_SHA: 7c305f24151cb21534287116e97fcf886b2413f2603e4b9d07b973d6d1986d64
jobs:
  native:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Reconstruct repaired encrypted payload
        run: |
          set -euo pipefail
          d=.stackprobe_7c305_native_payload
          { cat "$d/chunk_00" "$d/chunk_01"; head -c 16000 "$d/chunk_02"; cat "$d/chunk_03a" "$d/chunk_03b" "$d/chunk_04" "$d/chunk_05" "$d/chunk_06" "$d/chunk_07" "$d/chunk_08"; } > "$RUNNER_TEMP/native.b64"
          test "$(wc -c < "$RUNNER_TEMP/native.b64" | tr -d '[:space:]')" = 144000
          base64 -d "$RUNNER_TEMP/native.b64" > "$RUNNER_TEMP/native.enc"
          test -s "$RUNNER_TEMP/native.enc"
          sha256sum "$RUNNER_TEMP/native.enc" | tee repaired_native_cipher_sha256.txt
          echo REPAIRED_PAYLOAD_RECONSTRUCT_PASS
      - name: Publish one-time RSA key
        run: |
          set -euo pipefail
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$RUNNER_TEMP/private.pem"
          openssl pkey -in "$RUNNER_TEMP/private.pem" -pubout -out "$RUNNER_TEMP/public.pem"
          git config user.name windows-dll-test-bot; git config user.email windows-dll-test-bot@users.noreply.github.com
          for n in 1 2 3 4 5; do
            git fetch -q origin main; git checkout -q -B main origin/main
            rm -rf .native7c305_v2_handoff; mkdir -p .native7c305_v2_handoff
            cp "$RUNNER_TEMP/public.pem" .native7c305_v2_handoff/public.pem
            printf '%s\n' "$FIX_SHA" > .native7c305_v2_handoff/target_sha256.txt
            git add .native7c305_v2_handoff; git commit -qm 'Publish 7c305 v2 native RSA key' || true
            git push -q origin HEAD:main && break
            sleep 2
          done
          echo NATIVE_V2_RSA_PUBLIC_KEY_PUBLISHED
      - name: Receive RSA wrapped password set
        run: |
          set -euo pipefail
          url='https://raw.githubusercontent.com/jxwittower/Git-C/main/.native7c305_v2_handoff/wrapped.bin.b64'
          ok=0
          for i in $(seq 1 600); do
            rm -f "$RUNNER_TEMP/w.b64" "$RUNNER_TEMP/w.bin" "$RUNNER_TEMP/passset.try"
            if curl -L -sS --fail --max-time 15 -H 'Cache-Control: no-cache' -o "$RUNNER_TEMP/w.b64" "${url}?run=${GITHUB_RUN_ID}&i=${i}"; then
              base64 -d "$RUNNER_TEMP/w.b64" > "$RUNNER_TEMP/w.bin" 2>/dev/null || true
              if [ "$(wc -c < "$RUNNER_TEMP/w.bin" 2>/dev/null | tr -d '[:space:]')" = 384 ] && openssl pkeyutl -decrypt -inkey "$RUNNER_TEMP/private.pem" -in "$RUNNER_TEMP/w.bin" -out "$RUNNER_TEMP/passset.try" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 >/dev/null 2>&1; then
                test -s "$RUNNER_TEMP/passset.try" && { mv "$RUNNER_TEMP/passset.try" "$RUNNER_TEMP/passset.txt"; ok=1; break; }
              fi
            fi
            sleep 2
          done
          test "$ok" = 1 || exit 20
          echo NATIVE_V2_RSA_PASSWORD_SET_PASS
      - name: Recover exact 7c305 assets
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          @'
          from pathlib import Path
          import os,subprocess,hashlib,tarfile,zipfile,lzma,gzip,shutil,sys
          T=Path(os.environ['RUNNER_TEMP']); ENC=T/'native.enc'; FIX=os.environ['FIX_SHA']
          candidates=[]
          for x in (T/'passset.txt').read_text(errors='ignore').splitlines():
              x=x.strip()
              if x and x not in candidates: candidates.append(x)
          print('PASSWORD_CANDIDATE_COUNT',len(candidates))
          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          def unpack(src,dst):
              shutil.rmtree(dst,ignore_errors=True); dst.mkdir()
              try:
                  if tarfile.is_tarfile(src): tarfile.open(src).extractall(dst); return True
              except: pass
              try:
                  raw=lzma.decompress(src.read_bytes()); q=dst/'inner.tar'; q.write_bytes(raw)
                  if tarfile.is_tarfile(q): tarfile.open(q).extractall(dst); return True
              except: pass
              try:
                  if zipfile.is_zipfile(src): zipfile.ZipFile(src).extractall(dst); return True
              except: pass
              return False
          found=None
          for ci,pw in enumerate(candidates):
              pf=T/f'pw_{ci}.txt'; pf.write_text(pw)
              for it in (200000,250000,100000,150000,300000,600000):
                  dec=T/f'dec_{ci}_{it}.bin'
                  r=subprocess.run(['openssl','enc','-d','-aes-256-cbc','-pbkdf2','-iter',str(it),'-md','sha256','-in',str(ENC),'-out',str(dec),'-pass',f'file:{pf}'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
                  if r.returncode: continue
                  dest=Path(f'dec_{ci}_{it}')
                  if not unpack(dec,dest): continue
                  files=[p for p in dest.rglob('*') if p.is_file()]
                  dll=next((p for p in files if p.suffix.lower()=='.dll' and sha(p)==FIX),None)
                  c=next((p for p in files if p.name.lower()=='native_nonzero_smoke.c'),None)
                  ghf=next((p for p in files if p.suffix.lower()=='.ghf'),None)
                  if dll and c and ghf: found=(ci,it,dll,c,ghf,files); break
              if found: break
          if not found: print('FAIL_STAGE=NO_PASSWORD_RECOVERED_EXACT_7C305'); sys.exit(31)
          ci,it,dll,c,ghf,files=found
          stage=Path('native_stage'); shutil.rmtree(stage,ignore_errors=True); stage.mkdir()
          shutil.copy2(dll,stage/'SigProcDll-64HF.dll'); shutil.copy2(c,stage/'native_nonzero_smoke.c'); shutil.copy2(ghf,stage/'prefix20.ghf')
          for n in ('file_sig','filter_brth','filter_hrt3','file_bed_model_v1'):
              q=next((p for p in files if p.name==n),None)
              if q: shutil.copy2(q,stage/n)
          Path('native_recovery.txt').write_text(f'CANDIDATE={ci}\nITER={it}\nSHA256={sha(stage/"SigProcDll-64HF.dll")}\n')
          print('EXACT_7C305_NATIVE_ASSETS_RECOVERED')
          '@ | Set-Content -Encoding ascii $env:RUNNER_TEMP\recover.py
          python $env:RUNNER_TEMP\recover.py
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Static ABI stackfix gate
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'; $dll=(Resolve-Path 'native_stage\SigProcDll-64HF.dll').Path
          $h=(Get-FileHash $dll -Algorithm SHA256).Hash.ToLowerInvariant(); if($h -ne $env:FIX_SHA){throw 'SHA_MISMATCH'}
          dumpbin /headers $dll | Out-File native_headers.txt; dumpbin /exports $dll | Out-File native_exports.txt; dumpbin /imports $dll | Out-File native_imports.txt
          $a=Get-Content native_headers.txt -Raw; $b=Get-Content native_exports.txt -Raw; $c=Get-Content native_imports.txt -Raw
          if($a -notmatch '\.stkfix'){throw 'STKFIX_MISSING'}
          foreach($e in @('_SigProc_Init@8','_SigProc@24','_SigProc_Stat@0','_SigProc_Fini@0')){if($b -notmatch [regex]::Escape($e)){throw "MISSING_EXPORT $e"}}
          if($c -match '(?im)^\s*ucrtbase\.dll\s*$'){throw 'DIRECT_UCRTBASE_FORBIDDEN'}
          'EXACT_7C305_STATIC_ABI_STACKFIX_PASS' | Out-File native_static_gate.txt
      - name: Real nonzero x86 execution twice
        shell: powershell
        timeout-minutes: 12
        run: |
          $ErrorActionPreference='Stop'; Push-Location native_stage
          cl /nologo /O2 /W3 /MT native_nonzero_smoke.c /Fe:native_nonzero_smoke.exe 2>&1 | Tee-Object ..\native_build.txt
          if($LASTEXITCODE -ne 0){Pop-Location; exit $LASTEXITCODE}
          $sets=@(@(),@('.\SigProcDll-64HF.dll'),@('.\SigProcDll-64HF.dll','.\prefix20.ghf'),@('.\SigProcDll-64HF.dll','.\prefix20.ghf','.'),@('.\SigProcDll-64HF.dll','.','.\prefix20.ghf'),@('.\prefix20.ghf'),@('.\prefix20.ghf','.\SigProcDll-64HF.dll'))
          $chosen=$null; $i=0
          foreach($x in $sets){$i++; & .\native_nonzero_smoke.exe @x *> "..\native_attempt_$i.txt"; $t=Get-Content "..\native_attempt_$i.txt" -Raw -ErrorAction SilentlyContinue; if($LASTEXITCODE -eq 0 -and $t -match '(?i)PASS'){$chosen=$x;break}}
          if($null -eq $chosen){Pop-Location;throw 'NATIVE_NONZERO_FAILED'}
          & .\native_nonzero_smoke.exe @chosen *> ..\native_repeat.txt; $rc=$LASTEXITCODE; $t=Get-Content ..\native_repeat.txt -Raw; Pop-Location
          if($rc -ne 0 -or $t -notmatch '(?i)PASS'){throw 'NATIVE_REPEAT_FAILED'}
          $h=(Get-FileHash native_stage\SigProcDll-64HF.dll -Algorithm SHA256).Hash.ToLowerInvariant(); if($h -ne $env:FIX_SHA){throw 'POST_SHA_DRIFT'}
          "STACKPROBE_NATIVE_NONZERO_PASS SHA256=$h" | Out-File native_exact_pass.lock
          'REAL_NONZERO_WINDOWS_X86_REPEAT_PASS' | Out-File native_dynamic_gate.txt
      - name: Commit exact native pass lock
        run: |
          set -euo pipefail
          grep -Fxq "STACKPROBE_NATIVE_NONZERO_PASS SHA256=$FIX_SHA" native_exact_pass.lock
          cp native_exact_pass.lock "$RUNNER_TEMP/lock"; cp native_static_gate.txt "$RUNNER_TEMP/static"; cp native_dynamic_gate.txt "$RUNNER_TEMP/dynamic"
          git config user.name windows-dll-test-bot; git config user.email windows-dll-test-bot@users.noreply.github.com
          for n in 1 2 3 4 5; do
            git fetch -q origin main; git checkout -q -B main origin/main; mkdir -p evidence_summary
            cp "$RUNNER_TEMP/lock" evidence_summary/STACKPROBE_NATIVE_NONZERO_PASS.lock; cp "$RUNNER_TEMP/static" evidence_summary/stackprobe_7c305_native_static_gate.txt; cp "$RUNNER_TEMP/dynamic" evidence_summary/stackprobe_7c305_native_dynamic_gate.txt
            git add evidence_summary; git commit -qm 'PASS exact 7c305 native Windows gate' || true
            git push -q origin HEAD:main && break; sleep 2
          done
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-7c305-native-v2
          retention-days: 14
          if-no-files-found: ignore
          path: |
            native_stage/SigProcDll-64HF.dll
            repaired_native_cipher_sha256.txt
            native_recovery.txt
            native_headers.txt
            native_exports.txt
            native_imports.txt
            native_static_gate.txt
            native_dynamic_gate.txt
            native_exact_pass.lock
            native_attempt_*.txt
            native_repeat.txt
      - name: Remove RSA handoff
        if: always()
        run: |
          set +e; git fetch -q origin main; git checkout -q -B main origin/main
          if test -d .native7c305_v2_handoff; then git config user.name windows-dll-test-bot; git config user.email windows-dll-test-bot@users.noreply.github.com; git rm -r -q .native7c305_v2_handoff; git commit -qm 'Remove 7c305 v2 RSA handoff'; git push -q origin HEAD:main; fi
          true
