name: native-windows-rc3-v2

on:
  push:
    branches: [rc3-native-gate-20260810r]
    paths: ['.github/workflows/native_windows_rc3_v2.yml']
  workflow_dispatch:

permissions:
  actions: read
  contents: write

env:
  ARTIFACT_ID: '9034484495'
  SOURCE_RUN_ID: '31300993195'
  HOST_SHA: '081c4c62d2bf377913eb2aca0cc3cf3bf656350c8abaa3aaf11d171dac604804'
  C63_SHA: '56c02d18a9ee68a7ae14c4601e4ba24f7af170c6db01ea21fbff91cbe6b082fb'
  SMOKE_SHA: 'a9cc5cf614114c9481073669a3fd5d7ef5e1a1adce7e0fdc3f62824e0d50431d'
  FULLREG_SHA: 'f946ba5e503f7f921aec0e9b4632981540d7487004596b5940053bc817694b14'
  DELTA_B64_SHA: '28b6446caf5fdb7dcf194f58a1faf9ef59a51ff806dbeb4b55762f1d256daa30'
  DELTA_ENC_SHA: '0f943c6568801ff62fa4faccddc31bca3c2af90731c01a5a8f927bc81d16f76c'
  DELTA_XZ_SHA: '432be588c7550c8a49a4af46ea475716e9d378b21d5664456a3eaf734de1ae92'
  RC3_SHA: '1c2695f5f5d48228a9cfee18c31669cc27615d6d1c53bf83228aa015240a2b92'

jobs:
  native-rc3:
    runs-on: windows-2022
    timeout-minutes: 55
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Download verified prior Windows artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ env.ARTIFACT_ID }}
          path: baseline_artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          merge-multiple: true

      - name: Bind baseline artifact and GHF corpus
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $p = Resolve-Path 'baseline_artifact\payload'
          $checks = @{
            'HostCompat.dll' = $env:HOST_SHA
            'C63.dll' = $env:C63_SHA
            'SigProcLoaderContractSmoke.exe' = $env:SMOKE_SHA
            'fullreg.c' = $env:FULLREG_SHA
          }
          foreach($name in $checks.Keys){
            $f=Join-Path $p $name
            if(!(Test-Path $f)){throw "BASELINE_MISSING $name"}
            $h=(Get-FileHash $f -Algorithm SHA256).Hash.ToLowerInvariant()
            if($h -ne $checks[$name]){throw "BASELINE_SHA_MISMATCH $name $h"}
          }
          $ghf=Get-ChildItem (Join-Path $p 'testdata') -Recurse -Filter '*.ghf'
          if($ghf.Count -ne 13){throw "GHF_COUNT_MISMATCH $($ghf.Count)"}
          foreach($bed in @('inner-bed','outer-medical-bed')){
            foreach($f in @('file_bed_model_v1','file_bias','file_sig','filter_brth','filter_hrt3')){
              if(!(Test-Path (Join-Path $p "runtime\$bed\$f"))){throw "RUNTIME_MISSING $bed/$f"}
            }
          }
          "ARTIFACT_ID=$env:ARTIFACT_ID`nSOURCE_RUN_ID=$env:SOURCE_RUN_ID`nHOST_SHA256=$env:HOST_SHA`nC63_SHA256=$env:C63_SHA`nGHF_FILES=13`nBASELINE_ARTIFACT_BINDING_PASS" | Tee-Object baseline_binding.txt

      - name: Assemble encrypted delta with binary-safe Python hashes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os, hashlib, base64
          chunks=[Path(f'.rc3delta/chunk_{i:02d}').read_bytes() for i in range(10)]
          expected_sizes=[8000]*9+[2904]
          assert [len(x) for x in chunks]==expected_sizes, [len(x) for x in chunks]
          allb=b''.join(chunks)
          b64_sha=hashlib.sha256(allb).hexdigest()
          assert len(allb)==74904, len(allb)
          assert b64_sha==os.environ['DELTA_B64_SHA'], b64_sha
          enc=base64.b64decode(allb, validate=True)
          enc_sha=hashlib.sha256(enc).hexdigest()
          assert len(enc)==56176, len(enc)
          assert enc_sha==os.environ['DELTA_ENC_SHA'], enc_sha
          out=Path(os.environ['RUNNER_TEMP'])/'rc3.delta.xz.enc'
          out.write_bytes(enc)
          Path('delta_binding.txt').write_text(
              f'DELTA_B64_BYTES={len(allb)}\nDELTA_B64_SHA256={b64_sha}\nDELTA_ENC_BYTES={len(enc)}\nDELTA_ENC_SHA256={enc_sha}\nENCRYPTED_DELTA_BINDING_PASS\n',encoding='ascii')
          print(Path('delta_binding.txt').read_text())
          PY

      - name: Create one-time RSA transport key
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .secure_rc3
          mkdir -p .secure_rc3
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$RUNNER_TEMP/private.pem"
          openssl pkey -in "$RUNNER_TEMP/private.pem" -pubout -out .secure_rc3/public.pem
          git config user.name windows-dll-test-bot
          git config user.email windows-dll-test-bot@users.noreply.github.com
          git add .secure_rc3/public.pem
          git commit -m 'Publish RC3 v2 one-time RSA public key'
          git push origin HEAD:${GITHUB_REF_NAME}
          echo EPHEMERAL_RSA_PUBLIC_KEY_PUBLISHED

      - name: Wait for RSA-wrapped AES passphrase
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 240); do
            git pull --ff-only origin "${GITHUB_REF_NAME}" >/dev/null 2>&1 || true
            if [ -s .secure_rc3/key.enc.b64 ]; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = 1
          python - <<'PY'
          from pathlib import Path
          import base64, os
          p=Path('.secure_rc3/key.enc.b64').read_text(encoding='ascii').strip()
          b=base64.b64decode(p,validate=True)
          (Path(os.environ['RUNNER_TEMP'])/'key.enc').write_bytes(b)
          print('RSA_CIPHERTEXT_BYTES',len(b))
          PY
          openssl pkeyutl -decrypt -inkey "$RUNNER_TEMP/private.pem" -in "$RUNNER_TEMP/key.enc" -out "$RUNNER_TEMP/pass.txt" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          test -s "$RUNNER_TEMP/pass.txt"
          echo RSA_WRAPPED_AES_KEY_RECEIVED

      - name: Decrypt delta and reconstruct exact RC3
        shell: bash
        run: |
          set -euo pipefail
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in "$RUNNER_TEMP/rc3.delta.xz.enc" -out "$RUNNER_TEMP/rc3.delta.xz" -pass file:"$RUNNER_TEMP/pass.txt"
          python - <<'PY'
          from pathlib import Path
          import os, hashlib, lzma, struct
          temp=Path(os.environ['RUNNER_TEMP'])
          dx=temp/'rc3.delta.xz'
          dx_sha=hashlib.sha256(dx.read_bytes()).hexdigest()
          assert dx_sha==os.environ['DELTA_XZ_SHA'],dx_sha
          base=Path('baseline_artifact/payload/HostCompat.dll').read_bytes()
          assert hashlib.sha256(base).hexdigest()==os.environ['HOST_SHA']
          raw=lzma.decompress(dx.read_bytes())
          assert raw[:4]==b'R3D1'
          target_size,op_count=struct.unpack_from('<II',raw,4)
          pos=12; out=bytearray()
          for _ in range(op_count):
              op=raw[pos:pos+1]; pos+=1
              if op==b'C':
                  src,n=struct.unpack_from('<II',raw,pos); pos+=8
                  assert src+n<=len(base)
                  out.extend(base[src:src+n])
              elif op==b'L':
                  n,=struct.unpack_from('<I',raw,pos); pos+=4
                  assert pos+n<=len(raw)
                  out.extend(raw[pos:pos+n]); pos+=n
              else: raise AssertionError(op)
          assert pos==len(raw),(pos,len(raw))
          assert len(out)==target_size==442368,(len(out),target_size)
          rc3_sha=hashlib.sha256(out).hexdigest()
          assert rc3_sha==os.environ['RC3_SHA'],rc3_sha
          p=Path('rc3_payload');p.mkdir(exist_ok=True)
          (p/'SigProcDll-64HF.dll').write_bytes(out)
          Path('rc3_reconstruction.txt').write_text(
              f'DELTA_XZ_SHA256={dx_sha}\nDELTA_OPS={op_count}\nRC3_BYTES={len(out)}\nRC3_SHA256={rc3_sha}\nEXACT_RC3_RECONSTRUCTION_PASS\n',encoding='ascii')
          print(Path('rc3_reconstruction.txt').read_text())
          PY
          rm -f "$RUNNER_TEMP/pass.txt" "$RUNNER_TEMP/key.enc" "$RUNNER_TEMP/private.pem"

      - name: Configure MSVC x86
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Gate PE32 exports and imports
        shell: cmd
        run: |
          ver > windows_environment.txt
          echo PROCESSOR_ARCHITECTURE=%PROCESSOR_ARCHITECTURE%>> windows_environment.txt
          where dumpbin >> windows_environment.txt
          dumpbin /headers rc3_payload\SigProcDll-64HF.dll > pe_headers.txt
          dumpbin /exports rc3_payload\SigProcDll-64HF.dll > pe_exports.txt
          dumpbin /imports rc3_payload\SigProcDll-64HF.dll > pe_imports.txt
          findstr /C:"14C machine (x86)" pe_headers.txt > nul || exit /b 31
          findstr /C:"_SigProc@24" pe_exports.txt > nul || exit /b 32
          findstr /C:"_SigProc_Init@8" pe_exports.txt > nul || exit /b 33
          findstr /C:"_SigProc_Stat@0" pe_exports.txt > nul || exit /b 34
          findstr /C:"_SigProc_Fini@0" pe_exports.txt > nul || exit /b 35
          findstr /I /C:"ucrtbase.dll" pe_imports.txt > nul && exit /b 36 || ver > nul
          echo EXACT_PE32_X86_EXPORT_IMPORT_GATE_PASS> pe_gate.txt

      - name: Native LoadLibrary Init Stat zero-input Fini
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force smoke_work | Out-Null
          Copy-Item rc3_payload\SigProcDll-64HF.dll smoke_work\SigProcDll-64HF.dll -Force
          Copy-Item baseline_artifact\payload\SigProcLoaderContractSmoke.exe smoke_work\ -Force
          Copy-Item baseline_artifact\payload\runtime\inner-bed\* smoke_work\ -Force
          Push-Location smoke_work
          .\SigProcLoaderContractSmoke.exe *> ..\loader_smoke.txt
          $rc=$LASTEXITCODE
          Pop-Location
          Get-Content loader_smoke.txt
          if($rc -ne 0){throw "LOADER_CONTRACT_FAIL rc=$rc"}
          if(-not (Select-String loader_smoke.txt -SimpleMatch 'ALL_LOADER_CONTRACT_TESTS_PASS')){throw 'LOADER_PASS_MARKER_MISSING'}
          'NATIVE_LOADLIBRARY_INIT_STAT_ZERO_INPUT_FINI_PASS' | Out-File loader_gate.txt

      - name: Sequential 200 restart-style loader cycles
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Push-Location smoke_work
          for($i=1;$i -le 200;$i++){
            .\SigProcLoaderContractSmoke.exe *> $null
            if($LASTEXITCODE -ne 0){throw "SEQUENTIAL_SMOKE_FAIL iteration=$i rc=$LASTEXITCODE"}
          }
          Pop-Location
          'SEQUENTIAL_200_LOAD_INIT_ZERO_FINI_PASS' | Out-File sequential_gate.txt

      - name: Four-process isolated loader stress
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $jobs=@()
          for($j=0;$j -lt 4;$j++){
            $d="stress_$j"; New-Item -ItemType Directory -Force $d | Out-Null
            Copy-Item rc3_payload\SigProcDll-64HF.dll "$d\SigProcDll-64HF.dll" -Force
            Copy-Item baseline_artifact\payload\SigProcLoaderContractSmoke.exe "$d\" -Force
            Copy-Item baseline_artifact\payload\runtime\inner-bed\* "$d\" -Force
            $jobs += Start-Job -ArgumentList (Resolve-Path $d) -ScriptBlock {
              param($dir); Set-Location $dir
              for($i=1;$i -le 50;$i++){
                .\SigProcLoaderContractSmoke.exe *> $null
                if($LASTEXITCODE -ne 0){return "FAIL $i $LASTEXITCODE"}
              }
              'PASS'
            }
          }
          Wait-Job $jobs | Out-Null
          $res=$jobs | Receive-Job
          $jobs | Remove-Job -Force
          $res | Set-Content parallel_results.txt
          if(($res | Where-Object {$_ -ne 'PASS'}).Count -ne 0){throw "PARALLEL_STRESS_FAIL $res"}
          'PARALLEL_4X50_ISOLATED_PROCESS_PASS' | Out-File parallel_gate.txt

      - name: Build x86 real-GHF regression harness
        shell: cmd
        run: |
          copy /Y baseline_artifact\payload\fullreg.c fullreg.c > nul
          cl /nologo /O2 /W4 /TC fullreg.c /Fe:fullreg.exe > fullreg_build.txt 2>&1
          set RC=%ERRORLEVEL%
          type fullreg_build.txt
          if not "%RC%"=="0" exit /b %RC%
          if not exist fullreg.exe exit /b 61
          echo FULLREG_MSVC_X86_BUILD_PASS> fullreg_build_gate.txt

      - name: Full Aug03 GHF deterministic long-run thread realtime regression
        shell: cmd
        run: |
          fullreg.exe rc3_payload\SigProcDll-64HF.dll baseline_artifact\payload\HostCompat.dll baseline_artifact\payload\C63.dll baseline_artifact\payload\runtime\inner-bed baseline_artifact\payload\runtime\outer-medical-bed baseline_artifact\payload\testdata > fullreg.txt 2>&1
          set RC=%ERRORLEVEL%
          type fullreg.txt
          if not "%RC%"=="0" exit /b %RC%
          findstr /C:"HOSTCOMPAT_REAL_NONZERO_PASS" fullreg.txt > nul || exit /b 71
          findstr /C:"C63_REAL_NONZERO_PASS" fullreg.txt > nul || exit /b 72
          findstr /C:"SEQ_TARGETS_VITAL_SUPPRESSION_RECOVERY_PASS" fullreg.txt > nul || exit /b 73
          findstr /C:"DETERMINISTIC_REPLAY_PASS" fullreg.txt > nul || exit /b 74
          findstr /C:"LONG_STABILITY_PASS" fullreg.txt > nul || exit /b 75
          findstr /C:"TWO_THREAD_STRESS_PASS" fullreg.txt > nul || exit /b 76
          findstr /C:"REALTIME_1HZ_PASS" fullreg.txt > nul || exit /b 77
          findstr /C:"PERFORMANCE_PASS" fullreg.txt > nul || exit /b 78
          findstr /C:"COMPLETE_NATIVE_WINDOWS_REGRESSION_PASS" fullreg.txt > nul || exit /b 79
          echo COMPLETE_NATIVE_WINDOWS_REAL_GHF_GATE_PASS> fullreg_gate.txt

      - name: Final immutable RC3 SHA lock
        shell: powershell
        run: |
          $h=(Get-FileHash rc3_payload\SigProcDll-64HF.dll -Algorithm SHA256).Hash.ToLowerInvariant()
          if($h -ne $env:RC3_SHA){throw "POST_TEST_SHA_CHANGED $h"}
          "NATIVE_WINDOWS_RC3_REAL_GHF_PASS SHA256=$h" | Out-File RC3_NATIVE_WINDOWS_PASS.lock

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc3-v2-native-windows-evidence-${{ github.run_id }}
          path: |
            baseline_binding.txt
            delta_binding.txt
            rc3_reconstruction.txt
            windows_environment.txt
            pe_headers.txt
            pe_exports.txt
            pe_imports.txt
            pe_gate.txt
            loader_smoke.txt
            loader_gate.txt
            sequential_gate.txt
            parallel_results.txt
            parallel_gate.txt
            fullreg_build.txt
            fullreg_build_gate.txt
            fullreg.txt
            fullreg_gate.txt
            RC3_NATIVE_WINDOWS_PASS.lock
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove one-time RSA handoff
        if: always()
        shell: bash
        run: |
          git pull --ff-only origin "${GITHUB_REF_NAME}" || true
          rm -rf .secure_rc3
          git add -A .secure_rc3 || true
          if ! git diff --cached --quiet; then
            git config user.name windows-dll-test-bot
            git config user.email windows-dll-test-bot@users.noreply.github.com
            git commit -m 'Remove RC3 v2 one-time RSA handoff'
            git push origin HEAD:${GITHUB_REF_NAME} || true
          fi
