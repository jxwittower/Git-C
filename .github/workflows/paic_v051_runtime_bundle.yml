name: PAIC Full Offline Runtime Bundle

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/paic_v051_runtime_bundle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          architecture: 'x64'
      - name: Copy relocatable core runtime
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $prefix=(& python -c "import sys; print(sys.prefix)").Trim()
          robocopy $prefix runtime /E /NFL /NDL /NJH /NJS /NP
          $rc=$LASTEXITCODE
          if ($rc -gt 7) { throw "robocopy failed $rc" }
          $global:LASTEXITCODE=0
      - name: Install core AI
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          .\runtime\python.exe -m pip install --disable-pip-version-check --upgrade pip setuptools wheel
          .\runtime\python.exe -m pip install --disable-pip-version-check --prefer-binary 'PySide6>=6.7,<7' 'numpy==1.26.4' 'scipy>=1.12,<2' 'pandas>=2.2,<3' 'sounddevice>=0.5,<1' 'opencv-contrib-python>=4.10,<5' 'partitura>=1.7,<2' 'verovio>=5,<6' 'music21>=9,<10' 'pretty-midi>=0.2.10,<1' 'mido>=1.3,<2' 'parangonar==3.2.0' 'pianoplayer==3.0.2' 'mediapipe==0.10.21' 'onnxruntime>=1.19,<2' 'python-rtmidi>=1.5,<2'
          .\runtime\python.exe -m pip check
      - name: Core relocation gate
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $env:QT_QPA_PLATFORM='offscreen'
          .\runtime\python.exe -c "import numpy,pandas,cv2,partitura,verovio,parangonar,pianoplayer,mediapipe,onnxruntime,rtmidi; from PySide6.QtWidgets import QApplication,QWidget; a=QApplication([]); w=QWidget(); print('CORE_OK')"
          $tmp=Join-Path $env:RUNNER_TEMP 'paic-core-relocated'
          if (Test-Path $tmp) { Remove-Item $tmp -Recurse -Force }
          Move-Item runtime $tmp
          & "$tmp\python.exe" -c "import pandas,cv2,parangonar,mediapipe,onnxruntime; from PySide6.QtWidgets import QApplication; a=QApplication([]); print('CORE_RELOCATED_OK')"
          if ($LASTEXITCODE -ne 0) { throw 'core relocation failed' }
          Move-Item $tmp runtime
      - uses: actions/upload-artifact@v4
        with:
          name: paic-full-core-runtime
          path: runtime
          compression-level: 6
          retention-days: 5

  transcribe:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          architecture: 'x64'
      - name: Copy isolated transcription runtime
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $prefix=(& python -c "import sys; print(sys.prefix)").Trim()
          robocopy $prefix runtime_transcribe /E /NFL /NDL /NJH /NJS /NP
          $rc=$LASTEXITCODE
          if ($rc -gt 7) { throw "robocopy failed $rc" }
          $global:LASTEXITCODE=0
      - name: Install Basic Pitch TensorFlow engine
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          .\runtime_transcribe\python.exe -m pip install --disable-pip-version-check --upgrade pip setuptools wheel
          .\runtime_transcribe\python.exe -m pip install --disable-pip-version-check --prefer-binary 'basic-pitch==0.4.0'
          .\runtime_transcribe\python.exe -m pip check
          .\runtime_transcribe\python.exe -c "import tensorflow,basic_pitch; from basic_pitch import ICASSP_2022_MODEL_PATH; assert ICASSP_2022_MODEL_PATH.exists(); print('BASIC_PITCH_TF_OK')"
      - name: Transcription relocation gate
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $tmp=Join-Path $env:RUNNER_TEMP 'paic-transcribe-relocated'
          if (Test-Path $tmp) { Remove-Item $tmp -Recurse -Force }
          Move-Item runtime_transcribe $tmp
          & "$tmp\python.exe" -c "import tensorflow,basic_pitch; from basic_pitch import ICASSP_2022_MODEL_PATH; assert ICASSP_2022_MODEL_PATH.exists(); print('TRANSCRIBE_RELOCATED_OK')"
          if ($LASTEXITCODE -ne 0) { throw 'transcription relocation failed' }
          Move-Item $tmp runtime_transcribe
      - uses: actions/upload-artifact@v4
        with:
          name: paic-full-transcribe-runtime
          path: runtime_transcribe
          compression-level: 6
          retention-days: 5
