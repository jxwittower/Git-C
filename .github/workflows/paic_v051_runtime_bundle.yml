name: PAIC V051 Portable Runtime Bundle

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/paic_v051_runtime_bundle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Download verified CPython 3.11 x64 portable runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/astral-sh/python-build-standalone/releases/download/20260807/cpython-3.11.15%2B20260807-x86_64-pc-windows-msvc-install_only_stripped.tar.gz'
          Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile python-runtime.tar.gz
          $hash = (Get-FileHash python-runtime.tar.gz -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne 'ebfd13f290b79fc0cd874304e80944d81a368edc2c7cd94994a7d5104cc0c6b3') { throw "Runtime hash mismatch: $hash" }
          tar -xzf python-runtime.tar.gz
          if (!(Test-Path python\python.exe)) { throw 'python.exe missing after extraction' }
          Move-Item python runtime
          .\runtime\python.exe -c "import sys; print(sys.version); print(sys.executable)"

      - name: Prepare pip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\runtime\python.exe -m ensurepip --upgrade
          .\runtime\python.exe -m pip install --disable-pip-version-check --upgrade pip setuptools wheel

      - name: Install core desktop, score, audio and alignment engines
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\runtime\python.exe -m pip install --disable-pip-version-check --prefer-binary `
            'PySide6>=6.7,<7' `
            'numpy==1.26.4' `
            'scipy>=1.12,<2' `
            'sounddevice>=0.5,<1' `
            'opencv-contrib-python>=4.10,<5' `
            'partitura>=1.7,<2' `
            'verovio>=5,<6' `
            'music21>=9,<10' `
            'pretty-midi>=0.2.10,<1' `
            'mido>=1.3,<2' `
            'parangonar==3.2.0' `
            'pianoplayer==3.0.2'

      - name: Install camera hand AI and MIDI runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\runtime\python.exe -m pip install --disable-pip-version-check --prefer-binary `
            'mediapipe==0.10.21' `
            'onnxruntime>=1.19,<2' `
            'python-rtmidi>=1.5,<2'

      - name: Install Basic Pitch high accuracy transcription when compatible
        id: basicpitch
        shell: pwsh
        continue-on-error: true
        run: |
          .\runtime\python.exe -m pip install --disable-pip-version-check --prefer-binary 'basic-pitch==0.4.0'
          .\runtime\python.exe -c "import basic_pitch; print('BASIC_PITCH_OK')"

      - name: Bundle Microsoft VC runtime DLLs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($dll in @('vcruntime140.dll','vcruntime140_1.dll','msvcp140.dll','concrt140.dll')) {
            $src = Join-Path $env:WINDIR "System32\$dll"
            if (Test-Path $src) { Copy-Item $src runtime\ -Force }
          }

      - name: Portable relocation and import smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (!(Test-Path runtime\pythonw.exe)) { throw 'pythonw.exe missing' }
          $qwindows = Get-ChildItem runtime -Recurse -Filter qwindows.dll | Select-Object -First 1
          if (!$qwindows) { throw 'qwindows.dll missing' }
          $env:QT_QPA_PLATFORM = 'offscreen'
          .\runtime\python.exe -c "import numpy,scipy,sounddevice,cv2,partitura,verovio,music21,pretty_midi,mido,parangonar,pianoplayer,mediapipe,onnxruntime,rtmidi; from PySide6.QtWidgets import QApplication,QWidget; a=QApplication([]); w=QWidget(); print('PAIC_CORE_RUNTIME_OK')"
          $tmp = Join-Path $env:RUNNER_TEMP 'paic-relocated-runtime'
          if (Test-Path $tmp) { Remove-Item $tmp -Recurse -Force }
          Move-Item runtime $tmp
          & "$tmp\python.exe" -c "import numpy,cv2,partitura,verovio,parangonar,mediapipe; from PySide6.QtWidgets import QApplication; a=QApplication([]); print('PAIC_RELOCATION_OK')"
          Move-Item $tmp runtime

      - name: Write runtime manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\runtime\python.exe -m pip freeze | Sort-Object | Set-Content PORTABLE_RUNTIME_PACKAGES.txt
          $bp = 'optional-not-installed'
          if ('${{ steps.basicpitch.outcome }}' -eq 'success') { $bp = 'installed' }
          @(
            'Piano AI Coach V0.5.1 Portable Runtime',
            'CPython: 3.11.15 x86_64-pc-windows-msvc',
            'Runtime SHA256: ebfd13f290b79fc0cd874304e80944d81a368edc2c7cd94994a7d5104cc0c6b3',
            "Basic Pitch: $bp",
            'Core relocation smoke: PASS'
          ) | Set-Content PORTABLE_RUNTIME_BUILD.txt

      - name: Upload self-contained runtime tree
        uses: actions/upload-artifact@v4
        with:
          name: paic-v051-runtime-win64
          path: |
            runtime
            PORTABLE_RUNTIME_PACKAGES.txt
            PORTABLE_RUNTIME_BUILD.txt
          compression-level: 6
          retention-days: 3
