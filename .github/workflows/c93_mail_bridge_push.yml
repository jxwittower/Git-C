name: c93-mail-bridge-push
on:
  push:
    branches: [main]
    paths:
      - 'c93_mail_bridge_request.txt'
permissions:
  contents: write
jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Read target run and create one-time mailbox
        run: |
          set -euo pipefail
          RUN_ID=$(head -n1 c93_mail_bridge_request.txt | tr -d '[:space:]')
          test -n "$RUN_ID"
          export TARGET_RUN_ID="$RUN_ID"
          echo "TARGET_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import json,os,secrets,string,urllib.request
          from pathlib import Path
          def req(method,url,obj=None,token=None):
              data=None if obj is None else json.dumps(obj).encode()
              r=urllib.request.Request(url,data=data,method=method)
              r.add_header('Accept','application/json')
              if data is not None:r.add_header('Content-Type','application/json')
              if token:r.add_header('Authorization','Bearer '+token)
              with urllib.request.urlopen(r,timeout=30) as x:return json.load(x)
          base='https://api.mail.tm'; dom=req('GET',base+'/domains'); ms=dom if isinstance(dom,list) else dom.get('hydra:member',[])
          if not ms:raise SystemExit('MAILTM_NO_DOMAIN')
          alphabet=string.ascii_lowercase+string.digits
          user='ghc93'+''.join(secrets.choice(alphabet) for _ in range(16)); password=''.join(secrets.choice(string.ascii_letters+string.digits+'-_') for _ in range(36)); address=user+'@'+ms[0]['domain']
          req('POST',base+'/accounts',{'address':address,'password':password}); token=req('POST',base+'/token',{'address':address,'password':password})['token']
          Path(os.environ['RUNNER_TEMP'],'mail.json').write_text(json.dumps({'address':address,'password':password,'token':token}))
          Path('mailbox.txt').write_text(address+'\n'); Path('subject.txt').write_text('C93-NATIVE-'+os.environ['TARGET_RUN_ID']+'\n')
          print('MAILBOX',address)
          PY
          mkdir -p "c93_mail_bridge/$RUN_ID"
          cp mailbox.txt subject.txt "c93_mail_bridge/$RUN_ID/"
          printf 'TARGET_RUN_ID=%s\nBRIDGE_RUN_ID=%s\n' "$RUN_ID" "$GITHUB_RUN_ID" > "c93_mail_bridge/$RUN_ID/binding.txt"
          git config user.name c93-mail-bridge-bot
          git config user.email c93-mail-bridge-bot@users.noreply.github.com
          git fetch origin main
          git checkout -B main origin/main
          git add "c93_mail_bridge/$RUN_ID"
          git commit -m "Publish C93 mail bridge $RUN_ID"
          git push origin HEAD:main
      - name: Receive encrypted attachments
        timeout-minutes: 15
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,time,urllib.request,urllib.parse
          from pathlib import Path
          cfg=json.loads(Path(os.environ['RUNNER_TEMP'],'mail.json').read_text());token=cfg['token'];base='https://api.mail.tm';subj=Path('subject.txt').read_text().strip();seen=set();got={}
          def getj(url):
              r=urllib.request.Request(url);r.add_header('Accept','application/json');r.add_header('Authorization','Bearer '+token)
              with urllib.request.urlopen(r,timeout=30) as x:return json.load(x)
          def getb(url):
              r=urllib.request.Request(url);r.add_header('Authorization','Bearer '+token)
              with urllib.request.urlopen(r,timeout=120) as x:return x.read()
          deadline=time.time()+800
          while time.time()<deadline and len(got)<2:
              obj=getj(base+'/messages');ms=obj if isinstance(obj,list) else obj.get('hydra:member',[])
              for m in ms:
                  if m.get('subject')!=subj or m['id'] in seen:continue
                  seen.add(m['id']);d=getj(base+'/messages/'+m['id'])
                  for a in d.get('attachments',[]):
                      n=a.get('filename','');u=a.get('downloadUrl')
                      if n in ('payload.enc','wrapped_key.bin') and u:
                          b=getb(urllib.parse.urljoin(base,u));Path(n).write_bytes(b);got[n]=len(b)
              if len(got)<2:time.sleep(3)
          if len(got)<2:raise SystemExit('MAIL_ATTACHMENTS_TIMEOUT '+repr(got))
          print('RECEIVED',got)
          PY
      - name: Commit encrypted transport for waiting native replay
        run: |
          set -euo pipefail
          RUN_ID="$TARGET_RUN_ID"; DIR="c93_native_transport/$RUN_ID"
          rm -rf "$DIR"; mkdir -p "$DIR"
          base64 -w0 wrapped_key.bin > "$DIR/wrapped_key.b64"
          base64 -w0 payload.enc > payload.all.b64
          split -b 450000 -d -a 2 --additional-suffix=.b64 payload.all.b64 "$DIR/payload_"
          sha256sum payload.enc wrapped_key.bin > "$DIR/transport_sha256.txt"
          printf 'READY RUN_ID=%s\n' "$RUN_ID" > "$DIR/READY.txt"
          git config user.name c93-mail-bridge-bot
          git config user.email c93-mail-bridge-bot@users.noreply.github.com
          git fetch origin main
          git checkout -B main origin/main
          git add "$DIR"
          git commit -m "Deliver encrypted C93 native payload $RUN_ID"
          git push origin HEAD:main
