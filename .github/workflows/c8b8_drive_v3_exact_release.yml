name: c8b8-drive-v3-exact-native-full-release
on:
  push:
    branches: [c8b8-drive-v3-release-20260809]
    paths:
      - '.github/workflows/c8b8_drive_v3_exact_release.yml'
permissions:
  contents: write

jobs:
  exact-native-full-release:
    runs-on: windows-2022
    timeout-minutes: 150
    env:
      CAND_SHA: c8b8f49620b45707f80f47a9fadf14db376a115bc6052517e9243e0cb2dc20e9
      HOST_SHA: 081c4c62d2bf377913eb2aca0cc3cf3bf656350c8abaa3aaf11d171dac604804
      C63_SHA: 56c02d18a9ee68a7ae14c4601e4ba24f7af170c6db01ea21fbff91cbe6b082fb
      SMOKE_SHA: a9cc5cf614114c9481073669a3fd5d7ef5e1a1adce7e0fdc3f62824e0d50431d
      ENC_SHA: 53d11ca2b252e1b319d7552ed0c6ec5fdd53415286d63df0ea0c69bba1bd60de
      XZ_SHA: 95a0d2efecfcebee99355727bd8e9034e4c2fe08c169ea7a996b630e07da5fbc
      GHF_COUNT: '13'
      GHF_BYTES: '82484656'
      HANDOFF_BRANCH: c8b8-drive-v3-release-20260809

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Create one-time mailbox and RSA handoff
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          @'
          import json, os, secrets, string, urllib.request
          from pathlib import Path
          def req(method,url,obj=None,token=None):
              data=None if obj is None else json.dumps(obj).encode()
              r=urllib.request.Request(url,data=data,method=method)
              r.add_header('Accept','application/json')
              if data is not None: r.add_header('Content-Type','application/json')
              if token: r.add_header('Authorization','Bearer '+token)
              with urllib.request.urlopen(r,timeout=30) as x: return json.load(x)
          base='https://api.mail.tm'
          d=req('GET',base+'/domains')
          members=d if isinstance(d,list) else d.get('hydra:member',[])
          if not members: raise SystemExit('MAILTM_NO_DOMAIN')
          domain=members[0]['domain']
          alphabet=string.ascii_lowercase+string.digits
          user='ghc8b8v3'+''.join(secrets.choice(alphabet) for _ in range(14))
          password=''.join(secrets.choice(string.ascii_letters+string.digits+'-_') for _ in range(32))
          address=user+'@'+domain
          req('POST',base+'/accounts',{'address':address,'password':password})
          token=req('POST',base+'/token',{'address':address,'password':password})['token']
          Path(os.environ['RUNNER_TEMP'],'mail.json').write_text(json.dumps({'address':address,'password':password,'token':token}))
          Path('mailbox.txt').write_text(address+'\n')
          Path('subject_prefix.txt').write_text('GuanHu-C8B8-V3-Fullreg-'+os.environ['GITHUB_RUN_ID']+'\n')
          print('ONE_TIME_MAILBOX_READY',address)
          '@ | Set-Content -Encoding ascii $env:RUNNER_TEMP\make_mailbox.py
          python $env:RUNNER_TEMP\make_mailbox.py
          if($LASTEXITCODE -ne 0){ throw 'MAILBOX_CREATE_FAIL' }
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out $env:RUNNER_TEMP\private.pem
          if($LASTEXITCODE -ne 0){ throw 'RSA_PRIVATE_FAIL' }
          openssl pkey -in $env:RUNNER_TEMP\private.pem -pubout -out public.pem
          if($LASTEXITCODE -ne 0){ throw 'RSA_PUBLIC_FAIL' }
          New-Item -ItemType Directory -Force .c8b8_v3_handoff | Out-Null
          Copy-Item public.pem .c8b8_v3_handoff\public.pem -Force
          Copy-Item mailbox.txt .c8b8_v3_handoff\mailbox.txt -Force
          Copy-Item subject_prefix.txt .c8b8_v3_handoff\subject_prefix.txt -Force
          @("RUN_ID=$env:GITHUB_RUN_ID","ENC_SHA=$env:ENC_SHA","CAND_SHA=$env:CAND_SHA") | Set-Content .c8b8_v3_handoff\binding.txt
          git config user.name windows-dll-test-bot
          git config user.email windows-dll-test-bot@users.noreply.github.com
          git add .c8b8_v3_handoff
          git commit -m "Publish c8b8 V3 one-time handoff"
          if($LASTEXITCODE -ne 0){ throw 'HANDOFF_COMMIT_FAIL' }
          git push origin "HEAD:$env:HANDOFF_BRANCH"
          if($LASTEXITCODE -ne 0){ throw 'HANDOFF_PUSH_FAIL' }
          'C8B8_V3_HANDOFF_PUBLISHED' | Set-Content handoff_published.txt

      - name: Receive four encrypted chunks and wrapped AES key
        shell: powershell
        timeout-minutes: 35
        run: |
          $ErrorActionPreference='Stop'
          @'
          import json, os, time, urllib.request, urllib.parse
          from pathlib import Path
          cfg=json.loads(Path(os.environ['RUNNER_TEMP'],'mail.json').read_text())
          token=cfg['token']; base='https://api.mail.tm'
          prefix=Path('subject_prefix.txt').read_text().strip()
          out=Path('transport'); out.mkdir(exist_ok=True)
          wanted={f'{prefix}-P{i}':i for i in range(1,5)}
          got=set(); key_ok=False; seen=set()
          def get_json(url):
              r=urllib.request.Request(url); r.add_header('Accept','application/json'); r.add_header('Authorization','Bearer '+token)
              with urllib.request.urlopen(r,timeout=30) as x: return json.load(x)
          def get_bytes(url):
              r=urllib.request.Request(url); r.add_header('Authorization','Bearer '+token)
              with urllib.request.urlopen(r,timeout=120) as x: return x.read()
          deadline=time.time()+1800
          while time.time()<deadline and (len(got)<4 or not key_ok):
              listing=get_json(base+'/messages')
              messages=listing if isinstance(listing,list) else listing.get('hydra:member',[])
              for m in messages:
                  subj=m.get('subject','')
                  if subj not in wanted or m.get('id') in seen: continue
                  seen.add(m['id'])
                  detail=get_json(base+'/messages/'+m['id']); idx=wanted[subj]
                  for a in detail.get('attachments',[]):
                      name=a.get('filename',''); u=a.get('downloadUrl')
                      if not u: continue
                      data=get_bytes(urllib.parse.urljoin(base,u))
                      if name==f'c8b8_v3_part{idx}.bin':
                          (out/name).write_bytes(data); got.add(idx)
                      elif name=='c8b8_v3_wrapped_key.bin':
                          (out/name).write_bytes(data); key_ok=True
              if len(got)<4 or not key_ok: time.sleep(5)
          if len(got)!=4 or not key_ok: raise SystemExit(f'TRANSPORT_INCOMPLETE parts={sorted(got)} key={key_ok}')
          print('MAIL_TRANSPORT_COMPLETE parts=4 key=1')
          '@ | Set-Content -Encoding ascii $env:RUNNER_TEMP\recv.py
          python $env:RUNNER_TEMP\recv.py | Tee-Object mail_transport.txt
          if($LASTEXITCODE -ne 0){ throw 'MAIL_TRANSPORT_FAIL' }

      - name: Reassemble decrypt extract and exact-bind all assets
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          @'
          from pathlib import Path
          parts=[Path('transport')/f'c8b8_v3_part{i}.bin' for i in range(1,5)]
          out=Path(r'__PAYLOAD_ENC__')
          with out.open('wb') as fo:
              for p in parts:
                  with p.open('rb') as fi:
                      while True:
                          b=fi.read(1024*1024)
                          if not b: break
                          fo.write(b)
          print('REASSEMBLED_BYTES',out.stat().st_size)
          '@.Replace('__PAYLOAD_ENC__', (Join-Path $env:RUNNER_TEMP 'payload.enc')) | Set-Content -Encoding ascii $env:RUNNER_TEMP\reassemble.py
          python $env:RUNNER_TEMP\reassemble.py
          $enc=(Get-FileHash (Join-Path $env:RUNNER_TEMP 'payload.enc') -Algorithm SHA256).Hash.ToLowerInvariant()
          if($enc -ne $env:ENC_SHA){ throw "ENC_SHA_FAIL $enc" }
          if((Get-Item transport\c8b8_v3_wrapped_key.bin).Length -ne 384){ throw 'WRAPPED_KEY_SIZE_FAIL' }
          openssl pkeyutl -decrypt -inkey $env:RUNNER_TEMP\private.pem -in transport\c8b8_v3_wrapped_key.bin -out $env:RUNNER_TEMP\aes_pass.txt -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          if($LASTEXITCODE -ne 0){ throw 'RSA_UNWRAP_FAIL' }
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in $env:RUNNER_TEMP\payload.enc -out $env:RUNNER_TEMP\payload.tar.xz -pass file:$env:RUNNER_TEMP\aes_pass.txt
          if($LASTEXITCODE -ne 0){ throw 'AES_DECRYPT_FAIL' }
          $xz=(Get-FileHash $env:RUNNER_TEMP\payload.tar.xz -Algorithm SHA256).Hash.ToLowerInvariant()
          if($xz -ne $env:XZ_SHA){ throw "XZ_SHA_FAIL $xz" }
          @'
          import tarfile, os
          from pathlib import Path
          src=Path(os.environ['RUNNER_TEMP'])/'payload.tar.xz'
          dst=Path('payload'); dst.mkdir(exist_ok=True)
          with tarfile.open(src,'r:xz') as t: t.extractall(dst)
          print('PYTHON_TAR_XZ_EXTRACT_PASS')
          '@ | Set-Content -Encoding ascii $env:RUNNER_TEMP\extract.py
          python $env:RUNNER_TEMP\extract.py
          if($LASTEXITCODE -ne 0){ throw 'PYTHON_EXTRACT_FAIL' }
          $pairs=@(
            @('payload\SigProcDll-64HF.dll',$env:CAND_SHA),
            @('payload\HostCompat.dll',$env:HOST_SHA),
            @('payload\C63.dll',$env:C63_SHA),
            @('payload\SigProcLoaderContractSmoke.exe',$env:SMOKE_SHA)
          )
          foreach($p in $pairs){
            $h=(Get-FileHash $p[0] -Algorithm SHA256).Hash.ToLowerInvariant()
            if($h -ne $p[1]){ throw "CORE_SHA_FAIL $($p[0]) $h" }
            "$h  $($p[0])" | Add-Content exact_asset_binding.txt
          }
          @'
          from pathlib import Path
          import hashlib, os, sys
          expected={
          'inner-bed/01_initial_empty.ghf':'bdee0b60e66601d036925c6753f763020f517ff22504dc1080d6fd7fef16c798',
          'inner-bed/02_supine.ghf':'f9601b4f91b61bf15f554639f244ecb3617204b1102affdae5b3d7f6bfad0a7f',
          'inner-bed/03_left.ghf':'011426b2fd07ba2741a0fe890cbacb3f16766f1f7310160f6177fbbd1e557fbe',
          'inner-bed/04_right.ghf':'b5729623ddc5fed1b9a993658db1b84a699fe4a7e9a4183ef1433b7f392b4dfe',
          'inner-bed/05_free.ghf':'c4c4665fd9aff891b66aed223b67bfdb5af0a437d18385057acc7f675ad6b9cc',
          'inner-bed/06_final_empty.ghf':'6ee2b15321b1164b6f2de4b031b393a7227355d9e6b6b39dddddef57434da7e7',
          'outer-medical-bed/01_initial_empty.ghf':'226efcb270599df569b628118db8afa4e678296750afa651c5da376da79d3737',
          'outer-medical-bed/02_supine.ghf':'69f64f78d5a2e0d22f75086096117eda2d276ef734b763002d5cace97d17c7c0',
          'outer-medical-bed/03_left.ghf':'55558b1c850a5438f2815863e2102f958b4c9b137350622e36d5434a8c5da77c',
          'outer-medical-bed/04_right.ghf':'d54ae503fd68a9463fc48cbfa33af05d3b985aad8eb286d46359bf286ccc3afb',
          'outer-medical-bed/05_leave.ghf':'f2f2caa0e5e35dcc41f9d37c2bc0e70c11cc5b39062ec8025edd18394884866c',
          'outer-medical-bed/06_return_free.ghf':'99f93d049a6a84bc24bb6617f02de19b95dc17062ade0593ec33cec336dce948',
          'outer-medical-bed/07_final_empty.ghf':'4f7f9ba9a49ec39093c5883a3234bf468f2fee57c9a6392206d606ed1b9462c8'}
          total=0
          for rel,exp in expected.items():
              p=Path('payload/testdata')/rel; b=p.read_bytes(); h=hashlib.sha256(b).hexdigest(); total+=len(b)
              if h!=exp: print('GHF_SHA_FAIL',rel,h); sys.exit(40)
              print('GHF_SHA_OK',rel,h)
          if len(expected)!=int(os.environ['GHF_COUNT']) or total!=int(os.environ['GHF_BYTES']): sys.exit(41)
          print('FULL_GHF_BIND_PASS count=%d bytes=%d'%(len(expected),total))
          '@ | Set-Content -Encoding ascii $env:RUNNER_TEMP\ghf_bind.py
          python $env:RUNNER_TEMP\ghf_bind.py | Tee-Object ghf_hash_gate.txt
          if($LASTEXITCODE -ne 0){ throw 'GHF_BIND_FAIL' }
          "ENC_SHA=$enc`nXZ_SHA=$xz`nCAND_SHA=$env:CAND_SHA`nGHF_COUNT=$env:GHF_COUNT`nGHF_BYTES=$env:GHF_BYTES`nEXACT_ASSET_BINDING_PASS" | Add-Content exact_asset_binding.txt

      - name: Configure MSVC x86
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Static PE ABI export import and stack-safety gate
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          dumpbin /headers payload\SigProcDll-64HF.dll | Out-File candidate_headers.txt
          dumpbin /exports payload\SigProcDll-64HF.dll | Out-File candidate_exports.txt
          dumpbin /dependents payload\SigProcDll-64HF.dll | Out-File candidate_dependents.txt
          dumpbin /dependents payload\HostCompat.dll | Out-File hostcompat_dependents.txt
          if(-not (Select-String candidate_headers.txt -SimpleMatch '14C machine (x86)' -Quiet)){ throw 'NOT_X86' }
          foreach($e in @('_SigProc@24','_SigProc_Fini@0','_SigProc_Init@8','_SigProc_Stat@0')){ if(-not (Select-String candidate_exports.txt -SimpleMatch $e -Quiet)){ throw "MISSING_EXPORT $e" } }
          if(Select-String candidate_dependents.txt -SimpleMatch 'ucrtbase.dll' -Quiet){ throw 'DIRECT_UCRTBASE_FORBIDDEN' }
          @'
          from pathlib import Path
          import re,struct,sys
          def deps(p):
              s=Path(p).read_text(errors='ignore'); return {x.lower() for x in re.findall(r'^\s*([A-Za-z0-9_.-]+\.dll)\s*$',s,re.M|re.I)}
          c=deps('candidate_dependents.txt'); h=deps('hostcompat_dependents.txt')
          if c!=h: print('IMPORT_MISMATCH',sorted(c),sorted(h)); sys.exit(50)
          b=Path('payload/SigProcDll-64HF.dll').read_bytes()
          u16=lambda o:struct.unpack_from('<H',b,o)[0]; u32=lambda o:struct.unpack_from('<I',b,o)[0]
          pe=u32(0x3c); n=u16(pe+6); osz=u16(pe+20); s0=pe+24+osz; bad=[]; stk=False
          for i in range(n):
              o=s0+40*i; name=b[o:o+8].split(b'\0',1)[0].decode('ascii','ignore'); rs=u32(o+16); rp=u32(o+20); ch=u32(o+36)
              if name=='.stkfix': stk=True
              if ch & 0x20000000:
                  for off in range(rp,max(rp,rp+rs-6)):
                      if b[off:off+2]==b'\x81\xec':
                          imm=u32(off+2)
                          if 0x1000<=imm<0x100000: bad.append((name,off,imm))
          if not stk: sys.exit('STKFIX_SECTION_MISSING')
          if bad: print('UNSAFE_DIRECT_STACK',bad); sys.exit(51)
          Path('static_gate.txt').write_text('IMPORT_SET_EQUALS_HOSTCOMPAT\nSTKFIX_PRESENT=1\nLARGE_DIRECT_STACK_RESERVATIONS=0\nSTATIC_PE_ABI_STACK_SAFETY_PASS\n')
          '@ | Set-Content -Encoding ascii $env:RUNNER_TEMP\static_gate.py
          python $env:RUNNER_TEMP\static_gate.py
          if($LASTEXITCODE -ne 0){ throw 'STATIC_GATE_FAIL' }

      - name: Loader contract smoke in inner and outer runtime layouts
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          foreach($mode in @('inner-bed','outer-medical-bed')){
            $d="loader_$($mode.Replace('-','_'))"
            New-Item -ItemType Directory -Force $d | Out-Null
            Copy-Item payload\runtime\$mode\* $d\ -Force
            Copy-Item payload\SigProcDll-64HF.dll $d\SigProcDll-64HF.dll -Force
            Copy-Item payload\SigProcLoaderContractSmoke.exe $d\ -Force
            Push-Location $d
            .\SigProcLoaderContractSmoke.exe 2>&1 | Tee-Object "..\loader_$mode.log"
            $rc=$LASTEXITCODE
            Pop-Location
            if($rc -ne 0){ throw "LOADER_FAIL $mode rc=$rc" }
            if(-not (Select-String "loader_$mode.log" -SimpleMatch 'ALL_LOADER_CONTRACT_TESTS_PASS' -Quiet)){ throw "LOADER_MARKER_FAIL $mode" }
          }
          'INNER_OUTER_LOADER_CONTRACT_PASS' | Out-File loader_contract_gate.txt

      - name: Compile x86 complete native regression harness
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          cl /nologo /O2 /W4 /D_CRT_SECURE_NO_WARNINGS /Fe:payload\fullreg.exe payload\fullreg.c 2>&1 | Tee-Object fullreg_compile.txt
          if($LASTEXITCODE -ne 0){ throw 'FULLREG_COMPILE_FAIL' }

      - name: Execute complete native Windows regression
        shell: powershell
        timeout-minutes: 125
        run: |
          $ErrorActionPreference='Stop'
          .\payload\fullreg.exe .\payload\SigProcDll-64HF.dll .\payload\HostCompat.dll .\payload\C63.dll .\payload\testdata .\payload\runtime\inner-bed .\payload\runtime\outer-medical-bed 2>&1 | Tee-Object full_regression_c8b8_v3.log
          $rc=$LASTEXITCODE
          "FULLREG_EXIT=$rc" | Out-File regression_runner_exit.txt
          if($rc -ne 0){ throw "FULLREG_RUNTIME_FAIL rc=$rc" }
          $markers=@(
            'NONZERO_NATIVE_SMOKE_PASS frames=1',
            'INNER_FULL_REPLAY_PASS',
            'OUTER_FULL_REPLAY_PASS',
            'SEQ_TARGETS_VITAL_SUPPRESSION_RECOVERY_PASS',
            'DETERMINISTIC_REPLAY_PASS',
            'PERFORMANCE_PASS',
            'LONG_STABILITY_PASS loops=20000',
            'TWO_THREAD_STRESS_PASS threads=2 loops_each=2000',
            'REALTIME_1HZ_PASS frames=60',
            'HOSTCOMPAT_FULL_BASELINE_PASS',
            'C63_FULL_BASELINE_PASS',
            'BASELINE_COMPARISON_PASS',
            'COMPLETE_NATIVE_WINDOWS_REGRESSION_PASS'
          )
          foreach($m in $markers){ if(-not (Select-String full_regression_c8b8_v3.log -SimpleMatch $m -Quiet)){ throw "FULLREG_MARKER_MISSING $m" } }
          'FULL_NATIVE_WINDOWS_COMPLETE_REGRESSION_PASS' | Out-File fullreg_gate.txt

      - name: Exact post-test SHA and release lock
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $h=(Get-FileHash payload\SigProcDll-64HF.dll -Algorithm SHA256).Hash.ToLowerInvariant()
          if($h -ne $env:CAND_SHA){ throw "POST_TEST_SHA_CHANGED $h" }
          "POST_TEST_SHA256=$h" | Out-File post_regression_sha256.txt
          "NATIVE_WINDOWS_DYNAMIC_PASS SHA256=$h`nFULL_NATIVE_WINDOWS_COMPLETE_REGRESSION_PASS SHA256=$h`nRELEASE_GATE_PASS SHA256=$h" | Out-File C8B8_V3_EXACT_RELEASE_PASS.lock

      - name: Commit exact PASS lock and evidence summary
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force evidence_summary | Out-Null
          Copy-Item C8B8_V3_EXACT_RELEASE_PASS.lock evidence_summary\ -Force
          Copy-Item post_regression_sha256.txt evidence_summary\ -Force
          Copy-Item fullreg_gate.txt evidence_summary\ -Force
          git config user.name windows-dll-test-bot
          git config user.email windows-dll-test-bot@users.noreply.github.com
          git add evidence_summary
          git commit -m "Lock c8b8 V3 exact native complete regression PASS"
          if($LASTEXITCODE -ne 0){ throw 'PASS_LOCK_COMMIT_FAIL' }
          git push origin "HEAD:$env:HANDOFF_BRANCH"
          if($LASTEXITCODE -ne 0){ throw 'PASS_LOCK_PUSH_FAIL' }

      - name: Upload exact tested DLL and full evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c8b8-v3-exact-release-${{ github.run_id }}
          path: |
            payload/SigProcDll-64HF.dll
            payload/MANIFEST.txt
            payload/CORE_SHA256SUMS.txt
            payload/GHF_SHA256SUMS.txt
            payload/fullreg.c
            exact_asset_binding.txt
            ghf_hash_gate.txt
            candidate_headers.txt
            candidate_exports.txt
            candidate_dependents.txt
            hostcompat_dependents.txt
            static_gate.txt
            loader_inner-bed.log
            loader_outer-medical-bed.log
            loader_contract_gate.txt
            fullreg_compile.txt
            full_regression_c8b8_v3.log
            regression_runner_exit.txt
            fullreg_gate.txt
            post_regression_sha256.txt
            C8B8_V3_EXACT_RELEASE_PASS.lock
            mail_transport.txt
          if-no-files-found: ignore
          retention-days: 30
