name: collect-run-status

on:
  push:
    paths:
      - '.github/workflows/collect_run_status.yml'

permissions:
  actions: read
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Query recent Windows test runs and logs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence_summary
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" > "$RUNNER_TEMP/runs.json"
          python3 - "$RUNNER_TEMP/runs.json" <<'PY' > evidence_summary/windows_run_status.txt
          import json,sys
          d=json.load(open(sys.argv[1]))
          paths={'.github/workflows/secure_windows_dll_test.yml','.github/workflows/secure_windows_drive_test.yml'}
          xs=[r for r in d.get('workflow_runs',[]) if r.get('path') in paths]
          xs.sort(key=lambda r:r.get('created_at',''),reverse=True)
          for r in xs[:10]:
              print('RUN',r.get('id'),'name=',r.get('name'),'path=',r.get('path'),'status=',r.get('status'),'conclusion=',r.get('conclusion'),'head_sha=',r.get('head_sha'),'created=',r.get('created_at'),'updated=',r.get('updated_at'))
          if xs:
              print('LATEST_RUN_ID='+str(xs[0].get('id')))
          PY
          run_id=$(sed -n 's/^LATEST_RUN_ID=//p' evidence_summary/windows_run_status.txt | head -1)
          if [ -n "$run_id" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" > "$RUNNER_TEMP/jobs.json"
            python3 - "$RUNNER_TEMP/jobs.json" <<'PY' >> evidence_summary/windows_run_status.txt
          import json,sys
          d=json.load(open(sys.argv[1]))
          for j in d.get('jobs',[]):
              print('JOB',j.get('id'),j.get('name'),'status=',j.get('status'),'conclusion=',j.get('conclusion'))
              for s in j.get('steps',[]): print(' STEP',s.get('number'),s.get('name'),'status=',s.get('status'),'conclusion=',s.get('conclusion'))
          PY
            job_id=$(python3 -c "import json;d=json.load(open('$RUNNER_TEMP/jobs.json'));print(d.get('jobs',[{}])[0].get('id',''))")
            if [ -n "$job_id" ]; then
              gh api -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/actions/jobs/${job_id}/logs" > evidence_summary/latest_windows_job.log || true
            fi
          fi
      - name: Commit status summary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'windows-dll-test-bot'
          git config user.email 'windows-dll-test-bot@users.noreply.github.com'
          git add evidence_summary
          git commit -m 'Record Windows test run status and logs'
          git push
