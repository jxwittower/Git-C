name: c8b8-exact-native-full-release-v2
on:
  push:
    paths:
      - '.github/workflows/c8b8_exact_full_release_v2.yml'
permissions:
  contents: write

defaults:
  run:
    shell: powershell

jobs:
  exact-native-full:
    runs-on: windows-2022
    timeout-minutes: 110
    env:
      CAND_SHA: c8b8f49620b45707f80f47a9fadf14db376a115bc6052517e9243e0cb2dc20e9
      HOST_SHA: 081c4c62d2bf377913eb2aca0cc3cf3bf656350c8abaa3aaf11d171dac604804
      C63_SHA: 56c02d18a9ee68a7ae14c4601e4ba24f7af170c6db01ea21fbff91cbe6b082fb
      SMOKE_SHA: a9cc5cf614114c9481073669a3fd5d7ef5e1a1adce7e0fdc3f62824e0d50431d
      PAYLOAD_SHA: c1bde82d07768249d1a55aaa8e48bc8a3f26629f7eabddc214611106cb39173f
      DRIVE_ID: 1EprfV4hwC0Xjq3Lf_a6jMhvTqxFiX8ov
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Download exact full-regression payload with Drive confirmation handling
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install --disable-pip-version-check --quiet gdown
          if($LASTEXITCODE -ne 0){ throw 'GDOWN_INSTALL_FAIL' }
          $url="https://drive.google.com/file/d/$env:DRIVE_ID/view"
          gdown --fuzzy $url -O payload.tar.xz
          if($LASTEXITCODE -ne 0){ throw 'GDOWN_DOWNLOAD_FAIL' }
          if(!(Test-Path payload.tar.xz)){ throw 'PAYLOAD_DOWNLOAD_MISSING' }
          $size=(Get-Item payload.tar.xz).Length
          $h=(Get-FileHash payload.tar.xz -Algorithm SHA256).Hash.ToLowerInvariant()
          "PAYLOAD_BYTES=$size`nPAYLOAD_SHA256=$h" | Tee-Object payload_binding.txt
          if($h -ne $env:PAYLOAD_SHA){ throw "PAYLOAD_SHA_MISMATCH $h size=$size" }
          7z x -y payload.tar.xz | Out-File extract_xz.log
          if(!(Test-Path newfullreg_payload.tar)){ throw 'TAR_STAGE_MISSING' }
          7z x -y newfullreg_payload.tar | Out-File extract_tar.log
          if(!(Test-Path newfullreg_payload\SigProcDll-64HF.dll)){ throw 'CANDIDATE_MISSING' }

      - name: Bind exact binaries and all full GHF files
        run: |
          $ErrorActionPreference='Stop'
          $p='newfullreg_payload'
          $pairs=@(
            @("$p\SigProcDll-64HF.dll",$env:CAND_SHA),
            @("$p\HostCompat.dll",$env:HOST_SHA),
            @("$p\C63.dll",$env:C63_SHA),
            @("$p\SigProcLoaderContractSmoke.exe",$env:SMOKE_SHA)
          )
          foreach($x in $pairs){
            $h=(Get-FileHash $x[0] -Algorithm SHA256).Hash.ToLowerInvariant()
            if($h -ne $x[1]){ throw "HASH_BIND_FAIL $($x[0]) $h" }
            "$h  $($x[0])" | Add-Content exact_binary_bindings.txt
          }
          $ghfs=Get-ChildItem "$p\testdata" -Recurse -Filter '*.ghf'
          if($ghfs.Count -ne 13){ throw "GHF_COUNT_FAIL $($ghfs.Count)" }
          $bytes=($ghfs | Measure-Object Length -Sum).Sum
          "FULL_GHF_COUNT=$($ghfs.Count)`nFULL_GHF_BYTES=$bytes" | Add-Content exact_binary_bindings.txt
          'EXACT_BINARY_AND_FULL_DATA_BINDING_PASS' | Add-Content exact_binary_bindings.txt

      - name: Configure MSVC x86
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Static PE ABI import and stack-safety gate
        run: |
          $ErrorActionPreference='Stop'
          $p='newfullreg_payload'
          dumpbin /headers "$p\SigProcDll-64HF.dll" | Out-File candidate_headers.txt
          dumpbin /exports "$p\SigProcDll-64HF.dll" | Out-File candidate_exports.txt
          dumpbin /imports "$p\SigProcDll-64HF.dll" | Out-File candidate_imports.txt
          dumpbin /imports "$p\HostCompat.dll" | Out-File hostcompat_imports.txt
          if(-not (Select-String candidate_headers.txt -SimpleMatch '14C machine (x86)' -Quiet)){ throw 'NOT_PE32_X86' }
          foreach($e in @('_SigProc@24','_SigProc_Fini@0','_SigProc_Init@8','_SigProc_Stat@0')){ if(-not (Select-String candidate_exports.txt -SimpleMatch $e -Quiet)){ throw "MISSING_EXPORT $e" } }
          if(Select-String candidate_imports.txt -SimpleMatch 'ucrtbase.dll' -Quiet){ throw 'DIRECT_UCRTBASE_FORBIDDEN' }
          if(-not (Select-String candidate_headers.txt -SimpleMatch '.stkfix' -Quiet)){ throw 'STKFIX_SECTION_MISSING' }
          @'
          from pathlib import Path
          import re,struct,sys
          cand=Path('candidate_imports.txt').read_text(errors='ignore')
          base=Path('hostcompat_imports.txt').read_text(errors='ignore')
          pat=re.compile(r'^\s*([A-Za-z0-9_.-]+\.dll)\s*$',re.I|re.M)
          cs={x.lower() for x in pat.findall(cand)}; bs={x.lower() for x in pat.findall(base)}
          if cs != bs:
              print('CAND_IMPORTS',sorted(cs)); print('BASE_IMPORTS',sorted(bs)); sys.exit(31)
          b=Path('newfullreg_payload/SigProcDll-64HF.dll').read_bytes()
          u16=lambda o:struct.unpack_from('<H',b,o)[0]; u32=lambda o:struct.unpack_from('<I',b,o)[0]
          pe=u32(0x3c); n=u16(pe+6); osz=u16(pe+20); s0=pe+24+osz; bad=[]
          for i in range(n):
              o=s0+40*i; name=b[o:o+8].split(b'\0',1)[0].decode('ascii','ignore'); rs=u32(o+16); rp=u32(o+20); ch=u32(o+36)
              if ch & 0x20000000:
                  for off in range(rp,max(rp,rp+rs-6)):
                      if b[off:off+2]==b'\x81\xec':
                          imm=u32(off+2)
                          if 0x1000 <= imm < 0x100000: bad.append((name,off,imm))
          if bad:
              print('UNSAFE_LARGE_DIRECT_STACK_RESERVATIONS',bad); sys.exit(32)
          Path('static_gate.txt').write_text('IMPORT_SET_EQUALS_HOSTCOMPAT\nLARGE_DIRECT_STACK_RESERVATIONS=0\nSTKFIX_PRESENT=1\nSTATIC_PE_ABI_STACK_SAFETY_PASS\n')
          '@ | Set-Content -Encoding ascii $env:RUNNER_TEMP\static_gate.py
          python $env:RUNNER_TEMP\static_gate.py

      - name: Execute canonical loader contract
        run: |
          $ErrorActionPreference='Stop'
          Push-Location newfullreg_payload
          .\SigProcLoaderContractSmoke.exe 2>&1 | Tee-Object ..\loader_contract.log
          $rc=$LASTEXITCODE
          Pop-Location
          if($rc -ne 0){ throw "LOADER_SMOKE_FAIL rc=$rc" }
          if(-not (Select-String loader_contract.log -SimpleMatch 'ALL_LOADER_CONTRACT_TESTS_PASS' -Quiet)){ throw 'LOADER_PASS_MARKER_MISSING' }
          'NATIVE_WINDOWS_LOADER_CONTRACT_PASS' | Out-File native_dynamic_gate.txt

      - name: Compile full native Windows regression host
        run: |
          $ErrorActionPreference='Stop'
          Push-Location newfullreg_payload
          cl /nologo /O2 /W4 /D_CRT_SECURE_NO_WARNINGS /Fe:fullreg.exe fullreg.c
          if($LASTEXITCODE -ne 0){ throw 'FULLREG_COMPILE_FAIL' }
          Pop-Location

      - name: Run complete full-data native Windows regression
        timeout-minutes: 95
        run: |
          $ErrorActionPreference='Stop'
          Push-Location newfullreg_payload
          .\fullreg.exe .\SigProcDll-64HF.dll .\HostCompat.dll .\C63.dll .\testdata 2>&1 | Tee-Object ..\full_regression.log
          $rc=$LASTEXITCODE
          Pop-Location
          if($rc -ne 0){ throw "FULL_REGRESSION_FAIL rc=$rc" }
          $markers=@(
            'DETERMINISTIC_REPLAY_PASS',
            'LONG_STABILITY_PASS loops=20000',
            'TWO_THREAD_STRESS_PASS threads=2 loops_each=2000',
            'REALTIME_1HZ_PASS frames=60',
            'SEQ_TARGETS_VITAL_SUPPRESSION_RECOVERY_PASS',
            'COMPLETE_NATIVE_WINDOWS_REGRESSION_PASS'
          )
          foreach($m in $markers){ if(-not (Select-String full_regression.log -SimpleMatch $m -Quiet)){ throw "FULLREG_MARKER_MISSING $m" } }
          'FULL_NATIVE_WINDOWS_COMPLETE_REGRESSION_PASS' | Out-File fullreg_gate.txt

      - name: Rebind exact candidate after all native dynamic tests
        run: |
          $ErrorActionPreference='Stop'
          $h=(Get-FileHash newfullreg_payload\SigProcDll-64HF.dll -Algorithm SHA256).Hash.ToLowerInvariant()
          if($h -ne $env:CAND_SHA){ throw "POST_TEST_SHA_CHANGED $h" }
          "NATIVE_WINDOWS_DYNAMIC_PASS SHA256=$h" | Out-File C8B8_EXACT_NATIVE_PASS.lock
          "FULL_NATIVE_WINDOWS_COMPLETE_REGRESSION_PASS SHA256=$h" | Out-File C8B8_EXACT_FULL_REGRESSION_PASS.lock
          "RELEASE_GATE_PASS SHA256=$h" | Out-File C8B8_EXACT_RELEASE_PASS.lock

      - name: Commit exact PASS locks only after all gates
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force evidence_summary | Out-Null
          Copy-Item C8B8_EXACT_NATIVE_PASS.lock evidence_summary\
          Copy-Item C8B8_EXACT_FULL_REGRESSION_PASS.lock evidence_summary\
          Copy-Item C8B8_EXACT_RELEASE_PASS.lock evidence_summary\
          git config user.name windows-dll-test-bot
          git config user.email windows-dll-test-bot@users.noreply.github.com
          git add evidence_summary/C8B8_EXACT_NATIVE_PASS.lock evidence_summary/C8B8_EXACT_FULL_REGRESSION_PASS.lock evidence_summary/C8B8_EXACT_RELEASE_PASS.lock
          git commit -m "Lock exact c8b8 native and complete regression PASS"
          git push origin HEAD:main

      - name: Upload exact tested DLL and evidence
        uses: actions/upload-artifact@v4
        with:
          name: c8b8-exact-release-pass-v2-${{ github.run_id }}
          path: |
            newfullreg_payload/SigProcDll-64HF.dll
            newfullreg_payload/MANIFEST.txt
            exact_binary_bindings.txt
            candidate_headers.txt
            candidate_exports.txt
            candidate_imports.txt
            hostcompat_imports.txt
            static_gate.txt
            loader_contract.log
            native_dynamic_gate.txt
            full_regression.log
            fullreg_gate.txt
            C8B8_EXACT_NATIVE_PASS.lock
            C8B8_EXACT_FULL_REGRESSION_PASS.lock
            C8B8_EXACT_RELEASE_PASS.lock
            payload_binding.txt
          if-no-files-found: error
          retention-days: 30
