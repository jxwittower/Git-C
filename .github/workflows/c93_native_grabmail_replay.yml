name: c93-native-windows-grabmail-replay

on:
  push:
    branches: [c93-v76-replay-20260824]
    paths:
      - '.github/workflows/c93_native_grabmail_replay.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  native-inner7:
    runs-on: windows-2022
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c93-v76-replay-20260824
          fetch-depth: 0
          persist-credentials: true

      - name: Publish one-time GrabMail and RSA handoff
        shell: bash
        run: |
          set -euo pipefail
          suffix=$(openssl rand -hex 6)
          addr="c93v76-${GITHUB_RUN_ID}-${suffix}@grabmail.io"
          subject="C93-NATIVE-GRAB-${GITHUB_RUN_ID}"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$RUNNER_TEMP/private.pem"
          openssl pkey -in "$RUNNER_TEMP/private.pem" -pubout -out public.pem
          printf '%s\n' "$addr" > address.txt
          printf '%s\n' "$subject" > subject.txt
          printf 'RUN_ID=%s\nEXPECTED_ENC_SHA=%s\nEXPECTED_PLAIN_SHA=%s\nEXPECTED_DLL_SHA=%s\n' \
            "$GITHUB_RUN_ID" \
            '9ff295770ea99e1a58e9bc95bd541c434f86378a40143524992ae99bbad62e33' \
            '283e68bec9e87976c717f8609d4f874a1020c51f889747abe135640c497d36c9' \
            'e4ce56dd12e6f43c3a4a9069ac1837d221ca1360b7e54fb106e49b6f4aa613ae' > binding.txt
          git config user.name c93-native-test-bot
          git config user.email c93-native-test-bot@users.noreply.github.com
          git fetch -q origin c93-v76-replay-20260824
          git checkout -q -B c93-v76-replay-20260824 origin/c93-v76-replay-20260824
          rm -rf .c93_grab_handoff
          mkdir .c93_grab_handoff
          cp public.pem address.txt subject.txt binding.txt .c93_grab_handoff/
          git add .c93_grab_handoff
          git commit -m 'Publish C93 GrabMail native replay handoff'
          git push origin HEAD:c93-v76-replay-20260824
          echo "GRAB_ADDRESS=$addr"
          echo "GRAB_SUBJECT=$subject"

      - name: Receive encrypted payload from GrabMail
        shell: powershell
        timeout-minutes: 5
        run: |
          $ErrorActionPreference='Stop'
          $addr=(Get-Content .c93_grab_handoff\address.txt -Raw).Trim()
          $subject=(Get-Content .c93_grab_handoff\subject.txt -Raw).Trim()
          $enc=[uri]::EscapeDataString($addr)
          $msgId=$null
          for($i=0;$i -lt 150;$i++){
            try {
              $box=Invoke-RestMethod -Method Get -Uri "https://grabmail.io/api/v1/mailbox?address=$enc" -TimeoutSec 20
              $m=$box.messages | Where-Object {$_.subject -eq $subject} | Select-Object -First 1
              if($m){$msgId=$m.id;break}
            } catch {}
            Start-Sleep -Seconds 2
          }
          if(-not $msgId){throw 'GRABMAIL_PAYLOAD_TIMEOUT'}
          $msg=Invoke-RestMethod -Method Get -Uri "https://grabmail.io/api/v1/message/$msgId?mailbox=$enc" -TimeoutSec 30
          New-Item -ItemType Directory -Force transport | Out-Null
          foreach($name in @('c93_inner7_payload.enc','c93_inner7_key.bin')){
            $a=$msg.attachments | Where-Object {$_.filename -eq $name} | Select-Object -First 1
            if(-not $a){throw "ATTACHMENT_MISSING $name"}
            $u=[string]$a.url
            if($u -notmatch '^https?://'){$u='https://grabmail.io'+$u}
            Invoke-WebRequest -UseBasicParsing -Uri $u -OutFile (Join-Path 'transport' $name) -TimeoutSec 120
          }
          try { Invoke-RestMethod -Method Delete -Uri "https://grabmail.io/api/v1/message/$msgId?mailbox=$enc" -TimeoutSec 20 | Out-Null } catch {}
          $encSha=(Get-FileHash transport\c93_inner7_payload.enc -Algorithm SHA256).Hash.ToLowerInvariant()
          if($encSha -ne '9ff295770ea99e1a58e9bc95bd541c434f86378a40143524992ae99bbad62e33'){throw "ENC_SHA_FAIL $encSha"}
          if((Get-Item transport\c93_inner7_key.bin).Length -ne 384){throw 'WRAPPED_KEY_SIZE_FAIL'}
          openssl pkeyutl -decrypt -inkey $env:RUNNER_TEMP\private.pem -in transport\c93_inner7_key.bin -out $env:RUNNER_TEMP\pass.txt -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          if($LASTEXITCODE -ne 0){throw 'RSA_DECRYPT_FAIL'}
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in transport\c93_inner7_payload.enc -out $env:RUNNER_TEMP\payload.tar.xz -pass file:$env:RUNNER_TEMP\pass.txt
          if($LASTEXITCODE -ne 0){throw 'AES_DECRYPT_FAIL'}
          $plain=(Get-FileHash $env:RUNNER_TEMP\payload.tar.xz -Algorithm SHA256).Hash.ToLowerInvariant()
          if($plain -ne '283e68bec9e87976c717f8609d4f874a1020c51f889747abe135640c497d36c9'){throw "PLAIN_SHA_FAIL $plain"}
          New-Item -ItemType Directory -Force payload | Out-Null
          tar -xJf $env:RUNNER_TEMP\payload.tar.xz -C payload --strip-components=1
          if($LASTEXITCODE -ne 0){throw 'PAYLOAD_EXTRACT_FAIL'}
          $dll=(Get-FileHash payload\bin\C93.dll -Algorithm SHA256).Hash.ToLowerInvariant()
          if($dll -ne 'e4ce56dd12e6f43c3a4a9069ac1837d221ca1360b7e54fb106e49b6f4aa613ae'){throw "DLL_SHA_FAIL $dll"}
          @'
          import lzma, pathlib
          src=pathlib.Path('payload/data/inner_slow7.ghr.xz')
          pathlib.Path('payload/input.ghr').write_bytes(lzma.decompress(src.read_bytes()))
          '@ | Set-Content -Encoding ascii $env:RUNNER_TEMP\unxz.py
          python $env:RUNNER_TEMP\unxz.py
          Remove-Item -Force $env:RUNNER_TEMP\pass.txt,$env:RUNNER_TEMP\private.pem -ErrorAction SilentlyContinue
          'NATIVE_PAYLOAD_BINDING_PASS' | Out-File payload_binding.txt

      - name: Configure MSVC x86
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Build and run real-cadence x86 replay
        shell: powershell
        timeout-minutes: 8
        run: |
          $ErrorActionPreference='Stop'
          @'
          #include <windows.h>
          #include <stdint.h>
          #include <stdio.h>
          #include <string.h>
          typedef uint32_t (__stdcall *PF)(const uint32_t*,const void*,int,void*,void*,void*);
          typedef int (__stdcall *IF)(char*,void*); typedef void (__stdcall *FF)(void); typedef uint8_t (__stdcall *SF)(void);
          static uint32_t ids[2048]; static uint16_t w[8192]; static unsigned char st[0x105c],rs[0x786];
          static int rd(FILE*f,void*p,size_t n){return fread(p,1,n,f)==n;}
          int main(void){FILE*f=fopen("input.ghr","rb"),*o;char m4[4],prod[160]={0};uint32_t n,i,rel,c,k,seq=0;unsigned char lic[4]={1,0,0,0};HMODULE m;PF p;IF init;FF fini;SF stat;if(!f)return 10;if(!rd(f,m4,4)||memcmp(m4,"GHR1",4)||!rd(f,&n,4))return 11;m=LoadLibraryA("SigProcDll-64HF.dll");if(!m){printf("LOAD_FAIL %lu\n",GetLastError());return 12;}p=(PF)GetProcAddress(m,"_SigProc@24");init=(IF)GetProcAddress(m,"_SigProc_Init@8");fini=(FF)GetProcAddress(m,"_SigProc_Fini@0");stat=(SF)GetProcAddress(m,"_SigProc_Stat@0");if(!p||!init||!fini||!stat)return 13;if(!init(prod,lic))return 14;printf("INIT_PASS STAT=%u PRODUCT=%s RECORDS=%u\n",(unsigned)stat(),prod,n);o=fopen("state.csv","w");fprintf(o,"rel_ms,u16_0,u16_2,u16_4,u16_4176\n");for(i=0;i<n;i++){if(!rd(f,&rel,4)||!rd(f,&c,4)||c>2048)return 20;if(c&&(!rd(f,ids,c*4)||!rd(f,w,c*8)))return 21;if(c){for(k=0;k<c;k+=32){uint32_t z=c-k;if(z>32)z=32;seq=p(ids+k,w+k*4,(int)z,0,st,rs);Sleep(50);}}else{seq=p(0,0,0,0,st,rs);Sleep(1000);} {uint16_t a,b,d,e;memcpy(&a,st,2);memcpy(&b,st+2,2);memcpy(&d,st+4,2);memcpy(&e,st+4176,2);fprintf(o,"%u,%u,%u,%u,%u\n",rel,a,b,d,e);fflush(o);}if(i%25==0){printf("REC %u/%u rel=%u seq=%u stat=%u\n",i,n,rel,seq,(unsigned)stat());fflush(stdout);}}fclose(o);fclose(f);fini();printf("DONE STAT=%u\n",(unsigned)stat());FreeLibrary(m);return 0;}
          '@ | Set-Content -Encoding ascii payload\native_replay.c
          Push-Location payload
          try { cl /nologo /O2 /W4 /MT native_replay.c /Fe:NativeReplay.exe *>&1 | Tee-Object -FilePath ..\native_build.txt; if($LASTEXITCODE -ne 0){throw "BUILD_RC=$LASTEXITCODE"} } finally { Pop-Location }
          $run=Join-Path (Get-Location) 'payload\run';New-Item -ItemType Directory -Force $run|Out-Null
          Copy-Item payload\NativeReplay.exe,payload\input.ghr $run\
          Copy-Item payload\bin\C93.dll $run\SigProcDll-64HF.dll
          Copy-Item payload\sidecars\* $run\
          Push-Location $run
          try {
            $env:SIGPROC_REBUILD_DEBUG_CSV='rebuild.csv'
            $env:SIGPROC_RR_SHADOW_DEBUG_CSV='rrshadow.csv'
            $env:SIGPROC_BED_CAL_DEBUG_CSV='bedcal.csv'
            $env:SIGPROC_ENERGY_DEBUG_CSV='energy.csv'
            $env:SIGPROC_PHYSICS_DEBUG_CSV='physics.csv'
            .\NativeReplay.exe *>&1 | Tee-Object native_replay.log
            if($LASTEXITCODE -ne 0){throw "REPLAY_RC=$LASTEXITCODE"}
          } finally {Pop-Location}

      - name: Analyze native result
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference='Continue'
          @'
          import csv,pathlib,statistics,collections,hashlib,re
          p=pathlib.Path('payload/run');out=['C93_NATIVE_WINDOWS_GRABMAIL_REPLAY']
          if pathlib.Path('payload_binding.txt').exists():out.append('PAYLOAD_BINDING=PASS')
          if (p/'SigProcDll-64HF.dll').exists():out.append('DLL_SHA256='+hashlib.sha256((p/'SigProcDll-64HF.dll').read_bytes()).hexdigest())
          if (p/'native_replay.log').exists():
              t=(p/'native_replay.log').read_text(errors='ignore');m=re.search(r'INIT_PASS[^\n]*PRODUCT=([^\r\n]+)',t);out.append('NATIVE_INIT=' + ('PASS PRODUCT='+m.group(1).strip() if m else 'NO_SENTINEL'));out.append('NATIVE_DONE=' + ('PASS' if 'DONE STAT=0' in t else 'NO'))
          else: out.append('NATIVE_REPLAY_LOG=MISSING')
          verdict='NATIVE_REPLAY_NOT_COMPLETED'
          if (p/'rebuild.csv').exists():
              r=list(csv.DictReader((p/'rebuild.csv').open(newline='')));num=lambda x,k,d=0:float(x.get(k,d) or d)
              maxreal=max((num(x,'real_channel_count') for x in r),default=0);maxactive=max((num(x,'active_count') for x in r),default=0);minbad=min((num(x,'bad_channels',64) for x in r),default=64);maxclock=max((num(x,'sample_clock_windows') for x in r),default=0);rates=[int(float(x['rr_rate'])) for x in r if x.get('rr_rate') and int(float(x['rr_rate']))!=65535]
              f0=(329000-147000)/(480000-147000);f1=(416000-147000)/(480000-147000);a=max(0,min(len(r),round(f0*len(r))));b=max(a,min(len(r),round(f1*len(r))));ev=r[a:b];evr=[int(float(x['rr_rate'])) for x in ev if x.get('rr_rate') and int(float(x['rr_rate']))!=65535]
              out.append(f'REBUILD_ROWS={len(r)} MAX_REAL_CHANNELS={maxreal:g} MAX_ACTIVE_CHANNELS={maxactive:g} MIN_BAD_CHANNELS={minbad:g} MAX_SAMPLE_CLOCK_WINDOWS={maxclock:g}')
              out.append(f'ALL_RR_VALID={len(rates)}/{len(r)}')
              out.append(f'SLOW7_APPROX_ROWS={len(ev)} VALID_RR={len(evr)} MEDIAN={(statistics.median(evr) if evr else "NA")} COUNTS={dict(collections.Counter(evr).most_common(12))}')
              verdict='P0_C93_NATIVE_ALL_CHANNELS_REJECTED' if maxreal==0 and minbad>=64 else ('C93_NATIVE_CHANNEL_GATE_RECOVERED' if maxreal>0 else 'C93_NATIVE_REVIEW')
          else: out.append('REBUILD_CSV=MISSING')
          if (p/'state.csv').exists():
              s=list(csv.DictReader((p/'state.csv').open(newline='')));e=[x for x in s if 329000<=int(x['rel_ms'])<=416000];out.append('SLOW7_STATE_ROWS='+str(len(e)))
          out.append('VERDICT='+verdict);pathlib.Path('C93_NATIVE_GRABMAIL_RESULT.txt').write_text('\n'.join(out)+'\n');print('\n'.join(out))
          '@ | Set-Content -Encoding ascii $env:RUNNER_TEMP\an.py
          python $env:RUNNER_TEMP\an.py | Tee-Object analysis_console.txt

      - name: Upload native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c93-native-grabmail-evidence-${{ github.run_id }}
          path: |
            C93_NATIVE_GRABMAIL_RESULT.txt
            analysis_console.txt
            payload_binding.txt
            native_build.txt
            payload/run/native_replay.log
            payload/run/state.csv
            payload/run/rebuild.csv
            payload/run/rrshadow.csv
            payload/run/bedcal.csv
            payload/run/energy.csv
            payload/run/physics.csv
          if-no-files-found: ignore
          retention-days: 2

      - name: Commit result summary and cleanup handoff
        if: always()
        shell: bash
        run: |
          set +e
          git config user.name c93-native-test-bot
          git config user.email c93-native-test-bot@users.noreply.github.com
          git fetch -q origin c93-v76-replay-20260824
          git checkout -q -B c93-v76-replay-20260824 origin/c93-v76-replay-20260824
          mkdir -p evidence_summary
          if [ -f C93_NATIVE_GRABMAIL_RESULT.txt ]; then cp C93_NATIVE_GRABMAIL_RESULT.txt evidence_summary/C93_NATIVE_GRABMAIL_RESULT.txt; fi
          rm -rf .c93_grab_handoff
          git add -A .c93_grab_handoff evidence_summary
          git commit -m 'Record C93 native GrabMail replay result' >/dev/null 2>&1 || true
          git push origin HEAD:c93-v76-replay-20260824 || true
