name: native-windows-exact-original-gate-v7

on:
  push:
    paths:
      - '.github/workflows/native_windows_exact_original_gate_v7.yml'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  exact-gate:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Checkout current main full history
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 0

      - name: Create and publish one-time RSA transport key
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          rm -rf .exact_gate_v7_handoff
          mkdir -p .exact_gate_v7_handoff
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$RUNNER_TEMP/private.pem"
          openssl pkey -in "$RUNNER_TEMP/private.pem" -pubout -out .exact_gate_v7_handoff/public.pem
          git config user.name "windows-dll-test-bot"
          git config user.email "windows-dll-test-bot@users.noreply.github.com"
          git add .exact_gate_v7_handoff/public.pem
          git commit -m "Publish one-time RSA key for exact original gate v7"
          ok=0
          for i in $(seq 1 5); do
            if git push origin HEAD:main; then ok=1; break; fi
            git pull --rebase origin main
          done
          [ "$ok" = 1 ] || { echo "FAIL_STAGE=PUBLIC_KEY_PUSH"; exit 19; }
          echo "ONE_TIME_PUBLIC_KEY_PUBLISHED"

      - name: Wait for RSA-wrapped AES key
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 300); do
            git pull --ff-only origin main >/dev/null 2>&1 || true
            if [ -s .exact_gate_v7_handoff/key.enc.b64 ]; then ok=1; break; fi
            sleep 2
          done
          [ "$ok" = 1 ] || { echo "FAIL_STAGE=RSA_KEY_TIMEOUT"; exit 20; }
          tr -d '[:space:]' < .exact_gate_v7_handoff/key.enc.b64 > "$RUNNER_TEMP/key.enc.b64"
          base64 -d "$RUNNER_TEMP/key.enc.b64" > "$RUNNER_TEMP/key.enc" || { echo "FAIL_STAGE=KEY_B64_DECODE"; exit 21; }
          [ "$(wc -c < "$RUNNER_TEMP/key.enc" | tr -d '[:space:]')" = 384 ] || { echo "FAIL_STAGE=KEY_RSA_SIZE"; exit 22; }
          openssl pkeyutl -decrypt -inkey "$RUNNER_TEMP/private.pem" -in "$RUNNER_TEMP/key.enc" -out "$RUNNER_TEMP/pass.txt" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 || { echo "FAIL_STAGE=RSA_UNWRAP"; exit 23; }
          echo "RSA_WRAPPED_AES_KEY_ACCEPTED"

      - name: Recover and verify exact encrypted materials
        run: |
          set -euo pipefail
          rt=$(cygpath -u "$RUNNER_TEMP")
          PAYLOAD_REF='447f0ed3d653c425e7e603638f1ebae1d132ead8'
          p64="$RUNNER_TEMP/payload.enc.b64"
          : > "$p64"
          for p in \
            chunk_00 chunk_01 chunk_02 chunk_03 chunk_04 chunk_05 chunk_06 \
            chunk_07 chunk_08 chunk_09 chunk_10 chunk_11 \
            chunk_12fix_00 chunk_12fix_01 chunk_12fix_02 \
            chunk_12fix_03_00 chunk_12fix_03_01 chunk_12fix_03_02 chunk_12fix_03_03 chunk_12fix_03_04 \
            chunk_12b
          do git show "$PAYLOAD_REF:.recovered_payload/$p" >> "$p64"; done
          chars=$(wc -c < "$p64" | tr -d '[:space:]')
          echo "PAYLOAD_B64_CHARS=$chars"
          [ "$chars" = 259884 ] || { echo "FAIL_STAGE=PAYLOAD_B64_SIZE"; exit 31; }
          base64 -d "$p64" > "$RUNNER_TEMP/payload.enc" || { echo "FAIL_STAGE=PAYLOAD_B64_DECODE"; exit 32; }
          csha=$(sha256sum < "$RUNNER_TEMP/payload.enc" | awk '{print $1}')
          echo "PAYLOAD_CIPHER_SHA=$csha"
          [ "$csha" = '49087efe5f8506eaa1ba8ed42196678019220ac1db0847ac5ae5ea140796d4a3' ] || { echo "FAIL_STAGE=PAYLOAD_CIPHER_SHA"; exit 33; }
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in "$RUNNER_TEMP/payload.enc" -out "$RUNNER_TEMP/payload.tar.xz" -pass file:"$RUNNER_TEMP/pass.txt" || { echo "FAIL_STAGE=PAYLOAD_AES"; exit 34; }
          tsha=$(sha256sum < "$RUNNER_TEMP/payload.tar.xz" | awk '{print $1}')
          echo "PAYLOAD_TAR_SHA=$tsha"
          [ "$tsha" = '46cd159d17a7e83a4a65af0afca61e967de519a232459ce3821b6263bf962bf5' ] || { echo "FAIL_STAGE=PAYLOAD_TAR_SHA"; exit 35; }
          rm -rf payload; mkdir payload
          tar -xJf "$rt/payload.tar.xz" -C payload || { echo "FAIL_STAGE=PAYLOAD_EXTRACT"; exit 36; }
          check_sha() { local f="$1" exp="$2" got; [ -f "payload/$f" ] || { echo "FAIL_STAGE=MISSING:$f"; exit 37; }; got=$(sha256sum -b "payload/$f" | awk '{print $1}'); echo "FILE_SHA $f $got"; [ "$got" = "$exp" ] || { echo "FAIL_STAGE=FILE_SHA:$f"; exit 38; }; }
          check_sha SigProcDll-64HF.dll 081c4c62d2bf377913eb2aca0cc3cf3bf656350c8abaa3aaf11d171dac604804
          check_sha filter_brth ab3f170ff90741c614bd8ff2e5942038f1d14489f2c9df0a1dad7f3dd12b7b9a
          check_sha filter_hrt3 0ea419a929ac7d765f7c6bcb04fc151927eb6954a65a69819136bf3ae0946805
          check_sha file_sig a9caf6b2a06fb194bed68b7de910e30d48b31e8e3b03c23b1ae675d037753290
          check_sha file_bed_model_v1 48571bf163e1f12b5265bb09b65ce2dc4025f01d27b748bfc521381f94611520
          echo "PAYLOAD_FILES_OK"

          raw=$(tr -d '[:space:]' < .exact_gate_v7_source/src_00)
          echo "SOURCE_B64_CHARS=${#raw}"
          [ "${#raw}" = 1624 ] || { echo "FAIL_STAGE=SOURCE_B64_SIZE"; exit 41; }
          printf '%s' "$raw" > "$RUNNER_TEMP/exact_gate_source.enc.b64"
          base64 -d "$RUNNER_TEMP/exact_gate_source.enc.b64" > "$RUNNER_TEMP/exact_gate_source.enc" || { echo "FAIL_STAGE=SOURCE_B64_DECODE"; exit 42; }
          sesha=$(sha256sum < "$RUNNER_TEMP/exact_gate_source.enc" | awk '{print $1}')
          echo "SOURCE_CIPHER_SHA=$sesha"
          [ "$sesha" = '699c490bb08b0072d7c3a9f8c7e6cbf282ac254d31ba7095f1aa4448a1ef71c7' ] || { echo "FAIL_STAGE=SOURCE_CIPHER_SHA"; exit 43; }
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in "$RUNNER_TEMP/exact_gate_source.enc" -out "$RUNNER_TEMP/exact_gate_source.tar.xz" -pass file:"$RUNNER_TEMP/pass.txt" || { echo "FAIL_STAGE=SOURCE_AES"; exit 44; }
          stsha=$(sha256sum < "$RUNNER_TEMP/exact_gate_source.tar.xz" | awk '{print $1}')
          echo "SOURCE_TAR_SHA=$stsha"
          [ "$stsha" = '6188869d85c28237c82dda49551e20b47eda7af8805352baf96c14f31a58108d' ] || { echo "FAIL_STAGE=SOURCE_TAR_SHA"; exit 45; }
          tar -xJf "$rt/exact_gate_source.tar.xz" -C payload || { echo "FAIL_STAGE=SOURCE_EXTRACT"; exit 46; }
          ssha=$(sha256sum -b payload/exact_loader_gate.c | awk '{print $1}')
          echo "SOURCE_SHA=$ssha"
          [ "$ssha" = '244be80d82abeecadb0be4f35bcc5c2a26a2fc3960b5ad74cf262bd90d8f5a0e' ] || { echo "FAIL_STAGE=SOURCE_SHA"; exit 47; }
          echo "EXACT_MATERIALS_READY"
          rm -f "$RUNNER_TEMP/pass.txt" "$RUNNER_TEMP/key.enc.b64" "$RUNNER_TEMP/key.enc" "$RUNNER_TEMP/payload.enc" "$RUNNER_TEMP/payload.enc.b64" "$RUNNER_TEMP/payload.tar.xz" "$RUNNER_TEMP/exact_gate_source.enc.b64" "$RUNNER_TEMP/exact_gate_source.enc" "$RUNNER_TEMP/exact_gate_source.tar.xz"

      - name: Configure MSVC x86
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Build exact original-goal gate
        shell: cmd
        working-directory: payload
        run: |
          cl /nologo /W4 /O2 /MT exact_loader_gate.c /Fe:ExactLoaderGate.exe > ..\exact_gate_build.txt 2>&1
          if errorlevel 1 (type ..\exact_gate_build.txt & exit /b 50)
          type ..\exact_gate_build.txt

      - name: Execute exact original closed loop
        shell: cmd
        working-directory: payload
        run: |
          ExactLoaderGate.exe > ..\loader_smoke.txt 2>&1
          set RC=%ERRORLEVEL%
          type ..\loader_smoke.txt
          exit /b %RC%

      - name: Validate exact sentinel
        shell: cmd
        run: |
          findstr /C:"ALL_LOADER_CONTRACT_TESTS_PASS" loader_smoke.txt > nul
          if errorlevel 1 exit /b 30
          echo EXACT_LOADER_GATE_PASS

      - name: Upload non-proprietary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-original-native-loader-gate-v7-evidence
          path: |
            exact_gate_build.txt
            loader_smoke.txt
          if-no-files-found: ignore
          retention-days: 2

      - name: Remove one-time handoff
        if: always()
        run: |
          set +e
          git fetch origin main
          git reset --hard origin/main
          rm -rf .exact_gate_v7_handoff
          git add -A .exact_gate_v7_handoff
          if ! git diff --cached --quiet; then
            git commit -m "Remove exact original gate v7 handoff"
            for i in $(seq 1 5); do
              if git push origin HEAD:main; then break; fi
              git pull --rebase origin main || break
            done
          fi
          rm -rf payload
          rm -f "$RUNNER_TEMP/private.pem" "$RUNNER_TEMP/pass.txt" "$RUNNER_TEMP/key.enc.b64" "$RUNNER_TEMP/key.enc" "$RUNNER_TEMP/payload.enc" "$RUNNER_TEMP/payload.enc.b64" "$RUNNER_TEMP/payload.tar.xz" "$RUNNER_TEMP/exact_gate_source.enc.b64" "$RUNNER_TEMP/exact_gate_source.enc" "$RUNNER_TEMP/exact_gate_source.tar.xz"
