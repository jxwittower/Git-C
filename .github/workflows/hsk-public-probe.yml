name: HSK Public Probe
on:
  push:
    branches:
      - hsk-crawl-20260914
    paths:
      - 'hsk_public_access_probe.js'
      - 'package.json'
      - '.github/workflows/hsk-public-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hsk-crawl-20260914
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - name: Probe public HSK APIs and deep links
        run: node hsk_public_access_probe.js
      - name: Upload public-access evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hsk-public-access
          path: hsk_public_access
          if-no-files-found: warn
