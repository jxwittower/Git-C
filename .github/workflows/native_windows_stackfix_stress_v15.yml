name: native-windows-stackfix-stress-v15

on:
  push:
    paths:
      - '.github/workflows/native_windows_stackfix_stress_v15.yml'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  stress:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 0
      - name: Publish one-time RSA transport key
        run: |
          set -euo pipefail
          git fetch origin main; git reset --hard origin/main
          rm -rf .stackfix_stress_v15_handoff; mkdir -p .stackfix_stress_v15_handoff
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$RUNNER_TEMP/private.pem"
          openssl pkey -in "$RUNNER_TEMP/private.pem" -pubout -out .stackfix_stress_v15_handoff/public.pem
          git config user.name windows-dll-test-bot; git config user.email windows-dll-test-bot@users.noreply.github.com
          git add .stackfix_stress_v15_handoff/public.pem; git commit -m "Publish one-time RSA key for stress v15"
          ok=0; for i in $(seq 1 5); do if git push origin HEAD:main; then ok=1; break; fi; git pull --rebase origin main; done; [ "$ok" = 1 ] || exit 19
      - name: Receive wrapped AES key
        run: |
          set -euo pipefail
          ok=0; for i in $(seq 1 300); do git pull --ff-only origin main >/dev/null 2>&1 || true; if [ -s .stackfix_stress_v15_handoff/key.enc.b64 ]; then ok=1; break; fi; sleep 2; done
          [ "$ok" = 1 ] || exit 20
          tr -d '[:space:]' < .stackfix_stress_v15_handoff/key.enc.b64 | base64 -d > "$RUNNER_TEMP/key.enc"
          openssl pkeyutl -decrypt -inkey "$RUNNER_TEMP/private.pem" -in "$RUNNER_TEMP/key.enc" -out "$RUNNER_TEMP/pass.txt" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
      - name: Recover exact old payload and apply deterministic fix
        run: |
          set -euo pipefail
          rt=$(cygpath -u "$RUNNER_TEMP"); REF=447f0ed3d653c425e7e603638f1ebae1d132ead8; p64="$RUNNER_TEMP/payload.enc.b64"; : > "$p64"
          for p in chunk_00 chunk_01 chunk_02 chunk_03 chunk_04 chunk_05 chunk_06 chunk_07 chunk_08 chunk_09 chunk_10 chunk_11 chunk_12fix_00 chunk_12fix_01 chunk_12fix_02 chunk_12fix_03_00 chunk_12fix_03_01 chunk_12fix_03_02 chunk_12fix_03_03 chunk_12fix_03_04 chunk_12b; do git show "$REF:.recovered_payload/$p" >> "$p64"; done
          base64 -d "$p64" > "$RUNNER_TEMP/payload.enc"
          [ "$(sha256sum < "$RUNNER_TEMP/payload.enc" | awk '{print $1}')" = 49087efe5f8506eaa1ba8ed42196678019220ac1db0847ac5ae5ea140796d4a3 ] || exit 31
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in "$RUNNER_TEMP/payload.enc" -out "$RUNNER_TEMP/payload.tar.xz" -pass file:"$RUNNER_TEMP/pass.txt"
          rm -rf payload; mkdir payload; tar -xJf "$rt/payload.tar.xz" -C payload
          [ "$(sha256sum -b payload/SigProcDll-64HF.dll | awk '{print $1}')" = 081c4c62d2bf377913eb2aca0cc3cf3bf656350c8abaa3aaf11d171dac604804 ] || exit 32
          cat > "$RUNNER_TEMP/fix.py" <<'PY'
          from pathlib import Path
          import struct,hashlib
          p=Path('payload/SigProcDll-64HF.dll');b=bytearray(p.read_bytes())
          helper=bytes.fromhex('51528b5424080fb6024289542408e800000000598d893d0000008b04818d54240c3d00100000721481ea0010000085122d001000003d0010000077ec29c285128b4c2408894afc89d05a598d60fcc390902200004c21000068810000300f0100406f0000a0d60000c09d000070100000805a02004040000048200000e0370000')
          sites=[(0x1209,0x2290),(0x2a04,0x214c),(0x52f1,0x8168),(0x79a9,0x10f30),(0x1e7e9,0x6f40),(0x21d79,0xd6a0),(0x37141,0x9dc0),(0x45b59,0x1070),(0x460f9,0x25a80),(0x4a6c9,0x4040),(0x4b2f9,0x2048),(0x4d6c6,0x37e0)]
          def al(v,a):return(v+a-1)//a*a
          pe=struct.unpack_from('<I',b,0x3c)[0];fh=pe+4;ns=struct.unpack_from('<H',b,fh+2)[0];opt=fh+20;os=struct.unpack_from('<H',b,fh+16)[0];sec=opt+os;sa=struct.unpack_from('<I',b,opt+32)[0];fa=struct.unpack_from('<I',b,opt+36)[0];text=None;last=None
          for i in range(ns):
           o=sec+i*40;name=bytes(b[o:o+8]).rstrip(b'\0');vs,va,rs,rp=struct.unpack_from('<IIII',b,o+8)
           if name==b'.text':text=(vs,va,rs,rp)
           if last is None or va>last[1]:last=(vs,va,rs,rp)
          _,tva,_,trp=text;nva=al(last[1]+max(last[0],last[2]),sa);nrp=al(len(b),fa);nrs=al(len(helper),fa)
          if len(b)<nrp:b.extend(b'\0'*(nrp-len(b)))
          b.extend(helper);b.extend(b'\0'*(nrs-len(helper)));so=sec+ns*40;b[so:so+8]=b'.stkfix\0';struct.pack_into('<IIIIIIHHI',b,so+8,len(helper),nva,nrs,nrp,0,0,0,0,0x60000020);struct.pack_into('<H',b,fh+2,ns+1);struct.pack_into('<I',b,opt+56,al(nva+len(helper),sa));struct.pack_into('<I',b,opt+4,struct.unpack_from('<I',b,opt+4)[0]+nrs)
          for idx,(rva,imm) in enumerate(sites):
           fo=trp+rva-tva; exp=b'\x81\xec'+struct.pack('<I',imm)
           if bytes(b[fo:fo+6])!=exp: raise SystemExit('SITE_MISMATCH')
           b[fo:fo+6]=b'\xe8'+struct.pack('<I',(nva-rva-5)&0xffffffff)+bytes([idx])
          p.write_bytes(b);print(hashlib.sha256(b).hexdigest())
          PY
          python "$RUNNER_TEMP/fix.py" | tee fixed_sha.txt
          [ "$(sha256sum -b payload/SigProcDll-64HF.dll | awk '{print $1}')" = da4228b5f0fdb39bea9763dd1ffb9e7438fd3cb39223542255f39603660d15f3 ] || exit 33
          rm -f "$RUNNER_TEMP/pass.txt" "$RUNNER_TEMP/key.enc" "$RUNNER_TEMP/payload.enc" "$RUNNER_TEMP/payload.enc.b64" "$RUNNER_TEMP/payload.tar.xz" "$RUNNER_TEMP/fix.py"
      - name: Write corrected six-argument stress harness
        run: |
          cat > payload/stress_v15.c <<'EOF'
          #include <windows.h>
          #include <stdint.h>
          #include <stdio.h>
          #include <string.h>
          typedef uint32_t (__stdcall *ProcFn)(const uint32_t*,const void*,int,void*,void*,void*);
          typedef int (__stdcall *InitFn)(char*,void*); typedef void (__stdcall *FiniFn)(void); typedef uint8_t (__stdcall *StatFn)(void);
          typedef struct {ProcFn p; volatile LONG *fail; int loops;} Arg;
          static int check_state(const uint8_t*s){size_t k;for(k=0;k<4;k++)if(s[k]!=0xff)return 0;for(k=4;k<0x105c;k++)if(s[k]!=0)return 0;return 1;}
          static DWORD WINAPI worker(LPVOID v){Arg*a=(Arg*)v;int i;for(i=0;i<a->loops;i++){uint8_t st[0x105c];uint8_t rs[0x786];uint32_t seq;memset(st,0xA5,sizeof(st));memset(rs,0x5A,sizeof(rs));seq=a->p(0,0,0,0,st,rs);if(seq==0||!check_state(st)){InterlockedIncrement(a->fail);return 1;}{size_t k;for(k=0;k<sizeof(rs);k++)if(rs[k]){InterlockedIncrement(a->fail);return 2;}}}return 0;}
          int main(void){HMODULE m=LoadLibraryA("SigProcDll-64HF.dll");ProcFn p;InitFn init;FiniFn fini;StatFn stat;unsigned char lic[4]={1,0,0,0};char product[80];volatile LONG fail=0;Arg a;HANDLE t1,t2;DWORD w1=0,w2=0;int i;if(!m){puts("LOAD_FAIL");return 10;}p=(ProcFn)GetProcAddress(m,"_SigProc@24");init=(InitFn)GetProcAddress(m,"_SigProc_Init@8");fini=(FiniFn)GetProcAddress(m,"_SigProc_Fini@0");stat=(StatFn)GetProcAddress(m,"_SigProc_Stat@0");if(!p||!init||!fini||!stat)return 11;memset(product,0,sizeof(product));if(!init(product,lic)||stat()!=1)return 12;printf("INIT_PASS product=%s\n",product);a.p=p;a.fail=&fail;a.loops=50000;t1=CreateThread(0,0,worker,&a,0,0);t2=CreateThread(0,0,worker,&a,0,0);if(!t1||!t2)return 13;WaitForSingleObject(t1,INFINITE);WaitForSingleObject(t2,INFINITE);GetExitCodeThread(t1,&w1);GetExitCodeThread(t2,&w2);CloseHandle(t1);CloseHandle(t2);printf("TWO_THREAD_ZERO loops_each=%d fail=%ld rc1=%lu rc2=%lu stat=%u\n",a.loops,fail,w1,w2,(unsigned)stat());if(fail||w1||w2||stat()!=1)return 20;for(i=0;i<2000;i++){fini();if(stat()!=0)return 21;memset(product,0,sizeof(product));if(!init(product,lic)||stat()!=1)return 22;}printf("LIFECYCLE_CYCLES=2000 PASS\n");a.loops=100000;t1=CreateThread(0,0,worker,&a,0,0);t2=CreateThread(0,0,worker,&a,0,0);if(!t1||!t2)return 14;WaitForSingleObject(t1,INFINITE);WaitForSingleObject(t2,INFINITE);GetExitCodeThread(t1,&w1);GetExitCodeThread(t2,&w2);CloseHandle(t1);CloseHandle(t2);printf("LONG_ZERO_STABILITY total_calls=200000 fail=%ld rc1=%lu rc2=%lu stat=%u\n",fail,w1,w2,(unsigned)stat());if(fail||w1||w2||stat()!=1)return 23;fini();if(stat()!=0)return 24;FreeLibrary(m);puts("ALL_NATIVE_CONCURRENCY_STRESS_PASS");return 0;}
          EOF
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Build and run corrected stress
        shell: cmd
        working-directory: payload
        run: |
          cl /nologo /W4 /O2 /MT stress_v15.c /Fe:StressV15.exe > ..\stress_build.txt 2>&1
          if errorlevel 1 (type ..\stress_build.txt & exit /b 50)
          StressV15.exe > ..\stress_v15.txt 2>&1
          set RC=%ERRORLEVEL%
          type ..\stress_v15.txt
          exit /b %RC%
      - name: Validate stress sentinel
        shell: cmd
        run: |
          findstr /C:"ALL_NATIVE_CONCURRENCY_STRESS_PASS" stress_v15.txt > nul
          if errorlevel 1 exit /b 60
          echo NATIVE_WINDOWS_TWO_THREAD_LIFECYCLE_LONG_STABILITY_PASS
          exit /b 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-stackfix-stress-v15-evidence
          path: |
            fixed_sha.txt
            stress_build.txt
            stress_v15.txt
          retention-days: 2
          if-no-files-found: ignore
      - name: Cleanup
        if: always()
        run: |
          set +e
          git fetch origin main; git reset --hard origin/main; rm -rf .stackfix_stress_v15_handoff; git add -A .stackfix_stress_v15_handoff
          if ! git diff --cached --quiet; then git commit -m "Remove stress v15 handoff"; for i in $(seq 1 5); do git push origin HEAD:main && break; git pull --rebase origin main || break; done; fi
          rm -rf payload; rm -f "$RUNNER_TEMP/private.pem" "$RUNNER_TEMP/pass.txt" "$RUNNER_TEMP/key.enc" "$RUNNER_TEMP/payload.enc" "$RUNNER_TEMP/payload.enc.b64" "$RUNNER_TEMP/payload.tar.xz" "$RUNNER_TEMP/fix.py"
