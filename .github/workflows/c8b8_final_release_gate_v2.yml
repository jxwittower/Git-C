name: c8b8-final-release-gate-v2
on:
  push:
    branches: [c8b8-final-release-gate-20260809]
    paths:
      - '.github/workflows/c8b8_final_release_gate_v2.yml'
permissions:
  contents: write
jobs:
  final-release-v2:
    runs-on: windows-2022
    timeout-minutes: 110
    env:
      CAND_SHA: c8b8f49620b45707f80f47a9fadf14db376a115bc6052517e9243e0cb2dc20e9
      HOST_SHA: 081c4c62d2bf377913eb2aca0cc3cf3bf656350c8abaa3aaf11d171dac604804
      C63_SHA: 56c02d18a9ee68a7ae14c4601e4ba24f7af170c6db01ea21fbff91cbe6b082fb
      SMOKE_SHA: a9cc5cf614114c9481073669a3fd5d7ef5e1a1adce7e0fdc3f62824e0d50431d
      ENC_SHA: 3cbe4e8339d3f934a1766a66e48a6ca794c32a262f768f43e6b9548d5276b5d9
      XZ_SHA: eace407afd906df9409b8e5e8c116d0f6a6e47ec398c19034b2981f1fbf8d93b
      GHF_COUNT: '13'
      GHF_BYTES: '82484656'
      HANDOFF_BRANCH: c8b8-final-release-gate-20260809
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Publish V2 one-time mailbox and RSA key
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          @'
          import json,os,secrets,string,urllib.request
          from pathlib import Path
          def rq(method,url,obj=None,token=None):
              data=None if obj is None else json.dumps(obj).encode();h={'Accept':'application/json'}
              if data is not None:h['Content-Type']='application/json'
              if token:h['Authorization']='Bearer '+token
              r=urllib.request.Request(url,data=data,method=method,headers=h)
              with urllib.request.urlopen(r,timeout=30) as x:return json.load(x)
          base='https://api.mail.tm';d=rq('GET',base+'/domains');m=d if isinstance(d,list) else d.get('hydra:member',[])
          if not m:raise SystemExit('MAIL_DOMAIN_FAIL')
          a=string.ascii_lowercase+string.digits;addr='ghc8v2'+''.join(secrets.choice(a) for _ in range(16))+'@'+m[0]['domain'];pw=''.join(secrets.choice(string.ascii_letters+string.digits+'-_') for _ in range(40))
          rq('POST',base+'/accounts',{'address':addr,'password':pw});tok=rq('POST',base+'/token',{'address':addr,'password':pw})['token']
          Path(os.environ['RUNNER_TEMP'],'mail_v2.json').write_text(json.dumps({'address':addr,'token':tok}));Path('mailbox_v2.txt').write_text(addr+'\n');Path('subject_v2.txt').write_text('GuanHu-C8B8-FINALV2-'+os.environ['GITHUB_RUN_ID']+'\n')
          print('FINAL_V2_MAILBOX_READY',addr)
          '@ | Set-Content -Encoding ascii $env:RUNNER_TEMP\mail_v2.py
          python $env:RUNNER_TEMP\mail_v2.py
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out $env:RUNNER_TEMP\private_v2.pem
          if($LASTEXITCODE -ne 0){throw 'RSA_GEN_FAIL'}
          openssl pkey -in $env:RUNNER_TEMP\private_v2.pem -pubout -out public_v2.pem
          if($LASTEXITCODE -ne 0){throw 'RSA_PUB_FAIL'}
          New-Item -ItemType Directory -Force .c8b8_final_v2_handoff|Out-Null
          Copy-Item mailbox_v2.txt,subject_v2.txt,public_v2.pem .c8b8_final_v2_handoff\ -Force
          git config user.name windows-dll-test-bot;git config user.email windows-dll-test-bot@users.noreply.github.com;git add .c8b8_final_v2_handoff;git commit -m "Publish c8b8 final V2 handoff";if($LASTEXITCODE -ne 0){throw 'HANDOFF_COMMIT_FAIL'};git push origin "HEAD:$env:HANDOFF_BRANCH";if($LASTEXITCODE -ne 0){throw 'HANDOFF_PUSH_FAIL'}

      - name: Receive V2 four encrypted chunks
        shell: powershell
        timeout-minutes: 30
        run: |
          $ErrorActionPreference='Stop'
          @'
          import json,os,time,urllib.request,urllib.parse
          from pathlib import Path
          c=json.loads(Path(os.environ['RUNNER_TEMP'],'mail_v2.json').read_text());tok=c['token'];base='https://api.mail.tm';prefix=Path('subject_v2.txt').read_text().strip();out=Path('transport_v2');out.mkdir(exist_ok=True);want={f'{prefix}-P{i}':i for i in range(1,5)};got=set();key=False;seen=set()
          def j(u):
              r=urllib.request.Request(u,headers={'Accept':'application/json','Authorization':'Bearer '+tok});
              with urllib.request.urlopen(r,timeout=30) as x:return json.load(x)
          def b(u):
              r=urllib.request.Request(u,headers={'Authorization':'Bearer '+tok});
              with urllib.request.urlopen(r,timeout=120) as x:return x.read()
          end=time.time()+1500
          while time.time()<end and (len(got)<4 or not key):
              q=j(base+'/messages');items=q if isinstance(q,list) else q.get('hydra:member',[])
              for x in items:
                  s=x.get('subject','');mid=x.get('id')
                  if s not in want or mid in seen:continue
                  seen.add(mid);d=j(base+'/messages/'+mid);i=want[s]
                  for a in d.get('attachments',[]):
                      n=a.get('filename','');u=a.get('downloadUrl')
                      if not u:continue
                      z=b(urllib.parse.urljoin(base,u))
                      if n==f'c8b8_payload_part{i}.bin':(out/n).write_bytes(z);got.add(i)
                      elif n=='c8b8_wrapped_key.bin':(out/n).write_bytes(z);key=True
              if len(got)<4 or not key:time.sleep(4)
          if len(got)!=4 or not key:raise SystemExit(f'V2_TRANSPORT_FAIL {sorted(got)} key={key}')
          print('V2_TRANSPORT_PASS')
          '@ | Set-Content -Encoding ascii $env:RUNNER_TEMP\recv_v2.py
          python $env:RUNNER_TEMP\recv_v2.py 2>&1 | Tee-Object transport_v2.log
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}

      - name: V2 reassemble and decrypt only
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';$enc=Join-Path $env:RUNNER_TEMP payload_v2.enc;$o=[IO.File]::Create($enc);try{1..4|%{$s=[IO.File]::OpenRead("transport_v2\c8b8_payload_part$_.bin");try{$s.CopyTo($o)}finally{$s.Dispose()}}}finally{$o.Dispose()}
          $h=(Get-FileHash $enc -Algorithm SHA256).Hash.ToLowerInvariant();if($h -ne $env:ENC_SHA){throw "ENC_SHA_FAIL $h"};if((Get-Item transport_v2\c8b8_wrapped_key.bin).Length -ne 384){throw 'KEY_SIZE_FAIL'}
          $pass=Join-Path $env:RUNNER_TEMP pass_v2.txt;$xz=Join-Path $env:RUNNER_TEMP payload_v2.tar.xz
          openssl pkeyutl -decrypt -inkey $env:RUNNER_TEMP\private_v2.pem -in transport_v2\c8b8_wrapped_key.bin -out $pass -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256;if($LASTEXITCODE -ne 0){throw 'UNWRAP_FAIL'}
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in $enc -out $xz -pass "file:$pass";if($LASTEXITCODE -ne 0){throw 'DECRYPT_FAIL'}
          $x=(Get-FileHash $xz -Algorithm SHA256).Hash.ToLowerInvariant();if($x -ne $env:XZ_SHA){throw "XZ_SHA_FAIL $x"};"ENC_SHA=$h`nXZ_SHA=$x"|Set-Content crypto_v2.txt;Write-Host V2_CRYPTO_PASS

      - name: V2 Python XZ tar extraction
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          @'
          import os,tarfile,shutil
          from pathlib import Path
          dst=Path('payload');shutil.rmtree(dst,ignore_errors=True);dst.mkdir()
          xz=Path(os.environ['RUNNER_TEMP'])/'payload_v2.tar.xz'
          with tarfile.open(xz,'r:xz') as t:
              members=t.getmembers();print('TAR_MEMBERS',len(members));t.extractall(dst)
          print('PYTHON_XZ_EXTRACT_PASS')
          '@ | Set-Content -Encoding ascii $env:RUNNER_TEMP\extract_v2.py
          python $env:RUNNER_TEMP\extract_v2.py 2>&1 | Tee-Object extract_v2.log
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}

      - name: V2 exact manifest and asset binding
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          @'
          import hashlib,os,re,sys
          from pathlib import Path
          root=Path('payload')
          def sha(p):
              h=hashlib.sha256()
              with open(p,'rb') as f:
                  for b in iter(lambda:f.read(1<<20),b''):h.update(b)
              return h.hexdigest()
          exact={'SigProcDll-64HF.dll':os.environ['CAND_SHA'],'HostCompat.dll':os.environ['HOST_SHA'],'C63.dll':os.environ['C63_SHA'],'SigProcLoaderContractSmoke.exe':os.environ['SMOKE_SHA']}
          for n,e in exact.items():
              p=root/n
              if not p.is_file():raise SystemExit('MISSING_'+n)
              h=sha(p)
              if h!=e:raise SystemExit(f'EXACT_SHA_FAIL {n} {h}')
          lines=(root/'MANIFEST.sha256').read_text().splitlines();ok=0
          for line in lines:
              m=re.match(r'^([0-9a-f]{64})  (.+)$',line)
              if not m:continue
              rel=m.group(2)
              if rel.startswith('./'):rel=rel[2:]
              p=root/rel
              if not p.is_file():raise SystemExit('MANIFEST_MISSING '+rel)
              h=sha(p)
              if h!=m.group(1):raise SystemExit(f'MANIFEST_SHA_FAIL {rel} {h}')
              ok+=1
          ghf=list((root/'testdata').rglob('*.ghf'));b=sum(p.stat().st_size for p in ghf)
          if len(ghf)!=int(os.environ['GHF_COUNT']) or b!=int(os.environ['GHF_BYTES']):raise SystemExit(f'GHF_BIND_FAIL count={len(ghf)} bytes={b}')
          Path('asset_binding_v2.txt').write_text(f'MANIFEST_FILES={ok}\nGHF_COUNT={len(ghf)}\nGHF_BYTES={b}\nCAND_SHA={os.environ["CAND_SHA"]}\n')
          print('V2_ASSET_BINDING_PASS',ok,len(ghf),b)
          '@ | Set-Content -Encoding ascii $env:RUNNER_TEMP\bind_v2.py
          python $env:RUNNER_TEMP\bind_v2.py 2>&1 | Tee-Object bind_v2.log
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: V2 PE ABI and stack-probe static gate
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';dumpbin /headers payload\SigProcDll-64HF.dll|Out-File pe_v2_headers.txt;dumpbin /exports payload\SigProcDll-64HF.dll|Out-File pe_v2_exports.txt;dumpbin /dependents payload\SigProcDll-64HF.dll|Out-File pe_v2_canddeps.txt;dumpbin /dependents payload\HostCompat.dll|Out-File pe_v2_hostdeps.txt
          @'
          import re,struct
          from pathlib import Path
          h=Path('pe_v2_headers.txt').read_text(errors='ignore');e=Path('pe_v2_exports.txt').read_text(errors='ignore')
          if not re.search(r'(?i)14C machine|machine \(x86\)',h):raise SystemExit('NOT_X86')
          if '.stkfix' not in h:raise SystemExit('NO_STKFIX')
          for x in ['_SigProc@24','_SigProc_Fini@0','_SigProc_Init@8','_SigProc_Stat@0']:
              if x not in e:raise SystemExit('EXPORT_MISSING '+x)
          def deps(p):return {x.lower() for x in re.findall(r'(?im)^\s*([A-Za-z0-9_.-]+\.dll)\s*$',Path(p).read_text(errors='ignore'))}
          c=deps('pe_v2_canddeps.txt');hb=deps('pe_v2_hostdeps.txt')
          if 'ucrtbase.dll' in c:raise SystemExit('DIRECT_UCRTBASE')
          if c-hb:raise SystemExit('IMPORT_EXTRA '+','.join(sorted(c-hb)))
          b=Path('payload/SigProcDll-64HF.dll').read_bytes();pe=struct.unpack_from('<I',b,0x3c)[0];n=struct.unpack_from('<H',b,pe+6)[0];osz=struct.unpack_from('<H',b,pe+20)[0];s0=pe+24+osz;bad=[]
          for i in range(n):
              o=s0+40*i;rs=struct.unpack_from('<I',b,o+16)[0];rp=struct.unpack_from('<I',b,o+20)[0];ch=struct.unpack_from('<I',b,o+36)[0]
              if ch&0x20000000:
                  for p in range(rp,rp+rs-6):
                      if b[p:p+2]==b'\x81\xec':
                          z=struct.unpack_from('<I',b,p+2)[0]
                          if 0x1000<=z<0x100000:bad.append((p,z))
          if bad:raise SystemExit('UNSAFE_STACK '+repr(bad))
          Path('static_v2.txt').write_text('V2_PE_EXPORT_IMPORT_STACK_PASS\n');print('V2_STATIC_PASS')
          '@ | Set-Content -Encoding ascii $env:RUNNER_TEMP\static_v2.py
          python $env:RUNNER_TEMP\static_v2.py;if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}

      - name: V2 loader contracts both runtime layouts
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          foreach($bed in @('inner-bed','outer-medical-bed')){$tag=if($bed -eq 'inner-bed'){'inner'}else{'outer'};$d="smoke_v2_$tag";New-Item -ItemType Directory -Force $d|Out-Null;Copy-Item payload\SigProcDll-64HF.dll,payload\SigProcLoaderContractSmoke.exe $d -Force;Copy-Item "payload\runtime\$bed\*" $d -Force;Push-Location $d;& .\SigProcLoaderContractSmoke.exe 2>&1|Tee-Object "..\loader_v2_$tag.log";$r=$LASTEXITCODE;Pop-Location;if($r -ne 0){throw "LOADER_$tag`_EXIT_$r"};if((Get-Content "loader_v2_$tag.log" -Raw) -notmatch 'ALL_LOADER_CONTRACT_TESTS_PASS'){throw "LOADER_$tag`_MARKER"}}
          'V2_INNER_OUTER_LOADER_PASS'|Set-Content loader_v2_pass.txt

      - name: V2 compile x86 full regression
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';cl /nologo /O2 /W3 /MT /D_CRT_SECURE_NO_WARNINGS payload\fullreg.c /Fe:payload\fullreg.exe 2>&1|Tee-Object compile_v2.log;if($LASTEXITCODE -ne 0){throw 'COMPILE_FAIL'};dumpbin /headers payload\fullreg.exe|Out-File fullreg_v2_headers.txt;if((Get-Content fullreg_v2_headers.txt -Raw)-notmatch '(?i)14C machine|machine \(x86\)'){throw 'HARNESS_NOT_X86'}

      - name: V2 execute complete native Windows regression
        shell: powershell
        timeout-minutes: 75
        run: |
          $ErrorActionPreference='Stop';$c=(Resolve-Path payload\SigProcDll-64HF.dll).Path;$h=(Resolve-Path payload\HostCompat.dll).Path;$b=(Resolve-Path payload\C63.dll).Path;$t=(Resolve-Path payload\testdata).Path;$r=(Resolve-Path payload\runtime).Path;& .\payload\fullreg.exe $c $h $b $t $r 2>&1|Tee-Object fullreg_v2.log;$rc=$LASTEXITCODE;"EXIT=$rc"|Set-Content fullreg_v2_exit.txt;if($rc -ne 0){throw "FULLREG_EXIT_$rc"};$s=Get-Content fullreg_v2.log -Raw;foreach($m in @('BASELINE_CONTRACTS_PASS','SEQ_TARGETS_VITAL_SUPPRESSION_RECOVERY_PASS','FULL_DATA_PERFORMANCE_PASS','DETERMINISTIC_REPLAY_PASS','LONG_STABILITY_PASS loops=20000','TWO_THREAD_STRESS_PASS threads=2 loops_each=2000','REALTIME_1HZ_PASS frames=60','COMPLETE_NATIVE_WINDOWS_REGRESSION_PASS')){if($s -notmatch [regex]::Escape($m)){throw "MARKER_MISSING $m"}};$z=(Get-FileHash payload\SigProcDll-64HF.dll -Algorithm SHA256).Hash.ToLowerInvariant();if($z -ne $env:CAND_SHA){throw 'SHA_DRIFT'};"C8B8_FINAL_V2_PASS`nEXACT_SHA=$z"|Set-Content C8B8_FINAL_V2_PASS.lock

      - name: V2 build and independently audit release ZIP
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';New-Item -ItemType Directory -Force release_v2|Out-Null;Copy-Item payload\SigProcDll-64HF.dll release_v2\SigProcDll-64HF.dll -Force;"$env:CAND_SHA  SigProcDll-64HF.dll"|Set-Content release_v2\RELEASE_SHA256SUMS.txt;Copy-Item fullreg_v2.log release_v2\full_regression.log -Force;"WINDOWS_NATIVE_FULLREG_PASS`nSHA256=$env:CAND_SHA`nRUN_ID=$env:GITHUB_RUN_ID"|Set-Content release_v2\PASS.txt;$zip='GuanHu_SigProc_Final_Release_20260809.zip';Remove-Item $zip -Force -ErrorAction SilentlyContinue;Compress-Archive release_v2\* $zip -CompressionLevel Optimal;Remove-Item audit_v2 -Recurse -Force -ErrorAction SilentlyContinue;Expand-Archive $zip audit_v2 -Force;$p='audit_v2\SigProcDll-64HF.dll';if((Get-Item $p).Length -ne 441344){throw 'ZIP_DLL_SIZE'};$a=(Get-FileHash $p -Algorithm SHA256).Hash.ToLowerInvariant();$o=(Get-FileHash payload\SigProcDll-64HF.dll -Algorithm SHA256).Hash.ToLowerInvariant();if($a -ne $env:CAND_SHA -or $o -ne $a){throw "ZIP_SHA_FAIL orig=$o audit=$a"};"PACKAGE_AUDIT_PASS`nTESTED_SHA=$o`nEXTRACTED_SHA=$a`nDLL_BYTES=441344`nZIP_BYTES=$((Get-Item $zip).Length)"|Set-Content package_v2_audit.txt

      - name: V2 persist release PASS lock
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';New-Item -ItemType Directory -Force .c8b8_final_v2_release|Out-Null;Copy-Item C8B8_FINAL_V2_PASS.lock,package_v2_audit.txt .c8b8_final_v2_release\ -Force;git config user.name windows-dll-test-bot;git config user.email windows-dll-test-bot@users.noreply.github.com;git add .c8b8_final_v2_release;git commit -m "Record c8b8 final V2 release PASS";if($LASTEXITCODE -ne 0){throw 'PASS_COMMIT_FAIL'};git push origin "HEAD:$env:HANDOFF_BRANCH";if($LASTEXITCODE -ne 0){throw 'PASS_PUSH_FAIL'}

      - name: V2 upload exact tested DLL ZIP and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guanhu-c8b8-final-v2-${{ github.run_id }}
          path: |
            GuanHu_SigProc_Final_Release_20260809.zip
            release_v2/SigProcDll-64HF.dll
            C8B8_FINAL_V2_PASS.lock
            package_v2_audit.txt
            asset_binding_v2.txt
            crypto_v2.txt
            extract_v2.log
            bind_v2.log
            static_v2.txt
            loader_v2_inner.log
            loader_v2_outer.log
            compile_v2.log
            fullreg_v2.log
            fullreg_v2_exit.txt
            transport_v2.log
          if-no-files-found: ignore
          retention-days: 14
