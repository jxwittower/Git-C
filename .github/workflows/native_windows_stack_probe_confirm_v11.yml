name: native-windows-stack-probe-confirm-v11

on:
  push:
    paths:
      - '.github/workflows/native_windows_stack_probe_confirm_v11.yml'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  confirm:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 0
      - name: Publish one-time RSA key
        run: |
          set -euo pipefail
          git fetch origin main; git reset --hard origin/main
          rm -rf .stack_probe_v11_handoff; mkdir -p .stack_probe_v11_handoff
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$RUNNER_TEMP/private.pem"
          openssl pkey -in "$RUNNER_TEMP/private.pem" -pubout -out .stack_probe_v11_handoff/public.pem
          git config user.name windows-dll-test-bot; git config user.email windows-dll-test-bot@users.noreply.github.com
          git add .stack_probe_v11_handoff/public.pem; git commit -m "Publish one-time RSA key for stack probe v11"
          for i in $(seq 1 5); do git push origin HEAD:main && exit 0; git pull --rebase origin main; done; exit 19
      - name: Receive wrapped key
        run: |
          set -euo pipefail
          ok=0; for i in $(seq 1 300); do git pull --ff-only origin main >/dev/null 2>&1 || true; if [ -s .stack_probe_v11_handoff/key.enc.b64 ]; then ok=1; break; fi; sleep 2; done
          [ "$ok" = 1 ] || exit 20
          tr -d '[:space:]' < .stack_probe_v11_handoff/key.enc.b64 | base64 -d > "$RUNNER_TEMP/key.enc"
          openssl pkeyutl -decrypt -inkey "$RUNNER_TEMP/private.pem" -in "$RUNNER_TEMP/key.enc" -out "$RUNNER_TEMP/pass.txt" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
      - name: Recover exact candidate payload
        run: |
          set -euo pipefail
          rt=$(cygpath -u "$RUNNER_TEMP"); REF=447f0ed3d653c425e7e603638f1ebae1d132ead8; p64="$RUNNER_TEMP/payload.enc.b64"; : > "$p64"
          for p in chunk_00 chunk_01 chunk_02 chunk_03 chunk_04 chunk_05 chunk_06 chunk_07 chunk_08 chunk_09 chunk_10 chunk_11 chunk_12fix_00 chunk_12fix_01 chunk_12fix_02 chunk_12fix_03_00 chunk_12fix_03_01 chunk_12fix_03_02 chunk_12fix_03_03 chunk_12fix_03_04 chunk_12b; do git show "$REF:.recovered_payload/$p" >> "$p64"; done
          base64 -d "$p64" > "$RUNNER_TEMP/payload.enc"
          [ "$(sha256sum < "$RUNNER_TEMP/payload.enc" | awk '{print $1}')" = 49087efe5f8506eaa1ba8ed42196678019220ac1db0847ac5ae5ea140796d4a3 ] || exit 31
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in "$RUNNER_TEMP/payload.enc" -out "$RUNNER_TEMP/payload.tar.xz" -pass file:"$RUNNER_TEMP/pass.txt"
          rm -rf payload; mkdir payload; tar -xJf "$rt/payload.tar.xz" -C payload
          [ "$(sha256sum -b payload/SigProcDll-64HF.dll | awk '{print $1}')" = 081c4c62d2bf377913eb2aca0cc3cf3bf656350c8abaa3aaf11d171dac604804 ] || exit 32
          rm -f "$RUNNER_TEMP/pass.txt" "$RUNNER_TEMP/key.enc" "$RUNNER_TEMP/payload.enc" "$RUNNER_TEMP/payload.enc.b64" "$RUNNER_TEMP/payload.tar.xz"
      - name: Write stack-commit confirmation probe
        run: |
          cat > payload/stack_probe_v11.c <<'EOF'
          #include <windows.h>
          #include <stdint.h>
          typedef void (__cdecl *CtxVoidFn)(void *); typedef void (__cdecl *LoadFiltersFn)(void *); typedef int (__cdecl *LoadParamFn)(void *,const char *); typedef int (__cdecl *LoadBedFn)(void *,const char *);
          static void out(const char*s){DWORD n=0,w=0;HANDLE h=GetStdHandle(STD_OUTPUT_HANDLE);while(s[n])++n;WriteFile(h,s,n,&w,0);} static void od(const char*t,unsigned v){char b[64],x[16];DWORD i=0,j=0,k;while(t[i]){b[i]=t[i];++i;}do{x[j++]=(char)('0'+v%10u);v/=10u;}while(v);for(k=0;k<j;k++)b[i++]=x[j-1-k];b[i++]='\r';b[i++]='\n';b[i]=0;out(b);}
          __declspec(noinline) static void precommit_stack(void){volatile unsigned char b[131072]; unsigned i; for(i=0;i<sizeof(b);i+=4096)b[i]=(unsigned char)i; b[sizeof(b)-1]=1;}
          int main(void){HMODULE m=LoadLibraryA("SigProcDll-64HF.dll");uintptr_t base=(uintptr_t)m;void*ctx;CtxVoidFn r,i;LoadFiltersFn f;LoadParamFn p;LoadBedFn b;int rc;if(!m)return 10;ctx=(void*)(base+0x6b040u);r=(CtxVoidFn)(base+0x3c00u);i=(CtxVoidFn)(base+0x3f80u);f=(LoadFiltersFn)(base+0x3f90u);p=(LoadParamFn)(base+0x2930u);b=(LoadBedFn)(base+0x4040u);out("SETUP_RESET\r\n");r(ctx);i(ctx);f(ctx);rc=p(ctx,"file_sig");od("PARAM_RC=",(unsigned)rc);out("PRECOMMIT_128KB_STACK\r\n");precommit_stack();out("CALL_BED_MODEL_AFTER_PRECOMMIT\r\n");rc=b(ctx,"file_bed_model_v1");out("BED_MODEL_RETURNED\r\n");od("BED_RC=",(unsigned)rc);return rc==1?0:40;}
          EOF
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Build confirmation probe
        shell: cmd
        working-directory: payload
        run: |
          cl /nologo /W4 /O2 /MT /GS- stack_probe_v11.c /Fe:StackProbeV11.exe > ..\stack_probe_build.txt 2>&1
          if errorlevel 1 (type ..\stack_probe_build.txt & exit /b 50)
      - name: Run confirmation probe
        shell: cmd
        working-directory: payload
        run: |
          StackProbeV11.exe > ..\stack_probe_v11.txt 2>&1
          set RC=%ERRORLEVEL%
          type ..\stack_probe_v11.txt
          echo %RC%>..\stack_probe_v11_rc.txt
          echo PROBE_RC=%RC%
          exit /b 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stack-probe-v11-evidence
          path: |
            stack_probe_build.txt
            stack_probe_v11.txt
            stack_probe_v11_rc.txt
          retention-days: 2
          if-no-files-found: ignore
      - name: Cleanup
        if: always()
        run: |
          set +e
          git fetch origin main; git reset --hard origin/main; rm -rf .stack_probe_v11_handoff; git add -A .stack_probe_v11_handoff
          if ! git diff --cached --quiet; then git commit -m "Remove stack probe v11 handoff"; for i in $(seq 1 5); do git push origin HEAD:main && break; git pull --rebase origin main || break; done; fi
          rm -rf payload; rm -f "$RUNNER_TEMP/private.pem" "$RUNNER_TEMP/pass.txt" "$RUNNER_TEMP/key.enc" "$RUNNER_TEMP/payload.enc" "$RUNNER_TEMP/payload.enc.b64" "$RUNNER_TEMP/payload.tar.xz"
