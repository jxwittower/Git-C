name: BLCU portal real traversal

on:
  push:
    branches: [blcu-site-audit]
    paths:
      - 'tools/blcu_audit/portal_real_traversal.py'
      - '.github/workflows/blcu-portal-real-traversal.yml'
  workflow_dispatch:

jobs:
  traverse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CJK fonts and Playwright Python package
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f
          pip install playwright
      - name: Traverse portal and all resource/application pages
        run: python tools/blcu_audit/portal_real_traversal.py
      - name: Pack evidence
        if: always()
        run: python -c "import shutil, pathlib; p=pathlib.Path('blcu_portal_output'); p.exists() and shutil.make_archive('BLCU_portal_real_traversal','zip',p)"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BLCU-portal-real-traversal-CJK
          path: |
            blcu_portal_output/**
            BLCU_portal_real_traversal.zip
          if-no-files-found: warn
          retention-days: 7
