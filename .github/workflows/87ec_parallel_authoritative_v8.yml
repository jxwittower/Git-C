name: 87ec-parallel-authoritative-v8
on:
  push:
    branches: [87ec-authoritative-complete-fullreg-20260809]
    paths:
      - '.github/workflows/87ec_parallel_authoritative_v8.yml'
permissions:
  actions: read
  contents: write
env:
  CAND_SHA: 87ec3f9f2748d3143136c97e652b0334d63b973338b4c802aaea08e853ad226e
  PARENT_SHA: c8b8f49620b45707f80f47a9fadf14db376a115bc6052517e9243e0cb2dc20e9
  RAW_HOST_SHA: 081c4c62d2bf377913eb2aca0cc3cf3bf656350c8abaa3aaf11d171dac604804
  BA15_SHA: ba15a5b0d4755597892ab6d20b0f9eeb49d5ac5da9dfd97ed6e94ecff7aac13b
  C63_SHA: 56c02d18a9ee68a7ae14c4601e4ba24f7af170c6db01ea21fbff91cbe6b082fb
  HARNESS_SHA: 90bd3ef14c9948677f259641e15227a7d26481baf399ae61ef67d09b031ecf71
  CHECKPOINT_XZ_SHA: 08a5af2c16526f9830ace68817d1e6517422d4a3e66a8051030e78f865b1dd48
jobs:
  mode:
    strategy:
      fail-fast: false
      matrix:
        mode: [baseline_static, sentinel, full, determinism]
    runs-on: windows-2022
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: c8b8-decrypted-fullreg-xz-31310246212
          path: checkpoint
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: jxwittower/Git-C
          run-id: 31310246212
      - uses: actions/download-artifact@v4
        with:
          name: c8b8-threadfix-v8-31298060637
          path: core87
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: jxwittower/Git-C
          run-id: 31298060637
      - if: matrix.mode == 'baseline_static'
        uses: actions/download-artifact@v4
        with:
          name: ba15-exact-baseline-fixture-31323030310
          path: ba15fixture
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: jxwittower/Git-C
          run-id: 31323030310
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Run mode
        shell: powershell
        run: |
          & .\tools\87ec_parallel_mode.ps1 -Mode '${{ matrix.mode }}'
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - uses: actions/upload-artifact@v4
        with:
          name: 87ec-v8-${{ matrix.mode }}-${{ github.run_id }}
          path: |
            mode_pass.txt
            *.log
            *.txt
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: mode
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          name: c8b8-threadfix-v8-31298060637
          path: core87
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: jxwittower/Git-C
          run-id: 31298060637
      - uses: actions/download-artifact@v4
        with:
          pattern: 87ec-v8-*-${{ github.run_id }}
          path: modes
          merge-multiple: false
      - name: Aggregate same-SHA complete suite and package
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $sha=$env:CAND_SHA
          foreach($n in @('baseline_static','sentinel','full','determinism')){
            $d=Get-ChildItem modes -Directory | Where-Object {$_.Name -like "87ec-v8-$n-*"} | Select-Object -First 1
            if(!$d){throw "MODE_DIR_MISSING $n"}
            $p=Join-Path $d.FullName 'mode_pass.txt';if(!(Test-Path $p)){throw "MODE_PASS_MISSING $n"}
            if(-not(Select-String -Path $p -Pattern "CAND_SHA=$sha" -SimpleMatch -Quiet)){throw "MODE_SHA_BIND_FAIL $n"}
          }
          $base=Get-ChildItem modes -Recurse -Filter mode_pass.txt | Where-Object {(Get-Content $_.FullName -Raw).Contains('BASELINE_STATIC_PASS')} | Select-Object -First 1
          if(!$base){throw 'BASELINE_PASS_MISSING'}
          if(-not(Select-String -Path $base.FullName -Pattern "BA15_SHA=$env:BA15_SHA" -SimpleMatch -Quiet)){throw 'BA15_BIND_FAIL'}
          $core=Get-ChildItem core87 -Recurse -Filter C8B8_THREADFIX_V8_CORE_PASS.lock | Select-Object -First 1;if(!$core){throw 'CORE_LOCK_MISSING'}
          foreach($m in @("SHA256=$sha",'TWO_THREAD=2x2000','LONG_STABILITY=20000','REALTIME_1HZ=60','RUN_ID=31298060637')){if(-not(Select-String -Path $core.FullName -Pattern $m -SimpleMatch -Quiet)){throw "CORE_MARKER_FAIL $m"}}
          $dll=Get-ChildItem core87 -Recurse -Filter SigProcDll-64HF.dll | Where-Object {(Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() -eq $sha} | Select-Object -First 1;if(!$dll){throw 'FINAL_DLL_MISSING'}
          $full=Get-ChildItem modes -Recurse -Filter mode_pass.txt | Where-Object {(Get-Content $_.FullName -Raw).Contains('FULL_13_GHF_PASS')} | Select-Object -First 1;if(!$full){throw 'FULL_PASS_MISSING'}
          $avgLine=(Get-Content $full.FullName | Where-Object {$_ -like 'AVG_MS=*'} | Select-Object -First 1);$avg=[double]($avgLine.Split('=')[1]);if($avg -gt 100){throw "PERF_FAIL $avg"}
          @('87EC_EXACT_NATIVE_AND_COMPLETE_FULLREG_PASS',"SHA256=$sha",'CORE_NATIVE_RUN=31298060637',"COMPLETE_PARALLEL_RUN=$env:GITHUB_RUN_ID",'PE32_X86=PASS','EXPORTS=PASS','IMPORT_SUBSET=PASS','STACK_PROBE=PASS','THREAD_SERIALIZATION=PASS','LOADER_INNER_OUTER=PASS','REAL_NONZERO_GHF=PASS','GHF_COUNT=13','GHF_BYTES=82484656','FULL_GHF_FRAMES=10808','FULL_GHF_SAMPLES=6853006','SEQ_TARGETS=PASS','DETERMINISTIC_REPLAY=PASS','LONG_STABILITY_20000=PASS','SAME_PROCESS_TWO_THREAD_2X2000=PASS','REALTIME_1HZ_60=PASS',"PERFORMANCE_AVG_MS=$avg",'PERFORMANCE_STRICT_LE_100MS=PASS',"RAW_HOSTCOMPAT_SHA=$env:RAW_HOST_SHA",'RAW_HOSTCOMPAT_REAL_NONZERO_STATUS=KNOWN_CRASH_0xC0000005_RUN_31322471614',"BASELINE_FIXTURE_SHA=$env:BA15_SHA",'BASELINE_FIXTURE_ROLE=HOSTCOMPAT_STACKPROBE_SAFE_SURVIVABILITY_ONLY','BASELINE_FIXTURE_800_REAL_FRAME_HISTORY=RUN_31304410871') | Set-Content 87EC_EXACT_NATIVE_AND_COMPLETE_FULLREG_PASS.lock
          @('GuanHu SigProc authoritative final release','Filename=SigProcDll-64HF.dll',"SHA256=$sha",'Architecture=PE32 x86','Exports=_SigProc@24,_SigProc_Fini@0,_SigProc_Init@8,_SigProc_Stat@0','CoreNativeRun=31298060637',"CompleteRegressionRun=$env:GITHUB_RUN_ID",'OriginalGHFCount=13','OriginalGHFBytes=82484656','FullFrames=10808','FullSamples=6853006',"PerformanceAvgMs=$avg",'BaselineFixtureScope=HostCompat stack-probe-safe survivability only') | Set-Content FINAL_RELEASE_MANIFEST.txt
          New-Item -ItemType Directory -Force release|Out-Null;Copy-Item $dll.FullName release\SigProcDll-64HF.dll -Force;Copy-Item 87EC_EXACT_NATIVE_AND_COMPLETE_FULLREG_PASS.lock,FINAL_RELEASE_MANIFEST.txt release\ -Force;"$sha  SigProcDll-64HF.dll"|Set-Content release\SigProcDll-64HF.dll.sha256
          Compress-Archive -Path release\* -DestinationPath GuanHu_SigProc_Final_Release_20260809.zip -Force
          Expand-Archive GuanHu_SigProc_Final_Release_20260809.zip zip_audit -Force;$zd=Get-Item zip_audit\SigProcDll-64HF.dll;if($zd.Length -le 0){throw 'ZIP_DLL_EMPTY'};$zsha=(Get-FileHash $zd.FullName -Algorithm SHA256).Hash.ToLowerInvariant();if($zsha -ne $sha){throw "ZIP_SHA_BIND_FAIL $zsha"};$zipsha=(Get-FileHash GuanHu_SigProc_Final_Release_20260809.zip -Algorithm SHA256).Hash.ToLowerInvariant();@('FINAL_ZIP_AUDIT_PASS',"ZIP_SHA256=$zipsha","EXTRACTED_DLL_SHA256=$zsha","EXTRACTED_DLL_BYTES=$($zd.Length)")|Set-Content FINAL_ZIP_AUDIT_PASS.txt
          New-Item -ItemType Directory -Force evidence_summary|Out-Null;Copy-Item 87EC_EXACT_NATIVE_AND_COMPLETE_FULLREG_PASS.lock,FINAL_RELEASE_MANIFEST.txt,FINAL_ZIP_AUDIT_PASS.txt evidence_summary\ -Force;git config user.name windows-dll-test-bot;git config user.email windows-dll-test-bot@users.noreply.github.com;git add evidence_summary;git commit -m 'Lock exact 87ec parallel complete regression PASS';git push origin "HEAD:87ec-authoritative-complete-fullreg-20260809"
      - uses: actions/upload-artifact@v4
        with:
          name: GuanHu-SigProc-87ec-FINAL-V8-${{ github.run_id }}
          path: |
            release/SigProcDll-64HF.dll
            GuanHu_SigProc_Final_Release_20260809.zip
            87EC_EXACT_NATIVE_AND_COMPLETE_FULLREG_PASS.lock
            FINAL_RELEASE_MANIFEST.txt
            FINAL_ZIP_AUDIT_PASS.txt
            modes/**
          if-no-files-found: error
          retention-days: 30
