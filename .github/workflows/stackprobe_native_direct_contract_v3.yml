name: stackprobe-native-direct-contract-v3
on:
  push:
    paths:
      - '.github/workflows/stackprobe_native_direct_contract_v3.yml'
permissions:
  contents: write
  actions: read
jobs:
  direct:
    runs-on: windows-2022
    timeout-minutes: 50
    env:
      BAD_SHA: 66a44c88e9c9bf011825077fcc67c6ddc78a439700add94574056eb67d54678c
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recover exact unsafe parent and runtime coefficients
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          @'
          import os,json,hashlib,zipfile,io,urllib.request,pathlib,subprocess,sys
          O=pathlib.Path('mat'); O.mkdir(exist_ok=True); BAD=os.environ['BAD_SHA']; tok=os.environ['GH_TOKEN']; repo=os.environ['GITHUB_REPOSITORY']
          H={'Authorization':f'Bearer {tok}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def sha(b):return hashlib.sha256(b).hexdigest()
          have={'bad':False,'brth':False,'hrt':False,'sig':False}
          # Git objects first.
          try:
            for ln in subprocess.check_output(['git','rev-list','--objects','--all'],text=True,errors='ignore').splitlines():
              oid=ln.split()[0]
              try:
                if subprocess.check_output(['git','cat-file','-t',oid],text=True,stderr=subprocess.DEVNULL).strip()!='blob':continue
                sz=int(subprocess.check_output(['git','cat-file','-s',oid],text=True).strip())
                if sz>5_000_000:continue
                b=subprocess.check_output(['git','cat-file','-p',oid]); bn=(' '.join(ln.split()[1:])).replace('\\','/').split('/')[-1].lower()
                if not have['bad'] and sha(b)==BAD:(O/'bad.dll').write_bytes(b);have['bad']=True;print('BAD_GIT',oid)
                if bn=='filter_brth' and not have['brth']:(O/'filter_brth').write_bytes(b);have['brth']=True
                if bn=='filter_hrt3' and not have['hrt']:(O/'filter_hrt3').write_bytes(b);have['hrt']=True
                if bn=='file_sig' and not have['sig']:(O/'file_sig').write_bytes(b);have['sig']=True
              except:pass
          except Exception as e:print('GITWARN',e)
          arts=[]
          for pg in range(1,6):
            q=urllib.request.Request(f'https://api.github.com/repos/{repo}/actions/artifacts?per_page=100&page={pg}',headers=H)
            with urllib.request.urlopen(q,timeout=30) as r:d=json.load(r)
            x=d.get('artifacts',[]);arts+=x
            if len(x)<100:break
          arts=[a for a in arts if not a.get('expired') and a.get('size_in_bytes',0)<100_000_000]
          arts.sort(key=lambda a:(0 if any(k in a['name'].lower() for k in ['native','stack','final','full','regress','v4','host'])else 1,-int(a['id'])))
          for ai,a in enumerate(arts):
            if all(have.values()):break
            if ai>180:break
            try:
              q=urllib.request.Request(a['archive_download_url'],headers=H)
              with urllib.request.urlopen(q,timeout=60) as r:zb=r.read()
              z=zipfile.ZipFile(io.BytesIO(zb))
              for n in z.namelist():
                bn=pathlib.PurePosixPath(n).name.lower()
                try:
                  b=None
                  if not have['bad'] and n.lower().endswith('.dll'):
                    b=z.read(n)
                    if sha(b)==BAD:(O/'bad.dll').write_bytes(b);have['bad']=True;print('BAD_ART',a['id'],n)
                  if bn=='filter_brth' and not have['brth']:(O/'filter_brth').write_bytes(z.read(n));have['brth']=True
                  if bn=='filter_hrt3' and not have['hrt']:(O/'filter_hrt3').write_bytes(z.read(n));have['hrt']=True
                  if bn=='file_sig' and not have['sig']:(O/'file_sig').write_bytes(z.read(n));have['sig']=True
                except:pass
            except Exception as e:print('ARTWARN',a.get('id'),str(e)[:100])
          pathlib.Path('direct_harvest.json').write_text(json.dumps(have,indent=2));print(have)
          if not all(have.values()):sys.exit(21)
          '@ | Set-Content -Encoding ascii $env:RUNNER_TEMP\h.py
          python $env:RUNNER_TEMP\h.py 2>&1 | Tee-Object direct_harvest.log
      - name: Binary-patch 12 unsafe large stack reservations
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          @'
          import struct,hashlib
          from pathlib import Path
          b=bytearray(Path('mat/bad.dll').read_bytes());u16=lambda o:struct.unpack_from('<H',b,o)[0];u32=lambda o:struct.unpack_from('<I',b,o)[0]
          def p16(o,v):struct.pack_into('<H',b,o,v)
          def p32(o,v):struct.pack_into('<I',b,o,v)
          A=lambda x,a:(x+a-1)//a*a;pe=u32(0x3c);n=u16(pe+6);osz=u16(pe+20);opt=pe+24;s0=opt+osz;sa=u32(opt+32);fa=u32(opt+36);sh=u32(opt+60)
          sec=[]
          for i in range(n):
            o=s0+40*i;sec.append((u32(o+8),u32(o+12),u32(o+16),u32(o+20),u32(o+36),o))
          vs,tva,trs,trp,_,_=max((s for s in sec if s[4]&0x20000000),key=lambda s:s[2]);sites=[]
          for x in range(trp,trp+trs-6):
            if b[x:x+2]==b'\x81\xec':
              z=u32(x+2)
              if 0x1000<=z<0x100000:sites.append((x,tva+x-trp,z))
          if len(sites)!=12:raise SystemExit(f'SITE_COUNT={len(sites)}')
          chk=bytearray(b'\x51\x8d\x4c\x24\x04\x29\xc1\x19\xc0\xf7\xd0\x21\xc1\x89\xe0\x25\x00\xf0\xff\xff');loop=len(chk);chk+=b'\x39\xc1\x72\x00';jb=len(chk)-1;chk+=b'\x89\xc8\x59\x94\x8b\x00\x89\x04\x24\xc3';probe=len(chk);chk+=b'\x2d\x00\x10\x00\x00\x85\x00\xeb\x00';jm=len(chk)-1;chk[jb]=(probe-jb-1)&255;chk[jm]=(loop-jm-1)&255
          nh=s0+40*n
          if nh+40>sh:raise SystemExit('NO_HEADER_ROOM')
          rp=A(max(s[3]+s[2] for s in sec),fa);va=A(max(s[1]+max(s[0],s[2]) for s in sec),sa);pay=bytearray(b'\x90'*120)+chk;rs=A(len(pay),fa)
          if len(b)<rp+rs:b.extend(b'\0'*(rp+rs-len(b)))
          b[rp:rp+len(pay)]=pay;cr=va+120
          for i,(x,r,z) in enumerate(sites):
            tr=va+10*i;to=rp+10*i;b[to]=0xb8;struct.pack_into('<I',b,to+1,z);b[to+5]=0xe9;struct.pack_into('<i',b,to+6,cr-(tr+10));b[x]=0xe8;struct.pack_into('<i',b,x+1,tr-(r+5));b[x+5]=0x90
          b[nh:nh+8]=b'.stkfix\0';p32(nh+8,len(pay));p32(nh+12,va);p32(nh+16,rs);p32(nh+20,rp);p32(nh+24,0);p32(nh+28,0);p16(nh+32,0);p16(nh+34,0);p32(nh+36,0x60000020);p16(pe+6,n+1);p32(opt+56,A(va+len(pay),sa));p32(opt+64,0)
          Path('SigProcDll-64HF.dll').write_bytes(b);h=hashlib.sha256(b).hexdigest();Path('direct_candidate_sha.txt').write_text(h+'\n');print('SHA',h)
          '@ | Set-Content -Encoding ascii $env:RUNNER_TEMP\p.py
          python $env:RUNNER_TEMP\p.py
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Build generic stdcall nonzero crash harness
        shell: powershell
        run: |
          @'
          #define WIN32_LEAN_AND_MEAN
          #include <windows.h>
          #include <stdio.h>
          #include <stdint.h>
          #include <string.h>
          typedef int  (__stdcall *PFN_INIT)(const char*,const char*);
          typedef int  (__stdcall *PFN_PROC)(uint32_t,const void*,void*,void*,void*,void*);
          typedef int  (__stdcall *PFN_STAT)(void);
          typedef void (__stdcall *PFN_FINI)(void);
          int main(int argc,char**argv){
            const char *prod=(argc>1?argv[1]:"inner-bed");
            HMODULE h=LoadLibraryA("SigProcDll-64HF.dll"); if(!h){printf("LOAD_FAIL %lu\n",GetLastError());return 2;}
            PFN_INIT init=(PFN_INIT)GetProcAddress(h,"_SigProc_Init@8"); PFN_PROC proc=(PFN_PROC)GetProcAddress(h,"_SigProc@24"); PFN_STAT stat=(PFN_STAT)GetProcAddress(h,"_SigProc_Stat@0"); PFN_FINI fini=(PFN_FINI)GetProcAddress(h,"_SigProc_Fini@0");
            if(!init||!proc||!stat||!fini){puts("EXPORT_FAIL");return 3;}
            int ir=init(".",prod); printf("INIT product=%s ret=%d stat=%d\n",prod,ir,stat());
            static uint8_t in[65536],o1[256],o2[256],o3[256],o4[256];
            for(unsigned i=0;i<sizeof(in);i++) in[i]=(uint8_t)((i*37u+11u)&255u);
            for(int k=0;k<40;k++){ int r=proc(632,in,o1,o2,o3,o4); if((k%10)==0)printf("PROC k=%d ret=%d stat=%d\n",k,r,stat()); }
            fini(); FreeLibrary(h); puts("DIRECT_NONZERO_STACK_PATH_PASS"); return 0;
          }
          '@ | Set-Content -Encoding ascii direct_harness.c
          cl /nologo /O2 /W3 direct_harness.c /Fe:direct_harness.exe | Tee-Object direct_compile.log
          if($LASTEXITCODE -ne 0){throw 'COMPILE_FAIL'}
      - name: Execute candidate in isolated x86 processes across product strings
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force run | Out-Null
          Copy-Item SigProcDll-64HF.dll run\
          Copy-Item direct_harness.exe run\
          Copy-Item mat\filter_brth run\
          Copy-Item mat\filter_hrt3 run\
          Copy-Item mat\file_sig run\
          $products=@('inner-bed','outer-bed','inner','outer','64HF','HF','default','')
          $ok=$false;$i=0
          Push-Location run
          foreach($p in $products){$i++; & .\direct_harness.exe $p 2>&1 | Tee-Object "..\direct_run_$i.log"; $rc=$LASTEXITCODE; $t=Get-Content "..\direct_run_$i.log" -Raw -ErrorAction SilentlyContinue; if($rc -eq 0 -and $t -match 'DIRECT_NONZERO_STACK_PATH_PASS'){$ok=$true;break}}
          Pop-Location
          if(!$ok){throw 'ALL_DIRECT_NONZERO_ATTEMPTS_FAILED'}
          $sha=(Get-FileHash SigProcDll-64HF.dll -Algorithm SHA256).Hash.ToLowerInvariant();"STACKPROBE_DIRECT_NONZERO_PASS SHA256=$sha" | Out-File STACKPROBE_DIRECT_NONZERO_PASS.lock -Encoding ascii
      - name: Commit direct native PASS lock
        if: success()
        shell: powershell
        run: |
          $sha=(Get-FileHash SigProcDll-64HF.dll -Algorithm SHA256).Hash.ToLowerInvariant();git config user.name windows-dll-test-bot;git config user.email windows-dll-test-bot@users.noreply.github.com;git fetch origin main;git checkout -B main origin/main;New-Item -ItemType Directory -Force evidence_summary|Out-Null;"STACKPROBE_DIRECT_NONZERO_PASS SHA256=$sha`nPARENT=$env:BAD_SHA`nCOUNT=632`nITERATIONS=40"|Out-File evidence_summary/STACKPROBE_DIRECT_NONZERO_PASS.lock -Encoding ascii;git add evidence_summary/STACKPROBE_DIRECT_NONZERO_PASS.lock;git commit -m 'Record direct x86 nonzero stackprobe PASS';git push origin HEAD:main
      - name: Upload exact candidate and native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stackprobe-direct-nonzero-${{ github.run_id }}
          path: |
            SigProcDll-64HF.dll
            direct_candidate_sha.txt
            direct_harvest.json
            direct_harvest.log
            direct_compile.log
            direct_run_*.log
            STACKPROBE_DIRECT_NONZERO_PASS.lock
          if-no-files-found: ignore
          retention-days: 7
