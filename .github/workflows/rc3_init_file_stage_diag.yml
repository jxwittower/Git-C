name: rc3-init-file-stage-diagnostic
on:
  push:
    branches: [rc3-native-gate-20260810r]
    paths: ['.github/workflows/rc3_init_file_stage_diag.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: write
env:
  ARTIFACT_ID: '9034484495'
  HOST_SHA: '081c4c62d2bf377913eb2aca0cc3cf3bf656350c8abaa3aaf11d171dac604804'
  DELTA_B64_SHA: '28b6446caf5fdb7dcf194f58a1faf9ef59a51ff806dbeb4b55762f1d256daa30'
  DELTA_ENC_SHA: '0f943c6568801ff62fa4faccddc31bca3c2af90731c01a5a8f927bc81d16f76c'
  DELTA_XZ_SHA: '432be588c7550c8a49a4af46ea475716e9d378b21d5664456a3eaf734de1ae92'
  RC3_SHA: '1c2695f5f5d48228a9cfee18c31669cc27615d6d1c53bf83228aa015240a2b92'
jobs:
  file-stage:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ env.ARTIFACT_ID }}
          path: baseline_artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: '31300993195'
          merge-multiple: true
      - name: Bind inputs and encrypted delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum baseline_artifact/payload/HostCompat.dll | awk '{print $1}')" = "$HOST_SHA"
          : > "$RUNNER_TEMP/rc3.delta.enc.b64"
          for f in .rc3delta/chunk_00 .rc3delta/chunk_01 .rc3delta/chunk_02 .rc3delta/chunk_03 .rc3delta/chunk_04 .rc3delta/chunk_05 .rc3delta/chunk_06 .rc3delta/chunk_07 .rc3delta/chunk_08 .rc3delta/chunk_09; do cat "$f" >> "$RUNNER_TEMP/rc3.delta.enc.b64"; done
          test "$(sha256sum < "$RUNNER_TEMP/rc3.delta.enc.b64" | awk '{print $1}')" = "$DELTA_B64_SHA"
          base64 -d "$RUNNER_TEMP/rc3.delta.enc.b64" > "$RUNNER_TEMP/rc3.delta.xz.enc"
          test "$(sha256sum < "$RUNNER_TEMP/rc3.delta.xz.enc" | awk '{print $1}')" = "$DELTA_ENC_SHA"
      - name: Create one-time RSA key
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .secure_rc3_stage
          mkdir -p .secure_rc3_stage
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$RUNNER_TEMP/private_stage.pem"
          openssl pkey -in "$RUNNER_TEMP/private_stage.pem" -pubout -out .secure_rc3_stage/public.pem
          git config user.name windows-dll-test-bot
          git config user.email windows-dll-test-bot@users.noreply.github.com
          git add .secure_rc3_stage/public.pem
          git commit -m 'Publish RC3 file-stage diagnostic RSA public key'
          git push origin HEAD:${GITHUB_REF_NAME}
      - name: Receive wrapped AES key
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 240); do
            git pull --ff-only origin "${GITHUB_REF_NAME}" >/dev/null 2>&1 || true
            if [ -s .secure_rc3_stage/key.enc.b64 ]; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = 1
          base64 -d .secure_rc3_stage/key.enc.b64 > "$RUNNER_TEMP/key_stage.enc"
          openssl pkeyutl -decrypt -inkey "$RUNNER_TEMP/private_stage.pem" -in "$RUNNER_TEMP/key_stage.enc" -out "$RUNNER_TEMP/pass_stage.txt" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
      - name: Reconstruct exact RC3
        shell: bash
        run: |
          set -euo pipefail
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in "$RUNNER_TEMP/rc3.delta.xz.enc" -out "$RUNNER_TEMP/rc3.delta.xz" -pass file:"$RUNNER_TEMP/pass_stage.txt"
          test "$(sha256sum < "$RUNNER_TEMP/rc3.delta.xz" | awk '{print $1}')" = "$DELTA_XZ_SHA"
          python - <<'PY'
          from pathlib import Path
          import lzma,struct,os,hashlib
          base=Path('baseline_artifact/payload/HostCompat.dll').read_bytes()
          raw=lzma.decompress((Path(os.environ['RUNNER_TEMP'])/'rc3.delta.xz').read_bytes())
          target,nops=struct.unpack_from('<II',raw,4); pos=12; out=bytearray()
          assert raw[:4]==b'R3D1'
          for _ in range(nops):
              op=raw[pos:pos+1]; pos+=1
              if op==b'C':
                  src,n=struct.unpack_from('<II',raw,pos); pos+=8; out.extend(base[src:src+n])
              elif op==b'L':
                  n,=struct.unpack_from('<I',raw,pos); pos+=4; out.extend(raw[pos:pos+n]); pos+=n
              else: raise SystemExit('BAD_DELTA_OPCODE')
          assert pos==len(raw) and len(out)==target
          Path('rc3_payload').mkdir(exist_ok=True)
          Path('rc3_payload/SigProcDll-64HF.dll').write_bytes(out)
          print(hashlib.sha256(out).hexdigest())
          PY
          test "$(sha256sum rc3_payload/SigProcDll-64HF.dll | awk '{print $1}')" = "$RC3_SHA"
          rm -f "$RUNNER_TEMP/pass_stage.txt" "$RUNNER_TEMP/key_stage.enc" "$RUNNER_TEMP/private_stage.pem"
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Compile simple Init probe
        shell: cmd
        run: |
          cl /nologo /O2 /W4 /TC diagnostics\sigproc_init_seh_probe.c /Fe:initprobe.exe > stage_probe_build.txt 2>&1
          if errorlevel 1 (type stage_probe_build.txt & exit /b 1)
      - name: Run runtime-file staging matrix
        shell: powershell
        run: |
          $ErrorActionPreference='Continue'
          Remove-Item file_stage_probe.txt -ErrorAction SilentlyContinue
          $runtime = Resolve-Path 'baseline_artifact\payload\runtime\inner-bed'
          $variants = @('NONE','BRTH','HRT3','FILTERS','FILTERS_BADSIG','FILTERS_SIG','FULL')
          foreach($v in $variants){
            $d="stage_$v"
            New-Item -ItemType Directory -Force $d | Out-Null
            Copy-Item initprobe.exe "$d\initprobe.exe" -Force
            Copy-Item rc3_payload\SigProcDll-64HF.dll "$d\SigProcDll-64HF.dll" -Force
            if($v -in @('BRTH','FILTERS','FILTERS_BADSIG','FILTERS_SIG','FULL')){ Copy-Item "$runtime\filter_brth" "$d\filter_brth" -Force }
            if($v -in @('HRT3','FILTERS','FILTERS_BADSIG','FILTERS_SIG','FULL')){ Copy-Item "$runtime\filter_hrt3" "$d\filter_hrt3" -Force }
            if($v -eq 'FILTERS_BADSIG'){ Set-Content -Path "$d\file_sig" -Value 'INVALID' -NoNewline }
            if($v -in @('FILTERS_SIG','FULL')){ Copy-Item "$runtime\file_sig" "$d\file_sig" -Force }
            if($v -eq 'FULL'){ Copy-Item "$runtime\file_bed_model_v1" "$d\file_bed_model_v1" -Force }
            "===== VARIANT=$v =====" | Tee-Object -FilePath file_stage_probe.txt -Append
            Get-ChildItem $d | ForEach-Object { "FILE=$($_.Name) BYTES=$($_.Length)" } | Tee-Object -FilePath file_stage_probe.txt -Append
            Push-Location $d
            & .\initprobe.exe SigProcDll-64HF.dll 3 2>&1 | Tee-Object -FilePath ..\file_stage_probe.txt -Append
            $rc=$LASTEXITCODE
            Pop-Location
            "VARIANT=$v EXIT=$rc" | Tee-Object -FilePath file_stage_probe.txt -Append
          }
          Get-Content file_stage_probe.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc3-init-file-stage-${{ github.run_id }}
          path: |
            stage_probe_build.txt
            file_stage_probe.txt
          if-no-files-found: ignore
          retention-days: 14
      - if: always()
        shell: bash
        run: |
          git pull --ff-only origin "${GITHUB_REF_NAME}" || true
          rm -rf .secure_rc3_stage
          git add -A .secure_rc3_stage || true
          if ! git diff --cached --quiet; then git commit -m 'Remove RC3 file-stage RSA handoff'; git push origin HEAD:${GITHUB_REF_NAME} || true; fi
