name: stackprobe-7c305-native-nonzero-autofix-v2
on:
  push:
    paths:
      - '.github/workflows/stackprobe_7c305_native_nonzero_autofix_v2.yml'
permissions:
  contents: write
  actions: read
jobs:
  native-nonzero:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      BAD_SHA: 66a44c88e9c9bf011825077fcc67c6ddc78a439700add94574056eb67d54678c
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Harvest bad DLL, exact nonzero harness, GHF and runtime
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          @'
          import os,json,hashlib,zipfile,io,urllib.request,pathlib,subprocess,sys,re,shutil
          O=pathlib.Path('native_material'); O.mkdir(exist_ok=True)
          BAD=os.environ['BAD_SHA']; token=os.environ['GH_TOKEN']; repo=os.environ['GITHUB_REPOSITORY']
          H={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def sha(b): return hashlib.sha256(b).hexdigest()
          have={'bad':False,'src':False,'ghf':False,'brth':False,'hrt':False,'sig':False}
          # Recover C harness embedded anywhere in git history if present.
          try:
              objs=subprocess.check_output(['git','rev-list','--objects','--all'],text=True,errors='ignore').splitlines()
              for ln in objs:
                  oid=ln.split()[0]
                  try:
                      if subprocess.check_output(['git','cat-file','-t',oid],text=True,stderr=subprocess.DEVNULL).strip()!='blob': continue
                      sz=int(subprocess.check_output(['git','cat-file','-s',oid],text=True).strip())
                      if sz>2_000_000: continue
                      b=subprocess.check_output(['git','cat-file','-p',oid])
                      if sha(b)==BAD and not have['bad']:
                          (O/'bad66a.dll').write_bytes(b); have['bad']=True; print('BAD_FROM_GIT',oid)
                      if not have['src']:
                          t=b.decode('utf-8','ignore')
                          if 'NONZERO_NATIVE_SMOKE_PASS' in t and '#include' in t and 'GetProcAddress' in t:
                              # Prefer an actual .c blob; otherwise extract a heredoc-like C region.
                              path=' '.join(ln.split()[1:]).lower()
                              if path.endswith('.c'):
                                  (O/'native_nonzero_smoke.c').write_text(t,encoding='utf-8'); have['src']=True; print('HARNESS_C_FROM_GIT',oid)
                              else:
                                  starts=[m.start() for m in re.finditer(r'#include\s*[<\"]',t)]
                                  if starts:
                                      s=max([x for x in starts if x<t.find('NONZERO_NATIVE_SMOKE_PASS')] or starts[:1])
                                      frag=t[s:]
                                      # trim common heredoc terminators
                                      for marker in ['\nEOF\n','\nC_EOF\n','\n\'@\n','\n"@\n']:
                                          j=frag.find(marker)
                                          if j>0: frag=frag[:j]; break
                                      if 'int main' in frag:
                                          (O/'native_nonzero_smoke.c').write_text(frag,encoding='utf-8'); have['src']=True; print('HARNESS_EXTRACTED_FROM_GIT',oid)
                  except Exception: pass
          except Exception as e: print('GIT_SCAN_WARN',e)
          arts=[]
          for page in range(1,6):
              req=urllib.request.Request(f'https://api.github.com/repos/{repo}/actions/artifacts?per_page=100&page={page}',headers=H)
              with urllib.request.urlopen(req,timeout=30) as r: d=json.load(r)
              q=d.get('artifacts',[]); arts+=q
              if len(q)<100: break
          arts=[a for a in arts if not a.get('expired') and a.get('size_in_bytes',0)<100_000_000]
          arts.sort(key=lambda a:(0 if any(k in a['name'].lower() for k in ['native','stack','full','regress','final','seq','v4']) else 1,-int(a['id'])))
          for ai,a in enumerate(arts):
              if all(have.values()): break
              if ai>160 and not any(k in a['name'].lower() for k in ['native','stack','full','regress','final','seq','v4']): continue
              try:
                  req=urllib.request.Request(a['archive_download_url'],headers=H)
                  with urllib.request.urlopen(req,timeout=60) as r: zb=r.read()
                  z=zipfile.ZipFile(io.BytesIO(zb)); names=z.namelist()
                  for n in names:
                      bn=pathlib.PurePosixPath(n).name.lower()
                      try:
                          if bn=='native_nonzero_smoke.c' and not have['src']:
                              (O/'native_nonzero_smoke.c').write_bytes(z.read(n)); have['src']=True; print('HARNESS_ART',a['id'],n)
                          elif n.lower().endswith('.dll') and not have['bad']:
                              bb=z.read(n)
                              if sha(bb)==BAD: (O/'bad66a.dll').write_bytes(bb); have['bad']=True; print('BAD_ART',a['id'],n)
                          elif n.lower().endswith('.ghf') and not have['ghf']:
                              bb=z.read(n)
                              if len(bb)>1000: (O/'oneframe_or_real.ghf').write_bytes(bb); have['ghf']=True; print('GHF_ART',a['id'],n,len(bb))
                          elif bn=='filter_brth' and not have['brth']:
                              (O/'filter_brth').write_bytes(z.read(n)); have['brth']=True
                          elif bn=='filter_hrt3' and not have['hrt']:
                              (O/'filter_hrt3').write_bytes(z.read(n)); have['hrt']=True
                          elif bn=='file_sig' and not have['sig']:
                              (O/'file_sig').write_bytes(z.read(n)); have['sig']=True
                      except Exception: pass
              except Exception as e: print('ART_WARN',a.get('id'),str(e)[:120])
          print('HAVE',have)
          pathlib.Path('native_harvest_status.json').write_text(json.dumps(have,indent=2))
          missing=[k for k,v in have.items() if not v]
          if missing: print('FAIL_STAGE=MISSING_NATIVE_MATERIAL',missing); sys.exit(21)
          '@ | Set-Content -Encoding ascii $env:RUNNER_TEMP\harvest_native.py
          python $env:RUNNER_TEMP\harvest_native.py 2>&1 | Tee-Object native_harvest.log
      - name: Patch canonical x86 stack probing
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          @'
          import struct,hashlib
          from pathlib import Path
          b=bytearray(Path('native_material/bad66a.dll').read_bytes())
          U16=lambda o:struct.unpack_from('<H',b,o)[0]; U32=lambda o:struct.unpack_from('<I',b,o)[0]
          def P16(o,v):struct.pack_into('<H',b,o,v)
          def P32(o,v):struct.pack_into('<I',b,o,v)
          A=lambda x,a:(x+a-1)//a*a
          pe=U32(0x3c); assert b[pe:pe+4]==b'PE\0\0' and U16(pe+4)==0x14c
          n=U16(pe+6); osz=U16(pe+20); opt=pe+24; s0=opt+osz; sa=U32(opt+32); fa=U32(opt+36); sh=U32(opt+60)
          secs=[]
          for i in range(n):
              o=s0+40*i; secs.append((bytes(b[o:o+8]).split(b'\0')[0],U32(o+8),U32(o+12),U32(o+16),U32(o+20),U32(o+36),o))
          text=max((s for s in secs if s[5]&0x20000000),key=lambda s:s[3]); _,vs,tva,trs,trp,_,_=text
          sites=[]
          for p in range(trp,trp+trs-6):
              if b[p:p+2]==b'\x81\xec':
                  z=U32(p+2)
                  if 0x1000<=z<0x100000: sites.append((p,tva+p-trp,z))
          if len(sites)!=12: raise SystemExit(f'EXPECTED_12_STACK_SITES_GOT_{len(sites)}')
          chk=bytearray(b'\x51\x8d\x4c\x24\x04\x29\xc1\x19\xc0\xf7\xd0\x21\xc1\x89\xe0\x25\x00\xf0\xff\xff')
          loop=len(chk); chk+=b'\x39\xc1\x72\x00'; jb=len(chk)-1; chk+=b'\x89\xc8\x59\x94\x8b\x00\x89\x04\x24\xc3'; probe=len(chk); chk+=b'\x2d\x00\x10\x00\x00\x85\x00\xeb\x00'; jm=len(chk)-1
          chk[jb]=(probe-jb-1)&255; chk[jm]=(loop-jm-1)&255
          nh=s0+40*n
          if nh+40>sh: raise SystemExit('NO_HEADER_ROOM')
          re=max(x[4]+x[3] for x in secs); ve=max(x[2]+max(x[1],x[3]) for x in secs); rp=A(re,fa); va=A(ve,sa)
          payload=bytearray(b'\x90'*(10*len(sites)))+chk; rs=A(len(payload),fa)
          if len(b)<rp+rs: b.extend(b'\0'*(rp+rs-len(b)))
          b[rp:rp+len(payload)]=payload; crva=va+10*len(sites)
          for i,(p,r,z) in enumerate(sites):
              tr=va+10*i; to=rp+10*i; b[to]=0xb8; struct.pack_into('<I',b,to+1,z); b[to+5]=0xe9; struct.pack_into('<i',b,to+6,crva-(tr+10)); b[p]=0xe8; struct.pack_into('<i',b,p+1,tr-(r+5)); b[p+5]=0x90
          b[nh:nh+8]=b'.stkfix\0'; P32(nh+8,len(payload));P32(nh+12,va);P32(nh+16,rs);P32(nh+20,rp);P32(nh+24,0);P32(nh+28,0);P16(nh+32,0);P16(nh+34,0);P32(nh+36,0x60000020);P16(pe+6,n+1);P32(opt+56,A(va+len(payload),sa));P32(opt+64,0)
          Path('SigProcDll-64HF.dll').write_bytes(b); h=hashlib.sha256(b).hexdigest(); Path('native_candidate_sha.txt').write_text(h+'\n'); print('FIXED_SHA',h)
          '@ | Set-Content -Encoding ascii $env:RUNNER_TEMP\patch.py
          python $env:RUNNER_TEMP\patch.py
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Compile and execute real nonzero SigProc smoke
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force native_run | Out-Null
          Copy-Item .\SigProcDll-64HF.dll native_run\SigProcDll-64HF.dll
          Copy-Item native_material\filter_brth native_run\filter_brth
          Copy-Item native_material\filter_hrt3 native_run\filter_hrt3
          Copy-Item native_material\file_sig native_run\file_sig
          Copy-Item native_material\oneframe_or_real.ghf native_run\oneframe.ghf
          Copy-Item native_material\native_nonzero_smoke.c native_run\native_nonzero_smoke.c
          Push-Location native_run
          cl /nologo /O2 /W3 native_nonzero_smoke.c /Fe:native_nonzero_smoke.exe | Tee-Object ..\native_compile.log
          if($LASTEXITCODE -ne 0){ throw 'NATIVE_HARNESS_COMPILE_FAIL' }
          $attempts=@(
            '.\\native_nonzero_smoke.exe',
            '.\\native_nonzero_smoke.exe .\\SigProcDll-64HF.dll .\\oneframe.ghf',
            '.\\native_nonzero_smoke.exe .\\oneframe.ghf',
            '.\\native_nonzero_smoke.exe .\\SigProcDll-64HF.dll'
          )
          $ok=$false; $i=0
          foreach($cmd in $attempts){
            $i++; cmd /c $cmd 2>&1 | Tee-Object "..\\native_attempt_$i.log"
            $txt=Get-Content "..\\native_attempt_$i.log" -Raw -ErrorAction SilentlyContinue
            if($txt -match 'NONZERO_NATIVE_SMOKE_PASS'){ $ok=$true; break }
          }
          Pop-Location
          if(!$ok){ throw 'REAL_NONZERO_SIGPROC_SMOKE_DID_NOT_PASS' }
          $sha=(Get-FileHash .\SigProcDll-64HF.dll -Algorithm SHA256).Hash.ToLowerInvariant()
          "STACKPROBE_NATIVE_NONZERO_PASS SHA256=$sha" | Out-File STACKPROBE_NATIVE_NONZERO_PASS.lock -Encoding ascii
      - name: Commit exact native nonzero PASS lock
        if: success()
        shell: powershell
        run: |
          $sha=(Get-FileHash .\SigProcDll-64HF.dll -Algorithm SHA256).Hash.ToLowerInvariant()
          git config user.name windows-dll-test-bot
          git config user.email windows-dll-test-bot@users.noreply.github.com
          git fetch origin main
          git checkout -B main origin/main
          New-Item -ItemType Directory -Force evidence_summary | Out-Null
          "STACKPROBE_NATIVE_NONZERO_PASS SHA256=$sha`nPARENT_UNSAFE_SHA256=$env:BAD_SHA`nREAL_NONZERO_GHF=PASS" | Out-File evidence_summary/STACKPROBE_NATIVE_NONZERO_PASS.lock -Encoding ascii
          git add evidence_summary/STACKPROBE_NATIVE_NONZERO_PASS.lock
          git commit -m 'Record stackprobe real nonzero native PASS'
          git push origin HEAD:main
      - name: Upload native evidence and exact DLL
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stackprobe-native-nonzero-${{ github.run_id }}
          path: |
            SigProcDll-64HF.dll
            native_candidate_sha.txt
            native_harvest_status.json
            native_harvest.log
            native_compile.log
            native_attempt_*.log
            STACKPROBE_NATIVE_NONZERO_PASS.lock
          if-no-files-found: ignore
          retention-days: 7
