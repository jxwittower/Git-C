name: HSK Curl Diagnostic
on:
  push:
    branches:
      - hsk-crawl-20260914
    paths:
      - '.github/workflows/hsk-curl-diag.yml'
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch HSK OpenAPI schema
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p hsk_openapi
          for u in openapi.json docs redoc; do
            code=$(curl -k -L --max-time 30 -A 'Mozilla/5.0' "https://hsk.blcu.edu.cn/$u" -o "hsk_openapi/${u//\//_}.txt" -w '%{http_code}')
            echo "$u HTTP=$code bytes=$(wc -c < hsk_openapi/${u//\//_}.txt)"
          done
          if python3 -m json.tool hsk_openapi/openapi.json.txt > hsk_openapi/openapi.pretty.json 2>/dev/null; then
            python3 - <<'PY'
          import json
          o=json.load(open('hsk_openapi/openapi.json.txt'))
          for path,ops in o.get('paths',{}).items():
              if any(k in path for k in ('sentence/search','statistics','nlp/tools','resource')):
                  print('\nPATH',path)
                  for method,v in ops.items():
                      if not isinstance(v,dict): continue
                      print(' ',method.upper(),v.get('summary'))
                      rb=v.get('requestBody',{})
                      if rb: print('  requestBody=',json.dumps(rb,ensure_ascii=False)[:3000])
                      ps=v.get('parameters',[])
                      if ps: print('  params=',json.dumps(ps,ensure_ascii=False)[:3000])
          PY
          fi
      - name: Upload OpenAPI
        uses: actions/upload-artifact@v4
        with:
          name: hsk-openapi
          path: hsk_openapi
          retention-days: 7
