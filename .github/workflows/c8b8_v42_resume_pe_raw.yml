name: c8b8-v4.2-resume-raw-pe-gate
on:
  push:
    branches: [c8b8-v4-drive-resumable-20260809]
    paths:
      - '.github/workflows/c8b8_v42_resume_pe_raw.yml'
permissions:
  contents: read
  actions: read
jobs:
  fullreg:
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      SOURCE_RUN: '31314728589'
      SOURCE_ARTIFACT: c8b8-v4-plaintext-xz-31314728589
      CAND_SHA: c8b8f49620b45707f80f47a9fadf14db376a115bc6052517e9243e0cb2dc20e9
      HOST_SHA: 081c4c62d2bf377913eb2aca0cc3cf3bf656350c8abaa3aaf11d171dac604804
      C63_SHA: 56c02d18a9ee68a7ae14c4601e4ba24f7af170c6db01ea21fbff91cbe6b082fb
      SMOKE_SHA: a9cc5cf614114c9481073669a3fd5d7ef5e1a1adce7e0fdc3f62824e0d50431d
      XZ_SHA: 5a1c750b48a7d436f8ca7a011dd4d925d68891e8241a11aa42bf4bbd30afd3c0
      XZ_BYTES: '20593840'
      GHF_FILES: '13'
      GHF_BYTES: '82484656'
      GHF_FRAMES: '10808'
      PAYLOAD_ROOT: c8b8_fullreg_payload_v4
    steps:
      - uses: actions/checkout@v4

      - name: Restore exact verified XZ checkpoint
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $d=Join-Path $env:RUNNER_TEMP 'resume'; New-Item -ItemType Directory -Force $d | Out-Null
          gh run download $env:SOURCE_RUN -n $env:SOURCE_ARTIFACT -D $d
          if($LASTEXITCODE -ne 0){ throw 'CHECKPOINT_DOWNLOAD_FAIL' }
          $p=Get-ChildItem $d -Recurse -Filter payload.tar.xz | Select-Object -First 1
          if(!$p){ throw 'CHECKPOINT_FILE_MISSING' }
          $h=(Get-FileHash $p.FullName -Algorithm SHA256).Hash.ToLowerInvariant(); $sz=$p.Length
          if($h -ne $env:XZ_SHA -or $sz -ne [int64]$env:XZ_BYTES){ throw "CHECKPOINT_BIND_FAIL $h $sz" }
          Copy-Item -Force $p.FullName "$env:RUNNER_TEMP\payload.tar.xz"
          "CHECKPOINT_RESTORE_PASS sha=$h bytes=$sz source_run=$env:SOURCE_RUN" | Tee-Object checkpoint_restore.txt

      - name: Extract via 7Zip and verify full corpus
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Remove-Item -Recurse -Force $env:PAYLOAD_ROOT -ErrorAction SilentlyContinue
          $stage=Join-Path $env:RUNNER_TEMP 'xz_stage'; Remove-Item -Recurse -Force $stage -ErrorAction SilentlyContinue; New-Item -ItemType Directory -Force $stage | Out-Null
          7z x -y "$env:RUNNER_TEMP\payload.tar.xz" "-o$stage" | Tee-Object extract_xz.txt
          if($LASTEXITCODE -ne 0){ throw 'SEVENZIP_XZ_FAIL' }
          $tar=Get-ChildItem $stage -File | Where-Object {$_.Extension -eq '.tar'} | Select-Object -First 1
          if(!$tar){ throw 'TAR_STAGE_MISSING' }
          7z x -y $tar.FullName '-o.' | Tee-Object extract_tar.txt
          if($LASTEXITCODE -ne 0){ throw 'SEVENZIP_TAR_FAIL' }
          @'
          import hashlib,os,struct
          from pathlib import Path
          root=Path(os.environ['PAYLOAD_ROOT'])
          if not (root/'fullreg.c').is_file(): raise SystemExit('PAYLOAD_ROOT_MISSING')
          for line in (root/'MANIFEST_SHA256.txt').read_text().splitlines():
              h,rel=line.split(None,1); rel=rel.strip(); rel=rel[2:] if rel.startswith('./') else rel
              p=root/rel; got=hashlib.sha256(p.read_bytes()).hexdigest()
              if got!=h: raise SystemExit(f'MANIFEST_FAIL {rel} {got} {h}')
          expected={'SigProcDll-64HF.dll':os.environ['CAND_SHA'],'HostCompat.dll':os.environ['HOST_SHA'],'C63.dll':os.environ['C63_SHA'],'SigProcLoaderContractSmoke.exe':os.environ['SMOKE_SHA']}
          for n,h in expected.items():
              got=hashlib.sha256((root/n).read_bytes()).hexdigest()
              if got!=h: raise SystemExit(f'BINARY_BIND_FAIL {n} {got}')
          ghfs=sorted((root/'testdata').rglob('*.ghf')); total=sum(p.stat().st_size for p in ghfs); frames=0
          for p in ghfs:
              b=p.read_bytes(); off=0
              while off<len(b):
                  if off+6>len(b): raise SystemExit(f'GHF_HEADER_FAIL {p}')
                  n,tl=struct.unpack_from('<IH',b,off); off += 6+tl+n*12; frames += 1
                  if off>len(b): raise SystemExit(f'GHF_PARSE_FAIL {p}')
              if off!=len(b): raise SystemExit(f'GHF_TRAILING_FAIL {p}')
          if (len(ghfs),total,frames)!=(int(os.environ['GHF_FILES']),int(os.environ['GHF_BYTES']),int(os.environ['GHF_FRAMES'])): raise SystemExit(f'GHF_BIND_FAIL files={len(ghfs)} bytes={total} frames={frames}')
          print(f'PAYLOAD_MANIFEST_AND_CORPUS_PASS files={len(ghfs)} bytes={total} frames={frames}')
          '@ | Set-Content -Encoding ascii "$env:RUNNER_TEMP\verify.py"
          python "$env:RUNNER_TEMP\verify.py" | Tee-Object payload_manifest_gate.txt
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }

      - name: Configure MSVC x86
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Raw PE32 export import and stack-probe gate
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'; $r=$env:PAYLOAD_ROOT
          dumpbin /headers "$r\SigProcDll-64HF.dll" | Set-Content -Encoding ascii candidate_headers.txt
          dumpbin /exports "$r\SigProcDll-64HF.dll" | Set-Content -Encoding ascii candidate_exports_evidence.txt
          dumpbin /dependents "$r\SigProcDll-64HF.dll" | Set-Content -Encoding ascii candidate_dependents_evidence.txt
          dumpbin /dependents "$r\HostCompat.dll" | Set-Content -Encoding ascii hostcompat_dependents_evidence.txt
          @'
          import os,struct
          from pathlib import Path
          def parse_pe(path):
              b=Path(path).read_bytes(); u16=lambda o:struct.unpack_from('<H',b,o)[0]; u32=lambda o:struct.unpack_from('<I',b,o)[0]
              if b[:2]!=b'MZ': raise SystemExit('MZ_FAIL '+str(path))
              pe=u32(0x3c)
              if b[pe:pe+4]!=b'PE\0\0': raise SystemExit('PE_SIG_FAIL '+str(path))
              machine=u16(pe+4); nsec=u16(pe+6); osz=u16(pe+20); opt=pe+24; magic=u16(opt)
              if machine!=0x14c or magic!=0x10b: raise SystemExit(f'NOT_PE32_X86 {path} machine={machine:x} magic={magic:x}')
              sec0=opt+osz; secs=[]
              for i in range(nsec):
                  o=sec0+40*i; name=b[o:o+8].split(b'\0',1)[0].decode('ascii','ignore'); vs=u32(o+8); va=u32(o+12); rs=u32(o+16); rp=u32(o+20); ch=u32(o+36); secs.append((name,va,max(vs,rs),rp,rs,ch))
              def r2o(rva):
                  if rva==0:return 0
                  for name,va,span,rp,rs,ch in secs:
                      if va<=rva<va+span:return rp+(rva-va)
                  if rva<len(b):return rva
                  raise SystemExit(f'RVA_MAP_FAIL {path} {rva:x}')
              def cstr(off):
                  e=b.find(b'\0',off)
                  if e<0:raise SystemExit('CSTR_FAIL')
                  return b[off:e].decode('ascii','replace')
              exports=set(); er=u32(opt+96)
              if er:
                  eo=r2o(er); nn=u32(eo+24); names_rva=u32(eo+32); no=r2o(names_rva)
                  for i in range(nn): exports.add(cstr(r2o(u32(no+4*i))))
              imports=set(); ir=u32(opt+104)
              if ir:
                  io=r2o(ir)
                  for i in range(4096):
                      o=io+20*i; vals=struct.unpack_from('<IIIII',b,o)
                      if vals==(0,0,0,0,0):break
                      imports.add(cstr(r2o(vals[3])).lower())
                  else:raise SystemExit('IMPORT_DESCRIPTOR_RUNAWAY')
              bad=[]
              for name,va,span,rp,rs,ch in secs:
                  if ch&0x20000000:
                      end=min(len(b),rp+rs)
                      for x in range(rp,max(rp,end-5)):
                          if b[x:x+2]==b'\x81\xec':
                              imm=u32(x+2)
                              if 0x1000<=imm<0x100000:bad.append((name,x,imm))
              return b,secs,exports,imports,bad
          root=Path(os.environ['PAYLOAD_ROOT'])
          cb,cs,ce,ci,bad=parse_pe(root/'SigProcDll-64HF.dll'); hb,hs,he,hi,hbad=parse_pe(root/'HostCompat.dll')
          required={'_SigProc@24','_SigProc_Fini@0','_SigProc_Init@8','_SigProc_Stat@0'}
          miss=sorted(required-ce)
          if miss:raise SystemExit('EXPORT_MISSING '+repr(miss)+' got='+repr(sorted(ce)))
          if '.stkfix' not in [x[0] for x in cs]:raise SystemExit('STKFIX_SECTION_MISSING')
          if bad:raise SystemExit('UNSAFE_LARGE_DIRECT_STACK '+repr(bad))
          if 'ucrtbase.dll' in ci:raise SystemExit('DIRECT_UCRTBASE_IMPORT')
          extra=sorted(ci-hi)
          if extra:raise SystemExit('IMPORT_NOT_HOSTCOMPAT_SUBSET '+repr(extra))
          print('RAW_PE_EXPORTS='+','.join(sorted(ce)))
          print('RAW_PE_IMPORTS='+','.join(sorted(ci)))
          print('HOST_IMPORTS='+','.join(sorted(hi)))
          print('RAW_PE_ABI_IMPORT_STACKPROBE_PASS')
          '@ | Set-Content -Encoding ascii "$env:RUNNER_TEMP\raw_pe_gate.py"
          python "$env:RUNNER_TEMP\raw_pe_gate.py" | Tee-Object static_gate.txt
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }

      - name: Inner and outer loader contract gates
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'; $r=(Resolve-Path $env:PAYLOAD_ROOT).Path
          foreach($bed in @('inner-bed','outer-medical-bed')){
            $d="loader_$($bed.Replace('-','_'))"; Remove-Item -Recurse -Force $d -ErrorAction SilentlyContinue; New-Item -ItemType Directory -Force $d | Out-Null
            Copy-Item "$r\SigProcDll-64HF.dll","$r\SigProcLoaderContractSmoke.exe" $d
            Copy-Item "$r\runtime\$bed\*" $d
            Push-Location $d
            try { .\SigProcLoaderContractSmoke.exe *>&1 | Tee-Object "..\loader_$bed.log"; $rc=$LASTEXITCODE }
            finally { Pop-Location }
            if($rc -ne 0){ throw "LOADER_FAIL bed=$bed rc=$rc" }
            if(-not (Select-String -Quiet -SimpleMatch 'ALL_LOADER_CONTRACT_TESTS_PASS' "loader_$bed.log")){ throw "LOADER_MARKER_MISSING $bed" }
          }
          'INNER_OUTER_LOADER_CONTRACT_PASS' | Tee-Object loader_contract_gate.txt

      - name: Compile full-data regression harness x86
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'; Push-Location $env:PAYLOAD_ROOT
          try { cl /nologo /O2 /W4 /D_CRT_SECURE_NO_WARNINGS /Fe:fullreg.exe fullreg.c 2>&1 | Tee-Object ..\fullreg_compile.txt; $rc=$LASTEXITCODE }
          finally { Pop-Location }
          if($rc -ne 0){ throw "FULLREG_COMPILE_FAIL $rc" }

      - name: Execute complete native Windows regression
        shell: powershell
        timeout-minutes: 100
        run: |
          $ErrorActionPreference='Stop'; Push-Location $env:PAYLOAD_ROOT
          try { .\fullreg.exe .\SigProcDll-64HF.dll .\HostCompat.dll .\C63.dll .\testdata .\runtime *>&1 | Tee-Object ..\full_regression_v42.log; $rc=$LASTEXITCODE }
          finally { Pop-Location }
          if($rc -ne 0){ throw "FULLREG_RC=$rc" }
          foreach($m in @('HOSTCOMPAT_NONZERO_CONTRACT_PASS','C63_NONZERO_CONTRACT_PASS','CANDIDATE_NONZERO_CONTRACT_PASS','FULL_13_GHF_CORPUS_PASS files=13 frames=10808 bytes=82484656','SEQ_TARGETS_VITAL_SUPPRESSION_RECOVERY_PASS','DETERMINISTIC_REPLAY_PASS frames=10808','LONG_STABILITY_PASS loops=20000','TWO_THREAD_STRESS_PASS threads=2 loops_each=2000','REALTIME_1HZ_PASS frames=60','COMPLETE_NATIVE_WINDOWS_REGRESSION_PASS')){
            if(-not (Select-String -Quiet -SimpleMatch $m full_regression_v42.log)){ throw "FULLREG_MARKER_MISSING $m" }
          }
          $h=(Get-FileHash "$env:PAYLOAD_ROOT\SigProcDll-64HF.dll" -Algorithm SHA256).Hash.ToLowerInvariant(); if($h -ne $env:CAND_SHA){ throw "POSTREG_SHA_DRIFT $h" }
          "NATIVE_WINDOWS_DYNAMIC_NONZERO_PASS SHA256=$h`nFULL_NATIVE_WINDOWS_COMPLETE_REGRESSION_PASS SHA256=$h" | Tee-Object C8B8_V42_FULLREG_PASS.lock

      - name: Build and independently audit final release ZIP
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'; $rel='GuanHu_C8B8_V42_FINAL_RELEASE'; Remove-Item -Recurse -Force $rel,'zip_audit' -ErrorAction SilentlyContinue; New-Item -ItemType Directory -Force $rel | Out-Null
          Copy-Item "$env:PAYLOAD_ROOT\SigProcDll-64HF.dll" "$rel\SigProcDll-64HF.dll"
          Copy-Item C8B8_V42_FULLREG_PASS.lock,static_gate.txt,loader_contract_gate.txt,payload_manifest_gate.txt "$rel\"
          $h=(Get-FileHash "$rel\SigProcDll-64HF.dll" -Algorithm SHA256).Hash.ToLowerInvariant(); $sz=(Get-Item "$rel\SigProcDll-64HF.dll").Length
          if($h -ne $env:CAND_SHA -or $sz -le 0){ throw 'PREZIP_DLL_BIND_FAIL' }
          "SHA256 $h  SigProcDll-64HF.dll`nSIZE $sz" | Set-Content "$rel\RELEASE_SHA256SUMS.txt"
          Compress-Archive -Path "$rel\*" -DestinationPath GuanHu_SigProc_Final_Release_20260809.zip -CompressionLevel Optimal
          Expand-Archive GuanHu_SigProc_Final_Release_20260809.zip -DestinationPath zip_audit -Force
          $ah=(Get-FileHash 'zip_audit\SigProcDll-64HF.dll' -Algorithm SHA256).Hash.ToLowerInvariant(); $asz=(Get-Item 'zip_audit\SigProcDll-64HF.dll').Length
          if($ah -ne $env:CAND_SHA -or $asz -ne $sz){ throw "ZIP_AUDIT_FAIL $ah $asz" }
          "FINAL_ZIP_AUDIT_PASS SHA256=$ah DLL_BYTES=$asz ZIP_BYTES=$((Get-Item GuanHu_SigProc_Final_Release_20260809.zip).Length)" | Tee-Object C8B8_V42_RELEASE_PASS.lock

      - name: Upload exact tested final package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: c8b8-v42-exact-final-release-${{ github.run_id }}
          path: |
            ${{ env.PAYLOAD_ROOT }}/SigProcDll-64HF.dll
            GuanHu_SigProc_Final_Release_20260809.zip
            C8B8_V42_FULLREG_PASS.lock
            C8B8_V42_RELEASE_PASS.lock
            checkpoint_restore.txt
            payload_manifest_gate.txt
            static_gate.txt
            candidate_headers.txt
            candidate_exports_evidence.txt
            candidate_dependents_evidence.txt
            hostcompat_dependents_evidence.txt
            loader_inner-bed.log
            loader_outer-medical-bed.log
            loader_contract_gate.txt
            fullreg_compile.txt
            full_regression_v42.log
          if-no-files-found: error
          retention-days: 30

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: c8b8-v42-failure-evidence-${{ github.run_id }}
          path: |
            checkpoint_restore.txt
            extract_xz.txt
            extract_tar.txt
            payload_manifest_gate.txt
            static_gate.txt
            candidate_headers.txt
            candidate_exports_evidence.txt
            candidate_dependents_evidence.txt
            hostcompat_dependents_evidence.txt
            loader_inner-bed.log
            loader_outer-medical-bed.log
            loader_contract_gate.txt
            fullreg_compile.txt
            full_regression_v42.log
          if-no-files-found: ignore
          retention-days: 30
