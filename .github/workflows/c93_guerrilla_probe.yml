name: c93-guerrilla-mail-probe

on:
  push:
    branches: [c93-v76-replay-20260824]
    paths:
      - '.github/workflows/c93_guerrilla_probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c93-v76-replay-20260824
          fetch-depth: 0
          persist-credentials: true
      - name: Create GuerrillaMail inbox and publish handoff
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/gm_probe.py" <<'PY'
          import json, os, time, urllib.request, urllib.parse, http.cookiejar
          from pathlib import Path
          base='https://api.guerrillamail.com/ajax.php'
          cj=http.cookiejar.CookieJar(); op=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj))
          def call(params):
              q=urllib.parse.urlencode(params)
              req=urllib.request.Request(base+'?'+q,headers={'User-Agent':'GuanHu-C93-Native-Probe'})
              with op.open(req,timeout=30) as r:return json.load(r)
          a=call({'f':'get_email_address','lang':'en','ip':'127.0.0.1','agent':'GuanHu-C93'})
          addr=a['email_addr']; subject='C93-GM-PROBE-'+os.environ['GITHUB_RUN_ID']
          Path('gm_address.txt').write_text(addr+'\n'); Path('gm_subject.txt').write_text(subject+'\n')
          Path(os.environ['RUNNER_TEMP'],'gm_session.json').write_text(json.dumps({'addr':addr,'subject':subject}))
          print('GM_ADDRESS='+addr); print('GM_SUBJECT='+subject)
          PY
          python "$RUNNER_TEMP/gm_probe.py"
          git config user.name c93-native-test-bot
          git config user.email c93-native-test-bot@users.noreply.github.com
          git fetch -q origin c93-v76-replay-20260824
          git checkout -q -B c93-v76-replay-20260824 origin/c93-v76-replay-20260824
          rm -rf .c93_gm_probe; mkdir .c93_gm_probe
          cp gm_address.txt gm_subject.txt .c93_gm_probe/
          git add .c93_gm_probe
          git commit -m 'Publish C93 GuerrillaMail probe inbox'
          git push origin HEAD:c93-v76-replay-20260824
      - name: Wait for probe message
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/gm_wait.py" <<'PY'
          import json, os, time, urllib.request, urllib.parse, http.cookiejar, html
          from pathlib import Path
          cfg=json.loads(Path(os.environ['RUNNER_TEMP'],'gm_session.json').read_text())
          base='https://api.guerrillamail.com/ajax.php'; cj=http.cookiejar.CookieJar(); op=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj))
          # Re-acquire the published mailbox in this session.
          def call(params):
              q=urllib.parse.urlencode(params); req=urllib.request.Request(base+'?'+q,headers={'User-Agent':'GuanHu-C93-Native-Probe'})
              with op.open(req,timeout=30) as r:return json.load(r)
          a=call({'f':'get_email_address','lang':'en','ip':'127.0.0.1','agent':'GuanHu-C93'})
          user=cfg['addr'].split('@',1)[0]
          data=urllib.parse.urlencode({'f':'set_email_user','email_user':user,'lang':'en','ip':'127.0.0.1','agent':'GuanHu-C93'}).encode()
          req=urllib.request.Request(base,data=data,headers={'User-Agent':'GuanHu-C93-Native-Probe','Content-Type':'application/x-www-form-urlencoded'})
          with op.open(req,timeout=30) as r: json.load(r)
          deadline=time.time()+150; found=None
          while time.time()<deadline and not found:
              z=call({'f':'check_email','seq':0,'ip':'127.0.0.1','agent':'GuanHu-C93'})
              for m in z.get('list',[]):
                  if html.unescape(m.get('mail_subject',''))==cfg['subject']:
                      found=m; break
              if not found: time.sleep(3)
          if not found: raise SystemExit('GM_PROBE_TIMEOUT')
          f=call({'f':'fetch_email','email_id':found['mail_id'],'ip':'127.0.0.1','agent':'GuanHu-C93'})
          body=f.get('mail_body','')
          Path('C93_GM_PROBE_PASS.txt').write_text(f"PASS\nADDRESS={cfg['addr']}\nSUBJECT={cfg['subject']}\nBODY_LEN={len(body)}\n")
          print('GM_PROBE_PASS BODY_LEN='+str(len(body)))
          PY
          python "$RUNNER_TEMP/gm_wait.py"
      - name: Commit probe result
        if: always()
        shell: bash
        run: |
          set +e
          git config user.name c93-native-test-bot
          git config user.email c93-native-test-bot@users.noreply.github.com
          git fetch -q origin c93-v76-replay-20260824
          git checkout -q -B c93-v76-replay-20260824 origin/c93-v76-replay-20260824
          mkdir -p evidence_summary
          if [ -f C93_GM_PROBE_PASS.txt ]; then cp C93_GM_PROBE_PASS.txt evidence_summary/; fi
          rm -rf .c93_gm_probe
          git add -A .c93_gm_probe evidence_summary
          git commit -m 'Record C93 GuerrillaMail probe result' >/dev/null 2>&1 || true
          git push origin HEAD:c93-v76-replay-20260824 || true
