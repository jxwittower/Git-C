name: rc3-repair-and-trigger
on:
  push:
    branches: [rc3-native-gate-20260810r]
    paths: ['.github/workflows/rc3_repair_and_trigger.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Bind exact encrypted RC3 delta and trigger native gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib
          p=Path('.rc3delta/chunk_07')
          b=bytearray(p.read_bytes())
          assert len(b)==8000, len(b)
          assert b[6591] in (ord('o'), ord('O')), (6591,b[6591])
          b[6591]=ord('O')
          p.write_bytes(b)
          h=hashlib.sha256(b).hexdigest()
          print('CHUNK07_SHA256='+h)
          assert h=='5552c9be9f9d0863bbfc29f47fe371596ce7a3abe1a2a36eabfcc239b911708e', h
          parts=[Path(f'.rc3delta/chunk_{i:02d}').read_bytes() for i in range(10)]
          joined=b''.join(parts)
          assert len(joined)==74904, len(joined)
          jh=hashlib.sha256(joined).hexdigest()
          print('DELTA_B64_SHA256='+jh)
          assert jh=='28b6446caf5fdb7dcf194f58a1faf9ef59a51ff806dbeb4b55762f1d256daa30', jh
          enc=base64.b64decode(joined, validate=True)
          assert len(enc)==56176, len(enc)
          eh=hashlib.sha256(enc).hexdigest()
          print('DELTA_ENC_SHA256='+eh)
          assert eh=='0f943c6568801ff62fa4faccddc31bca3c2af90731c01a5a8f927bc81d16f76c', eh
          print('EXACT_ENCRYPTED_DELTA_BINDING_PASS')
          PY
          printf '\n# exact-delta-bound-trigger-20260810c\n' >> .github/workflows/native_windows_prefix14.yml
          git config user.name windows-dll-test-bot
          git config user.email windows-dll-test-bot@users.noreply.github.com
          git add .rc3delta/chunk_07 .github/workflows/native_windows_prefix14.yml
          git commit -m 'Bind exact RC3 encrypted delta and trigger native gate'
          git push origin HEAD:${GITHUB_REF_NAME}
