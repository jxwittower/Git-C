name: rc3-repair-and-trigger
on:
  push:
    branches: [rc3-native-gate-20260810r]
    paths: ['.github/workflows/rc3_repair_and_trigger.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Repair proven one-byte corruption and trigger native gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('.rc3delta/chunk_07')
          b=bytearray(p.read_bytes())
          assert len(b)==8000, len(b)
          assert b[6591]==ord('o'), (6591,b[6591])
          b[6591]=ord('O')
          p.write_bytes(b)
          h=hashlib.sha256(b).hexdigest()
          print('REPAIRED_CHUNK07_SHA256='+h)
          assert h=='287926b4be57723ac258614dbf6f26fdc034fa322636160b055ef717e1a0a5c7', h
          PY
          printf '\n# exact-delta-repair-trigger-20260810\n' >> .github/workflows/native_windows_prefix14.yml
          git config user.name windows-dll-test-bot
          git config user.email windows-dll-test-bot@users.noreply.github.com
          git add .rc3delta/chunk_07 .github/workflows/native_windows_prefix14.yml
          git commit -m 'Repair exact RC3 delta byte and trigger native gate'
          git push origin HEAD:${GITHUB_REF_NAME}
