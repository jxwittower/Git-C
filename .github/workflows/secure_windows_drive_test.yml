name: secure-windows-drive-test

on:
  push:
    paths:
      - '.github/workflows/secure_windows_drive_test.yml'

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Create ephemeral RSA transport key
        run: |
          set -euo pipefail
          rm -rf .secure5
          mkdir -p .secure5
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$RUNNER_TEMP/private.pem"
          openssl pkey -in "$RUNNER_TEMP/private.pem" -pubout -out .secure5/public.pem
          git config user.name "windows-dll-test-bot"
          git config user.email "windows-dll-test-bot@users.noreply.github.com"
          git add -A .secure5
          git commit -m "Publish ephemeral Windows Drive-test public key"
          git push
          echo "EPHEMERAL_PUBLIC_KEY_PUBLISHED"

      - name: Wait for encrypted AES key
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 360); do
            git pull --ff-only >/dev/null 2>&1 || true
            if [ -s .secure5/key.enc.b64 ]; then
              ok=1
              break
            fi
            sleep 5
          done
          if [ "$ok" != 1 ]; then
            echo "ENCRYPTED_KEY_TIMEOUT"
            exit 20
          fi
          echo "ENCRYPTED_KEY_RECEIVED"

      - name: Download encrypted payload from Drive
        run: |
          set -euo pipefail
          url='https://drive.google.com/uc?export=download&id=1PgDQKB2XOGbBvQWYUcoJA9I39dM8CqMP'
          curl -L --fail --retry 3 --retry-delay 2 -o "$RUNNER_TEMP/payload.enc" "$url"
          actual=$(sha256sum "$RUNNER_TEMP/payload.enc" | awk '{print $1}')
          expected='f161bd15427b5b5f1c6aa4d05d4f5303414745afa6ae781449bdea28d0fa592a'
          echo "payload_sha256=$actual"
          test "$actual" = "$expected"
          echo "ENCRYPTED_PAYLOAD_SHA256_PASS"

      - name: Decrypt payload in runner temp
        run: |
          set -euo pipefail
          base64 -d .secure5/key.enc.b64 > "$RUNNER_TEMP/key.enc"
          openssl pkeyutl -decrypt -inkey "$RUNNER_TEMP/private.pem" -in "$RUNNER_TEMP/key.enc" -out "$RUNNER_TEMP/pass.txt" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in "$RUNNER_TEMP/payload.enc" -out "$RUNNER_TEMP/payload.zip" -pass file:"$RUNNER_TEMP/pass.txt"
          mkdir -p payload
          7z x -y "$RUNNER_TEMP/payload.zip" -opayload >/dev/null
          rm -f "$RUNNER_TEMP/pass.txt" "$RUNNER_TEMP/key.enc" "$RUNNER_TEMP/payload.enc" "$RUNNER_TEMP/payload.zip"
          echo "PAYLOAD_DECRYPTED"

      - name: Configure MSVC x86
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Inspect candidate PE on native Windows
        shell: cmd
        run: |
          ver > windows_environment.txt
          dumpbin /headers payload\SigProcDll-64HF.dll > pe_headers.txt
          dumpbin /exports payload\SigProcDll-64HF.dll > pe_exports.txt
          dumpbin /imports payload\SigProcDll-64HF.dll > pe_imports.txt

      - name: Run loader ABI contract smoke on native Windows
        shell: cmd
        working-directory: payload
        run: |
          SigProcLoaderContractSmoke.exe > ..\loader_smoke.txt 2>&1
          type ..\loader_smoke.txt
          findstr /C:"ALL_LOADER_CONTRACT_TESTS_PASS" ..\loader_smoke.txt

      - name: Upload Windows evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-drive-smoke-evidence
          path: |
            windows_environment.txt
            pe_headers.txt
            pe_exports.txt
            pe_imports.txt
            loader_smoke.txt
          if-no-files-found: ignore
          retention-days: 2

      - name: Remove ephemeral transport files
        if: always()
        run: |
          git pull --ff-only || true
          rm -rf .secure5
          git add -A .secure5 || true
          if ! git diff --cached --quiet; then
            git commit -m "Remove ephemeral Windows Drive-test transport"
            git push || true
          fi
