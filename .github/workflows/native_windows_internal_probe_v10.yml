name: native-windows-internal-probe-v10

on:
  push:
    paths:
      - '.github/workflows/native_windows_internal_probe_v10.yml'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 0

      - name: Publish one-time RSA key
        run: |
          set -euo pipefail
          git fetch origin main; git reset --hard origin/main
          rm -rf .internal_probe_v10_handoff; mkdir -p .internal_probe_v10_handoff
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$RUNNER_TEMP/private.pem"
          openssl pkey -in "$RUNNER_TEMP/private.pem" -pubout -out .internal_probe_v10_handoff/public.pem
          git config user.name windows-dll-test-bot
          git config user.email windows-dll-test-bot@users.noreply.github.com
          git add .internal_probe_v10_handoff/public.pem
          git commit -m "Publish one-time RSA key for internal probe v10"
          for i in $(seq 1 5); do git push origin HEAD:main && exit 0; git pull --rebase origin main; done
          exit 19

      - name: Receive wrapped payload key
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 300); do git pull --ff-only origin main >/dev/null 2>&1 || true; if [ -s .internal_probe_v10_handoff/key.enc.b64 ]; then ok=1; break; fi; sleep 2; done
          [ "$ok" = 1 ] || exit 20
          tr -d '[:space:]' < .internal_probe_v10_handoff/key.enc.b64 | base64 -d > "$RUNNER_TEMP/key.enc"
          openssl pkeyutl -decrypt -inkey "$RUNNER_TEMP/private.pem" -in "$RUNNER_TEMP/key.enc" -out "$RUNNER_TEMP/pass.txt" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256

      - name: Recover exact candidate payload
        run: |
          set -euo pipefail
          rt=$(cygpath -u "$RUNNER_TEMP"); REF=447f0ed3d653c425e7e603638f1ebae1d132ead8; p64="$RUNNER_TEMP/payload.enc.b64"; : > "$p64"
          for p in chunk_00 chunk_01 chunk_02 chunk_03 chunk_04 chunk_05 chunk_06 chunk_07 chunk_08 chunk_09 chunk_10 chunk_11 chunk_12fix_00 chunk_12fix_01 chunk_12fix_02 chunk_12fix_03_00 chunk_12fix_03_01 chunk_12fix_03_02 chunk_12fix_03_03 chunk_12fix_03_04 chunk_12b; do git show "$REF:.recovered_payload/$p" >> "$p64"; done
          [ "$(wc -c < "$p64" | tr -d '[:space:]')" = 259884 ] || exit 31
          base64 -d "$p64" > "$RUNNER_TEMP/payload.enc"
          [ "$(sha256sum < "$RUNNER_TEMP/payload.enc" | awk '{print $1}')" = 49087efe5f8506eaa1ba8ed42196678019220ac1db0847ac5ae5ea140796d4a3 ] || exit 32
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in "$RUNNER_TEMP/payload.enc" -out "$RUNNER_TEMP/payload.tar.xz" -pass file:"$RUNNER_TEMP/pass.txt"
          [ "$(sha256sum < "$RUNNER_TEMP/payload.tar.xz" | awk '{print $1}')" = 46cd159d17a7e83a4a65af0afca61e967de519a232459ce3821b6263bf962bf5 ] || exit 33
          rm -rf payload; mkdir payload; tar -xJf "$rt/payload.tar.xz" -C payload
          [ "$(sha256sum -b payload/SigProcDll-64HF.dll | awk '{print $1}')" = 081c4c62d2bf377913eb2aca0cc3cf3bf656350c8abaa3aaf11d171dac604804 ] || exit 34
          rm -f "$RUNNER_TEMP/pass.txt" "$RUNNER_TEMP/key.enc" "$RUNNER_TEMP/payload.enc" "$RUNNER_TEMP/payload.enc.b64" "$RUNNER_TEMP/payload.tar.xz"

      - name: Write non-secret internal probe
        run: |
          cat > payload/internal_probe_v10.c <<'EOF'
          #include <windows.h>
          #include <stdint.h>
          #include <stddef.h>
          typedef void (__cdecl *CtxVoidFn)(void *); typedef void (__cdecl *LoadFiltersFn)(void *); typedef int (__cdecl *LoadParamFn)(void *,const char *); typedef int (__cdecl *LoadBedFn)(void *,const char *); typedef void * (__cdecl *CandFopenFn)(const char *,const char *); typedef size_t (__cdecl *CandFreadFn)(void *,size_t,size_t,void *); typedef int (__cdecl *CandFcloseFn)(void *);
          static void out(const char*s){DWORD n=0,w=0;HANDLE h=GetStdHandle(STD_OUTPUT_HANDLE);while(s[n])++n;WriteFile(h,s,n,&w,0);} static char hx(unsigned v){v&=15u;return(char)(v<10u?'0'+v:'A'+v-10u);} static void oh(const char*t,DWORD v){char b[64];DWORD i=0,j;while(t[i]){b[i]=t[i];++i;}b[i++]='0';b[i++]='x';for(j=0;j<8;j++)b[i++]=hx(v>>(28-4*j));b[i++]='\r';b[i++]='\n';b[i]=0;out(b);} static void od(const char*t,unsigned v){char b[64],x[16];DWORD i=0,j=0,k;while(t[i]){b[i]=t[i];++i;}do{x[j++]=(char)('0'+v%10u);v/=10u;}while(v);for(k=0;k<j;k++)b[i++]=x[j-1-k];b[i++]='\r';b[i++]='\n';b[i]=0;out(b);}
          int main(void){HMODULE m=LoadLibraryA("SigProcDll-64HF.dll");uintptr_t base=(uintptr_t)m;void*ctx;CtxVoidFn r,i;LoadFiltersFn f;LoadParamFn p;LoadBedFn b;CandFopenFn fo;CandFreadFn fr;CandFcloseFn fc;void*fp;unsigned char buf[32];size_t got;int rc;if(!m){out("[1] LoadLibrary FAIL\r\n");return 10;}out("[1] LoadLibrary PASS\r\n");oh("MODULE_BASE=",(DWORD)base);ctx=(void*)(base+0x6b040u);r=(CtxVoidFn)(base+0x3c00u);i=(CtxVoidFn)(base+0x3f80u);f=(LoadFiltersFn)(base+0x3f90u);p=(LoadParamFn)(base+0x2930u);b=(LoadBedFn)(base+0x4040u);fo=(CandFopenFn)(base+0x63efau);fr=(CandFreadFn)(base+0x63f06u);fc=(CandFcloseFn)(base+0x63ee8u);out("[2] direct sp_reset ... ");r(ctx);out("PASS\r\n");out("[3] direct sp_init ... ");i(ctx);out("PASS\r\n");out("[4] candidate fopen thunk ... ");fp=fo("filter_brth","rb");if(!fp){out("RETURNED_NULL\r\n");return 14;}out("PASS\r\n");oh("FILE_PTR=",(DWORD)(uintptr_t)fp);out("[5] candidate fread thunk ... ");got=fr(buf,1u,sizeof(buf),fp);out("PASS\r\n");od("FREAD_GOT=",(unsigned)got);out("[6] candidate fclose thunk ... ");rc=fc(fp);out("PASS\r\n");od("FCLOSE_RC=",(unsigned)rc);out("[7] direct sp_load_filter_files ... ");f(ctx);out("PASS\r\n");out("[8] direct sp_load_runtime_parameter_file ... ");rc=p(ctx,"file_sig");out("RETURNED\r\n");od("PARAM_RC=",(unsigned)rc);out("[9] direct sp_load_bed_model ... ");rc=b(ctx,"file_bed_model_v1");out("RETURNED\r\n");od("BED_RC=",(unsigned)rc);out("INTERNAL_PROBE_COMPLETE\r\n");return 0;}
          EOF

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Build internal probe
        shell: cmd
        working-directory: payload
        run: |
          cl /nologo /W4 /O2 /MT /GS- internal_probe_v10.c /Fe:InternalProbeV10.exe > ..\internal_probe_build.txt 2>&1
          if errorlevel 1 (type ..\internal_probe_build.txt & exit /b 50)

      - name: Run internal probe
        shell: cmd
        working-directory: payload
        run: |
          InternalProbeV10.exe > ..\internal_probe_v10.txt 2>&1
          set RC=%ERRORLEVEL%
          type ..\internal_probe_v10.txt
          echo %RC%>..\internal_probe_v10_rc.txt
          echo PROBE_RC=%RC%
          exit /b 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: internal-probe-v10-evidence
          path: |
            internal_probe_build.txt
            internal_probe_v10.txt
            internal_probe_v10_rc.txt
          retention-days: 2
          if-no-files-found: ignore

      - name: Cleanup
        if: always()
        run: |
          set +e
          git fetch origin main; git reset --hard origin/main; rm -rf .internal_probe_v10_handoff; git add -A .internal_probe_v10_handoff
          if ! git diff --cached --quiet; then git commit -m "Remove internal probe v10 handoff"; for i in $(seq 1 5); do git push origin HEAD:main && break; git pull --rebase origin main || break; done; fi
          rm -rf payload; rm -f "$RUNNER_TEMP/private.pem" "$RUNNER_TEMP/pass.txt" "$RUNNER_TEMP/key.enc" "$RUNNER_TEMP/payload.enc" "$RUNNER_TEMP/payload.enc.b64" "$RUNNER_TEMP/payload.tar.xz"
