name: native-7c305-direct-bridge-v2
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  native:
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      FIX_SHA: 7c305f24151cb21534287116e97fcf886b2413f2603e4b9d07b973d6d1986d64
      XZ_SHA: 4bf11ca9105e66d1743607892dbe48b54eddae9fa28052b23720d7c821e45365
      ASSET: c3e59360fecf87fe66a1c1a8366c3fa8eabd446e
      GHF_SHA: f5e507d88d181923b774abb2ac51e5b2e26034e53199b111f1de7e50e8e4e8eb
      GHF_XZ_SHA: 4e8a9a69d015a960dc2c91a313637011401b677c7c564cd5160911d6540a7579
      RT_XZ_SHA: 9f467fd7f70e04d387d7bf7c8455d2ecf5f4bee91ad12c7522cae3ab1d7870b6
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Recover exact DLL and assets
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 -o fixed.xz 'https://drive.google.com/uc?export=download&id=1EprfV4hwC0Xjq3Lf_a6jMhvTqxFiX8ov'
          test "$(sha256sum fixed.xz|awk '{print $1}')" = "$XZ_SHA"
          xz -dc fixed.xz > SigProcDll-64HF.dll
          test "$(sha256sum SigProcDll-64HF.dll|awk '{print $1}')" = "$FIX_SHA"
          mkdir -p a/ghf a/rt a/src
          for i in 00 01 02 03; do git show "$ASSET:.release7c305_realghf/chunk_$i"; done | tr -d '\r\n' | base64 -d > a/ghf/x.xz
          test "$(sha256sum a/ghf/x.xz|awk '{print $1}')" = "$GHF_XZ_SHA"
          xz -dc a/ghf/x.xz > a/ghf/real.ghf
          test "$(sha256sum a/ghf/real.ghf|awk '{print $1}')" = "$GHF_SHA"
          for i in 00 01 02 03; do git show "$ASSET:.release7c305_runtime/chunk_$i"; done | tr -d '\r\n' | base64 -d > a/rt/x.xz
          test "$(sha256sum a/rt/x.xz|awk '{print $1}')" = "$RT_XZ_SHA"
          git show "$ASSET:.release7c305_native/native_nonzero_smoke.c" > a/src/smoke.c
      - name: Expand runtime
        shell: powershell
        run: |
          @'
          import lzma,tarfile,io,pathlib
          p=pathlib.Path('a/rt/x.xz'); raw=lzma.decompress(p.read_bytes()); out=pathlib.Path('a/rt/u'); out.mkdir(parents=True,exist_ok=True)
          with tarfile.open(fileobj=io.BytesIO(raw),mode='r:*') as t:t.extractall(out)
          '@ | Set-Content -Encoding ascii $env:RUNNER_TEMP\u.py
          python $env:RUNNER_TEMP\u.py
      - uses: ilammy/msvc-dev-cmd@v1
        with: {arch: x86}
      - name: ABI and stackfix gate
        shell: powershell
        run: |
          $h=(Get-FileHash .\SigProcDll-64HF.dll -Algorithm SHA256).Hash.ToLowerInvariant(); if($h-ne$env:FIX_SHA){throw 'SHA'}
          dumpbin /headers .\SigProcDll-64HF.dll > headers.txt; dumpbin /exports .\SigProcDll-64HF.dll > exports.txt; dumpbin /imports .\SigProcDll-64HF.dll > imports.txt
          foreach($e in @('_SigProc_Init@8','_SigProc@24','_SigProc_Stat@0','_SigProc_Fini@0')){if(-not(Select-String exports.txt -SimpleMatch $e -Quiet)){throw "EXPORT $e"}}
          if(-not(Select-String headers.txt -SimpleMatch '.stkfix' -Quiet)){throw 'NO_STKFIX'}
          if(Select-String imports.txt -SimpleMatch 'ucrtbase.dll' -Quiet){throw 'UCRT'}
          cl /nologo /O2 /EHsc /Fe:smoke.exe a\src\smoke.c
          if($LASTEXITCODE-ne0){throw 'COMPILE'}
      - name: Real nonzero GHF execution and repeat stability
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'; $ghf=(Resolve-Path 'a\ghf\real.ghf').Path; $dll=(Resolve-Path '.\SigProcDll-64HF.dll').Path
          $dirs=Get-ChildItem a\rt\u -Directory -Recurse | Where-Object {(Test-Path (Join-Path $_.FullName 'filter_brth')) -and (Test-Path (Join-Path $_.FullName 'filter_hrt3')) -and (Test-Path (Join-Path $_.FullName 'file_sig'))}
          if(-not $dirs){throw 'NO_RUNTIME'}; $n=0
          foreach($d in $dirs){$n++;$root=Join-Path $PWD "env$n";$rt=Join-Path $root runtime;New-Item -ItemType Directory -Force $rt|Out-Null;Copy-Item $dll (Join-Path $root 'SigProcDll-64HF.dll');Copy-Item (Join-Path $d.FullName '*') $rt -Recurse -Force;.\smoke.exe $rt $ghf 2>&1|Tee-Object "real_$n.txt";if($LASTEXITCODE-ne0){throw "REAL_$n"};if(-not(Select-String "real_$n.txt" -SimpleMatch 'NONZERO_NATIVE_SMOKE_PASS' -Quiet)){throw 'SENTINEL'}}
          $rt=(Resolve-Path 'env1\runtime').Path; 1..20|%{.\smoke.exe $rt $ghf *> "rep_$_.txt";if($LASTEXITCODE-ne0){throw "REPEAT $_"}}
          "RUNTIMES=$n"|Out-File native_count.txt; 'NATIVE_REAL_GHF_AND_REPEAT20_PASS'|Out-File native_pass.txt
      - name: Commit SHA-bound native PASS
        shell: powershell
        run: |
          $h=(Get-FileHash .\SigProcDll-64HF.dll -Algorithm SHA256).Hash.ToLowerInvariant();if($h-ne$env:FIX_SHA){throw 'POST_SHA'}
          "NATIVE_WINDOWS_7C305_REAL_NONZERO_PASS SHA256=$h"|Out-File native.lock -Encoding ascii
          git config user.name windows-dll-test-bot;git config user.email windows-dll-test-bot@users.noreply.github.com;git fetch -q origin main;git checkout -q -B main origin/main;New-Item -ItemType Directory -Force evidence_summary|Out-Null;Copy-Item native.lock evidence_summary\NATIVE_WINDOWS_7C305_REAL_NONZERO_PASS.lock;Copy-Item native_pass.txt evidence_summary\native_7c305_real_nonzero_pass.txt;Copy-Item native_count.txt evidence_summary\native_7c305_runtime_count.txt;git add evidence_summary;git commit -m 'Record exact 7c305 native Windows real-GHF PASS' || exit 0;git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-7c305-v2-${{ github.run_id }}
          path: |
            native.lock
            native_pass.txt
            native_count.txt
            headers.txt
            exports.txt
            imports.txt
            real_*.txt
          if-no-files-found: ignore
