name: c93-trigger-probe
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/c93_trigger_probe.yml'
  issues:
    types: [opened]
permissions:
  contents: write
jobs:
  probe:
    if: github.event_name == 'push' || startsWith(github.event.issue.title, 'C93_NATIVE_TRIGGER_')
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Mark Windows runner
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          "C93_WINDOWS_TRIGGER_PASS RUN_ID=$env:GITHUB_RUN_ID ARCH=$env:PROCESSOR_ARCHITECTURE EVENT=$env:GITHUB_EVENT_NAME" | Out-File c93_trigger_probe.lock -Encoding ascii
      - name: Commit marker
        shell: bash
        run: |
          set -e
          git config user.name c93-native-test-bot
          git config user.email c93-native-test-bot@users.noreply.github.com
          git fetch origin main
          git checkout -B main origin/main
          git add c93_trigger_probe.lock
          git commit -m 'Record C93 native Windows trigger probe' || true
          git push origin HEAD:main
