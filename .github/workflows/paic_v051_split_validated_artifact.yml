name: PAIC V051 Split Validated Runtime Artifact

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/paic_v051_split_validated_artifact.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  split:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download original validated artifact ZIP bytes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          Invoke-WebRequest -UseBasicParsing -Headers $headers -Uri 'https://api.github.com/repos/jxwittower/Git-C/actions/artifacts/9190213214/zip' -OutFile runtime-artifact.zip
          $hash = (Get-FileHash runtime-artifact.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = (Get-Item runtime-artifact.zip).Length
          if ($hash -ne 'edf0cb543b24a8bef755e66205386acd332688c4bd4b6fcf5a6fbfb8e1f01da7') { throw "Artifact hash mismatch: $hash" }
          "runtime-artifact.zip SHA256=$hash SIZE=$size" | Set-Content transfer-manifest.txt
          Write-Host "Validated artifact bytes=$size sha256=$hash"

      - name: Split exact artifact bytes into 240 MiB chunks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $input = [System.IO.File]::OpenRead((Resolve-Path runtime-artifact.zip))
          try {
            $chunkSize = 240MB
            $buffer = New-Object byte[] (8MB)
            $index = 1
            while ($input.Position -lt $input.Length) {
              $name = ('runtime-artifact.part{0:d2}' -f $index)
              $out = [System.IO.File]::Create((Join-Path $PWD $name))
              try {
                $remaining = [Math]::Min($chunkSize, $input.Length - $input.Position)
                while ($remaining -gt 0) {
                  $want = [Math]::Min($buffer.Length, $remaining)
                  $read = $input.Read($buffer, 0, [int]$want)
                  if ($read -le 0) { break }
                  $out.Write($buffer, 0, $read)
                  $remaining -= $read
                }
              } finally { $out.Dispose() }
              $partHash = (Get-FileHash $name -Algorithm SHA256).Hash.ToLowerInvariant()
              $partSize = (Get-Item $name).Length
              "$name SHA256=$partHash SIZE=$partSize" | Add-Content transfer-manifest.txt
              $index++
            }
          } finally { $input.Dispose() }
          Get-Content transfer-manifest.txt
          $parts = (Get-ChildItem runtime-artifact.part*).Count
          if ($parts -lt 2 -or $parts -gt 8) { throw "Unexpected part count: $parts" }

      - name: Upload manifest
        uses: actions/upload-artifact@v4
        with:
          name: paic-v051-exact-manifest
          path: transfer-manifest.txt
          compression-level: 0
          retention-days: 3
      - name: Upload part01
        uses: actions/upload-artifact@v4
        with:
          name: paic-v051-exact-part01
          path: runtime-artifact.part01
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
      - name: Upload part02
        uses: actions/upload-artifact@v4
        with:
          name: paic-v051-exact-part02
          path: runtime-artifact.part02
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
      - name: Upload part03
        uses: actions/upload-artifact@v4
        with:
          name: paic-v051-exact-part03
          path: runtime-artifact.part03
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 3
      - name: Upload part04
        uses: actions/upload-artifact@v4
        with:
          name: paic-v051-exact-part04
          path: runtime-artifact.part04
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 3
      - name: Upload part05
        uses: actions/upload-artifact@v4
        with:
          name: paic-v051-exact-part05
          path: runtime-artifact.part05
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 3
      - name: Upload part06
        uses: actions/upload-artifact@v4
        with:
          name: paic-v051-exact-part06
          path: runtime-artifact.part06
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 3
      - name: Upload part07
        uses: actions/upload-artifact@v4
        with:
          name: paic-v051-exact-part07
          path: runtime-artifact.part07
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 3
      - name: Upload part08
        uses: actions/upload-artifact@v4
        with:
          name: paic-v051-exact-part08
          path: runtime-artifact.part08
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 3
