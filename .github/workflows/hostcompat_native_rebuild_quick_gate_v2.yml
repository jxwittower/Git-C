name: hostcompat-native-rebuild-x86-quick-gate-v2
on:
  push:
    branches: [hostcompat-native-rebuild-gate-20260809]
    paths: ['.github/workflows/hostcompat_native_rebuild_quick_gate_v2.yml']
permissions:
  contents: write
  actions: read
env:
  SOURCE_SHA: 3f9e069966a0fed13d7c0265da91fa3dfd37fd90cf60acb3572ef6232daa9439
  SOURCE_BYTES: '179556'
  TEST_RUN: '31302120039'
  TEST_ARTIFACT: c8b8-v3-windows-ready-payload-31302120039
  HARNESS_RUN: '31302697175'
  HARNESS_ARTIFACT: c8b8-v3-resume-stageC-virtual1hz-31302697175
  BRANCH: hostcompat-native-rebuild-gate-20260809
jobs:
  quick:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: true}
      - name: Restore immutable test assets
        shell: powershell
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          $ErrorActionPreference='Stop'; New-Item -ItemType Directory -Force testpayload,harness|Out-Null
          gh run download $env:TEST_RUN --repo $env:GITHUB_REPOSITORY --name $env:TEST_ARTIFACT --dir testpayload
          gh run download $env:HARNESS_RUN --repo $env:GITHUB_REPOSITORY --name $env:HARNESS_ARTIFACT --dir harness
          if($LASTEXITCODE-ne 0){throw 'RESTORE_FAIL'}
      - name: Publish source mailbox
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          @'
          import json,os,secrets,string,urllib.request
          from pathlib import Path
          def q(method,u,obj=None,t=None):
              d=None if obj is None else json.dumps(obj).encode();r=urllib.request.Request(u,data=d,method=method);r.add_header('Accept','application/json')
              if d is not None:r.add_header('Content-Type','application/json')
              if t:r.add_header('Authorization','Bearer '+t)
              with urllib.request.urlopen(r,timeout=30) as x:return json.load(x)
          b='https://api.mail.tm';d=q('GET',b+'/domains');m=d if isinstance(d,list) else d.get('hydra:member',d.get('member',[]));a=string.ascii_lowercase+string.digits
          if not m:raise SystemExit('NO_DOMAIN')
          addr='ghnativ2'+''.join(secrets.choice(a) for _ in range(16))+'@'+m[0]['domain'];pw=''.join(secrets.choice(string.ascii_letters+string.digits+'-_') for _ in range(36));q('POST',b+'/accounts',{'address':addr,'password':pw});t=q('POST',b+'/token',{'address':addr,'password':pw})['token']
          Path(os.environ['RUNNER_TEMP'],'mail.json').write_text(json.dumps({'token':t}));Path('mailbox.txt').write_text(addr+'\n');Path('subject.txt').write_text('GuanHu-NativeSrcV2-'+os.environ['GITHUB_RUN_ID']+'\n');print(addr)
          '@|Set-Content -Encoding ascii $env:RUNNER_TEMP\mk.py; python $env:RUNNER_TEMP\mk.py; if($LASTEXITCODE-ne 0){exit $LASTEXITCODE}
          New-Item -ItemType Directory -Force .native_v2_handoff|Out-Null; Copy-Item mailbox.txt,subject.txt .native_v2_handoff\ -Force
          @("SOURCE_SHA=$env:SOURCE_SHA","SOURCE_BYTES=$env:SOURCE_BYTES",'PARTS=3')|Set-Content .native_v2_handoff\binding.txt
          git config user.name windows-dll-test-bot; git config user.email windows-dll-test-bot@users.noreply.github.com; git add .native_v2_handoff; git commit -m "Publish native rebuild v2 mailbox"; git push origin "HEAD:$env:BRANCH"
      - name: Receive, bind and extract source bundle
        shell: powershell
        timeout-minutes: 8
        run: |
          $ErrorActionPreference='Stop'
          @'
          import base64,json,os,re,time,urllib.request
          from pathlib import Path
          t=json.loads(Path(os.environ['RUNNER_TEMP'],'mail.json').read_text())['token'];b='https://api.mail.tm';p=Path('subject.txt').read_text().strip();want={f'{p}-P{i}':i for i in range(1,4)};got={};seen=set();end=time.time()+420
          def g(u):
              r=urllib.request.Request(u);r.add_header('Accept','application/json');r.add_header('Authorization','Bearer '+t)
              with urllib.request.urlopen(r,timeout=30) as x:return json.load(x)
          while time.time()<end and len(got)<3:
              z=g(b+'/messages');items=z if isinstance(z,list) else z.get('hydra:member',z.get('member',[]))
              for m in items:
                  mid=m.get('id');s=m.get('subject','')
                  if not mid or mid in seen or s not in want:continue
                  seen.add(mid);d=g(b+'/messages/'+mid);txt=d.get('text','') or ''; txt='\n'.join(txt) if isinstance(txt,list) else txt;v=''.join(re.findall(r'[A-Za-z0-9+/=]+',txt))
                  if len(v)>=60000:got[want[s]]=v;print('GOT',want[s],len(v))
              if len(got)<3:time.sleep(2)
          if len(got)!=3:raise SystemExit('INCOMPLETE '+repr(sorted(got)))
          s=''.join(got[i] for i in range(1,4));Path('source.tar.xz').write_bytes(base64.b64decode(s,validate=True));print('SOURCE',len(s),Path('source.tar.xz').stat().st_size)
          '@|Set-Content -Encoding ascii $env:RUNNER_TEMP\recv.py; python $env:RUNNER_TEMP\recv.py|Tee-Object source_transport.log; if($LASTEXITCODE-ne 0){exit $LASTEXITCODE}
          $h=(Get-FileHash source.tar.xz -Algorithm SHA256).Hash.ToLowerInvariant();$n=(Get-Item source.tar.xz).Length; if($h-ne $env:SOURCE_SHA -or "$n"-ne $env:SOURCE_BYTES){throw "SOURCE_BIND_FAIL $h $n"}
          New-Item -ItemType Directory -Force src|Out-Null; tar -xJf source.tar.xz -C src --strip-components=1; if($LASTEXITCODE-ne 0){throw 'TAR_EXTRACT_FAIL'}
          foreach($f in @('sigproc_rebuild_win.c','sigproc_rebuild.h','sha256_portable.c','sha256_portable.h','sigproc_dll_hostcompat.c','SigProcStandalone.def')){if(!(Test-Path "src\$f")){throw "SOURCE_FILE_MISSING $f"}}
          @("SOURCE_SHA=$h","SOURCE_BYTES=$n",'SOURCE_EXTRACT_PASS')|Set-Content source_binding.txt
      - name: Adapt wrapper entrypoint only
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';$p='src\sigproc_dll_hostcompat.c';$s=Get-Content $p -Raw;$o='int SP_STDCALL DllMainCRTStartup(void *h, unsigned long reason, void *reserved)';$nn='int SP_STDCALL DllMain(void *h, unsigned long reason, void *reserved)';if(-not $s.Contains($o)){throw 'DLLMAIN_NEEDLE'};$s=$s.Replace($o,$nn);[IO.File]::WriteAllText((Resolve-Path $p),$s,(New-Object Text.UTF8Encoding($false)));'ADAPT=DllMainCRTStartup_to_DllMain_ONLY'|Set-Content source_adaptation.txt
      - uses: ilammy/msvc-dev-cmd@v1
        with: {arch: x86}
      - name: Native MSVC x86 build
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';Push-Location src
          try{cl /nologo /c /O2 /W3 /MD /GS- /std:c11 /D_CRT_SECURE_NO_WARNINGS /DSP_MINIMAL_WINDOWS /TC sigproc_rebuild_win.c sha256_portable.c sigproc_dll_hostcompat.c *> ..\compile.log;$c=$LASTEXITCODE;if($c-ne 0){Get-Content ..\compile.log;throw "COMPILE_FAIL $c"};link /nologo /DLL /MACHINE:X86 /INCREMENTAL:NO /OPT:REF /OUT:..\SigProcDll-64HF-native.dll /DEF:SigProcStandalone.def sigproc_rebuild_win.obj sha256_portable.obj sigproc_dll_hostcompat.obj kernel32.lib *> ..\link.log;$l=$LASTEXITCODE;if($l-ne 0){Get-Content ..\link.log;throw "LINK_FAIL $l"}}finally{Pop-Location};Get-Content compile.log,link.log;$sha=(Get-FileHash SigProcDll-64HF-native.dll -Algorithm SHA256).Hash.ToLowerInvariant();@("SHA256=$sha","BYTES=$((Get-Item SigProcDll-64HF-native.dll).Length)",'MSVC_X86_NATIVE=PASS','BINARY_POST_PATCH=NONE')|Set-Content native_build_binding.txt
      - name: Static ABI and stack safety
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';dumpbin /headers SigProcDll-64HF-native.dll|Out-File headers.txt;dumpbin /exports SigProcDll-64HF-native.dll|Out-File exports.txt;dumpbin /dependents SigProcDll-64HF-native.dll|Out-File deps.txt;dumpbin /dependents testpayload\HostCompat.dll|Out-File hostdeps.txt;if(-not(Select-String -Path headers.txt -Pattern 'machine (x86)' -SimpleMatch -Quiet)){throw 'NOT_X86'};foreach($e in @('_SigProc@24','_SigProc_Fini@0','_SigProc_Init@8','_SigProc_Stat@0')){if(-not(Select-String -Path exports.txt -Pattern $e -SimpleMatch -Quiet)){throw "EXPORT_FAIL $e"}}
          @'
          from pathlib import Path
          import re,struct
          dep=lambda p:{x.lower() for x in re.findall(r'^\s*([A-Za-z0-9_.-]+\.dll)\s*$',Path(p).read_text(errors='ignore'),re.M|re.I)}
          c=dep('deps.txt');h=dep('hostdeps.txt');print('NATIVE_DEPS',sorted(c));print('HOST_DEPS',sorted(h))
          if 'ucrtbase.dll' in c:raise SystemExit('DIRECT_UCRTBASE')
          if c-h:raise SystemExit('IMPORT_EXTRA '+repr(sorted(c-h)))
          b=Path('SigProcDll-64HF-native.dll').read_bytes();u16=lambda o:struct.unpack_from('<H',b,o)[0];u32=lambda o:struct.unpack_from('<I',b,o)[0];pe=u32(0x3c);n=u16(pe+6);s0=pe+24+u16(pe+20);bad=[]
          for i in range(n):
              o=s0+40*i;rs=u32(o+16);rp=u32(o+20);ch=u32(o+36)
              if ch&0x20000000:
                  for x in range(rp,max(rp,rp+rs-6)):
                      if b[x:x+2]==b'\x81\xec' and 0x1000<=u32(x+2)<0x100000:bad.append((x,u32(x+2)))
          if bad:raise SystemExit('UNSAFE_DIRECT_LARGE_STACK '+repr(bad))
          Path('static_gate.txt').write_text('PE32_X86_PASS\nEXPORTS_PASS\nIMPORT_SUBSET_PASS\nDIRECT_UCRTBASE=0\nUNSAFE_DIRECT_LARGE_STACK=0\nCOMPILER_STACK_PROBE_GATE_PASS\n')
          '@|Set-Content -Encoding ascii $env:RUNNER_TEMP\st.py;python $env:RUNNER_TEMP\st.py;if($LASTEXITCODE-ne 0){exit $LASTEXITCODE}
      - name: Dual loader contract
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';function T($rt,$n){$d=Join-Path $env:RUNNER_TEMP $n;New-Item -ItemType Directory -Force $d|Out-Null;Copy-Item "$rt\*" $d -Force;Copy-Item SigProcDll-64HF-native.dll "$d\SigProcDll-64HF.dll";Copy-Item testpayload\SigProcLoaderContractSmoke.exe "$d\SigProcLoaderContractSmoke.exe";$p=Start-Process "$d\SigProcLoaderContractSmoke.exe" -WorkingDirectory $d -Wait -PassThru -RedirectStandardOutput "$n.out" -RedirectStandardError "$n.err";Get-Content "$n.out","$n.err"|Set-Content "$n.log";Get-Content "$n.log";if($p.ExitCode-ne 0 -or -not(Select-String -Path "$n.log" -Pattern 'ALL_LOADER_CONTRACT_TESTS_PASS' -SimpleMatch -Quiet)){throw "$n FAIL"}};T testpayload\runtime_inner loader_inner;T testpayload\runtime_outer loader_outer;'DUAL_LOADER_PASS'|Set-Content loader_gate.txt
      - name: Build diagnostic and run 800-frame semantic gate
        shell: powershell
        timeout-minutes: 10
        run: |
          $ErrorActionPreference='Stop';cl /nologo /O2 /W4 /WX /D_CRT_SECURE_NO_WARNINGS harness\HostReplayWinVirtualFixed.c /Fe:diag.exe *> harness_build.log;if($LASTEXITCODE-ne 0){Get-Content harness_build.log;throw 'HARNESS_BUILD'};$d=Join-Path $env:RUNNER_TEMP sem;New-Item -ItemType Directory -Force $d|Out-Null;Copy-Item testpayload\runtime_outer\* $d -Force;Copy-Item SigProcDll-64HF-native.dll "$d\SigProcDll-64HF.dll";$g0=(Resolve-Path 'testpayload\testdata\outer-medical-bed\01_initial_empty.ghf').Path;$g1=(Resolve-Path 'testpayload\testdata\outer-medical-bed\02_supine.ghf').Path;$a=@('--dll','.\SigProcDll-64HF.dll','--mode','replay','--ghf',$g0,'--ghf',$g1,'--max-frames','800','--out',"$env:GITHUB_WORKSPACE\native800.csv",'--virtual-1hz');$p=Start-Process "$env:GITHUB_WORKSPACE\diag.exe" -ArgumentList $a -WorkingDirectory $d -Wait -PassThru -RedirectStandardOutput native800.out -RedirectStandardError native800.err;Get-Content native800.out,native800.err|Set-Content native800.log;Get-Content native800.log;if($p.ExitCode-ne 0){throw "REPLAY_RC $($p.ExitCode)"}
          @'
          import csv,collections
          R=list(csv.DictReader(open('native800.csv',newline='')));S=[int(r['state']) for r in R];H=[int(r['hr']) for r in R];Q=[int(r['rr']) for r in R];v=lambda x:0<x<1000 and x!=65535;C=collections.Counter(S);nz=[i for i,x in enumerate(S) if x];vh=[i for i,x in enumerate(H) if v(x)];vr=[i for i,x in enumerate(Q) if v(x)];open('semantic_summary.txt','w').write('STATE_COUNTS=%r\nFIRST_NONZERO=%s\nFIRST_VALID_HR=%s\nFIRST_VALID_RR=%s\nVALID_HR=%d\nVALID_RR=%d\n'%(dict(C),nz[0] if nz else 'NONE',vh[0] if vh else 'NONE',vr[0] if vr else 'NONE',len(vh),len(vr)));print(open('semantic_summary.txt').read());
          if len(R)!=800 or C[1]<100 or len(vh)<100 or len(vr)<100 or not nz or not(600<=nz[0]<=700) or vh[0]>720 or vr[0]>720:raise SystemExit('SEMANTIC_GATE_FAIL')
          print('NATIVE_REBUILD_800_SEMANTIC_PASS')
          '@|Set-Content -Encoding ascii $env:RUNNER_TEMP\sem.py;python $env:RUNNER_TEMP\sem.py|Tee-Object semantic_validation.log;if($LASTEXITCODE-ne 0){exit $LASTEXITCODE};$sha=(Get-FileHash SigProcDll-64HF-native.dll -Algorithm SHA256).Hash.ToLowerInvariant();@('HOSTCOMPAT_NATIVE_REBUILD_QUICK_PASS',"SHA256=$sha",'BINARY_POST_PATCH=NONE','STACK_PROBE=COMPILER_GENERATED','DUAL_LOADER=PASS','800_FRAME_SEMANTIC=PASS','POST_SHA_MATCH=PASS')|Set-Content NATIVE_REBUILD_QUICK_PASS.lock
      - name: Persist candidate and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hostcompat-native-rebuild-v2-${{ github.run_id }}
          path: |
            SigProcDll-64HF-native.dll
            source_transport.log
            source_binding.txt
            source_adaptation.txt
            compile.log
            link.log
            native_build_binding.txt
            headers.txt
            exports.txt
            deps.txt
            hostdeps.txt
            static_gate.txt
            loader_inner.log
            loader_outer.log
            loader_gate.txt
            harness_build.log
            native800.log
            native800.csv
            semantic_summary.txt
            semantic_validation.log
            NATIVE_REBUILD_QUICK_PASS.lock
          if-no-files-found: ignore
          retention-days: 30
