name: c8b8-resilient-native-fullreg-v2
on:
  push:
    branches: [c8b8-fullreg-v2-20260809]
    paths:
      - '.github/workflows/c8b8_bootstrap_fullreg_v2.yml'
permissions:
  contents: write
jobs:
  gate:
    runs-on: windows-2022
    timeout-minutes: 150
    env:
      CAND_SHA: c8b8f49620b45707f80f47a9fadf14db376a115bc6052517e9243e0cb2dc20e9
      HOST_SHA: 081c4c62d2bf377913eb2aca0cc3cf3bf656350c8abaa3aaf11d171dac604804
      C63_SHA: 56c02d18a9ee68a7ae14c4601e4ba24f7af170c6db01ea21fbff91cbe6b082fb
      SMOKE_SHA: a9cc5cf614114c9481073669a3fd5d7ef5e1a1adce7e0fdc3f62824e0d50431d
      HARNESS_SHA: 90bd3ef14c9948677f259641e15227a7d26481baf399ae61ef67d09b031ecf71
      RUNNER_SHA: fa0fadfda7cc72135f39a583e977f4a0ba14df07aa88ab73a4be5678f06cb874
      ENC_SHA: e0bbcd4883362daf8cfc5c067a8a8f72e03760f6ab9d425bb3f426b97ad5fd59
      XZ_SHA: 08a5af2c16526f9830ace68817d1e6517422d4a3e66a8051030e78f865b1dd48
      HANDOFF_BRANCH: c8b8-fullreg-v2-20260809
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Publish one-time mailbox and RSA public key
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          @'
          import json,os,secrets,string,urllib.request
          from pathlib import Path
          def req(method,url,obj=None,token=None):
              data=None if obj is None else json.dumps(obj).encode()
              r=urllib.request.Request(url,data=data,method=method)
              r.add_header('Accept','application/json')
              if data is not None:r.add_header('Content-Type','application/json')
              if token:r.add_header('Authorization','Bearer '+token)
              with urllib.request.urlopen(r,timeout=30) as x:return json.load(x)
          base='https://api.mail.tm'
          d=req('GET',base+'/domains'); m=d if isinstance(d,list) else d.get('hydra:member',[])
          if not m:raise SystemExit('MAILTM_NO_DOMAIN')
          alphabet=string.ascii_lowercase+string.digits
          addr='ghc8v2'+''.join(secrets.choice(alphabet) for _ in range(14))+'@'+m[0]['domain']
          pw=''.join(secrets.choice(string.ascii_letters+string.digits+'-_') for _ in range(32))
          req('POST',base+'/accounts',{'address':addr,'password':pw})
          tok=req('POST',base+'/token',{'address':addr,'password':pw})['token']
          Path(os.environ['RUNNER_TEMP'],'mail.json').write_text(json.dumps({'address':addr,'password':pw,'token':tok}))
          Path('mailbox.txt').write_text(addr+'\n')
          Path('subject_prefix.txt').write_text('GuanHu-C8B8-V2-'+os.environ['GITHUB_RUN_ID']+'\n')
          print('ONE_TIME_MAILBOX_READY',addr)
          '@ | Set-Content -Encoding ascii $env:RUNNER_TEMP\make_mail.py
          python $env:RUNNER_TEMP\make_mail.py
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out $env:RUNNER_TEMP\private.pem
          openssl pkey -in $env:RUNNER_TEMP\private.pem -pubout -out public.pem
          New-Item -ItemType Directory -Force .c8b8_v2_handoff | Out-Null
          Copy-Item mailbox.txt,subject_prefix.txt,public.pem .c8b8_v2_handoff\ -Force
          @("RUN_ID=$env:GITHUB_RUN_ID","ENC_SHA=$env:ENC_SHA","XZ_SHA=$env:XZ_SHA","CAND_SHA=$env:CAND_SHA") | Set-Content .c8b8_v2_handoff\binding.txt
          git config user.name windows-dll-test-bot
          git config user.email windows-dll-test-bot@users.noreply.github.com
          git add .c8b8_v2_handoff
          git commit -m "Publish c8b8 v2 one-time handoff"
          git push origin "HEAD:$env:HANDOFF_BRANCH"
          'HANDOFF_PASS' | Set-Content handoff_stage.txt

      - name: Receive four encrypted payload parts and wrapped key
        shell: powershell
        timeout-minutes: 35
        run: |
          $ErrorActionPreference='Stop'
          @'
          import json,os,time,urllib.request,urllib.parse
          from pathlib import Path
          cfg=json.loads(Path(os.environ['RUNNER_TEMP'],'mail.json').read_text()); token=cfg['token']; base='https://api.mail.tm'
          prefix=Path('subject_prefix.txt').read_text().strip(); out=Path('transport');out.mkdir(exist_ok=True)
          wanted={f'{prefix}-P{i}':i for i in range(1,5)};got=set();key=False;seen=set()
          def gj(url):
              r=urllib.request.Request(url);r.add_header('Accept','application/json');r.add_header('Authorization','Bearer '+token)
              with urllib.request.urlopen(r,timeout=30) as x:return json.load(x)
          def gb(url):
              r=urllib.request.Request(url);r.add_header('Authorization','Bearer '+token)
              with urllib.request.urlopen(r,timeout=120) as x:return x.read()
          end=time.time()+1900
          while time.time()<end and (len(got)<4 or not key):
              listing=gj(base+'/messages'); msgs=listing if isinstance(listing,list) else listing.get('hydra:member',[])
              for m in msgs:
                  subj=m.get('subject','')
                  if subj not in wanted or m['id'] in seen:continue
                  seen.add(m['id']);detail=gj(base+'/messages/'+m['id']);idx=wanted[subj]
                  for a in detail.get('attachments',[]):
                      name=a.get('filename','');u=a.get('downloadUrl')
                      if not u:continue
                      data=gb(urllib.parse.urljoin(base,u))
                      if name==f'c8b8_v2_part{idx}.bin':(out/name).write_bytes(data);got.add(idx)
                      elif name=='c8b8_v2_wrapped_key.bin':(out/name).write_bytes(data);key=True
              if len(got)<4 or not key:time.sleep(4)
          if len(got)!=4 or not key:raise SystemExit(f'TRANSPORT_INCOMPLETE parts={sorted(got)} key={key}')
          print('TRANSPORT_COMPLETE parts=4 key=1')
          '@ | Set-Content -Encoding ascii $env:RUNNER_TEMP\recv.py
          python $env:RUNNER_TEMP\recv.py | Tee-Object transport_receive.log
          cmd /c copy /b transport\c8b8_v2_part1.bin+transport\c8b8_v2_part2.bin+transport\c8b8_v2_part3.bin+transport\c8b8_v2_part4.bin payload.enc | Out-Null
          $h=(Get-FileHash payload.enc -Algorithm SHA256).Hash.ToLowerInvariant()
          if($h -ne $env:ENC_SHA){throw "ENC_SHA_FAIL $h"}
          "TRANSPORT_SHA_PASS SHA256=$h" | Set-Content transport_sha_gate.txt

      - name: Persist received ciphertext checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: c8b8-v2-ciphertext-checkpoint-${{ github.run_id }}
          path: |
            payload.enc
            transport_receive.log
            transport_sha_gate.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Decrypt and extract payload with relative paths
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $k=(Get-Item transport\c8b8_v2_wrapped_key.bin).Length
          if($k -ne 384){throw "WRAPPED_KEY_SIZE_FAIL $k"}
          openssl pkeyutl -decrypt -inkey $env:RUNNER_TEMP\private.pem -in transport\c8b8_v2_wrapped_key.bin -out $env:RUNNER_TEMP\aes_pass.txt -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          if($LASTEXITCODE -ne 0){throw 'RSA_DECRYPT_FAIL'}
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in payload.enc -out payload.tar.xz -pass file:$env:RUNNER_TEMP\aes_pass.txt
          if($LASTEXITCODE -ne 0){throw 'AES_DECRYPT_FAIL'}
          $xh=(Get-FileHash payload.tar.xz -Algorithm SHA256).Hash.ToLowerInvariant()
          if($xh -ne $env:XZ_SHA){throw "XZ_SHA_FAIL $xh"}
          tar -xJf payload.tar.xz
          if($LASTEXITCODE -ne 0){throw 'RELATIVE_TAR_EXTRACT_FAIL'}
          if(!(Test-Path c8b8_fullreg_payload_v2)){throw 'PAYLOAD_DIR_MISSING'}
          Move-Item c8b8_fullreg_payload_v2 payload
          $rh=(Get-FileHash payload\run_windows_gate.ps1 -Algorithm SHA256).Hash.ToLowerInvariant()
          if($rh -ne $env:RUNNER_SHA){throw "RUNNER_SHA_FAIL $rh"}
          Push-Location payload
          Get-Content SHA256SUMS_PAYLOAD.txt | ForEach-Object {
            if($_ -match '^([0-9a-f]{64})  (.+)$'){
              $expect=$matches[1];$file=$matches[2].TrimStart('.','/')
              $actual=(Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
              if($actual -ne $expect){throw "PAYLOAD_FILE_SHA_FAIL $file"}
            }
          }
          Pop-Location
          "PAYLOAD_EXTRACT_BIND_PASS XZ_SHA=$xh RUNNER_SHA=$rh" | Set-Content payload_extract_gate.txt

      - name: Persist extracted-asset checkpoint metadata
        uses: actions/upload-artifact@v4
        with:
          name: c8b8-v2-assets-bound-${{ github.run_id }}
          path: |
            payload/MANIFEST.txt
            payload/SHA256SUMS_PAYLOAD.txt
            payload_extract_gate.txt
          if-no-files-found: error
          retention-days: 30

      - name: Configure MSVC x86
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Run exact native Windows gate and complete regression
        shell: powershell
        timeout-minutes: 105
        run: |
          $ErrorActionPreference='Stop'
          powershell -NoProfile -ExecutionPolicy Bypass -File payload\run_windows_gate.ps1
          if($LASTEXITCODE -ne 0){throw "WINDOWS_GATE_FAIL rc=$LASTEXITCODE"}
          if(!(Test-Path C8B8_EXACT_NATIVE_AND_FULLREG_PASS.lock)){throw 'PASS_LOCK_MISSING'}
          Get-Content C8B8_EXACT_NATIVE_AND_FULLREG_PASS.lock

      - name: Upload exact tested DLL and full evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c8b8-v2-native-fullreg-evidence-${{ github.run_id }}
          path: |
            payload/SigProcDll-64HF.dll
            payload/MANIFEST.txt
            payload/SHA256SUMS_PAYLOAD.txt
            exact_asset_hashes.txt
            exact_asset_binding.txt
            ghf_sha_gate.txt
            candidate_headers.txt
            candidate_exports.txt
            candidate_dependents.txt
            hostcompat_dependents.txt
            static_pe_gate.txt
            static_gate_python.log
            fullreg_compile.txt
            loader_inner.log
            loader_outer.log
            hostcompat_nonzero.log
            c63_nonzero.log
            native_loader_baseline_gate.txt
            01_sentinel.log
            02_long.log
            03_threads.log
            04_full.log
            05_determinism.log
            06_realtime.log
            post_test_sha.txt
            complete_regression_gate.txt
            C8B8_EXACT_NATIVE_AND_FULLREG_PASS.lock
            run_windows_gate_pass.txt
            payload_extract_gate.txt
            transport_sha_gate.txt
          if-no-files-found: ignore
          retention-days: 30
