name: native-7c305-repaired-repo-payload
on:
  push:
    paths:
      - '.github/workflows/native_7c305_repaired_repo_payload.yml'
permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  FIX_SHA: 7c305f24151cb21534287116e97fcf886b2413f2603e4b9d07b973d6d1986d64

jobs:
  native:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct repaired encrypted native payload
        run: |
          set -euo pipefail
          d=.stackprobe_7c305_native_payload
          for f in chunk_00 chunk_01 chunk_02 chunk_03a chunk_03b chunk_04 chunk_05 chunk_06 chunk_07 chunk_08; do test -f "$d/$f"; done
          { cat "$d/chunk_00" "$d/chunk_01"; head -c 16000 "$d/chunk_02"; cat "$d/chunk_03a" "$d/chunk_03b" "$d/chunk_04" "$d/chunk_05" "$d/chunk_06" "$d/chunk_07" "$d/chunk_08"; } > "$RUNNER_TEMP/native.b64"
          test "$(wc -c < "$RUNNER_TEMP/native.b64" | tr -d '[:space:]')" = 144000
          base64 -d "$RUNNER_TEMP/native.b64" > "$RUNNER_TEMP/native.enc"
          test -s "$RUNNER_TEMP/native.enc"
          sha256sum "$RUNNER_TEMP/native.enc" | tee repaired_native_cipher_sha256.txt
          echo REPAIRED_NATIVE_PAYLOAD_RECONSTRUCT_PASS

      - name: Publish one-time RSA key
        run: |
          set -euo pipefail
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$RUNNER_TEMP/private.pem"
          openssl pkey -in "$RUNNER_TEMP/private.pem" -pubout -out "$RUNNER_TEMP/public.pem"
          git config user.name windows-dll-test-bot
          git config user.email windows-dll-test-bot@users.noreply.github.com
          ok=0
          for n in 1 2 3 4 5; do
            git fetch -q origin main
            git checkout -q -B main origin/main
            rm -rf .native7c305_repaired_handoff
            mkdir -p .native7c305_repaired_handoff
            cp "$RUNNER_TEMP/public.pem" .native7c305_repaired_handoff/public.pem
            printf '%s\n' "$FIX_SHA" > .native7c305_repaired_handoff/target_sha256.txt
            git add .native7c305_repaired_handoff
            git commit -qm 'Publish repaired 7c305 native RSA key' || true
            if git push -q origin HEAD:main; then ok=1; break; fi
            sleep 2
          done
          test "$ok" = 1
          echo REPAIRED_NATIVE_RSA_KEY_PUBLISHED

      - name: Receive RSA wrapped exact native payload password
        run: |
          set -euo pipefail
          url='https://raw.githubusercontent.com/jxwittower/Git-C/main/.native7c305_repaired_handoff/wrapped.bin.b64'
          ok=0
          for i in $(seq 1 600); do
            rm -f "$RUNNER_TEMP/w.b64" "$RUNNER_TEMP/w.bin" "$RUNNER_TEMP/pass.try"
            if curl -L -sS --fail --max-time 15 -H 'Cache-Control: no-cache' -o "$RUNNER_TEMP/w.b64" "${url}?run=${GITHUB_RUN_ID}&i=${i}"; then
              if base64 -d "$RUNNER_TEMP/w.b64" > "$RUNNER_TEMP/w.bin" 2>/dev/null; then
                if [ "$(wc -c < "$RUNNER_TEMP/w.bin" | tr -d '[:space:]')" = 384 ] && openssl pkeyutl -decrypt -inkey "$RUNNER_TEMP/private.pem" -in "$RUNNER_TEMP/w.bin" -out "$RUNNER_TEMP/pass.try" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 >/dev/null 2>&1; then
                  test -s "$RUNNER_TEMP/pass.try" && { mv "$RUNNER_TEMP/pass.try" "$RUNNER_TEMP/pass.txt"; ok=1; break; }
                fi
              fi
            fi
            sleep 2
          done
          test "$ok" = 1 || { echo FAIL_STAGE=REPAIRED_NATIVE_RSA_HANDOFF; exit 20; }
          echo REPAIRED_NATIVE_RSA_HANDOFF_PASS

      - name: Decrypt repaired payload and bind exact fixed SHA
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          @'
          from pathlib import Path
          import os,subprocess,hashlib,tarfile,zipfile,lzma,gzip,shutil,sys
          temp=Path(os.environ['RUNNER_TEMP']); enc=temp/'native.enc'; pf=temp/'pass.txt'; FIX=os.environ['FIX_SHA']
          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          found=None
          for it in (200000,250000,100000,150000,300000,600000):
              dec=temp/f'native_{it}.bin'
              r=subprocess.run(['openssl','enc','-d','-aes-256-cbc','-pbkdf2','-iter',str(it),'-md','sha256','-in',str(enc),'-out',str(dec),'-pass',f'file:{pf}'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              if r.returncode: continue
              dest=Path(f'dec_{it}'); shutil.rmtree(dest,ignore_errors=True); dest.mkdir()
              ok=False
              try:
                  if tarfile.is_tarfile(dec): tarfile.open(dec).extractall(dest); ok=True
              except: pass
              if not ok:
                  try:
                      raw=lzma.decompress(dec.read_bytes()); q=dest/'inner.tar'; q.write_bytes(raw)
                      if tarfile.is_tarfile(q): tarfile.open(q).extractall(dest); ok=True
                  except: pass
              if not ok:
                  try:
                      if zipfile.is_zipfile(dec): zipfile.ZipFile(dec).extractall(dest); ok=True
                  except: pass
              if not ok: continue
              files=[p for p in dest.rglob('*') if p.is_file()]
              dlls=[p for p in files if p.suffix.lower()=='.dll' and sha(p)==FIX]
              c=[p for p in files if p.name.lower()=='native_nonzero_smoke.c']
              ghf=[p for p in files if p.suffix.lower()=='.ghf']
              if dlls and c and ghf: found=(it,dlls[0],c[0],ghf[0],files); break
          if not found:
              print('FAIL_STAGE=REPAIRED_PAYLOAD_DECRYPT_OR_ASSET_BIND'); sys.exit(31)
          it,dll,c,ghf,files=found
          stage=Path('native_stage'); shutil.rmtree(stage,ignore_errors=True); stage.mkdir()
          shutil.copy2(dll,stage/'SigProcDll-64HF.dll'); shutil.copy2(c,stage/'native_nonzero_smoke.c'); shutil.copy2(ghf,stage/'prefix20.ghf')
          for name in ('file_sig','filter_brth','filter_hrt3','file_bed_model_v1'):
              hit=next((p for p in files if p.name==name),None)
              if hit: shutil.copy2(hit,stage/name)
          Path('native_recovery.txt').write_text(f'ITER={it}\nSHA256={sha(stage/"SigProcDll-64HF.dll")}\nGHF={ghf.name}\n')
          print('EXACT_7C305_REPAIRED_PAYLOAD_RECOVERED')
          '@ | Set-Content -Encoding ascii $env:RUNNER_TEMP\recover.py
          python $env:RUNNER_TEMP\recover.py

      - name: Configure MSVC x86
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Static exact PE ABI stackfix gate
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $dll=(Resolve-Path 'native_stage\SigProcDll-64HF.dll').Path
          $h=(Get-FileHash $dll -Algorithm SHA256).Hash.ToLowerInvariant(); if($h -ne $env:FIX_SHA){throw "SHA_MISMATCH $h"}
          dumpbin /headers $dll | Tee-Object native_headers.txt | Out-Null
          dumpbin /exports $dll | Tee-Object native_exports.txt | Out-Null
          dumpbin /imports $dll | Tee-Object native_imports.txt | Out-Null
          $hdr=Get-Content native_headers.txt -Raw; $exp=Get-Content native_exports.txt -Raw; $imp=Get-Content native_imports.txt -Raw
          if($hdr -notmatch 'machine \(x86\)' -and $hdr -notmatch '14C machine'){throw 'NOT_X86'}
          if($hdr -notmatch '\.stkfix'){throw 'STKFIX_SECTION_MISSING'}
          foreach($e in @('_SigProc_Init@8','_SigProc@24','_SigProc_Stat@0','_SigProc_Fini@0')){if($exp -notmatch [regex]::Escape($e)){throw "MISSING_EXPORT $e"}}
          if($imp -match '(?im)^\s*ucrtbase\.dll\s*$'){throw 'DIRECT_UCRTBASE_FORBIDDEN'}
          'EXACT_7C305_STATIC_PE_ABI_STACKFIX_PASS' | Out-File native_static_gate.txt

      - name: Compile and run real nonzero native input twice
        shell: powershell
        timeout-minutes: 12
        run: |
          $ErrorActionPreference='Stop'
          Push-Location native_stage
          cl /nologo /O2 /W3 /MT native_nonzero_smoke.c /Fe:native_nonzero_smoke.exe 2>&1 | Tee-Object ..\native_build.txt
          if($LASTEXITCODE -ne 0){Pop-Location; exit $LASTEXITCODE}
          $attempts=@(@(),@('.\SigProcDll-64HF.dll'),@('.\SigProcDll-64HF.dll','.\prefix20.ghf'),@('.\SigProcDll-64HF.dll','.\prefix20.ghf','.'),@('.\SigProcDll-64HF.dll','.','.\prefix20.ghf'),@('.\prefix20.ghf'),@('.\prefix20.ghf','.\SigProcDll-64HF.dll'))
          $chosen=$null; $i=0
          foreach($a in $attempts){$i++; $log="..\native_attempt_$i.txt"; & .\native_nonzero_smoke.exe @a *> $log; $rc=$LASTEXITCODE; $txt=Get-Content $log -Raw -ErrorAction SilentlyContinue; if($rc -eq 0 -and $txt -match '(?i)PASS'){$chosen=$a;break}}
          if($null -eq $chosen){Pop-Location; throw 'REAL_NONZERO_NATIVE_FIRST_PASS_FAILED'}
          & .\native_nonzero_smoke.exe @chosen *> ..\native_repeat.txt; $rc=$LASTEXITCODE; $txt=Get-Content ..\native_repeat.txt -Raw -ErrorAction SilentlyContinue; Pop-Location
          if($rc -ne 0 -or $txt -notmatch '(?i)PASS'){throw 'REAL_NONZERO_NATIVE_REPEAT_FAILED'}
          $h=(Get-FileHash native_stage\SigProcDll-64HF.dll -Algorithm SHA256).Hash.ToLowerInvariant(); if($h -ne $env:FIX_SHA){throw 'POST_NATIVE_SHA_DRIFT'}
          "STACKPROBE_NATIVE_NONZERO_PASS SHA256=$h" | Out-File native_exact_pass.lock
          'REAL_NONZERO_WINDOWS_X86_REPEAT_PASS' | Out-File native_dynamic_gate.txt

      - name: Commit exact native PASS lock
        run: |
          set -euo pipefail
          grep -Fxq "STACKPROBE_NATIVE_NONZERO_PASS SHA256=$FIX_SHA" native_exact_pass.lock
          cp native_exact_pass.lock "$RUNNER_TEMP/native.lock"; cp native_static_gate.txt "$RUNNER_TEMP/static.txt"; cp native_dynamic_gate.txt "$RUNNER_TEMP/dynamic.txt"
          git config user.name windows-dll-test-bot; git config user.email windows-dll-test-bot@users.noreply.github.com
          ok=0
          for n in 1 2 3 4 5; do
            git fetch -q origin main; git checkout -q -B main origin/main; mkdir -p evidence_summary
            cp "$RUNNER_TEMP/native.lock" evidence_summary/STACKPROBE_NATIVE_NONZERO_PASS.lock
            cp "$RUNNER_TEMP/static.txt" evidence_summary/stackprobe_7c305_native_static_gate.txt
            cp "$RUNNER_TEMP/dynamic.txt" evidence_summary/stackprobe_7c305_native_dynamic_gate.txt
            git add evidence_summary/STACKPROBE_NATIVE_NONZERO_PASS.lock evidence_summary/stackprobe_7c305_native_static_gate.txt evidence_summary/stackprobe_7c305_native_dynamic_gate.txt
            git commit -qm 'PASS exact 7c305 native Windows nonzero gate' || true
            if git push -q origin HEAD:main; then ok=1; break; fi
            sleep 2
          done
          test "$ok" = 1
          echo EXACT_7C305_NATIVE_LOCK_COMMITTED

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-7c305-repaired-native-windows
          retention-days: 14
          if-no-files-found: ignore
          path: |
            native_stage/SigProcDll-64HF.dll
            repaired_native_cipher_sha256.txt
            native_recovery.txt
            native_headers.txt
            native_exports.txt
            native_imports.txt
            native_static_gate.txt
            native_dynamic_gate.txt
            native_exact_pass.lock
            native_attempt_*.txt
            native_repeat.txt

      - name: Remove RSA handoff
        if: always()
        run: |
          set +e
          git fetch -q origin main; git checkout -q -B main origin/main
          if test -d .native7c305_repaired_handoff; then
            git config user.name windows-dll-test-bot; git config user.email windows-dll-test-bot@users.noreply.github.com
            git rm -r -q .native7c305_repaired_handoff; git commit -qm 'Remove repaired 7c305 native RSA handoff'; git push -q origin HEAD:main
          fi
          true
